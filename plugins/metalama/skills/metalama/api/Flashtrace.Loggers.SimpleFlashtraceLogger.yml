  namespace: Flashtrace.Loggers
  summary: A base class for simple but low-performance and low-feature implementations of <xref href="Flashtrace.IFlashtraceLogger" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The simplification stems from the wrapping of all message arguments in an object array, which

    allocates memory. Also, the logger does not support indentation.</p>
