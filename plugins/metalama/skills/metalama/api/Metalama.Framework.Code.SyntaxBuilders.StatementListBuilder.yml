  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: Allows building lists of statements programmatically by adding <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatement" data-throw-if-not-resolved="false"></xref> objects one at a time.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementListBuilder" data-throw-if-not-resolved="false"></xref> provides a way to dynamically construct a list of statements when the number or
        content of statements is determined at compile time. Use <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementListBuilder.Add(Metalama.Framework.Code.SyntaxBuilders.IStatement)" data-throw-if-not-resolved="false"></xref> to add individual statements
        or <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementListBuilder.Add(Metalama.Framework.Code.SyntaxBuilders.IStatementList)" data-throw-if-not-resolved="false"></xref> to add entire statement lists. After adding all statements, call
        <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementListBuilder.ToStatementList" data-throw-if-not-resolved="false"></xref> to get an <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatementList" data-throw-if-not-resolved="false"></xref> that can be used with other builders like
        <xref href="Metalama.Framework.Code.SyntaxBuilders.SwitchStatementBuilder" data-throw-if-not-resolved="false"></xref> or with <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.Block(Metalama.Framework.Code.SyntaxBuilders.IStatementList)" data-throw-if-not-resolved="false"></xref>.
        </p>
