  type: Class
  assemblies:
  - Metalama.Patterns.Immutability
  namespace: Metalama.Patterns.Immutability
  summary: >-
    An aspect that marks the target type as immutable and reports warnings when fields are not read-only

    or when automatic properties have setters.
  remarks: >-
    <p>This aspect serves three purposes:</p>

    <ul><li>It exposes the immutability of a type to other aspects, such as

    <code>ObservableAttribute</code> from <code>Metalama.Patterns.Observability</code>, to facilitate code analysis.</li><li>It represents the design intent visibly, enhancing code readability by eliminating the need

    for readers to infer immutability from the type implementation.</li><li>It reports warnings if a type marked as immutable contains mutable fields or auto-implemented

    properties with setters.</li></ul>

    <p>By default, the aspect represents <i>shallow</i> immutability, meaning all instance fields must be read-only

    and no automatic property may have a setter. To represent <i>deep</i> immutability, supply

    <xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Deep" data-throw-if-not-resolved="false"></xref> to the constructor. Deep immutability requires, recursively, that all instance

    fields and automatic properties are of a deeply immutable type.</p>

    <p>This aspect is automatically inherited by derived types due to the <xref href="Metalama.Framework.Aspects.InheritableAttribute" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [Inheritable]

      public class ImmutableAttribute : TypeAspect, IAspect<INamedType>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<INamedType>, IHierarchicalOptionsProvider
