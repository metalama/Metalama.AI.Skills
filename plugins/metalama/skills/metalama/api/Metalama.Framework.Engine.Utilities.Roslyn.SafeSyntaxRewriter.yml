- uid: Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter
  commentId: T:Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter
  id: SafeSyntaxRewriter
  parent: Metalama.Framework.Engine.Utilities.Roslyn
  children:
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter.#ctor(System.Boolean)
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter.Visit(Microsoft.CodeAnalysis.SyntaxNode)
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter.VisitCore(Microsoft.CodeAnalysis.SyntaxNode)
  langs:
  - csharp
  - vb
  name: SafeSyntaxRewriter
  nameWithType: SafeSyntaxRewriter
  fullName: Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter
  type: Class
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Utilities.Roslyn
  summary: >-
    A derivation of <xref href="Microsoft.CodeAnalysis.CSharp.CSharpSyntaxRewriter" data-throw-if-not-resolved="false"></xref> that provides enhanced exception handling and stack overflow protection

    when processing syntax nodes.
  remarks: >-
    <p>
        This class wraps exceptions thrown during node visitation with <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SyntaxProcessingException" data-throw-if-not-resolved="false"></xref>,
        which includes detailed information about the syntax node being processed when the exception occurred.
        This makes debugging weaver issues significantly easier.
        </p>
    <p>
        It also includes a recursion guard to prevent <xref href="System.InsufficientExecutionStackException" data-throw-if-not-resolved="false"></xref> when processing
        deeply nested syntax trees.
        </p>
    <p>
        Use this class instead of directly inheriting from <xref href="Microsoft.CodeAnalysis.CSharp.CSharpSyntaxRewriter" data-throw-if-not-resolved="false"></xref> in your aspect weaver implementations.
        Override <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter.VisitCore(Microsoft.CodeAnalysis.SyntaxNode)" data-throw-if-not-resolved="false"></xref> instead of <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxRewriter.Visit(Microsoft.CodeAnalysis.SyntaxNode)" data-throw-if-not-resolved="false"></xref> to add custom visiting logic.
        </p>
  example: []
  syntax:
    content: 'public abstract class SafeSyntaxRewriter : CSharpSyntaxRewriter'
    content.vb: Public MustInherit Class SafeSyntaxRewriter Inherits CSharpSyntaxRewriter
