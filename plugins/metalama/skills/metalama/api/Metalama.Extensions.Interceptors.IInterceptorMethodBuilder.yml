  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method
  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility
  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping
  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.IExpression)
  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.TypedConstant)
  - Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument(Metalama.Framework.Code.ITypeParameter,Metalama.Framework.Code.IType)
  langs:
  - csharp
  - vb
  name: IInterceptorMethodBuilder
  nameWithType: IInterceptorMethodBuilder
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Lets the delegate given to <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> shape the interceptor method that a template generates for a method

    call.
  remarks: >-
    <p>

    The <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> property is the builder of the generated method. It is created when it is first read, or after the delegates given

    to <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> return. It then holds the signature that the engine derives from the intercepted method for

    the placement given by the methods of <xref href="Metalama.Extensions.Interceptors.ITemplateInterception" data-throw-if-not-resolved="false"></xref> whose name starts with <code>PlaceIn</code>:

    </p>

    <ul><li>a receiver parameter, when the intercepted method has a receiver (see <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping" data-throw-if-not-resolved="false"></xref>);</li><li>the parameters of the intercepted method, without default values and without <code>params</code>;</li><li>the parameters that the template adds, which are its run-time parameters whose names are properties of the arguments

    given by <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>.</li></ul>

    <p>

    The delegate can change the name, the accessibility, the names and the types of the parameters, and the

    attributes, and it can add parameters. The value of an added parameter is given by the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter%2cMetalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>

    method or by the property of the arguments that has its name, and it is passed at each call site. The reference kinds and the positions of

    the receiver and argument parameters and the return type cannot change, and the derived type parameters cannot be renamed and can only gain

    constraints: an attempt to do otherwise throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>. A type of a parameter can change to a type to

    which the argument converts implicitly, and <code>meta.Proceed()</code> casts it back. A parameter passed by reference keeps its type. The

    delegate can also add type parameters after the derived ones, and give their type arguments with the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument(Metalama.Framework.Code.ITypeParameter%2cMetalama.Framework.Code.IType)" data-throw-if-not-resolved="false"></xref> method.

    </p>

    <p>

    The call sites whose generated methods have the same final signature, template, template arguments, tags, placement and granularity share

    one generated method. The values of the added parameters and the type arguments of the added type parameters are not part of this

    comparison.

    </p>

    <p>

    The generated method is not visible in the code model to aspects, in any stage of the pipeline, and it is not in the code that the IDE

    generates. <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> is a detached builder: its declaring type does not list it.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IInterceptorMethodBuilder
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IInterceptorMethodBuilder
  extensionMethods:
