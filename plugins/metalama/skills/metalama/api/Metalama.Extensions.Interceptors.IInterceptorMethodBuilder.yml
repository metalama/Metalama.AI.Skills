- uid: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument(Metalama.Framework.Code.ITypeParameter,Metalama.Framework.Code.IType)
  commentId: M:Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument(Metalama.Framework.Code.ITypeParameter,Metalama.Framework.Code.IType)
  id: SetTypeArgument(Metalama.Framework.Code.ITypeParameter,Metalama.Framework.Code.IType)
  parent: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  langs:
  - csharp
  - vb
  name: SetTypeArgument(ITypeParameter, IType)
  nameWithType: IInterceptorMethodBuilder.SetTypeArgument(ITypeParameter, IType)
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument(Metalama.Framework.Code.ITypeParameter, Metalama.Framework.Code.IType)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Sets the type argument that the call site passes to a type parameter that the delegate added to the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method builder.
  remarks: >-
    <p>

    The derived type parameters of the interceptor method, which come from the intercepted method or from the calling type, are locked, and

    the engine passes their type arguments. The delegate can add type parameters after them, for instance to make a parameter generic so

    that the call sites whose arguments have different types share one interceptor method. Each added type parameter must receive a type

    argument with this method. Otherwise, the site is not intercepted and LAMA1014 is reported.

    </p>

    <p>

    The type arguments are not part of the key that deduplicates the interceptor methods, but the type parameters are. Two call sites whose

    builders differ only by the type arguments therefore share one method. The template reads an added type parameter through the

    <code>meta.Target.Method.TypeParameters</code> property. The <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter%2cMetalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref> method does the same for the

    value of an added parameter.

    </p>
  example: []
  syntax:
    content: void SetTypeArgument(ITypeParameter typeParameter, IType typeArgument)
    parameters:
    - id: typeParameter
      type: Metalama.Framework.Code.ITypeParameter
      description: A type parameter that the delegate added to the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method builder.
    - id: typeArgument
      type: Metalama.Framework.Code.IType
      description: >-
        The type argument at this call site, for instance the type of an argument given by the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Context" data-throw-if-not-resolved="false"></xref>
                    property.
    content.vb: Sub SetTypeArgument(typeParameter As ITypeParameter, typeArgument As IType)
  overload: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetTypeArgument*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: >-
      <code class="paramref">typeParameter</code> is not a type parameter that the delegate added to the interceptor
                  method.
- uid: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.IExpression)
  commentId: M:Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.IExpression)
  id: SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.IExpression)
  parent: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  langs:
  - csharp
  - vb
  name: SetArgument(IParameter, IExpression)
  nameWithType: IInterceptorMethodBuilder.SetArgument(IParameter, IExpression)
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter, Metalama.Framework.Code.IExpression)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Sets the value that the call site passes to a parameter that was added to the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method builder, either by the template

    or by the delegate.
  remarks: >-
    <p>

    This method is an alternative to the property of the arguments that has the name of the parameter. Unlike the arguments, which are given

    once by <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>, it can use the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Context" data-throw-if-not-resolved="false"></xref> property of the call site. A parameter cannot

    receive a value from both: the site is then not intercepted and LAMA1014 is reported.

    </p>

    <p>

    The values are not part of the key that deduplicates the interceptor methods, so the call sites that pass different values share one

    method.

    </p>
  example: []
  syntax:
    content: void SetArgument(IParameter parameter, IExpression value)
    parameters:
    - id: parameter
      type: Metalama.Framework.Code.IParameter
      description: >-
        An added parameter of the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method builder, which follows the receiver and argument
                    parameters.
    - id: value
      type: Metalama.Framework.Code.IExpression
      description: >-
        The value at this call site. It takes any form that the arguments of
                    <xref href="Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref> accept for a parameter, for instance a <xref href="Metalama.Framework.Code.TypedConstant" data-throw-if-not-resolved="false"></xref> or a
                    parameter of the calling member given by the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Context" data-throw-if-not-resolved="false"></xref> property.
    content.vb: Sub SetArgument(parameter As IParameter, value As IExpression)
  overload: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: <code class="paramref">parameter</code> is not an added parameter of the interceptor method.
- uid: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.TypedConstant)
  commentId: M:Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.TypedConstant)
  id: SetArgument(Metalama.Framework.Code.IParameter,Metalama.Framework.Code.TypedConstant)
  parent: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  langs:
  - csharp
  - vb
  name: SetArgument(IParameter, TypedConstant)
  nameWithType: IInterceptorMethodBuilder.SetArgument(IParameter, TypedConstant)
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter, Metalama.Framework.Code.TypedConstant)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Gives the value of a parameter added to the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method at this call site, as a constant.
  remarks: >-
    This method is equivalent to <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter%2cMetalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>, and exists because C# does not apply a user-defined

    conversion to an interface type such as <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: void SetArgument(IParameter parameter, TypedConstant value)
    parameters:
    - id: parameter
      type: Metalama.Framework.Code.IParameter
      description: An added parameter of the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> method builder.
    - id: value
      type: Metalama.Framework.Code.TypedConstant
      description: >-
        The constant value at this call site. A value of a numeric type, of <xref href="System.Boolean" data-throw-if-not-resolved="false"></xref> or of <xref href="System.Char" data-throw-if-not-resolved="false"></xref> is
                    converted implicitly to a <xref href="Metalama.Framework.Code.TypedConstant" data-throw-if-not-resolved="false"></xref>, for instance in <code>SetArgument( parameter, 42 )</code>, and a <xref href="System.String" data-throw-if-not-resolved="false"></xref> is
                    converted explicitly, as in <code>SetArgument( parameter, (TypedConstant) name )</code>.
    content.vb: Sub SetArgument(parameter As IParameter, value As TypedConstant)
  overload: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: <code class="paramref">parameter</code> is not an added parameter of the interceptor method.
