- uid: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping
  commentId: P:Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping
  id: ReceiverMapping
  parent: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  langs:
  - csharp
  - vb
  name: ReceiverMapping
  nameWithType: IInterceptorMethodBuilder.ReceiverMapping
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets or sets how the receiver of the call is passed to the generated method. When it is <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.Parameter" data-throw-if-not-resolved="false"></xref>,

    the first parameter of <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> receives the receiver. When it is <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> is an instance method without a receiver parameter.
  remarks: >-
    <p>

    The generated method is static by default: the value is <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.Parameter" data-throw-if-not-resolved="false"></xref> when the intercepted method has

    a receiver, and <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.None" data-throw-if-not-resolved="false"></xref> when it is static. The only exception is a protected method of a base type of

    the calling type, which a static method cannot call through a receiver parameter. <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisRequired" data-throw-if-not-resolved="false"></xref>

    is then <code>true</code>, the value is <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>, and it cannot change.

    </p>

    <p>

    A delegate can change the value from <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.Parameter" data-throw-if-not-resolved="false"></xref> to <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>,

    and back, when <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligible" data-throw-if-not-resolved="false"></xref> is <code>true</code> and

    <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisRequired" data-throw-if-not-resolved="false"></xref> is <code>false</code> (see <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility" data-throw-if-not-resolved="false"></xref>). It must do so before it

    reads <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref>, because the mapping determines the signature of the method builder. The

    <xref href="Metalama.Framework.Code.IMemberOrNamedType.IsStatic" data-throw-if-not-resolved="false"></xref> property of <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> then follows the mapping and cannot be changed: the method is an

    instance method if and only if the mapping is <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: InterceptorReceiverMapping ReceiverMapping { get; set; }
    parameters: []
    return:
      type: Metalama.Extensions.Interceptors.InterceptorReceiverMapping
    content.vb: Property ReceiverMapping As InterceptorReceiverMapping
  overload: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      The value is set after <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> was read, it is set to
                  <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref> when <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligible" data-throw-if-not-resolved="false"></xref> is <code>false</code>, it is set to
                  <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.Parameter" data-throw-if-not-resolved="false"></xref> when <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisRequired" data-throw-if-not-resolved="false"></xref> is <code>true</code>, or it is
                  set to <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.None" data-throw-if-not-resolved="false"></xref>.
- uid: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility
  commentId: P:Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility
  id: ReceiverEligibility
  parent: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder
  langs:
  - csharp
  - vb
  name: ReceiverEligibility
  nameWithType: IInterceptorMethodBuilder.ReceiverEligibility
  fullName: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets whether the receiver of the call can or must be mapped to the <code>this</code> of the generated method, at the current call site and at

    every call site of its group.
  remarks: >-
    A delegate that maps the receiver to <code>this</code> when <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligibleForAllSites" data-throw-if-not-resolved="false"></xref> is

    <code>true</code> generates one method for each group, either an instance method or a static method. When

    <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligible" data-throw-if-not-resolved="false"></xref> is <code>false</code>, setting <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping" data-throw-if-not-resolved="false"></xref> to

    <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref> or making <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Method" data-throw-if-not-resolved="false"></xref> an instance method throws an

    <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>. A protected method of a base type whose receiver cannot be mapped to <code>this</code> is not

    intercepted, and the delegates do not run for it.
  example: []
  syntax:
    content: InterceptorReceiverEligibility ReceiverEligibility { get; }
    parameters: []
    return:
      type: Metalama.Extensions.Interceptors.InterceptorReceiverEligibility
    content.vb: ReadOnly Property ReceiverEligibility As InterceptorReceiverEligibility
  overload: Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility*
