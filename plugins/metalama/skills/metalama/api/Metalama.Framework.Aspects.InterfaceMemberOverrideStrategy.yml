    commentId: M:Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.INamedType},Metalama.Framework.Code.INamedType,Metalama.Framework.Aspects.OverrideStrategy,System.Object)
  - linkType: HRef
    linkId: '@implementing-interfaces'
    altText: '@implementing-interfaces'
