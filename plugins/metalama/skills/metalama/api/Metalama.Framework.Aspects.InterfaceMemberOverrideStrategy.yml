- uid: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Default
  commentId: F:Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Default
  id: Default
  parent: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  langs:
  - csharp
  - vb
  name: Default
  nameWithType: InterfaceMemberOverrideStrategy.Default
  fullName: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Default
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Use the strategy from the <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> parameter of

    <xref href="Metalama.Framework.Advising.IAdviceFactory.ImplementInterface(Metalama.Framework.Code.INamedType%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    When the interface-level strategy is <xref href="Metalama.Framework.Aspects.OverrideStrategy.Fail" data-throw-if-not-resolved="false"></xref>, this member fails on conflict.

    When it is <xref href="Metalama.Framework.Aspects.OverrideStrategy.Override" data-throw-if-not-resolved="false"></xref>, the existing member is overridden.
  example: []
  syntax:
    content: Default = 0
    return:
      type: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
- uid: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Fail
  commentId: F:Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Fail
