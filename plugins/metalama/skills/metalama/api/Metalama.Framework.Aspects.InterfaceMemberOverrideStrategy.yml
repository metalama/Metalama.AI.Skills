  fullName: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Fail
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Report a compilation error if a matching member already exists in the target type.
  example: []
  syntax:
    content: Fail = 1
    return:
      type: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
- uid: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.MakeExplicit
  commentId: F:Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.MakeExplicit
  id: MakeExplicit
  parent: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  langs:
  - csharp
  - vb
  name: MakeExplicit
  nameWithType: InterfaceMemberOverrideStrategy.MakeExplicit
  fullName: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.MakeExplicit
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Introduce the interface member as an explicit implementation, avoiding the conflict with the existing member.
  remarks: >-
    Use this when the target type already has a public member with the same name but you want to provide

    a different implementation for the interface member.
  example: []
  syntax:
    content: MakeExplicit = 2
    return:
      type: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
- uid: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Ignore
  commentId: F:Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Ignore
  id: Ignore
  parent: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  langs:
  - csharp
  - vb
  name: Ignore
  nameWithType: InterfaceMemberOverrideStrategy.Ignore
  fullName: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Ignore
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Do not introduce or override this member if a matching member already exists.
  remarks: Use this to allow the existing implementation to satisfy the interface member requirement.
  example: []
  syntax:
    content: Ignore = 3
    return:
      type: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
