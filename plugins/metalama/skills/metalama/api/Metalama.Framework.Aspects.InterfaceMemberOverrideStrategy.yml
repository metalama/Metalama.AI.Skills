- uid: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  commentId: T:Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  id: InterfaceMemberOverrideStrategy
  parent: Metalama.Framework.Aspects
  children:
  - Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Default
  - Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Fail
  - Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Ignore
  - Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.MakeExplicit
  langs:
  - csharp
  - vb
  name: InterfaceMemberOverrideStrategy
  nameWithType: InterfaceMemberOverrideStrategy
  fullName: Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Determines how to handle conflicts when introducing an interface member via <xref href="Metalama.Framework.Aspects.InterfaceMemberAttribute" data-throw-if-not-resolved="false"></xref>

    when a member with the same name already exists on the target type.
  remarks: >-
    <p>
        Use this enum with <xref href="Metalama.Framework.Aspects.InterfaceMemberAttribute.WhenExists" data-throw-if-not-resolved="false"></xref> to control per-member conflict resolution,
        overriding the default behavior specified by the <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> parameter of
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public enum InterfaceMemberOverrideStrategy
    content.vb: >-
      <CompileTime>

      Public Enum InterfaceMemberOverrideStrategy
  seealso:
