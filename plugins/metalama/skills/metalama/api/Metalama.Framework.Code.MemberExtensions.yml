  name: CanBeImplementedFromOutsideAssembly(IDeclaration, bool)
  nameWithType: MemberExtensions.CanBeImplementedFromOutsideAssembly(IDeclaration, bool)
  fullName: Metalama.Framework.Code.MemberExtensions.CanBeImplementedFromOutsideAssembly(Metalama.Framework.Code.IDeclaration, bool)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Determines whether an <xref href="Metalama.Framework.Code.IMember" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> can be implemented (i.e. derived from or overridden) from an

    outside assembly. When the declaration is an <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref>, considers the parent member. Returns <code>false</code> for other

    kinds of declarations.
  example: []
  syntax:
    content: public static bool CanBeImplementedFromOutsideAssembly(this IDeclaration declaration, bool honorInternalVisibleToAttributes = true)
    parameters:
    - id: declaration
      type: Metalama.Framework.Code.IDeclaration
      description: The declaration to check.
    - id: honorInternalVisibleToAttributes
      type: System.Boolean
      description: Whether to consider <code>InternalsVisibleTo</code> attributes when determining accessibility.
    return:
      type: System.Boolean
      description: <code>true</code> if the declaration can be implemented from outside the assembly; otherwise, <code>false</code>.
    content.vb: Public Shared Function CanBeImplementedFromOutsideAssembly(declaration As IDeclaration, honorInternalVisibleToAttributes As Boolean = True) As Boolean
  overload: Metalama.Framework.Code.MemberExtensions.CanBeImplementedFromOutsideAssembly*
  nameWithType.vb: MemberExtensions.CanBeImplementedFromOutsideAssembly(IDeclaration, Boolean)
  fullName.vb: Metalama.Framework.Code.MemberExtensions.CanBeImplementedFromOutsideAssembly(Metalama.Framework.Code.IDeclaration, Boolean)
