  summary: A metric that counts the number of statements in a declaration.
  remarks: >-
    <p>

    Counting statements is more relevant than counting lines of code. However, modern C# is more expression-oriented than

    earlier versions of the language. Counting expression nodes with <xref href="Metalama.Extensions.Metrics.SyntaxNodesCount" data-throw-if-not-resolved="false"></xref> has become a more relevant metric.

    </p> 

    <p>

    Use this metric with <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Metrics.MetricsExtensions.Metrics%60%601(%60%600)" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Metrics.Metrics%601.Get%60%601" data-throw-if-not-resolved="false"></xref>.

    </p>
