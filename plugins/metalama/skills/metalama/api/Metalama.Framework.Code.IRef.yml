  name.vb: GetTargetInterface(ICompilation, Type, IGenericContext, Boolean)
- uid: Metalama.Framework.Code.IRef.IsDurable
  commentId: P:Metalama.Framework.Code.IRef.IsDurable
  id: IsDurable
  parent: Metalama.Framework.Code.IRef
  langs:
  - csharp
  - vb
  name: IsDurable
  nameWithType: IRef.IsDurable
  fullName: Metalama.Framework.Code.IRef.IsDurable
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the reference may be stored in an object that outlives the run that produced

    it, without keeping a version of the compilation in memory for as long as it is held.
  remarks: >-
    <p>
      <b>Non-durable references</b> (when <code>IsDurable</code> is <code>false</code>) are bound to a specific compilation
        context. They are faster to resolve because they have direct access to the underlying symbol, but they
        prevent that compilation from being garbage-collected as long as the reference is held in memory.
        References returned by <xref href="Metalama.Framework.Code.IDeclaration.ToRef" data-throw-if-not-resolved="false"></xref> are always non-durable.
        </p>
    <p>
      <b>Durable references</b> (when <code>IsDurable</code> is <code>true</code>) may be held for as long as the object that
        holds them lives. Call <xref href="Metalama.Framework.Code.IRef.ToDurable" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> to obtain one,
        and prefer the <xref href="Metalama.Framework.Code.IDurableRef" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Code.IDurableRef%601" data-throw-if-not-resolved="false"></xref> type over this property when the
        requirement can be expressed in a signature.
        </p>
    <p>
        The representation of a durable reference depends on the kind of compilation. At design time, the analysis
        process is long-lived and receives a new compilation after each modification of the source code. A durable
        reference then stores only a string identifier and holds no other object, and resolving it costs a lookup in
        the symbol table. A batch compilation processes a single compilation, which lives until the build ends. A
        durable reference then stores the reference it was created from, and computes its identifier only when the
        identifier is requested, for instance during serialization.
        </p>
    <p>
        A reference that is stored for longer than a single pipeline run must be durable. The design-time pipeline
        keeps the objects that fabrics and aspects leave behind across many compilations, so a non-durable reference
        held by one of them keeps a whole version of the project in memory for as long as the solution is open.
        </p>
  example: []
  syntax:
    content: bool IsDurable { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsDurable As Boolean
  overload: Metalama.Framework.Code.IRef.IsDurable*
  seealso:
  - linkId: Metalama.Framework.Code.IRef.ToDurable
    commentId: M:Metalama.Framework.Code.IRef.ToDurable
  - linkId: Metalama.Framework.Code.IDurableRef
    commentId: T:Metalama.Framework.Code.IDurableRef
