- uid: Metalama.Framework.Code.IRef.GetTargetInterface(Metalama.Framework.Code.ICompilation,System.Type,Metalama.Framework.Code.IGenericContext,System.Boolean)
  commentId: M:Metalama.Framework.Code.IRef.GetTargetInterface(Metalama.Framework.Code.ICompilation,System.Type,Metalama.Framework.Code.IGenericContext,System.Boolean)
  id: GetTargetInterface(Metalama.Framework.Code.ICompilation,System.Type,Metalama.Framework.Code.IGenericContext,System.Boolean)
  parent: Metalama.Framework.Code.IRef
  langs:
  - csharp
  - vb
  name: GetTargetInterface(ICompilation, Type?, IGenericContext?, bool)
  nameWithType: IRef.GetTargetInterface(ICompilation, Type?, IGenericContext?, bool)
  fullName: Metalama.Framework.Code.IRef.GetTargetInterface(Metalama.Framework.Code.ICompilation, System.Type?, Metalama.Framework.Code.IGenericContext?, bool)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the target of the reference for a given compilation, with control over the interface type and error handling.

    Prefer the extension methods <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref>

    or <xref href="Metalama.Framework.Code.RefExtensions.GetTargetOrNull%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref> for typical usage.
  example: []
  syntax:
    content: ICompilationElement? GetTargetInterface(ICompilation compilation, Type? interfaceType, IGenericContext? genericContext = null, bool throwIfMissing = false)
    parameters:
    - id: compilation
      type: Metalama.Framework.Code.ICompilation
      description: The compilation in which to resolve the reference.
    - id: interfaceType
      type: System.Type
      description: The optional interface type to use for the target, or <code>null</code> to use the default.
    - id: genericContext
      type: Metalama.Framework.Code.IGenericContext
      description: The optional generic context for resolving generic instances.
    - id: throwIfMissing
      type: System.Boolean
      description: If <code>true</code>, throws an exception when the reference cannot be resolved; if <code>false</code>, returns <code>null</code>.
    return:
      type: Metalama.Framework.Code.ICompilationElement
      description: >-
        The resolved compilation element, or <code>null</code> if the reference cannot be resolved and

        <code class="paramref">throwIfMissing</code> is <code>false</code>.
    content.vb: Function GetTargetInterface(compilation As ICompilation, interfaceType As Type, genericContext As IGenericContext = Nothing, throwIfMissing As Boolean = False) As ICompilationElement
  overload: Metalama.Framework.Code.IRef.GetTargetInterface*
  nameWithType.vb: IRef.GetTargetInterface(ICompilation, Type, IGenericContext, Boolean)
