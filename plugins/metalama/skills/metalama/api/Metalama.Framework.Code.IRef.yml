- uid: Metalama.Framework.Code.IRef.ToDurable
  commentId: M:Metalama.Framework.Code.IRef.ToDurable
  id: ToDurable
  parent: Metalama.Framework.Code.IRef
  langs:
  - csharp
  - vb
  name: ToDurable()
  nameWithType: IRef.ToDurable()
  fullName: Metalama.Framework.Code.IRef.ToDurable()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Returns a reference to the same declaration that may be stored in an object outliving the current run

    without keeping a version of the compilation in memory. Returns the current instance when it is already

    durable.
  remarks: >-
    <p>
        Call this method before storing a reference in an object that outlives the current pipeline run, such as a
        field of a fabric or of an inheritable aspect. Resolving the result may cost an identifier lookup, which is
        why references are not durable by default. When the declaration itself is at hand, call
        <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> instead, which does not create the intermediate non-durable
        reference.
        </p>
    <p>
        A reference that cannot be represented by an identifier, such as a reference to an attribute, does not
        support this method.
        </p>
  example: []
  syntax:
    content: IDurableRef ToDurable()
    return:
      type: Metalama.Framework.Code.IDurableRef
    content.vb: Function ToDurable() As IDurableRef
  overload: Metalama.Framework.Code.IRef.ToDurable*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: The reference cannot be made durable.
  seealso:
  - linkId: Metalama.Framework.Code.IRef.IsDurable
    commentId: P:Metalama.Framework.Code.IRef.IsDurable
  - linkId: Metalama.Framework.Code.IDurableRef
    commentId: T:Metalama.Framework.Code.IDurableRef
