  name: IConfiguredTemplateRegistration
  nameWithType: IConfiguredTemplateRegistration
  fullName: Metalama.Extensions.Interceptors.IConfiguredTemplateRegistration
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A registration whose calls are redirected to a method synthesized from a template, after the first call of

    <xref href="Metalama.Extensions.Interceptors.ITemplateRegistration.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>. It is a complete interception, which the delegate given to <code>InterceptMethods</code> can return.

    It is the counterpart of <xref href="Metalama.Extensions.Interceptors.IConfiguredTemplateInterception" data-throw-if-not-resolved="false"></xref> for a result that applies to every call site.
  remarks: >-
    The other methods of <xref href="Metalama.Extensions.Interceptors.ITemplateRegistration" data-throw-if-not-resolved="false"></xref> must be called before <xref href="Metalama.Extensions.Interceptors.ITemplateRegistration.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>, because they

    determine the signature that the engine derives and that the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder" data-throw-if-not-resolved="false"></xref> exposes to the delegates. This interface

    therefore only allows further calls of <xref href="Metalama.Extensions.Interceptors.IConfiguredTemplateRegistration.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IConfiguredTemplateRegistration : IMethodInterception
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IConfiguredTemplateRegistration Inherits IMethodInterception
