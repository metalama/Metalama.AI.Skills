items:
- uid: Metalama.Framework.Advising.ForwardConstructorStrategy
  commentId: T:Metalama.Framework.Advising.ForwardConstructorStrategy
  id: ForwardConstructorStrategy
  parent: Metalama.Framework.Advising
  children:
  - Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String,System.Boolean)
  langs:
  - csharp
  - vb
  name: ForwardConstructorStrategy
  nameWithType: ForwardConstructorStrategy
  fullName: Metalama.Framework.Advising.ForwardConstructorStrategy
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    A standard <xref href="Metalama.Framework.Advising.IConstructorOverloadingStrategy" data-throw-if-not-resolved="false"></xref> implementation that generates a forwarding

    constructor for matching source constructors, optionally decorated with

    <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>. Obtain instances via

    <xref href="Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors" data-throw-if-not-resolved="false"></xref> or

    <xref href="Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor" data-throw-if-not-resolved="false"></xref>, and add the obsolete decoration

    by calling <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [CompileTime]

      public sealed class ForwardConstructorStrategy : IConstructorOverloadingStrategy, ICompileTimeSerializable
    content.vb: >-
      <CompileTime>

      Public NotInheritable Class ForwardConstructorStrategy Implements IConstructorOverloadingStrategy, ICompileTimeSerializable
  seealso:
