- uid: Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String,System.Boolean)
  commentId: M:Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String,System.Boolean)
  id: WithObsoleteAttribute(System.String,System.Boolean)
  parent: Metalama.Framework.Advising.ForwardConstructorStrategy
  langs:
  - csharp
  - vb
  name: WithObsoleteAttribute(string?, bool)
  nameWithType: ForwardConstructorStrategy.WithObsoleteAttribute(string?, bool)
  fullName: Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(string?, bool)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Returns a new <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy" data-throw-if-not-resolved="false"></xref> that additionally decorates the generated

    forwarding constructor with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>, so that callers receive a

    compiler warning (or error) nudging them to migrate from the original signature to the new one. The

    scope (all source constructors vs the parameterless default constructor) is preserved.
  example: []
  syntax:
    content: public ForwardConstructorStrategy WithObsoleteAttribute(string? description = null, bool isError = false)
    parameters:
    - id: description
      type: System.String
      description: >-
        Optional deprecation message displayed at the call site. When <code>null</code>, a bare
                    <code>[Obsolete]</code> attribute is emitted.
    - id: isError
      type: System.Boolean
      description: >-
        When <code>true</code>, calling the forwarding constructor is a compile-time
                    error instead of a warning.
    return:
      type: Metalama.Framework.Advising.ForwardConstructorStrategy
    content.vb: Public Function WithObsoleteAttribute(description As String = Nothing, isError As Boolean = False) As ForwardConstructorStrategy
