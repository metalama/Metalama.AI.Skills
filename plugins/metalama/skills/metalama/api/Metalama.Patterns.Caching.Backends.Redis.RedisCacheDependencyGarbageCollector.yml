  fullName: Metalama.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector
  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Backends.Redis
  namespace: Metalama.Patterns.Caching.Backends.Redis
  summary: >-
    A background service that cleans up orphaned dependency keys in a Redis-based caching backend.

    This garbage collector runs periodically to detect and remove keys that are no longer valid,

    such as forward and backward dependency keys whose associated value keys have expired or been evicted.
  remarks: >-
    <p>

    The garbage collector operates by subscribing to Redis keyevent notifications for expired and evicted keys,

    and by periodically running a full cleanup scan. When a value key is evicted or expires, the collector

    removes the associated version, forward dependency, and backward dependency keys.

    </p>

    <p>

    This class implements <xref href="Microsoft.Extensions.Hosting.IHostedService" data-throw-if-not-resolved="false"></xref> and can be registered as a hosted service in ASP.NET Core

    applications, or manually initialized using <xref href="Metalama.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector.Initialize" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Patterns.Caching.Backends.Redis.RedisCacheDependencyGarbageCollector.InitializeAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.

    </p>
