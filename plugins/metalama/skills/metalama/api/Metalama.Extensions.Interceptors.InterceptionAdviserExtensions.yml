        A delegate that describes the interception, as in
                    <xref href="Metalama.Extensions.Interceptors.InterceptionAdviserExtensions.InterceptMethods%60%601(Metalama.Framework.Aspects.IAdviser%7b%60%600%7d%2cSystem.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionBuilder%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>.
