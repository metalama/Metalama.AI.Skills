  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Registers the interception of the uses of methods, described by a delegate.
  example: []
  syntax:
    content: 'public static void InterceptMethods<TScope>(this IAdviser<TScope> adviser, Func<IMethodInterceptionBuilder, IMethodInterception> build) where TScope : class, IDeclaration'
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{{TScope}}
      description: An adviser whose target is the scope declaration.
    - id: build
      type: System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionBuilder,Metalama.Extensions.Interceptors.IMethodInterception}
      description: >-
        A delegate that receives an <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionBuilder" data-throw-if-not-resolved="false"></xref>, selects the intercepted methods, chooses how the
                    calls are intercepted, and returns the resulting <xref href="Metalama.Extensions.Interceptors.IMethodInterception" data-throw-if-not-resolved="false"></xref>, for instance
                    <code>b =&gt; b.Type( typeof(Console) ).Methods( "WriteLine" ).RedirectToSynthesizedMethod( nameof(this.Log) )</code>. It is invoked once,
                    before this method returns.
    typeParameters:
    - id: TScope
    content.vb: Public Shared Sub InterceptMethods(Of TScope As {Class, IDeclaration})(adviser As IAdviser(Of TScope), build As Func(Of IMethodInterceptionBuilder, IMethodInterception))
  overload: Metalama.Extensions.Interceptors.InterceptionAdviserExtensions.InterceptMethods*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">build</code> is <code>null</code>.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The delegate returned <code>null</code>, or a value that does not describe a complete interception.
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      The delegate discarded a value that it created, or the project that executes the registration
                  does not reference the <code>Metalama.Extensions.Interceptors</code> package.
