  type: Class
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Provides extension methods that register interceptors from an aspect or a type fabric. The scope is the target of the adviser: a

    compilation, a namespace, a type or a member.
  remarks: >-
    <p>

    These methods can be called only during <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> or during the amend method of a fabric. They return nothing,

    because interception happens after all aspects have run. When the aspect ends with an error or is skipped, its interceptors are

    discarded.

    </p>

    <p>

    The scope must be contained in the closest type of the aspect target. When the aspect target is a namespace, the scope must be contained

    in that namespace. When the aspect target is the compilation, any scope of the current project is accepted.

    </p>

    <p>

    Only call sites written in the source code are intercepted. A call that the compiler, the runtime or a library makes on behalf of the

    code is not intercepted, because no call exists at the site. For instance, <code>ToString</code> cannot be intercepted reliably: an interpolated

    string, a string concatenation, <code>Console.WriteLine( object )</code> and <code>StringBuilder.Append( object )</code> call it inside the runtime.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public static class InterceptionAdviserExtensions
    content.vb: >-
      <CompileTime>

      Public Module InterceptionAdviserExtensions
