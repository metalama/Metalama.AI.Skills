    - id: amender
      type: Metalama.Framework.Fabrics.ITypeAmender
      description: The amender of a type fabric.
    - id: build
      type: System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionBuilder,Metalama.Extensions.Interceptors.IMethodInterception}
