- uid: Metalama.Framework.Introspection.IIntrospectionCompilationDetails.HasMetalamaSucceeded
  commentId: P:Metalama.Framework.Introspection.IIntrospectionCompilationDetails.HasMetalamaSucceeded
  id: HasMetalamaSucceeded
  parent: Metalama.Framework.Introspection.IIntrospectionCompilationDetails
  langs:
  - csharp
  - vb
  name: HasMetalamaSucceeded
  nameWithType: IIntrospectionCompilationDetails.HasMetalamaSucceeded
  fullName: Metalama.Framework.Introspection.IIntrospectionCompilationDetails.HasMetalamaSucceeded
  type: Property
  assemblies:
  - Metalama.Framework.Introspection
  namespace: Metalama.Framework.Introspection
  summary: >-
    Gets a value indicating whether the processing of the compilation by Metalama was successful

    for all projects in the current set. This property returns <code>true</code> if the Metalama compilation

    process completed successfully, even if it resulted the compilation processes reported errors.

    These errors would be visible in the <xref href="Metalama.Framework.Introspection.IIntrospectionCompilationDetails.Diagnostics" data-throw-if-not-resolved="false"></xref> collection.
  example: []
  syntax:
    content: bool HasMetalamaSucceeded { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property HasMetalamaSucceeded As Boolean
  overload: Metalama.Framework.Introspection.IIntrospectionCompilationDetails.HasMetalamaSucceeded*
