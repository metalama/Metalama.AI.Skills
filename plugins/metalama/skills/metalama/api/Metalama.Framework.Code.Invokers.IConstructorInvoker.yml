  name: IConstructorInvoker
  nameWithType: IConstructorInvoker
  fullName: Metalama.Framework.Code.Invokers.IConstructorInvoker
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Allows generating run-time code that invokes a constructor when you have its compile-time <xref href="Metalama.Framework.Code.IConstructor" data-throw-if-not-resolved="false"></xref> representation.
  remarks: >-
    <p>
        Invokers are APIs that allow you to generate run-time code from compile-time declarations. When you have an <xref href="Metalama.Framework.Code.IConstructor" data-throw-if-not-resolved="false"></xref>
        object (a compile-time representation of a constructor), you can use its invoker methods to create <xref href="Metalama.Framework.Code.IObjectCreationExpression" data-throw-if-not-resolved="false"></xref>
        objects that represent object instantiation. These expressions can then be used in templates and will be expanded into actual C# code.
        </p>
    <p>
        The <xref href="Metalama.Framework.Code.Invokers.IConstructorInvoker.Invoke(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> method returns a <code>dynamic</code> value that can be used directly in template code, while
        <xref href="Metalama.Framework.Code.Invokers.IConstructorInvoker.CreateInvokeExpression" data-throw-if-not-resolved="false"></xref> and its overloads return an <xref href="Metalama.Framework.Code.IObjectCreationExpression" data-throw-if-not-resolved="false"></xref> for use in compile-time APIs.
        </p>
    <p>
        Unlike other invokers, constructors do not support <code>WithObject</code> or <code>WithOptions</code> since they always create new instances
        and do not have implementation layers or nullability concerns in the same way as member access.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface IConstructorInvoker
    content.vb: >-
      <CompileTime>

      Public Interface IConstructorInvoker
