  name: Constant
  nameWithType: ObservabilityContract.Constant
  fullName: Metalama.Patterns.Observability.Configuration.ObservabilityContract.Constant
  type: Property
  assemblies:
  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability.Configuration
  summary: >-
    Gets an <xref href="Metalama.Patterns.Observability.Configuration.ObservabilityContract" data-throw-if-not-resolved="false"></xref> that guarantees that the outputs of a method depend only on its input

    parameters (i.e., identical inputs will always produce identical outputs) and that the method has no side effects

    on observable state.
  remarks: >-
    <p>

    When applied to a type, the guarantee must hold for all methods and properties within that type.

    </p>
