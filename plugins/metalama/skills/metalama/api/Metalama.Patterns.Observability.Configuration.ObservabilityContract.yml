  fullName: Metalama.Patterns.Observability.Configuration.ObservabilityContract
  type: Class
  assemblies:
  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability.Configuration
  summary: Represents behavioral guarantees made by a method, field, or property with respect to the <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>

    An observability contract allows you to inform the <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect about the behavior of

    methods it cannot analyze automatically. This prevents false positive warnings and enables correct dependency tracking.

    </p>
