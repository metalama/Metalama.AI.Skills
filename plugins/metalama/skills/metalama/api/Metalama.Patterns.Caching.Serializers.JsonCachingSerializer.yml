  summary: An implementation of <xref href="Metalama.Patterns.Caching.Serializers.ICachingSerializer" data-throw-if-not-resolved="false"></xref> based on <xref href="System.Text.Json.JsonSerializer" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>This serializer stores the assembly-qualified type name along with the JSON payload,

    allowing for polymorphic deserialization of cached values.</p>

    <p>To customize type name resolution (for example, for type forwarding scenarios),

    override the <xref href="Metalama.Patterns.Caching.Serializers.JsonCachingSerializer.GetTypeName(System.Type)" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Patterns.Caching.Serializers.JsonCachingSerializer.ResolveTypeName(System.String)" data-throw-if-not-resolved="false"></xref> methods.</p>
