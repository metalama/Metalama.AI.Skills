  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Wraps a template provider type or instance for use in auxiliary template invocation and advice factory methods.
  remarks: >-
    <p>
        A <xref href="Metalama.Framework.Aspects.TemplateProvider" data-throw-if-not-resolved="false"></xref> encapsulates either an <xref href="Metalama.Framework.Aspects.ITemplateProvider" data-throw-if-not-resolved="false"></xref> instance or a type
        that implements <xref href="Metalama.Framework.Aspects.ITemplateProvider" data-throw-if-not-resolved="false"></xref>. This allows templates to be invoked from external classes
        or from the current aspect.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Aspects.TemplateProvider.FromInstance(Metalama.Framework.Aspects.ITemplateProvider)" data-throw-if-not-resolved="false"></xref> to wrap an existing template provider instance, or <xref href="Metalama.Framework.Aspects.TemplateProvider.FromType%60%601" data-throw-if-not-resolved="false"></xref>
        to specify a template provider type. When passed to <xref href="Metalama.Framework.Aspects.meta.InvokeTemplate(System.String%2cMetalama.Framework.Aspects.TemplateProvider%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Advising.IAdviceFactory.WithTemplateProvider(Metalama.Framework.Aspects.ITemplateProvider)" data-throw-if-not-resolved="false"></xref>, Metalama will look up template methods
        from the specified provider.
        </p>
    <p>
        Passing <code>default</code> (or a null provider) indicates that the current aspect should be used as the template provider.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public readonly struct TemplateProvider : IEquatable<TemplateProvider>
    content.vb: >-
      <CompileTime>

      Public Structure TemplateProvider Implements IEquatable(Of TemplateProvider)
