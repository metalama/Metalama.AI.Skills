- uid: Metalama.Framework.Aspects.TemplateProvider.FromType``1
  commentId: M:Metalama.Framework.Aspects.TemplateProvider.FromType``1
  id: FromType``1
  parent: Metalama.Framework.Aspects.TemplateProvider
  langs:
  - csharp
  - vb
  name: FromType<T>()
  nameWithType: TemplateProvider.FromType<T>()
  fullName: Metalama.Framework.Aspects.TemplateProvider.FromType<T>()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Creates a <xref href="Metalama.Framework.Aspects.TemplateProvider" data-throw-if-not-resolved="false"></xref> from a type that implements <xref href="Metalama.Framework.Aspects.ITemplateProvider" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Use this method when you want to invoke templates from a class that is not the current aspect or fabric.
        The type <code class="typeparamref">T</code> must implement <xref href="Metalama.Framework.Aspects.ITemplateProvider" data-throw-if-not-resolved="false"></xref> (which is an empty marker interface)
        and contain one or more template methods.
        </p>
    <p>
      <b>Important:</b> The type <code class="typeparamref">T</code> is never instantiated. This means:
        <ul><li>No constructor is required on <code class="typeparamref">T</code></li><li>Instance members of <code class="typeparamref">T</code> are not accessible from the template</li><li>Templates in <code class="typeparamref">T</code> must be <code>static</code> methods</li></ul></p>
    <p>
        If you need to invoke instance templates or access instance state, use <xref href="Metalama.Framework.Aspects.TemplateProvider.FromInstance(Metalama.Framework.Aspects.ITemplateProvider)" data-throw-if-not-resolved="false"></xref> instead,
        passing an actual instance of the template provider.
        </p>
  example: []
  syntax:
    content: 'public static TemplateProvider FromType<T>() where T : ITemplateProvider'
    typeParameters:
    - id: T
      description: >-
        A type that implements <xref href="Metalama.Framework.Aspects.ITemplateProvider" data-throw-if-not-resolved="false"></xref> and contains template methods
                    (methods annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>). The type must not be <code>static</code>; if you need
                    a helper class with only static templates, make the class non-static and add a private constructor to prevent instantiation.
    return:
      type: Metalama.Framework.Aspects.TemplateProvider
      description: A <xref href="Metalama.Framework.Aspects.TemplateProvider" data-throw-if-not-resolved="false"></xref> that references the specified type.
    content.vb: Public Shared Function FromType(Of T As ITemplateProvider)() As TemplateProvider
  overload: Metalama.Framework.Aspects.TemplateProvider.FromType*
