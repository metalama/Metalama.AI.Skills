  langs:
  - csharp
  - vb
  name: IGeneric
  nameWithType: IGeneric
  fullName: Metalama.Framework.Code.IGeneric
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Represents a generic declaration with type parameters, common to <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        In Metalama, and unlike <code>System.Reflection</code>, generic types and methods are always fully bound. In generic declarations,
        such as in <code>typeof(List&lt;&gt;)</code>, type parameters are bound to themselves, i.e. the content of the <xref href="Metalama.Framework.Code.IGeneric.TypeArguments" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.IGeneric.TypeParameters" data-throw-if-not-resolved="false"></xref>
        properties are identical.
        </p>
    <p>
        Consider the type <code>List&lt;T&gt;</code>, where <code>T</code> is a type parameter. In the generic type instance <code>List&lt;int&gt;</code>,
        <code>T</code> is the type parameter and <code>int</code> is the type argument; the <code>T</code> parameter is bound to <code>int</code>.
        In the type definition <code>List&lt;T&gt;</code>, <code>T</code> is both the type parameter and the type argument, because <code>T</code> is bound to itself.
        The <xref href="Metalama.Framework.Code.IGeneric.IsCanonicalGenericInstance" data-throw-if-not-resolved="false"></xref> property returns <code>true</code> when all type parameters are bound to themselves.
        </p>
    <p>
        To create a generic instance from a generic definition, use <xref href="Metalama.Framework.Code.INamedType.MakeGenericInstance(System.Collections.Generic.IReadOnlyList%7bMetalama.Framework.Code.IType%7d)" data-throw-if-not-resolved="false"></xref> or the extension methods in <xref href="Metalama.Framework.Code.GenericExtensions" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public interface IGeneric : IMemberOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>'
    content.vb: Public Interface IGeneric Inherits IMemberOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration)
