- uid: Metalama.Framework.Code.IGeneric.IsCanonicalGenericInstance
  commentId: P:Metalama.Framework.Code.IGeneric.IsCanonicalGenericInstance
  id: IsCanonicalGenericInstance
  parent: Metalama.Framework.Code.IGeneric
  langs:
  - csharp
  - vb
  name: IsCanonicalGenericInstance
  nameWithType: IGeneric.IsCanonicalGenericInstance
  fullName: Metalama.Framework.Code.IGeneric.IsCanonicalGenericInstance
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether all type parameters are bound to themselves, i.e. if the content of <xref href="Metalama.Framework.Code.IGeneric.TypeArguments" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.IGeneric.TypeParameters" data-throw-if-not-resolved="false"></xref> are equal.

    This property returns <code>true</code> if the current declaration has no generic argument. For generic methods, this property returns <code>false</code> if the declaring type is generic but is not a canonical generic instance.
  example: []
  syntax:
    content: bool IsCanonicalGenericInstance { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsCanonicalGenericInstance As Boolean
  overload: Metalama.Framework.Code.IGeneric.IsCanonicalGenericInstance*
