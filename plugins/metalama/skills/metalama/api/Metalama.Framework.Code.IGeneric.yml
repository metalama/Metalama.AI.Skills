- uid: Metalama.Framework.Code.IGeneric.TypeArguments
  commentId: P:Metalama.Framework.Code.IGeneric.TypeArguments
  id: TypeArguments
  parent: Metalama.Framework.Code.IGeneric
  langs:
  - csharp
  - vb
  name: TypeArguments
  nameWithType: IGeneric.TypeArguments
  fullName: Metalama.Framework.Code.IGeneric.TypeArguments
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the generic type arguments of the current type or method, which are the type values

    applied to the <xref href="Metalama.Framework.Code.IGeneric.TypeParameters" data-throw-if-not-resolved="false"></xref> of the current type. The number of items in this list is always the same

    as in <xref href="Metalama.Framework.Code.IGeneric.TypeParameters" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    When reflecting a generic declaration, i.e. with unbound type parameters, the content

    of this collection is identical to <xref href="Metalama.Framework.Code.IGeneric.TypeParameters" data-throw-if-not-resolved="false"></xref>. That is, there is no such thing as an unbound generic declaration

    in Metalama because generic declarations are bound to their parameters.
  example: []
  syntax:
    content: IReadOnlyList<IType> TypeArguments { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyList{Metalama.Framework.Code.IType}
    content.vb: ReadOnly Property TypeArguments As IReadOnlyList(Of IType)
  overload: Metalama.Framework.Code.IGeneric.TypeArguments*
