  summary: >-
    A strongly-typed <xref href="Metalama.Framework.Code.IRef%601" data-throw-if-not-resolved="false"></xref> that stores only a string identifier and therefore does not keep the

    compilation it came from in memory.
  remarks: >-
    This is the strongly-typed variant of <xref href="Metalama.Framework.Code.IDurableRef" data-throw-if-not-resolved="false"></xref>, which documents when to use it. Obtain one by

    calling <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> on a declaration or a type, or <xref href="Metalama.Framework.Code.IRef%601.ToDurable" data-throw-if-not-resolved="false"></xref>

    on a reference.
