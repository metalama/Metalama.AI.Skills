  type: Interface
  assemblies:
  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects.Configuration
  summary: >-
    Interface for compile-time classifiers that determine how method parameters should be handled

    in cache key generation.
  remarks: >-
    <p>Implementations of this interface are registered through the

    <xref href="Metalama.Patterns.Caching.Aspects.Configuration.CachingOptionsBuilder.AddParameterClassifier(System.String%2cMetalama.Patterns.Caching.Aspects.Configuration.ICacheParameterClassifier)" data-throw-if-not-resolved="false"></xref> method and are evaluated at compile time

    for each parameter of cached methods.</p>

    <p>Classifiers can exclude parameters from the cache key (for example, to exclude <code>ILogger</code>

    parameters) or report parameters as ineligible for caching (for example, parameters of types

    that cannot be reliably serialized to a cache key).</p>
  example: []
  syntax:
    content: 'public interface ICacheParameterClassifier : ICompileTimeSerializable'
    content.vb: Public Interface ICacheParameterClassifier Inherits ICompileTimeSerializable
