  type: Method
  assemblies:
  - Flashtrace
  namespace: Flashtrace.Activities
  summary: >-
    Suspends the current async activity.

    The activity must than be resumed by a call of the <xref href="Flashtrace.Activities.LogActivity%601.Resume" data-throw-if-not-resolved="false"></xref> method.

    There is typically no need to invoke this method in user code because all async methods that use the <xref href="Flashtrace.FlashtraceLevelSource" data-throw-if-not-resolved="false"></xref> class are automatically instrumented.
