- uid: Metalama.Extensions.Interceptors.IMethodInterceptionInfo.InterceptedMethod
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionInfo.InterceptedMethod
  id: InterceptedMethod
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionInfo
  langs:
  - csharp
  - vb
  name: InterceptedMethod
  nameWithType: IMethodInterceptionInfo.InterceptedMethod
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionInfo.InterceptedMethod
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the intercepted method, as the generated method calls it. When the generated method is generic over the type parameters of the

    intercepted method, its type arguments are the type parameters of the generated method. Otherwise, they are the type arguments of the

    call sites, which all the call sites that share the generated method have in common.
  example: []
  syntax:
    content: IMethod InterceptedMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property InterceptedMethod As IMethod
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionInfo.InterceptedMethod*
