    typeParameters:
    - id: T
      description: The type of member or named type being validated.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{Metalama.Framework.Code.INamedType}
      description: An eligibility builder for the declaring type.
    content.vb: Public Shared Function DeclaringType(Of T As {Class, IMemberOrNamedType})(eligibilityBuilder As IEligibilityBuilder(Of T)) As IEligibilityBuilder(Of INamedType)
