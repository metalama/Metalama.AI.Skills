      description: The parent eligibility builder for a parameter.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{Metalama.Framework.Code.IHasParameters}
      description: An eligibility builder for the declaring member (method, property, indexer, or event) that contains the parameter.
    content.vb: Public Shared Function DeclaringMember(eligibilityBuilder As IEligibilityBuilder(Of IParameter)) As IEligibilityBuilder(Of IHasParameters)
