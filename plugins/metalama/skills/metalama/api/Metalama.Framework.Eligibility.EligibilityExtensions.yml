  summary: >-
    Gets an <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref> for the same declaration as the given <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref>

    but that is applicable only to specified <xref href="Metalama.Framework.Eligibility.EligibleScenarios" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Use this method to restrict eligibility rules to specific scenarios. Rules added to the returned builder
        will only be evaluated for the specified scenarios. This is useful when you want different eligibility
        requirements for different scenarios.
        </p>
    <p>
        This is the opposite of <xref href="Metalama.Framework.Eligibility.EligibilityExtensions.ExceptForScenarios%60%601(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%60%600%7d%2cMetalama.Framework.Eligibility.EligibleScenarios)" data-throw-if-not-resolved="false"></xref> which excludes specific scenarios.
        </p>
  example: []
  syntax:
    content: 'public static IEligibilityBuilder<T> ForScenarios<T>(this IEligibilityBuilder<T> eligibilityBuilder, EligibleScenarios excludedScenarios) where T : class'
    parameters:
    - id: eligibilityBuilder
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: The parent eligibility builder.
    - id: excludedScenarios
      type: Metalama.Framework.Eligibility.EligibleScenarios
      description: >-
        The scenarios for which the following rules should apply. This is a flags enumeration
                    and can be a combination of scenarios (e.g., <code>EligibleScenarios.Default | EligibleScenarios.Inheritance</code>).
    typeParameters:
    - id: T
      description: The type of declaration being validated.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: An eligibility builder that applies only to the specified scenarios.
