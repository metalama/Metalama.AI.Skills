  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Eligibility
  summary: >-
    Adds a custom eligibility condition to the given <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref>, where the condition must be

    satisfied by the declaration in order to be eligible for the aspect.
  remarks: >-
    <p>
        Use this method when standard eligibility methods like <xref href="Metalama.Framework.Eligibility.EligibilityExtensions.MustNotBeStatic(Metalama.Framework.Eligibility.IEligibilityBuilder%7bMetalama.Framework.Code.IMemberOrNamedType%7d)" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Eligibility.EligibilityExtensions.MustNotBeAbstract(Metalama.Framework.Eligibility.IEligibilityBuilder%7bMetalama.Framework.Code.IMemberOrNamedType%7d)" data-throw-if-not-resolved="false"></xref>
        are insufficient for your requirements. The <code class="paramref">getJustification</code> message should state what the declaration
        <em>must</em> be (e.g., "must not be a record type") rather than what it <em>must not</em> be, as this convention
        combines better when multiple conditions are violated.
        </p>
    <p>
        Do not format the string yourself—use a raw interpolated string. The framework uses a custom formatter
        to ensure proper rendering of declarations.
        </p>
  example: []
  syntax:
    content: 'public static void MustSatisfy<T>(this IEligibilityBuilder<T> eligibilityBuilder, Predicate<T> predicate, Func<IDescribedObject<T>, FormattableString> getJustification) where T : class'
    parameters:
    - id: eligibilityBuilder
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: The parent <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: predicate
      type: System.Predicate{{T}}
      description: A predicate that returns <code>true</code> if the declaration is eligible for the aspect.
    - id: getJustification
      type: System.Func{Metalama.Framework.Eligibility.IDescribedObject{{T}},System.FormattableString}
      description: >-
        A delegate called when the <code class="paramref">predicate</code> returns <code>false</code> and an
                    error message is needed. This delegate must return a <xref href="System.FormattableString" data-throw-if-not-resolved="false"></xref> (a C# interpolated string like <code>$"like {this}"</code>)
                    explaining what the declaration <em>must</em> be to satisfy the condition.
    typeParameters:
    - id: T
    content.vb: Public Shared Sub MustSatisfy(Of T As Class)(eligibilityBuilder As IEligibilityBuilder(Of T), predicate As Predicate(Of T), getJustification As Func(Of IDescribedObject(Of T), FormattableString))
