  namespace: Metalama.Framework.Eligibility
  summary: >-
    Gets an <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref> for the same declaration as the given <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref>

    but that is not applicable to specified <xref href="Metalama.Framework.Eligibility.EligibleScenarios" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Use this method to exclude specific scenarios from eligibility. Rules added to the returned builder
        will mark the declaration as ineligible for the specified scenarios. This is useful when you want to
        prevent aspects from being applied in certain contexts (e.g., excluding inheritance scenarios).
        </p>
    <p>
        This is the opposite of <xref href="Metalama.Framework.Eligibility.EligibilityExtensions.ForScenarios%60%601(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%60%600%7d%2cMetalama.Framework.Eligibility.EligibleScenarios)" data-throw-if-not-resolved="false"></xref> which restricts to specific scenarios only.
        </p>
  example: []
  syntax:
    content: 'public static IEligibilityBuilder<T> ExceptForScenarios<T>(this IEligibilityBuilder<T> eligibilityBuilder, EligibleScenarios excludedScenarios) where T : class'
    parameters:
    - id: eligibilityBuilder
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: The parent eligibility builder.
    - id: excludedScenarios
      type: Metalama.Framework.Eligibility.EligibleScenarios
      description: >-
        The scenarios to exclude from eligibility. This is a flags enumeration
                    and can be a combination of scenarios (e.g., <code>EligibleScenarios.Inheritance | EligibleScenarios.LiveTemplate</code>).
    typeParameters:
    - id: T
      description: The type of declaration being validated.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: An eligibility builder that excludes the specified scenarios.
    content.vb: Public Shared Function ExceptForScenarios(Of T As Class)(eligibilityBuilder As IEligibilityBuilder(Of T), excludedScenarios As EligibleScenarios) As IEligibilityBuilder(Of T)
