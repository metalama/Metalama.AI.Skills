  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Eligibility
  summary: >-
    Returns an <xref href="Metalama.Framework.Eligibility.IEligibilityBuilder" data-throw-if-not-resolved="false"></xref> that conditionally applies rules based on a predicate.

    Rules added to the returned builder are only evaluated if the condition is satisfied.
  remarks: >-
    <p>
        Use this method when eligibility depends on a condition. For example, you might require static methods to have
        no parameters, but allow instance methods to have parameters. The rules added after <code>If</code> only apply
        when the condition is met.
        </p>
    <p>
        This is conceptually similar to: "If the declaration is X, then it must also satisfy Y."
        If the declaration is not X, the Y requirement is ignored.
        </p>
  example: []
  syntax:
    content: 'public static IEligibilityBuilder<T> If<T>(this IEligibilityBuilder<T> eligibilityBuilder, Predicate<T> condition) where T : class'
    parameters:
    - id: eligibilityBuilder
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: The parent eligibility builder.
    - id: condition
      type: System.Predicate{{T}}
      description: >-
        A predicate that determines whether the following rules should be evaluated.
                    If this returns <code>false</code>, the rules are ignored and the declaration is considered eligible (for those rules).
    typeParameters:
    - id: T
      description: The type of declaration being validated.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}
      description: An eligibility builder where rules are only evaluated when the condition is true.
    content.vb: Public Shared Function [If](Of T As Class)(eligibilityBuilder As IEligibilityBuilder(Of T), condition As Predicate(Of T)) As IEligibilityBuilder(Of T)
