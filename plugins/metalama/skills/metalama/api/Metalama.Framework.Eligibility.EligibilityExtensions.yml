    To check the type of a field, property or parameter, use code like <code>builder.Type().MustBeConvertibleTo(typeof(string));</code> instead.
  remarks: >-
    <p>Note that this validates the object itself, not the declaration that it represents.
        For instance, if the object is an <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref> and the <code class="paramref">type</code> parameter is set to <code>typeof(string)</code>,
        this method will fail with an exception, because no conversion exists from <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref> to <code>string</code>.</p>
    <p>On the other hand, code like <code>builder.MustBeInstanceOfType(typeof(IProperty));</code> will correctly check that a declaration is a property.</p>
