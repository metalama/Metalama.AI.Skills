  namespace: Metalama.Framework.Code.Types
  summary: Represents an array, e.g. <code>T[]</code>.
  remarks: >-
    <p>
        To create an <xref href="Metalama.Framework.Code.Types.IArrayType" data-throw-if-not-resolved="false"></xref>, call the <xref href="Metalama.Framework.Code.IType.MakeArrayType(System.Int32)" data-throw-if-not-resolved="false"></xref> method on any <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref> instance.
        For example: <code>intType.MakeArrayType()</code> creates <code>int[]</code>, and <code>intType.MakeArrayType(2)</code> creates <code>int[,]</code>.
        </p>
    <p>
        You can also obtain array types from existing declarations in the code model.
        </p>
  example: []
  syntax:
    content: 'public interface IArrayType : IType, ICompilationElement, IDisplayable, IEquatable<IType>'
    content.vb: Public Interface IArrayType Inherits IType, ICompilationElement, IDisplayable, IEquatable(Of IType)
