- uid: Metalama.Extensions.Interceptors.IMethodSelection.Where(System.Func{Metalama.Framework.Code.IMethod,System.Boolean})
  commentId: M:Metalama.Extensions.Interceptors.IMethodSelection.Where(System.Func{Metalama.Framework.Code.IMethod,System.Boolean})
  id: Where(System.Func{Metalama.Framework.Code.IMethod,System.Boolean})
  parent: Metalama.Extensions.Interceptors.IMethodSelection
  langs:
  - csharp
