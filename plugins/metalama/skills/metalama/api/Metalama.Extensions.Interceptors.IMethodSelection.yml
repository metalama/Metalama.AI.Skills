  name: Where(Func<IMethod, bool>)
  nameWithType: IMethodSelection.Where(Func<IMethod, bool>)
  fullName: Metalama.Extensions.Interceptors.IMethodSelection.Where(System.Func<Metalama.Framework.Code.IMethod, bool>)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Keeps only the selected methods that a predicate accepts, for instance one overload of a method name.
  example: []
  syntax:
    content: IMethodSelection Where(Func<IMethod, bool> predicate)
    parameters:
    - id: predicate
      type: System.Func{Metalama.Framework.Code.IMethod,System.Boolean}
      description: >-
        The predicate over the method definitions of the selected types. It is stored with the registration, so it must
                    not capture a declaration or a compilation. It is invoked once for each method definition that has a selected name. Several calls
                    combine their predicates.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.IMethodSelection
    content.vb: Function Where(predicate As Func(Of IMethod, Boolean)) As IMethodSelection
  overload: Metalama.Extensions.Interceptors.IMethodSelection.Where*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">predicate</code> is <code>null</code>.
