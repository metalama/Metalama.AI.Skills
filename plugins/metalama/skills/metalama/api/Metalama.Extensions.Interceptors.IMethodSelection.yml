- uid: Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionSite,Metalama.Extensions.Interceptors.IMethodInterception})
  commentId: M:Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionSite,Metalama.Extensions.Interceptors.IMethodInterception})
  id: ForEachSite(System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionSite,Metalama.Extensions.Interceptors.IMethodInterception})
  parent: Metalama.Extensions.Interceptors.IMethodSelection
  langs:
  - csharp
  - vb
  name: ForEachSite(Func<IMethodInterceptionSite, IMethodInterception>)
  nameWithType: IMethodSelection.ForEachSite(Func<IMethodInterceptionSite, IMethodInterception>)
  fullName: Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func<Metalama.Extensions.Interceptors.IMethodInterceptionSite, Metalama.Extensions.Interceptors.IMethodInterception>)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Decides the interception of each call site with a delegate, for instance to skip some call sites or to choose a template per site.
  remarks: >-
    <p>

    The delegate can report diagnostics through <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.Diagnostics" data-throw-if-not-resolved="false"></xref>. An exception thrown by the delegate is

    reported as an error on the declaration that contains the site, and the site is not intercepted.

    </p>

    <p>

    The delegate is invoked only for call sites written in the source code. A call that the compiler, the runtime or a library makes on

    behalf of the code is never presented, because no call exists at the site.

    </p>
  example: []
  syntax:
    content: IMethodInterception ForEachSite(Func<IMethodInterceptionSite, IMethodInterception> intercept)
    parameters:
    - id: intercept
      type: System.Func{Metalama.Extensions.Interceptors.IMethodInterceptionSite,Metalama.Extensions.Interceptors.IMethodInterception}
      description: >-
        The delegate. It receives the call site, which describes the site and creates its result, and returns a result
                    created by this site during this invocation, for instance <code>site.Skip()</code> or <code>site.RedirectToSynthesizedMethod( … )</code>. A result
                    created for another site is refused, so the delegate cannot store a result and return it again. It is stored with the registration,
                    so it must not capture a declaration or a compilation. It can be invoked concurrently, and several times for the same site.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.IMethodInterception
    content.vb: Function ForEachSite(intercept As Func(Of IMethodInterceptionSite, IMethodInterception)) As IMethodInterception
  overload: Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">intercept</code> is <code>null</code>.
  nameWithType.vb: IMethodSelection.ForEachSite(Func(Of IMethodInterceptionSite, IMethodInterception))
  fullName.vb: Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func(Of Metalama.Extensions.Interceptors.IMethodInterceptionSite, Metalama.Extensions.Interceptors.IMethodInterception))
  name.vb: ForEachSite(Func(Of IMethodInterceptionSite, IMethodInterception))
