  fullName: Metalama.Framework.Code.Types.IDelegateFacet
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: 'Represents the structure of a delegate: its <code>Invoke</code> method, which carries its signature.'
  remarks: >-
    <p>
        The facet is reached through <xref href="Metalama.Framework.Code.Collections.ITypeFacetCollection.Delegate" data-throw-if-not-resolved="false"></xref>, as in
        <code>type.Facets.Delegate?.ReturnType</code>. It is <code>null</code> for a type that
        <xref href="Metalama.Framework.Code.INamedType.IsDelegate" data-throw-if-not-resolved="false"></xref> reports as not being a delegate, which includes
        <xref href="System.Delegate" data-throw-if-not-resolved="false"></xref> and <xref href="System.MulticastDelegate" data-throw-if-not-resolved="false"></xref> themselves.
        </p>
    <p>
        The <code>BeginInvoke</code> and <code>EndInvoke</code> methods are not exposed. They exist only for a delegate compiled for
        .NET Framework, and they are the asynchronous pattern that preceded <code>async</code>.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IDelegateFacet : ITypeFacet
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IDelegateFacet Inherits ITypeFacet
