  namespace: Metalama.Framework.Code
  summary: Represents a syntax node in source code. Using <code>Metalama.Framework.Sdk</code> you can use <code>ToSyntaxNodeOrToken</code> to convert it to a Roslyn object.
  remarks: >-
    <p>
        To obtain a <xref href="Metalama.Framework.Code.SourceReference" data-throw-if-not-resolved="false"></xref>, access the <xref href="Metalama.Framework.Code.IDeclaration.Sources" data-throw-if-not-resolved="false"></xref> property on any declaration.
        </p>
  example: []
