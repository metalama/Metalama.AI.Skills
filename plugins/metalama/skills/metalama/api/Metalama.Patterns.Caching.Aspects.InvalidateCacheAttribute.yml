- uid: Metalama.Patterns.Caching.Aspects.InvalidateCacheAttribute.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IMethod})
  commentId: M:Metalama.Patterns.Caching.Aspects.InvalidateCacheAttribute.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IMethod})
