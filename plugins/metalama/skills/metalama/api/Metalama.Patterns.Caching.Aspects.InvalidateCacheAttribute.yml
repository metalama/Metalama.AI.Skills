  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Aspect that, when applied to a method, causes an invocation of this method to remove from

    the cache the result of invocations of other given methods with the same parameter values.
  remarks: >-
    <p>The <xref href="Metalama.Patterns.Caching.Aspects.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> aspect provides compile-time validation that the parameters of the

    invalidated and invalidating methods match. Parameters are matched by name and type, and a compile-time error

    is reported if any required parameter cannot be matched.</p>

    <p>By default, this aspect looks for the cached methods in the current type. To invalidate methods in a different type,

    use the constructor overload that accepts a <xref href="System.Type" data-throw-if-not-resolved="false"></xref> parameter.</p>

    <p>For imperative invalidation without an aspect, use the <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Invalidate%60%602(Metalama.Patterns.Caching.ICachingService%2cSystem.Func%7b%60%601%2c%60%600%7d%2c%60%601)" data-throw-if-not-resolved="false"></xref>

    method or the <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.InvalidateAsync%60%602(Metalama.Patterns.Caching.ICachingService%2cSystem.Func%7b%60%601%2c%60%600%7d%2c%60%601%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method, AllowMultiple = true)]

      public sealed class InvalidateCacheAttribute : MethodAspect, IAspect<IMethod>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IMethod>
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method, AllowMultiple:=True)>

      Public NotInheritable Class InvalidateCacheAttribute Inherits MethodAspect Implements IAspect(Of IMethod), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IMethod)
