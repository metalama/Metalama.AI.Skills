  namespace: Metalama.Framework.Engine.Services
  summary: Provides access to project-scoped services. A wrapper around <xref href="Metalama.Framework.Engine.Services.ServiceProvider%601" data-throw-if-not-resolved="false"></xref> for <xref href="Metalama.Framework.Services.IProjectService" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Project services are scoped to a specific compilation or project. This provider also provides access to global services
        through the <xref href="Metalama.Framework.Engine.Services.ProjectServiceProvider.Global" data-throw-if-not-resolved="false"></xref> property.</p>
    <p>This type is immutable. Methods like <xref href="Metalama.Framework.Engine.Services.ProjectServiceProvider.WithService(Metalama.Framework.Services.IProjectService%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Engine.Services.ProjectServiceProvider.WithServices(System.Collections.Generic.IEnumerable%7bMetalama.Framework.Services.IProjectService%7d)" data-throw-if-not-resolved="false"></xref> return a new instance
        instead of modifying the current one.</p>
