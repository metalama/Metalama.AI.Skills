    Gets the delegate that packs the event arguments and calls <xref href="Metalama.Framework.RunTime.Events.EventBroker%603.Invoke(%601%40)" data-throw-if-not-resolved="false"></xref>

    or <xref href="Metalama.Framework.RunTime.Events.EventBroker%603.InvokeByRef(%601%40)" data-throw-if-not-resolved="false"></xref>. This delegate is then registered in the event using <xref href="Metalama.Framework.RunTime.Events.IEventAdapter%603.AddHandler(%600%2c%602)" data-throw-if-not-resolved="false"></xref>

    or unregistered using <xref href="Metalama.Framework.RunTime.Events.IEventAdapter%603.RemoveHandler(%600%2c%602)" data-throw-if-not-resolved="false"></xref>.
