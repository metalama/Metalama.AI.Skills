- uid: Metalama.Framework.Aspects.OverrideEventAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IEvent})
  commentId: M:Metalama.Framework.Aspects.OverrideEventAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IEvent})
  id: BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IEvent})
  parent: Metalama.Framework.Aspects.OverrideEventAspect
  langs:
  - csharp
