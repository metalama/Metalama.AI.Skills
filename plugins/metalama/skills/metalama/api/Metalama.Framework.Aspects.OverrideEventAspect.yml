  summary: Template method for overriding the event add accessor.
  remarks: >-
    <p>
        This template method is optional (marked with <code>[Template(IsEmpty = true)]</code>). If not overridden,
        the default add behavior is used.
        </p>
    <p>
        Within the template, use <code>meta.Target.Event</code> to access event metadata. To delegate to the original
        add implementation, use <code>meta.Target.Event.Add(handler)</code> or <code>meta.Proceed()</code>.
        </p>
