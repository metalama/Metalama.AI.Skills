- uid: Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(System.Object)
  commentId: M:Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(System.Object)
  id: OverrideInvoke(System.Object)
  parent: Metalama.Framework.Aspects.OverrideEventAspect
  langs:
  - csharp
  - vb
  name: OverrideInvoke(dynamic)
  nameWithType: OverrideEventAspect.OverrideInvoke(dynamic)
  fullName: Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(dynamic)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Template method for overriding event invocation behavior, executed once per handler when the event is raised.
  remarks: >-
    <p>
        This template method is optional (marked with <code>[Template(IsEmpty = true)]</code>). If not overridden,
        handlers are invoked directly without interception.
        </p>
    <p>
        This template is invoked <strong>once for each registered handler</strong> when the event is raised.
        For example, if there are 3 event handlers and the event is raised once, this template will be called 3 times.
        This enables per-handler interception patterns such as exception handling with handler removal, async execution,
        or handler filtering.
        </p>
    <p>
        Use <code>meta.Proceed()</code> to invoke the actual handler. Within the template, you can access event metadata via
        <code>meta.Target.Event</code> and remove handlers programmatically using
        <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.Remove(System.Object)?text=meta.Target.Event.Remove(handler)" data-throw-if-not-resolved="false"></xref>.
        Note that <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.Raise(System.Object%5b%5d)?text=meta.Target.Event.Raise()" data-throw-if-not-resolved="false"></xref> is not
        supported from this template; you must use <code>meta.Proceed()</code>.
        </p>
  example: []
  syntax:
    content: >-
      [Template(IsEmpty = true)]

      public virtual dynamic? OverrideInvoke(dynamic handler)
    parameters:
    - id: handler
      type: dynamic
      description: The specific event handler being invoked. Use <code>dynamic</code> to support any delegate type.
    return:
      type: dynamic
      description: The return value from invoking the handler (typically <code>null</code> for void handlers).
    content.vb: >-
      <Template(IsEmpty:=True)>

      Public Overridable Function OverrideInvoke(handler As Object) As Object
