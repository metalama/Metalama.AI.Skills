  langs:
  - csharp
  - vb
  name: OverrideEventAspect
  nameWithType: OverrideEventAspect
  fullName: Metalama.Framework.Aspects.OverrideEventAspect
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: A base aspect that overrides the implementation of an event by providing template methods for add, remove, and invoke operations.
  remarks: >-
    <p>
        This class simplifies creating aspects that override event behavior. Derived classes can override the template methods
        <xref href="Metalama.Framework.Aspects.OverrideEventAspect.OverrideAdd(System.Object)" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.OverrideEventAspect.OverrideRemove(System.Object)" data-throw-if-not-resolved="false"></xref>, and <xref href="Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(System.Object)" data-throw-if-not-resolved="false"></xref> to customize event semantics.
        All template methods are optional (marked with <code>[Template(IsEmpty = true)]</code>).
        </p>
    <p>
        When applied to a field-like event, it is automatically transformed into an explicitly implemented event with a backing field,
        similar to how auto-properties are transformed when overridden.
        </p>
    <p>
        The <xref href="Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(System.Object)" data-throw-if-not-resolved="false"></xref> template is invoked <strong>once per event handler</strong> when the event is raised.
        For example, if there are 3 event handlers and the event is invoked once, <xref href="Metalama.Framework.Aspects.OverrideEventAspect.OverrideInvoke(System.Object)" data-throw-if-not-resolved="false"></xref> will be called 3 times.
        This enables per-handler interception patterns such as exception handling with handler removal, async execution, or handler filtering.
        Use <code>meta.Proceed()</code> to invoke the actual handler. You can remove handlers from within the template using
        <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.Remove(System.Object)?text=meta.Target.Event.Remove(handler)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
      <strong>Limitations:</strong> Delegate signatures with non-void return types or with <code>ref</code>/<code>out</code> parameters are not supported.
        Only handlers added through the event's add and remove accessors are intercepted; handlers added directly to the backing field
        (if accessible) will not be intercepted.
        </p>
    <p>
      <strong>Performance Note:</strong> Overriding the invoke operation uses an
        <xref href="Metalama.Framework.RunTime.Events.EventBroker%603" data-throw-if-not-resolved="false"></xref> pattern which adds memory overhead
        (one broker instance per event per object instance, unless the event is static) and allocates short-term memory during event invocation.
        Additional type conversions (casts) are also required. This may affect performance for high-frequency events, although high-frequency
        events are not a common use case for .NET events.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Event)]

      public abstract class OverrideEventAspect : EventAspect, IAspect<IEvent>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IEvent>
