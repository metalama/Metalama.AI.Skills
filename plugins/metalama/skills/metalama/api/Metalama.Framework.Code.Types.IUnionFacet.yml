  fullName: Metalama.Framework.Code.Types.IUnionFacet
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: 'Represents the structure of a union of C# 15: its authoring form, its cases and its <code>Value</code> property.'
  remarks: >-
    <p>
        The facet is reached through <xref href="Metalama.Framework.Code.Collections.ITypeFacetCollection.Union" data-throw-if-not-resolved="false"></xref>, as in <code>type.Facets.Union?.Cases</code>. It is
        <code>null</code> for a type that <xref href="Metalama.Framework.Code.INamedType.IsUnion" data-throw-if-not-resolved="false"></xref> reports as not being a union.
        </p>
    <p>
        A union is not a kind of its own in the code model. The compiler reports a union declaration as a struct, and the
        attribute form keeps the kind of the class or the struct that carries the attribute, so
        <xref href="Metalama.Framework.Code.INamedType.IsUnion" data-throw-if-not-resolved="false"></xref> is the property that tells a union from an ordinary type and this facet is the
        structure behind it.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IUnionFacet : ITypeFacet
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IUnionFacet Inherits ITypeFacet
