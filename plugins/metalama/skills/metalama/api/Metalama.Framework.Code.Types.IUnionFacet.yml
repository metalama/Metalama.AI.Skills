- uid: Metalama.Framework.Code.Types.IUnionFacet.Cases
  commentId: P:Metalama.Framework.Code.Types.IUnionFacet.Cases
  id: Cases
  parent: Metalama.Framework.Code.Types.IUnionFacet
  langs:
  - csharp
  - vb
  name: Cases
  nameWithType: IUnionFacet.Cases
  fullName: Metalama.Framework.Code.Types.IUnionFacet.Cases
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the cases of the union, in the order in which the creation members of the union declare them, which is the

    order of the union header for a union declaration.
  remarks: >-
    <p>
        The list is never empty for a well-formed union, because the language requires a union to have at least one
        case.
        </p>
    <p>
        A type occurs once in the list, as it does in the case set of the compiler. Two creation members that take the
        same type therefore declare one case, whose <xref href="Metalama.Framework.Code.Types.IUnionCase.CreationMember" data-throw-if-not-resolved="false"></xref> is the first of the two.
        </p>
  example: []
  syntax:
    content: IReadOnlyList<IUnionCase> Cases { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyList{Metalama.Framework.Code.Types.IUnionCase}
    content.vb: ReadOnly Property Cases As IReadOnlyList(Of IUnionCase)
  overload: Metalama.Framework.Code.Types.IUnionFacet.Cases*
- uid: Metalama.Framework.Code.Types.IUnionFacet.ValueProperty
  commentId: P:Metalama.Framework.Code.Types.IUnionFacet.ValueProperty
  id: ValueProperty
  parent: Metalama.Framework.Code.Types.IUnionFacet
  langs:
  - csharp
  - vb
  name: ValueProperty
  nameWithType: IUnionFacet.ValueProperty
  fullName: Metalama.Framework.Code.Types.IUnionFacet.ValueProperty
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the <code>Value</code> property, which holds the value of the case that the union currently carries, or

    <code>null</code> when the union has no such property. The compiler synthesizes the property for a union

    declaration, and the language requires the attribute form to have one, so the value is <code>null</code> only for a

    union that the compiler reports as ill-formed, which the code model of a design-time session does see.
  remarks: >-
    The property is the one that the compiler resolves, which is not necessarily declared by the union itself: the

    attribute form may inherit it from a base type, and a union that has a union member provider interface

    declares it on that interface.
  example: []
  syntax:
    content: IProperty? ValueProperty { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IProperty
    content.vb: ReadOnly Property ValueProperty As IProperty
  overload: Metalama.Framework.Code.Types.IUnionFacet.ValueProperty*
