  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a constructor that exactly matches the specified signature given using the <code>System.Reflection</code> API.

    By-ref reflection types (<xref href="System.Type.IsByRef" data-throw-if-not-resolved="false"></xref> == <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>) do not match any parameter.

    Non-by-ref reflection types match parameters with <xref href="Metalama.Framework.Code.RefKind.None" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Code.RefKind.In" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static IConstructor? OfExactSignature(this IConstructorCollection constructors, IReadOnlyList<Type> parameterTypes)
    parameters:
    - id: constructors
      type: Metalama.Framework.Code.Collections.IConstructorCollection
      description: A collection of constructors.
    - id: parameterTypes
      type: System.Collections.Generic.IReadOnlyList{System.Type}
      description: List of parameter types as reflection <xref href="System.Type" data-throw-if-not-resolved="false"></xref> objects.
    return:
      type: Metalama.Framework.Code.IConstructor
      description: A <xref href="Metalama.Framework.Code.IConstructor" data-throw-if-not-resolved="false"></xref> that matches the given signature.
    content.vb: Public Shared Function OfExactSignature(constructors As IConstructorCollection, parameterTypes As IReadOnlyList(Of Type)) As IConstructor
