  langs:
  - csharp
  - vb
  name: CachingBackendEnhancer
  nameWithType: CachingBackendEnhancer
  fullName: Metalama.Patterns.Caching.Implementation.CachingBackendEnhancer
  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Backend
  namespace: Metalama.Patterns.Caching.Implementation
  summary: >-
    A base class for all cache enhancers. A <xref href="Metalama.Patterns.Caching.Implementation.CachingBackendEnhancer" data-throw-if-not-resolved="false"></xref> is a node in a chain of responsibility where

    the last node is the physical implementation of the <xref href="Metalama.Patterns.Caching.Backends.CachingBackend" data-throw-if-not-resolved="false"></xref>. A <xref href="Metalama.Patterns.Caching.Implementation.CachingBackendEnhancer" data-throw-if-not-resolved="false"></xref>

    can add behaviors to a <xref href="Metalama.Patterns.Caching.Backends.CachingBackend" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The default behavior of all methods of a <xref href="Metalama.Patterns.Caching.Implementation.CachingBackendEnhancer" data-throw-if-not-resolved="false"></xref> is to delegate the implementation

    to the next <xref href="Metalama.Patterns.Caching.Backends.CachingBackend" data-throw-if-not-resolved="false"></xref> in the chain of responsibility.</p>
  example: []
  syntax:
    content: 'public abstract class CachingBackendEnhancer : CachingBackend, IDisposable, IAsyncDisposable'
    content.vb: Public MustInherit Class CachingBackendEnhancer Inherits CachingBackend Implements IDisposable, IAsyncDisposable
