items:
- uid: Metalama.Extensions.Interceptors.InterceptorGranularity
  commentId: T:Metalama.Extensions.Interceptors.InterceptorGranularity
  id: InterceptorGranularity
  parent: Metalama.Extensions.Interceptors
  children:
  - Metalama.Extensions.Interceptors.InterceptorGranularity.CallSite
  - Metalama.Extensions.Interceptors.InterceptorGranularity.Default
  - Metalama.Extensions.Interceptors.InterceptorGranularity.Global
  - Metalama.Extensions.Interceptors.InterceptorGranularity.Member
  - Metalama.Extensions.Interceptors.InterceptorGranularity.Owner
  - Metalama.Extensions.Interceptors.InterceptorGranularity.Type
  langs:
  - csharp
  - vb
  name: InterceptorGranularity
  nameWithType: InterceptorGranularity
  fullName: Metalama.Extensions.Interceptors.InterceptorGranularity
  type: Enum
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Declares what the template of a synthesized interceptor depends on, and therefore which call sites share one synthesized method. Set it with

    the <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithGranularity(Metalama.Extensions.Interceptors.InterceptorGranularity)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>

    The enumeration has two independent dimensions:

    </p>

    <ul><li>The site levels <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Type" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Member" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.CallSite" data-throw-if-not-resolved="false"></xref> nest: each level includes the coarser

    ones. Their values are cumulative, so the combination of two levels is the finer one, and

    <code>granularity.HasFlag( InterceptorGranularity.Type )</code> means "at least <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Type" data-throw-if-not-resolved="false"></xref>". A granularity without a site level is

    global: the template does not depend on the call site.</li><li><xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Owner" data-throw-if-not-resolved="false"></xref> can be combined with any site level, for instance

    <code>InterceptorGranularity.Member | InterceptorGranularity.Owner</code>.</li></ul>

    <p>

    The default granularity is <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Global" data-throw-if-not-resolved="false"></xref>. The engine does not detect what the template depends on: neither the tags, nor the aspect

    state, nor the fields of the aspect. When several call sites share a generated method, the template is expanded once, for the representative

    call site, which is the first in the order of the file paths and the positions, and with the aspect instance that registered the interceptor

    for that call site. This is the same rule as when several instances of an aspect target the same declaration, where the

    <code>BuildAspect</code> method must summarize them. A template that depends on the state of its aspect instance must therefore include

    <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Owner" data-throw-if-not-resolved="false"></xref> in the granularity. The tags of the result are compared by value, so the call sites whose results have different tags

    never share a method.

    </p>

    <p>

    The template reads the context through the <code>meta.Interception</code> property. A property that requires a finer granularity than the

    granularity of the interceptor throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> that names the granularity to set.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [Flags]

      public enum InterceptorGranularity
    content.vb: >-
      <CompileTime>

      <Flags>

      Public Enum InterceptorGranularity
  attributes:
  - type: Metalama.Framework.Aspects.CompileTimeAttribute
    ctor: Metalama.Framework.Aspects.CompileTimeAttribute.#ctor
    arguments: []
  - type: System.FlagsAttribute
    ctor: System.FlagsAttribute.#ctor
    arguments: []
