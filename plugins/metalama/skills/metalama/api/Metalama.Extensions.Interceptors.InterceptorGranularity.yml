- uid: Metalama.Extensions.Interceptors.InterceptorGranularity.Type
  commentId: F:Metalama.Extensions.Interceptors.InterceptorGranularity.Type
  id: Type
  parent: Metalama.Extensions.Interceptors.InterceptorGranularity
  langs:
  - csharp
  - vb
  name: Type
  nameWithType: InterceptorGranularity.Type
  fullName: Metalama.Extensions.Interceptors.InterceptorGranularity.Type
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The template can read the calling type through the <code>meta.Interception.CallingType</code> property. The method is shared by the call sites

    of the same type.
  example: []
  syntax:
    content: Type = 1
    return:
      type: Metalama.Extensions.Interceptors.InterceptorGranularity
