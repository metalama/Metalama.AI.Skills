  nameWithType: InterceptorGranularity.CallSite
  fullName: Metalama.Extensions.Interceptors.InterceptorGranularity.CallSite
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
