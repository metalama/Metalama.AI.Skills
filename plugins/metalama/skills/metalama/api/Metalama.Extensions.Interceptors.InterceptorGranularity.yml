      type: Metalama.Extensions.Interceptors.InterceptorGranularity
- uid: Metalama.Extensions.Interceptors.InterceptorGranularity.Owner
  commentId: F:Metalama.Extensions.Interceptors.InterceptorGranularity.Owner
  id: Owner
  parent: Metalama.Extensions.Interceptors.InterceptorGranularity
  langs:
  - csharp
  - vb
  name: Owner
  nameWithType: InterceptorGranularity.Owner
  fullName: Metalama.Extensions.Interceptors.InterceptorGranularity.Owner
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The template can depend on the aspect instance or the fabric that registered the interceptor, and on its aspect state. The method is

    shared only by the call sites of the same registration.
  example: []
  syntax:
    content: Owner = 8
    return:
      type: Metalama.Extensions.Interceptors.InterceptorGranularity
- uid: Metalama.Extensions.Interceptors.InterceptorGranularity.Global
  commentId: F:Metalama.Extensions.Interceptors.InterceptorGranularity.Global
  id: Global
  parent: Metalama.Extensions.Interceptors.InterceptorGranularity
  langs:
  - csharp
  - vb
  name: Global
  nameWithType: InterceptorGranularity.Global
  fullName: Metalama.Extensions.Interceptors.InterceptorGranularity.Global
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The template depends neither on the call site nor on the aspect instance that registered the interceptor. The method is shared by all

    the call sites that have the same template, arguments, tags, placement and signature. This is the default granularity.
  example: []
  syntax:
    content: Global = 0
    return:
      type: Metalama.Extensions.Interceptors.InterceptorGranularity
