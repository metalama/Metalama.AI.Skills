- uid: Metalama.Extensions.Interceptors.ICaller.Member
  commentId: P:Metalama.Extensions.Interceptors.ICaller.Member
  id: Member
  parent: Metalama.Extensions.Interceptors.ICaller
  langs:
  - csharp
  - vb
  name: Member
  nameWithType: ICaller.Member
  fullName: Metalama.Extensions.Interceptors.ICaller.Member
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the innermost member of the code model that contains the site: a method, a constructor, an operator or an accessor, the field,

    property or event of an initializer, the entry point for top-level statements, or the primary constructor for primary-constructor base

    arguments. Lambdas and local functions are attributed to their enclosing member.
  remarks: The type that contains the site is the <xref href="Metalama.Framework.Code.IMemberOrNamedType.DeclaringType" data-throw-if-not-resolved="false"></xref> of this member.
  example: []
  syntax:
    content: IMember Member { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMember
    content.vb: ReadOnly Property Member As IMember
  overload: Metalama.Extensions.Interceptors.ICaller.Member*
- uid: Metalama.Extensions.Interceptors.ICaller.Method
