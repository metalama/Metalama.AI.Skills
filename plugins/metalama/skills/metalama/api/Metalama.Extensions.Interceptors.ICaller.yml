  namespace: Metalama.Extensions.Interceptors
  summary: 'Describes the code that contains a site: the member, the kind of code and the function.'
  remarks: >-
    The object has the lifetime of the object that exposes it. An object exposed by an <xref href="Metalama.Extensions.Interceptors.IInterceptionContext" data-throw-if-not-resolved="false"></xref> must not be stored

    after the delegate that received the context returns. An object exposed by <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.Caller" data-throw-if-not-resolved="false"></xref> is valid

    during the expansion of the template.
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface ICaller
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface ICaller
