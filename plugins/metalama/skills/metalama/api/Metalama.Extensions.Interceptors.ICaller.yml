- uid: Metalama.Extensions.Interceptors.ICaller.CanAccessThis
  commentId: P:Metalama.Extensions.Interceptors.ICaller.CanAccessThis
  id: CanAccessThis
  parent: Metalama.Extensions.Interceptors.ICaller
  langs:
  - csharp
  - vb
  name: CanAccessThis
  nameWithType: ICaller.CanAccessThis
  fullName: Metalama.Extensions.Interceptors.ICaller.CanAccessThis
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets a value indicating whether code at the site can reference <code>this</code>. The value is <code>false</code> in static members, static

    lambdas, static local functions, field initializers, constructor initializers, and lambdas or local functions of struct members.
  remarks: >-
    When the value is <code>true</code>, a delegate that runs for the site, such as the delegate given to <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>,

    gets the instance of the caller with <xref href="Metalama.Framework.Code.SyntaxBuilders.ExpressionFactory.This" data-throw-if-not-resolved="false"></xref>, whose type is the declaring type

    of <xref href="Metalama.Extensions.Interceptors.ICaller.Member" data-throw-if-not-resolved="false"></xref>. When the value is <code>false</code>, <xref href="Metalama.Framework.Code.SyntaxBuilders.ExpressionFactory.This" data-throw-if-not-resolved="false"></xref> throws an

    <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: bool CanAccessThis { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property CanAccessThis As Boolean
  overload: Metalama.Extensions.Interceptors.ICaller.CanAccessThis*
