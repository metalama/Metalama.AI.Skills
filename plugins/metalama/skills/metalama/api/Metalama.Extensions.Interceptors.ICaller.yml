  namespace: Metalama.Extensions.Interceptors
  summary: 'Gets <xref href="Metalama.Extensions.Interceptors.ICaller.Member" data-throw-if-not-resolved="false"></xref> as a method: an ordinary method, an operator, an accessor, or the entry point for top-level statements.'
  remarks: >-
    The parameters of the method can be passed to an existing interceptor through <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>, because

    an <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref> is an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IMethod Method { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property Method As IMethod
  overload: Metalama.Extensions.Interceptors.ICaller.Method*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      <xref href="Metalama.Extensions.Interceptors.ICaller.Member" data-throw-if-not-resolved="false"></xref> is not a method, for instance a constructor, or the field, property
                  or event of an initializer.
- uid: Metalama.Extensions.Interceptors.ICaller.Parameters
  commentId: P:Metalama.Extensions.Interceptors.ICaller.Parameters
  id: Parameters
  parent: Metalama.Extensions.Interceptors.ICaller
  langs:
  - csharp
  - vb
  name: Parameters
  nameWithType: ICaller.Parameters
  fullName: Metalama.Extensions.Interceptors.ICaller.Parameters
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the parameters of <xref href="Metalama.Extensions.Interceptors.ICaller.Member" data-throw-if-not-resolved="false"></xref> when it is a method, a constructor or an indexer. The parameters of a lambda or a local

    function that contains the site are not included.
  remarks: >-
    <p>

    A parameter can be passed to an existing interceptor through <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>, because an

    <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref> is an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>. It is written at the site as its name.

    </p>

    <p>

    When a lambda or a local function that contains the site declares a parameter or a local variable with the same name, the linker renames

    this variable in the compiled code, so that the name designates the parameter of the member, and reports the warning LAMA0661.

    </p>

    <p>

    The generated code does not compile when a lambda or a local function that contains the site cannot capture the parameter. Before passing

    the parameter, check that <xref href="Metalama.Extensions.Interceptors.ICaller.IsInNestedFunction" data-throw-if-not-resolved="false"></xref> is <code>false</code>, or that <xref href="Metalama.Extensions.Interceptors.ICaller.IsInStaticFunction" data-throw-if-not-resolved="false"></xref> is <code>false</code>, that

    the <xref href="Metalama.Framework.Code.IHasType.RefKind" data-throw-if-not-resolved="false"></xref> of the parameter is <xref href="Metalama.Framework.Code.RefKind.None" data-throw-if-not-resolved="false"></xref>, and that its type is not a <code>ref struct</code>.

    </p>
  example: []
  syntax:
    content: IParameterList Parameters { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.Collections.IParameterList
    content.vb: ReadOnly Property Parameters As IParameterList
  overload: Metalama.Extensions.Interceptors.ICaller.Parameters*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      <xref href="Metalama.Extensions.Interceptors.ICaller.Member" data-throw-if-not-resolved="false"></xref> has no parameters, because it is a field, a property or an
                  event.
