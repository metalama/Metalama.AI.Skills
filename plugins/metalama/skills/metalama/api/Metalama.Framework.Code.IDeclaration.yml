- uid: Metalama.Framework.Code.IDeclaration.Depth
  commentId: P:Metalama.Framework.Code.IDeclaration.Depth
  id: Depth
  parent: Metalama.Framework.Code.IDeclaration
  langs:
  - csharp
  - vb
  name: Depth
  nameWithType: IDeclaration.Depth
  fullName: Metalama.Framework.Code.IDeclaration.Depth
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the depth of the current declaration in the code model. The value of the <xref href="Metalama.Framework.Code.IDeclaration.Depth" data-throw-if-not-resolved="false"></xref> property has no absolute meaning,

    only a relative one, i.e. it is only relevant when comparing the depth of two declarations. A declaration has always a greater depth

    than the declaration in which it is contained. A type has always a greater depths than the base it derives from or the interfaces

    it implements.
  example: []
  syntax:
    content: >-
      [Hidden]

      int Depth { get; }
    parameters: []
    return:
      type: System.Int32
    content.vb: >-
      <Hidden>

      ReadOnly Property Depth As Integer
  overload: Metalama.Framework.Code.IDeclaration.Depth*
  attributes:
  - type: Metalama.Framework.Utilities.HiddenAttribute
    ctor: Metalama.Framework.Utilities.HiddenAttribute.#ctor
    arguments: []
