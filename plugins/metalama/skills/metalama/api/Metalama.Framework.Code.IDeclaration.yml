- uid: Metalama.Framework.Code.IDeclaration.ToSerializableId
  commentId: M:Metalama.Framework.Code.IDeclaration.ToSerializableId
  id: ToSerializableId
  parent: Metalama.Framework.Code.IDeclaration
  langs:
  - csharp
  - vb
  name: ToSerializableId()
  nameWithType: IDeclaration.ToSerializableId()
  fullName: Metalama.Framework.Code.IDeclaration.ToSerializableId()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a string-based identifier that uniquely identifies the current declaration within a compilation.
  remarks: >-
    <p>
        Unlike <xref href="Metalama.Framework.Code.IDeclaration.ToRef" data-throw-if-not-resolved="false"></xref>, which returns a strongly-typed reference object, this method returns a lightweight string-based
        identifier that can be persisted to disk or transmitted across processes. The identifier is guaranteed to
        be resolvable in a different process, even with a different version of Metalama.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Code.SerializableDeclarationId.Resolve(Metalama.Framework.Code.ICompilation)" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Code.IDeclarationFactory.GetDeclarationFromId(Metalama.Framework.Code.SerializableDeclarationId)" data-throw-if-not-resolved="false"></xref>
        to resolve the identifier back to a declaration.
        </p>
  example: []
  syntax:
    content: SerializableDeclarationId ToSerializableId()
    return:
      type: Metalama.Framework.Code.SerializableDeclarationId
      description: A serializable declaration identifier.
    content.vb: Function ToSerializableId() As SerializableDeclarationId
  overload: Metalama.Framework.Code.IDeclaration.ToSerializableId*
  seealso:
  - linkId: Metalama.Framework.Code.IDeclaration.ToRef
    commentId: M:Metalama.Framework.Code.IDeclaration.ToRef
  - linkId: Metalama.Framework.Code.SerializableDeclarationId
    commentId: T:Metalama.Framework.Code.SerializableDeclarationId
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
