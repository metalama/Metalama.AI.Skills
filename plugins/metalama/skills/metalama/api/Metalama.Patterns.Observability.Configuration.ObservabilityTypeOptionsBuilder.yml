- uid: Metalama.Patterns.Observability.Configuration.ObservabilityTypeOptionsBuilder.EnableOnObservablePropertyChangedMethod
  commentId: P:Metalama.Patterns.Observability.Configuration.ObservabilityTypeOptionsBuilder.EnableOnObservablePropertyChangedMethod
  id: EnableOnObservablePropertyChangedMethod
  parent: Metalama.Patterns.Observability.Configuration.ObservabilityTypeOptionsBuilder
  langs:
  - csharp
  - vb
  name: EnableOnObservablePropertyChangedMethod
  nameWithType: ObservabilityTypeOptionsBuilder.EnableOnObservablePropertyChangedMethod
  fullName: Metalama.Patterns.Observability.Configuration.ObservabilityTypeOptionsBuilder.EnableOnObservablePropertyChangedMethod
  type: Property
  assemblies:
  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability.Configuration
  summary: Gets or sets a value indicating whether the <code>OnObservablePropertyChanged</code> method should be introduced. The default value is <code>true</code>.
  remarks: >-
    The <code>OnObservablePropertyChanged</code> method allows a derived class to efficiently add subscribe/unsubscribe functionality

    to a base class property, where the base class itself does not need to observe changes to children of the property.

    This only applies to properties where the property type implements <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref>. The introduced

    method allows the current target class to use the feature if provided by a base class, and allows the current target class

    to provide the feature to derived classes for applicable properties.
  example: []
  syntax:
    content: public bool? EnableOnObservablePropertyChangedMethod { get; set; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: Public Property EnableOnObservablePropertyChangedMethod As Boolean?
  overload: Metalama.Patterns.Observability.Configuration.ObservabilityTypeOptionsBuilder.EnableOnObservablePropertyChangedMethod*
