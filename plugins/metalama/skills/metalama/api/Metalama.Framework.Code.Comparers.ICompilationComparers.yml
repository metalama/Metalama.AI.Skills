  name: Default
  nameWithType: ICompilationComparers.Default
  fullName: Metalama.Framework.Code.Comparers.ICompilationComparers.Default
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Comparers
  summary: >-
    Gets an <xref href="System.Collections.Generic.IEqualityComparer%601" data-throw-if-not-resolved="false"></xref> allowing to compare types and declarations considers equal two instances that represent

    the same type or declaration even if they belong to different compilation versions. This comparer ignores

    the nullability annotations of reference types.
  example: []
  syntax:
    content: IDeclarationComparer Default { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.Comparers.IDeclarationComparer
    content.vb: ReadOnly Property [Default] As IDeclarationComparer
  overload: Metalama.Framework.Code.Comparers.ICompilationComparers.Default*
