- uid: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicDeclarationOrder
  commentId: P:Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicDeclarationOrder
  id: DeterministicDeclarationOrder
  parent: Metalama.Framework.Code.Comparers.ICompilationComparers
  langs:
  - csharp
  - vb
  name: DeterministicDeclarationOrder
  nameWithType: ICompilationComparers.DeterministicDeclarationOrder
  fullName: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicDeclarationOrder
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Comparers
  summary: >-
    Gets a deterministic ordering comparer for <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref>. The specific order produced by the

    comparer is an implementation detail — it is guaranteed to be stable across builds of the same compilation

    but the exact ordering is not part of the public contract. Sort key: depth, then containing declaration

    (recursively), then name, then signature (for overloadable members).
  example: []
  syntax:
    content: IComparer<IDeclaration> DeterministicDeclarationOrder { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IComparer{Metalama.Framework.Code.IDeclaration}
    content.vb: ReadOnly Property DeterministicDeclarationOrder As IComparer(Of IDeclaration)
  overload: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicDeclarationOrder*
- uid: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicTypeOrder
  commentId: P:Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicTypeOrder
  id: DeterministicTypeOrder
  parent: Metalama.Framework.Code.Comparers.ICompilationComparers
  langs:
  - csharp
  - vb
  name: DeterministicTypeOrder
  nameWithType: ICompilationComparers.DeterministicTypeOrder
  fullName: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicTypeOrder
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Comparers
  summary: >-
    Gets a deterministic ordering comparer for <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>. Sort key: kind, then — for named types —

    containing namespace, declaring type, name, and type arguments; arrays by rank and element type; pointers

    by pointed-at type; type parameters by kind and index. The specific order is an implementation detail

    but is stable.
  example: []
  syntax:
    content: IComparer<IType> DeterministicTypeOrder { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IComparer{Metalama.Framework.Code.IType}
    content.vb: ReadOnly Property DeterministicTypeOrder As IComparer(Of IType)
  overload: Metalama.Framework.Code.Comparers.ICompilationComparers.DeterministicTypeOrder*
