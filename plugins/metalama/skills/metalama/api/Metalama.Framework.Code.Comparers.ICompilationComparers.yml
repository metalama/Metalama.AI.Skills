- uid: Metalama.Framework.Code.Comparers.ICompilationComparers.Default
  commentId: P:Metalama.Framework.Code.Comparers.ICompilationComparers.Default
  id: Default
  parent: Metalama.Framework.Code.Comparers.ICompilationComparers
  langs:
