  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: A base aspect that overrides the implementation of a field or property using T# template properties.
  remarks: >-
    <p>
        This class simplifies creating aspects that override field or property behavior. Derived classes must implement the
        <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty" data-throw-if-not-resolved="false"></xref> template property, which is a T# template that executes at compile-time to generate
        the new accessor implementations. Use <code>meta.Target.FieldOrProperty.Value</code> within the template to access or modify
        the underlying field or property value, and <code>meta.Target.FieldOrProperty</code> to access metadata.
        </p>
    <p>
        When applied to a field or auto-property, a backing field is automatically created to store the value,
        similar to how auto-properties are transformed.
        </p>
    <p>
        The aspect automatically selects the appropriate template based on the property's return type:
        <ul><li><xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideEnumerableProperty" data-throw-if-not-resolved="false"></xref> for properties returning <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref></li><li><xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideEnumeratorProperty" data-throw-if-not-resolved="false"></xref> for properties returning <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref></li><li><xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty" data-throw-if-not-resolved="false"></xref> for all other properties and fields</li></ul>
        If specialized templates are not overridden, <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty" data-throw-if-not-resolved="false"></xref> is used as the fallback.
        </p>
    <p>
        For overriding multiple fields or properties from a single aspect, or for separate control over getter and setter templates,
        use <xref href="Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cMetalama.Framework.Advising.GetterTemplateSelector%40%2cSystem.String%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.Override(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cSystem.String%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> from your <code>BuildAspect</code> method instead of deriving from this class.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property|AttributeTargets.Field)]

      public abstract class OverrideFieldOrPropertyAspect : FieldOrPropertyAspect, IAspect<IFieldOrProperty>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IFieldOrProperty>
    content.vb: >-
      <AttributeUsage(AttributeTargets.PropertyOrAttributeTargets.Field)>

      Public MustInherit Class OverrideFieldOrPropertyAspect Inherits FieldOrPropertyAspect Implements IAspect(Of IFieldOrProperty), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IFieldOrProperty)
