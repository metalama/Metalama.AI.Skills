- uid: Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty
  commentId: P:Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty
  id: OverrideProperty
  parent: Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect
  langs:
  - csharp
  - vb
  name: OverrideProperty
  nameWithType: OverrideFieldOrPropertyAspect.OverrideProperty
  fullName: Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideProperty
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: The default template property for overriding field or property accessors.
  remarks: >-
    <p>
        This is the primary template property that must be implemented in derived aspects. It is used for all fields and properties
        where a more specific template (<xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideEnumerableProperty" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect.OverrideEnumeratorProperty" data-throw-if-not-resolved="false"></xref>)
        does not apply or has not been overridden.
        </p>
    <p>
        Within the template, use <code>meta.Target.FieldOrProperty.Value</code> to access the underlying field or property value,
        and <code>meta.Target.FieldOrProperty</code> to access metadata about the target.
        </p>
    <p>
        Due to C# language rules, the template property must implement both getter and setter if both are needed.
        For fine-grained control over individual accessors, derive from <xref href="Metalama.Framework.Aspects.FieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref> and use
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.Override(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cSystem.String%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cMetalama.Framework.Advising.GetterTemplateSelector%40%2cSystem.String%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> to override specific accessors.
        </p>
  example: []
  syntax:
    content: >-
      [Template]

      public abstract dynamic? OverrideProperty { get; set; }
    parameters: []
    return:
      type: dynamic
    content.vb: >-
      <Template>

      Public MustOverride Property OverrideProperty As Object
