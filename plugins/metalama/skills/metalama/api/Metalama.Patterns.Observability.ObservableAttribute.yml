  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability
  summary: >-
    Aspect that implements the <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> interface for the target type,

    automatically raising the <xref href="System.ComponentModel.INotifyPropertyChanged.PropertyChanged" data-throw-if-not-resolved="false"></xref> event when

    property values change.
  remarks: >-
    <p>

    This aspect analyzes the dependencies between all properties in the type and ensures that the <code>PropertyChanged</code>

    event is raised for all affected properties when a value changes. This includes:

    </p>

    <ul><li>Automatic properties</li><li>Field-backed properties</li><li>Computed properties that depend on other properties</li><li>Properties that depend on child objects implementing <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref></li></ul>

    <p>

    If the target type already implements <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref>, the aspect will

    use the existing <code>OnPropertyChanged</code> method (or equivalent) to raise notifications rather than introducing a new implementation.

    </p>

    <p>

    When the aspect encounters an unsupported code construct, it reports a warning (code <code>LAMA51**</code>).

    Use <xref href="Metalama.Patterns.Observability.NotObservableAttribute" data-throw-if-not-resolved="false"></xref> to exclude specific properties from change notifications,

    <xref href="Metalama.Patterns.Observability.SuppressObservabilityWarningsAttribute" data-throw-if-not-resolved="false"></xref> to suppress warnings, or

    <xref href="Metalama.Patterns.Observability.ConstantAttribute" data-throw-if-not-resolved="false"></xref> to mark methods whose output depends only on their input parameters.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Interface)]

      [Inheritable]

      public sealed class ObservableAttribute : Attribute, IAspect<INamedType>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<INamedType>
