  summary: Represents the label of a <code>switch case</code> (i.e., the literal or tuple literal to which the expression is compared).
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Code.SyntaxBuilders.SwitchStatementLabel" data-throw-if-not-resolved="false"></xref> represents the case label in a switch statement's case section. It supports single literals
        (e.g., <code>case 1:</code>) and tuple literals (e.g., <code>case (1, "a"):</code>).
        </p>
    <p>
        Use the static <xref href="Metalama.Framework.Code.SyntaxBuilders.SwitchStatementLabel.CreateLiteral(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> method to create labels from intrinsic values like <xref href="System.Int32" data-throw-if-not-resolved="false"></xref>,
        <xref href="System.String" data-throw-if-not-resolved="false"></xref>, or enum values. For more control over types, use <xref href="Metalama.Framework.Code.SyntaxBuilders.SwitchStatementLabel.CreateLiteral(Metalama.Framework.Code.TypedConstant%5b%5d)" data-throw-if-not-resolved="false"></xref>
        with explicitly typed constants.
        </p>
    <p>
      <b>Limitation:</b> Only constant literals and tuple literals are supported. Advanced C# pattern matching syntax
        (such as type patterns, property patterns, relational patterns, or logical patterns) is not supported.
        For complex pattern matching, consider using <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementBuilder" data-throw-if-not-resolved="false"></xref> to construct the switch statement as text.
        </p>
  example: []
