  name: ToDurable()
  nameWithType: IRef<T>.ToDurable()
  fullName: Metalama.Framework.Code.IRef<T>.ToDurable()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Returns a reference to the same declaration that stores only a string identifier, and therefore does not keep

    the compilation in memory. Returns the current instance when it is already durable.
  remarks: This is the strongly-typed variant of <xref href="Metalama.Framework.Code.IRef.ToDurable" data-throw-if-not-resolved="false"></xref>, which documents when to call it.
  example: []
  syntax:
    content: IDurableRef<out T> ToDurable()
    return:
      type: Metalama.Framework.Code.IDurableRef{{T}}
    content.vb: Function ToDurable() As IDurableRef(Of Out T)
  overload: Metalama.Framework.Code.IRef`1.ToDurable*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: The reference cannot be made durable.
  seealso:
