  summary: >-
    Gets the <xref href="Metalama.Framework.Eligibility.EligibleScenarios" data-throw-if-not-resolved="false"></xref> value that rules must return in case they evaluate negatively, i.e. what

    is the eligibility of the aspect on the target when the rule is <i>not</i> satisfied.  The default

    value of this property is <xref href="Metalama.Framework.Eligibility.EligibleScenarios.None" data-throw-if-not-resolved="false"></xref>, but it can be changed to anything

    using <xref href="Metalama.Framework.Eligibility.EligibilityExtensions.ExceptForScenarios%60%601(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%60%600%7d%2cMetalama.Framework.Eligibility.EligibleScenarios)" data-throw-if-not-resolved="false"></xref>.
