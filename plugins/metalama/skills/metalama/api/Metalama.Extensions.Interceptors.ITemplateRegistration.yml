- uid: Metalama.Extensions.Interceptors.ITemplateRegistration.WithArgs(System.Object)
  commentId: M:Metalama.Extensions.Interceptors.ITemplateRegistration.WithArgs(System.Object)
  id: WithArgs(System.Object)
  parent: Metalama.Extensions.Interceptors.ITemplateRegistration
  langs:
  - csharp
  - vb
  name: WithArgs(object)
  nameWithType: ITemplateRegistration.WithArgs(object)
  fullName: Metalama.Extensions.Interceptors.ITemplateRegistration.WithArgs(object)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Sets the arguments of the template.
  remarks: >-
    <p>

    A declaration or a type is passed as an <xref href="Metalama.Framework.Code.IDurableRef%601" data-throw-if-not-resolved="false"></xref>, created by <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref>, and an

    expression is passed as an <xref href="Metalama.Framework.Code.IDurableExpression" data-throw-if-not-resolved="false"></xref>, created by <xref href="Metalama.Framework.Code.ExpressionExtensions.ToDurable(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>. They are resolved in

    the compilation of each call site, so the template receives the declaration, the type or the <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> of that

    compilation.

    </p>

    <p>

    The arguments are compared by value, after this resolution, to decide which call sites share the synthesized method.

    </p>
  example: []
  syntax:
    content: ITemplateRegistration WithArgs(object args)
    parameters:
    - id: args
      type: System.Object
      description: >-
        An anonymous object, an <xref href="System.Collections.Generic.IReadOnlyDictionary%602" data-throw-if-not-resolved="false"></xref> of names and values, or an
                    <xref href="Metalama.Framework.Aspects.IObjectReader" data-throw-if-not-resolved="false"></xref>. Its values must be durable. A property whose name is a compile-time parameter or type parameter of the
                    template gives the value of that parameter. A property whose name is a run-time parameter of the template adds a parameter of that name
                    and type to the synthesized method, and gives the value that each call site passes to it. A property whose name is a parameter that a
                    <xref href="Metalama.Extensions.Interceptors.ITemplateRegistration.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> delegate adds gives the value of that parameter. Such a value takes any form that
                    <xref href="Metalama.Extensions.Interceptors.IExistingMethodRegistration.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref> accepts.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.ITemplateRegistration
    content.vb: Function WithArgs(args As Object) As ITemplateRegistration
  overload: Metalama.Extensions.Interceptors.ITemplateRegistration.WithArgs*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">args</code> is <code>null</code>.
  nameWithType.vb: ITemplateRegistration.WithArgs(Object)
  fullName.vb: Metalama.Extensions.Interceptors.ITemplateRegistration.WithArgs(Object)
  name.vb: WithArgs(Object)
