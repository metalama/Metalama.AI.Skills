  name: ITemplateRegistration
  nameWithType: ITemplateRegistration
  fullName: Metalama.Extensions.Interceptors.ITemplateRegistration
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A registration whose calls are redirected to a method synthesized from a template. Its methods set the options of the synthesized method. It

    is a complete interception, which the delegate given to <code>InterceptMethods</code> can return. It is the counterpart of

    <xref href="Metalama.Extensions.Interceptors.ITemplateInterception" data-throw-if-not-resolved="false"></xref> for a result that applies to every call site.
  remarks: >-
    <p>

    The registration is kept across compilations, so its arguments, its tags, its template provider and its <xref href="Metalama.Extensions.Interceptors.ITemplateRegistration.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> delegates

    must be durable. The arguments are resolved in the compilation of each call site.

    </p>

    <p>

    The call sites whose synthesized methods have the same final signature, template, arguments, tags, placement and granularity share one

    synthesized method.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface ITemplateRegistration : IMethodInterception
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface ITemplateRegistration Inherits IMethodInterception
