  namespace: Flashtrace
  summary: >-
    Evaluates whether a transaction needs to be open for a specified <xref href="Flashtrace.Options.OpenActivityOptions" data-throw-if-not-resolved="false"></xref> and updates

    its <xref href="Flashtrace.Options.OpenActivityOptions.TransactionRequirement" data-throw-if-not-resolved="false"></xref> property.

    This method must be invoked before calling <xref href="Flashtrace.FlashtraceLevelSource.OpenActivity%60%601(%60%600%40%2cFlashtrace.Options.OpenActivityOptions%40)" data-throw-if-not-resolved="false"></xref>.

    It is not automatically called.
  example: []
  syntax:
    content: public void ApplyTransactionRequirements(ref OpenActivityOptions openActivityOptions)
    parameters:
    - id: openActivityOptions
      type: Flashtrace.Options.OpenActivityOptions
      description: >-
        The options of the activity to be opened. This method updates the 
                    <xref href="Flashtrace.Options.OpenActivityOptions.TransactionRequirement" data-throw-if-not-resolved="false"></xref> property of this parameter.
    content.vb: Public Sub ApplyTransactionRequirements(openActivityOptions As OpenActivityOptions)
