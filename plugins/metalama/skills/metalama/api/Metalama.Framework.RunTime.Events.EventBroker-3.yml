  summary: >-
    Manages event handlers for event override advice when raise templates are specified.

    Provides thread-safe operations for adding/removing handlers and event invocation.
  example: []
  syntax:
    content: 'public sealed class EventBroker<TDelegate, TArgs, TState> where TDelegate : Delegate'
    typeParameters:
    - id: TDelegate
      description: The event delegate type.
    - id: TArgs
      description: The event arguments type  (i.e. the arguments of <code class="typeparamref">TDelegate</code> packed as a tuple).
    - id: TState
      description: >-
        An opaque state stored by the <xref href="Metalama.Framework.RunTime.Events.EventBroker%603" data-throw-if-not-resolved="false"></xref> and passed along to the <xref href="Metalama.Framework.RunTime.Events.IEventAdapter%603" data-throw-if-not-resolved="false"></xref>.
                    For instance events, typically set to the declaring type of the event. For static events, it is typically set to <xref href="Metalama.Framework.None" data-throw-if-not-resolved="false"></xref>.
