  namespace: Metalama.Framework.Aspects
  summary: 'A base class for aspects that target the compilation level, applied using assembly-level custom attributes (e.g., <code>[assembly: MyAspect]</code>).'
  remarks: >-
    <p>
        This class provides a convenient base for creating compilation-level aspects by implementing <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>
        with <code>T</code> set to <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>. Derived classes override <xref href="Metalama.Framework.Aspects.CompilationAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.ICompilation%7d)" data-throw-if-not-resolved="false"></xref>
        to perform project-wide transformations, such as applying aspects to types meeting certain criteria, introducing
        project-level configuration, or validating project-wide conventions.
        </p>
    <p>
      <strong>Note:</strong> In most scenarios, providing an <xref href="Metalama.Framework.Fabrics.IAmender%601" data-throw-if-not-resolved="false"></xref> extension method that can be called
        from a fabric is preferred over using compilation aspects. Extension methods provide a programmatic API for project-wide
        transformations and offer better discoverability and composability, whereas compilation aspects require explicit
        declaration using <code>[assembly: MyAspect]</code> syntax.
        </p>
    <p>
        For more localized transformations, consider using <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref> for type-level aspects or
        member-specific aspect base classes.
        </p>
    <p>
        This is a convenience base class. The aspect framework primarily requires implementation of <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly)]

      public abstract class CompilationAspect : Aspect, IAspect<ICompilation>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<ICompilation>
    content.vb: >-
      <AttributeUsage(AttributeTargets.Assembly)>

      Public MustInherit Class CompilationAspect Inherits Aspect Implements IAspect(Of ICompilation), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of ICompilation)
