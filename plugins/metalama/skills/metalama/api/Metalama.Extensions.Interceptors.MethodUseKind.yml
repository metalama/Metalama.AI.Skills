- uid: Metalama.Extensions.Interceptors.MethodUseKind.EventSubscription
  commentId: F:Metalama.Extensions.Interceptors.MethodUseKind.EventSubscription
  id: EventSubscription
  parent: Metalama.Extensions.Interceptors.MethodUseKind
  langs:
  - csharp
  - vb
  name: EventSubscription
  nameWithType: MethodUseKind.EventSubscription
  fullName: Metalama.Extensions.Interceptors.MethodUseKind.EventSubscription
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: A method group added to an event, for example <code>button.Click += OnClick;</code>.
  remarks: >-
    Intercepting the method group changes the identity of the handler. A handler added in the scope of the registration is therefore not

    removed by an <xref href="Metalama.Extensions.Interceptors.MethodUseKind.EventUnsubscription" data-throw-if-not-resolved="false"></xref> outside the scope, and the reverse. A provider that does not intercept every

    subscription and unsubscription of the handler returns <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip" data-throw-if-not-resolved="false"></xref> for this kind.
  example: []
  syntax:
    content: EventSubscription = 4
    return:
      type: Metalama.Extensions.Interceptors.MethodUseKind
- uid: Metalama.Extensions.Interceptors.MethodUseKind.EventUnsubscription
  commentId: F:Metalama.Extensions.Interceptors.MethodUseKind.EventUnsubscription
  id: EventUnsubscription
  parent: Metalama.Extensions.Interceptors.MethodUseKind
  langs:
  - csharp
  - vb
  name: EventUnsubscription
  nameWithType: MethodUseKind.EventUnsubscription
  fullName: Metalama.Extensions.Interceptors.MethodUseKind.EventUnsubscription
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: A method group removed from an event, for example <code>button.Click -= OnClick;</code>.
  remarks: >-
    Intercepting the method group changes the identity of the handler, so the unsubscription removes the handler only when the matching

    <xref href="Metalama.Extensions.Interceptors.MethodUseKind.EventSubscription" data-throw-if-not-resolved="false"></xref> is intercepted in the same way. A provider that does not intercept every subscription and unsubscription

    of the handler returns <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip" data-throw-if-not-resolved="false"></xref> for this kind.
  example: []
  syntax:
    content: EventUnsubscription = 5
    return:
      type: Metalama.Extensions.Interceptors.MethodUseKind
