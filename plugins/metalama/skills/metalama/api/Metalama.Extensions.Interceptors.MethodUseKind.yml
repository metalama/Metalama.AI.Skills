- uid: Metalama.Extensions.Interceptors.MethodUseKind.DelegateCreation
  commentId: F:Metalama.Extensions.Interceptors.MethodUseKind.DelegateCreation
  id: DelegateCreation
  parent: Metalama.Extensions.Interceptors.MethodUseKind
  langs:
  - csharp
  - vb
  name: DelegateCreation
  nameWithType: MethodUseKind.DelegateCreation
  fullName: Metalama.Extensions.Interceptors.MethodUseKind.DelegateCreation
  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A method group converted to a delegate, for example <code>list.Select( Transform )</code>, <code>new Action( M )</code> or <code>var d = M;</code>. A

    method group added to an event is an <xref href="Metalama.Extensions.Interceptors.MethodUseKind.EventSubscription" data-throw-if-not-resolved="false"></xref>, and a method group removed from an event is an

    <xref href="Metalama.Extensions.Interceptors.MethodUseKind.EventUnsubscription" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: DelegateCreation = 2
    return:
      type: Metalama.Extensions.Interceptors.MethodUseKind
