  fullName: Metalama.Framework.Engine.Formatting.CodeFormattingOptions.None
  type: Field
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Formatting
  summary: >-
    The resulting tree is not safe to textualize. Only a syntax tree is produced:

    tokens may be left adjacent with no separator trivia, so

    <xref href="Microsoft.CodeAnalysis.SyntaxNode.ToFullString" data-throw-if-not-resolved="false"></xref> generally will not round-trip through the

    parser. Use this only for AST-level analysis (for example, test validation of

    well-formedness).
  example: []
  syntax:
    content: None = 1
    return:
      type: Metalama.Framework.Engine.Formatting.CodeFormattingOptions
