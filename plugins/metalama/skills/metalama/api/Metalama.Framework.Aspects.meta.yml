  commentId: M:Metalama.Framework.Aspects.meta.DefineLocalVariable(System.String,Metalama.Framework.Code.IType)
  id: DefineLocalVariable(System.String,Metalama.Framework.Code.IType)
  parent: Metalama.Framework.Aspects.meta
