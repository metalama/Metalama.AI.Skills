  remarks: >-
    <p>
        The <xref href="Metalama.Framework.Aspects.meta.Target" data-throw-if-not-resolved="false"></xref> property provides access to metadata and invokers for the target declaration:
        <ul><li><xref href="Metalama.Framework.Aspects.IMetaTarget.Method" data-throw-if-not-resolved="false"></xref> - Access method metadata (name, parameters, return type, attributes)</li><li><xref href="Metalama.Framework.Aspects.IMetaTarget.FieldOrProperty" data-throw-if-not-resolved="false"></xref> - Access field/property metadata and use <code>.Value</code> to get/set the underlying value</li><li><xref href="Metalama.Framework.Aspects.IMetaTarget.Event" data-throw-if-not-resolved="false"></xref> - Access event metadata and use <code>.Add</code>/<code>.Remove</code> to manage handlers</li><li><xref href="Metalama.Framework.Aspects.IMetaTarget.Parameters" data-throw-if-not-resolved="false"></xref> - Access parameter metadata (<code>meta.Target.Parameters[0]</code>) and values (<code>meta.Target.Parameters[0].Value</code>)</li></ul></p>
