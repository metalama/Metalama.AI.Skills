- uid: Metalama.Framework.Aspects.meta.CompileTime``1(``0)
  commentId: M:Metalama.Framework.Aspects.meta.CompileTime``1(``0)
  id: CompileTime``1(``0)
  parent: Metalama.Framework.Aspects.meta
  langs:
  - csharp
  - vb
  name: CompileTime<T>(T?)
  nameWithType: meta.CompileTime<T>(T?)
  fullName: Metalama.Framework.Aspects.meta.CompileTime<T>(T?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Coerces an <code class="paramref">expression</code> to be interpreted as compile time. This is typically used

    to coerce expressions that can be either run-time or compile-time, such as a literal. Since ambiguous expressions are

    interpreted as run-time by default, this method allows to change that behavior.
  example: []
  syntax:
    content: >-
      [CompileTime(true, null)]

      public static T? CompileTime<T>(T? expression)
    parameters:
    - id: expression
      type: '{T}'
      description: An expression.
    typeParameters:
    - id: T
      description: ''
    return:
      type: '{T}'
      description: Exactly <code class="paramref">expression</code>, but coerced as a compile-time expression.
      attributes:
      - type: System.Diagnostics.CodeAnalysis.NotNullIfNotNullAttribute
        ctor: System.Diagnostics.CodeAnalysis.NotNullIfNotNullAttribute.#ctor(System.String)
        arguments:
        - type: System.String
          value: expression
      - type: Metalama.Framework.Aspects.CompileTimeAttribute
        ctor: Metalama.Framework.Aspects.CompileTimeAttribute.#ctor
        arguments: []
    content.vb: >-
      <CompileTime(True, Nothing)>

      Public Shared Function CompileTime(Of T)(expression As T) As T
  overload: Metalama.Framework.Aspects.meta.CompileTime*
  seealso:
