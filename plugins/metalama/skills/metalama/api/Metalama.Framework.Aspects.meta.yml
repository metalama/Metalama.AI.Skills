        of all aspects.  It corresponds to <xref href="Metalama.Framework.Code.Invokers.InvokerOptions" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.Invokers.InvokerOptions.Final" data-throw-if-not-resolved="false"></xref>. To access the prior layer (or the base type, if there is no prior layer), use <xref href="Metalama.Framework.Aspects.meta.BaseType" data-throw-if-not-resolved="false"></xref>.
        To access instance members, use <xref href="Metalama.Framework.Aspects.meta.This" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Because <xref href="Metalama.Framework.Aspects.meta.ThisType" data-throw-if-not-resolved="false"></xref> returns a <code>dynamic</code> value, static members accessed through it are validated at
        template expansion time, not at template compilation time.
        </p>
