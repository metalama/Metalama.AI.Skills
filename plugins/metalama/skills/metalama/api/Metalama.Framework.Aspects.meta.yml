  summary: >-
    Gets a <code>dynamic</code> object that gives access to the members of the base class for the current instance, equivalent to <code>base</code> in C#.

    The syntax to access these members is e.g. <code>meta.Base.MyMethod()</code>.
  remarks: >-
    <p>
        The <xref href="Metalama.Framework.Aspects.meta.Base" data-throw-if-not-resolved="false"></xref> property exposes the state of the target type as it is <i>before</i> the application
        of the current aspect layer. It corresponds to <xref href="Metalama.Framework.Code.Invokers.InvokerOptions" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.Invokers.InvokerOptions.Default" data-throw-if-not-resolved="false"></xref>. To access the final layer, use <xref href="Metalama.Framework.Aspects.meta.This" data-throw-if-not-resolved="false"></xref>.
        To access static members, use <xref href="Metalama.Framework.Aspects.meta.BaseType" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Because <xref href="Metalama.Framework.Aspects.meta.Base" data-throw-if-not-resolved="false"></xref> returns a <code>dynamic</code> value, any member accessed through it is validated when the template
        is expanded, not when the template is compiled.
        </p>
