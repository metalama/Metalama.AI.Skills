  summary: Programmatically defines a local variable in run-time code with a specified type and initial value expression.
  remarks: >-
    <p>
        Use this method when you need to programmatically define local variables with compile-time determined initial values.
        This is useful when generating code that saves and restores values, such as rolling back field changes upon exception.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime(true, null)]

      public static IExpression DefineLocalVariable(string nameHint, IType type, IExpression? value)
    parameters:
    - id: nameHint
      type: System.String
      description: A hint for the variable name. Metalama automatically appends a numerical suffix to ensure uniqueness within the target lexical scope.
    - id: type
      type: Metalama.Framework.Code.IType
      description: The type of the variable.
    - id: value
      type: Metalama.Framework.Code.IExpression
      description: An expression representing the initial value, or <code>null</code> for no initialization.
    return:
      type: Metalama.Framework.Code.IExpression
      description: An <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> that can be used to reference the local variable in run-time code.
    content.vb: >-
      <CompileTime(True, Nothing)>

