    ctor: Metalama.Framework.Aspects.CompileTimeAttribute.#ctor(System.Boolean,System.String)
    arguments:
    - type: System.Boolean
      value: true
    - type: System.String
  nameWithType.vb: meta.CompileTime(Of T)(T)
  fullName.vb: Metalama.Framework.Aspects.meta.CompileTime(Of T)(T)
  name.vb: CompileTime(Of T)(T)
