- uid: Metalama.Framework.Project.IProject.Extension``1
  commentId: M:Metalama.Framework.Project.IProject.Extension``1
  id: Extension``1
  parent: Metalama.Framework.Project.IProject
  langs:
  - csharp
  - vb
  name: Extension<T>()
  nameWithType: IProject.Extension<T>()
  fullName: Metalama.Framework.Project.IProject.Extension<T>()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Project
  summary: >-
    Gets a project extension object or creates a new instance if none has been created before. The type must derive from <xref href="Metalama.Framework.Project.ProjectExtension" data-throw-if-not-resolved="false"></xref>

    and have a default constructor. New instances will be initialized using <xref href="Metalama.Framework.Project.ProjectExtension.Initialize(Metalama.Framework.Project.IProject%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [Obsolete("Use IDeclaration.Enhancements().GetOptions<T> to get or amender.Configure<T>(...) to set an option.")]

      T Extension<T>() where T : ProjectExtension, new()
    typeParameters:
    - id: T
      description: The extension type, which must derive from <xref href="Metalama.Framework.Project.ProjectExtension" data-throw-if-not-resolved="false"></xref> and have a default constructor.
    return:
      type: '{T}'
    content.vb: >-
      <Obsolete("Use IDeclaration.Enhancements().GetOptions<T> to get or amender.Configure<T>(...) to set an option.")>

      Function Extension(Of T As {ProjectExtension, New})() As T
  overload: Metalama.Framework.Project.IProject.Extension*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String)
    arguments:
    - type: System.String
      value: Use IDeclaration.Enhancements().GetOptions<T> to get or amender.Configure<T>(...) to set an option.
  nameWithType.vb: IProject.Extension(Of T)()
  fullName.vb: Metalama.Framework.Project.IProject.Extension(Of T)()
  name.vb: Extension(Of T)()
