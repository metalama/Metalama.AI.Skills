  namespace: Metalama.Framework.Project
  summary: >-
    Exposes the properties of the current C# project, such as <xref href="Metalama.Framework.Project.IProject.Path" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Project.IProject.AssemblyReferences" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Project.IProject.PreprocessorSymbols" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Framework.Project.IProject.Configuration" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Project.IProject.TargetFramework" data-throw-if-not-resolved="false"></xref>. To access a custom MSBuild property, use <xref href="Metalama.Framework.Project.IProject.TryGetProperty(System.String%2cSystem.String%40)" data-throw-if-not-resolved="false"></xref>. You can extend

    this interface with your own framework-specific by using the <xref href="Metalama.Framework.Project.IProject.Extension%60%601" data-throw-if-not-resolved="false"></xref> method.
  example: []
  syntax:
    content: >-
      [InternalImplement]

      [CompileTime]

      public interface IProject
    content.vb: >-
      <InternalImplement>

      <CompileTime>

      Public Interface IProject
