  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the type is a reference type. If the type is a type parameter

    without a <code>struct</code>, <code>class</code> or similar constraint, this property evaluates to <code>null</code>.
  example: []
  syntax:
    content: bool? IsReferenceType { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: ReadOnly Property IsReferenceType As Boolean?
