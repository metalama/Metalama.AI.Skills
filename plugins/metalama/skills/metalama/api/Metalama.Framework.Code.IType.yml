- uid: Metalama.Framework.Code.IType.ToRef
  commentId: M:Metalama.Framework.Code.IType.ToRef
  id: ToRef
  parent: Metalama.Framework.Code.IType
  langs:
  - csharp
  - vb
  name: ToRef()
  nameWithType: IType.ToRef()
  fullName: Metalama.Framework.Code.IType.ToRef()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a reference that can be used to identify the current type across different compilation versions.
  remarks: >-
    <p>
        References are essential in Metalama because <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref> objects are bound to a specific
        <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>. As aspects execute, the compilation evolves through multiple immutable versions.
        References provide a stable way to track the same type across these versions.
        </p>
    <p>
        To resolve a reference back to the type, use <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: IRef<IType> ToRef()
    return:
      type: Metalama.Framework.Code.IRef{Metalama.Framework.Code.IType}
      description: A compile-time serializable reference to the current type.
    content.vb: Function ToRef() As IRef(Of IType)
  overload: Metalama.Framework.Code.IType.ToRef*
  seealso:
  - linkId: Metalama.Framework.Code.IRef`1
    commentId: T:Metalama.Framework.Code.IRef`1
  - linkId: Metalama.Framework.Code.RefExtensions
    commentId: T:Metalama.Framework.Code.RefExtensions
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
- uid: Metalama.Framework.Code.IType.ToType
  commentId: M:Metalama.Framework.Code.IType.ToType
  id: ToType
  parent: Metalama.Framework.Code.IType
  langs:
  - csharp
  - vb
  name: ToType()
  nameWithType: IType.ToType()
  fullName: Metalama.Framework.Code.IType.ToType()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a reflection <xref href="System.Type" data-throw-if-not-resolved="false"></xref> that represents the current type at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Type" data-throw-if-not-resolved="false"></xref> object for the current type.
        While Metalama is designed to eliminate the need for reflection in most scenarios, this method is useful
        when you need to pass type information to APIs that require <xref href="System.Type" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on type names and may break if your project
        is obfuscated. Consider using direct type references when possible to avoid obfuscation issues.
        </p>
  example: []
  syntax:
    content: Type ToType()
    return:
      type: System.Type
      description: A <xref href="System.Type" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToType() As Type
  overload: Metalama.Framework.Code.IType.ToType*
  seealso:
  - linkId: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
    commentId: M:Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
  - linkType: HRef
    linkId: '@reflection'
    altText: '@reflection'
