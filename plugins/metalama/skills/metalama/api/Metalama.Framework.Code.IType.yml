- uid: Metalama.Framework.Code.IType.IsNullable
  commentId: P:Metalama.Framework.Code.IType.IsNullable
  id: IsNullable
  parent: Metalama.Framework.Code.IType
  langs:
  - csharp
  - vb
  name: IsNullable
  nameWithType: IType.IsNullable
  fullName: Metalama.Framework.Code.IType.IsNullable
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the nullability of the type, or <code>null</code> if the type is a reference type but its nullability has not been analyzed or specified.

    This property returns <code>false</code> for normal value types and <code>true</code> for the <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref> type. Note that in

    case of nullable value types, the current type represents the <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref> type itself, and the inner value type

    is exposed as <xref href="Metalama.Framework.Code.INamedType.UnderlyingType" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: bool? IsNullable { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: ReadOnly Property IsNullable As Boolean?
  overload: Metalama.Framework.Code.IType.IsNullable*
