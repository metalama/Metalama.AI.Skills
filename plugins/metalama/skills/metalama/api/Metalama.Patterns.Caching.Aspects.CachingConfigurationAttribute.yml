  nameWithType: CachingConfigurationAttribute
  fullName: Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Custom attribute that, when applied to a type, configures the <xref href="Metalama.Patterns.Caching.Aspects.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspects applied to the methods of this type

    or its derived types. When applied to an assembly, the <xref href="Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute" data-throw-if-not-resolved="false"></xref> custom attribute configures all methods

    of the current assembly.
  remarks: >-
    <p>Any <xref href="Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute" data-throw-if-not-resolved="false"></xref> on the base class has always priority over a <xref href="Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute" data-throw-if-not-resolved="false"></xref>

    on the assembly, even if the base class is in a different assembly.</p>

    <p>Configuration can also be specified programmatically using the <xref href="Metalama.Patterns.Caching.Aspects.Configuration.CachingConfigurationExtensions.ConfigureCaching(Metalama.Framework.Fabrics.IQuery%7bMetalama.Framework.Code.IMethod%7d%2cSystem.Action%7bMetalama.Patterns.Caching.Aspects.Configuration.CachingOptionsBuilder%7d)" data-throw-if-not-resolved="false"></xref>

    fabric extension method.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class)]

      [RunTimeOrCompileTime]

      public sealed class CachingConfigurationAttribute : CachingBaseAttribute, IHierarchicalOptionsProvider
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.Class)>

