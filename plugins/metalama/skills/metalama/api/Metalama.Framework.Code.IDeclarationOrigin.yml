  name: IsCompilerGenerated
  nameWithType: IDeclarationOrigin.IsCompilerGenerated
  fullName: Metalama.Framework.Code.IDeclarationOrigin.IsCompilerGenerated
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the declaration or its parent has an <xref href="System.Runtime.CompilerServices.CompilerGeneratedAttribute" data-throw-if-not-resolved="false"></xref> regardless of the origin <xref href="Metalama.Framework.Code.IDeclarationOrigin.Kind" data-throw-if-not-resolved="false"></xref>.

    This property is currently <code>false</code> for declarations introduced by aspects because Metalama does not add the <xref href="System.Runtime.CompilerServices.CompilerGeneratedAttribute" data-throw-if-not-resolved="false"></xref>

    to introduced declarations. Check the <xref href="Metalama.Framework.Code.IDeclarationOrigin.Kind" data-throw-if-not-resolved="false"></xref> property to skip declarations added by aspects.
  example: []
  syntax:
    content: bool IsCompilerGenerated { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsCompilerGenerated As Boolean
  overload: Metalama.Framework.Code.IDeclarationOrigin.IsCompilerGenerated*
