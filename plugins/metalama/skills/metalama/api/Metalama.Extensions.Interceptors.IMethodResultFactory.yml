- uid: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)
  commentId: M:Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)
  id: RedirectToExistingMethod(Metalama.Framework.Code.IMethod)
  parent: Metalama.Extensions.Interceptors.IMethodResultFactory
  langs:
  - csharp
  - vb
  name: RedirectToExistingMethod(IMethod)
  nameWithType: IMethodResultFactory.RedirectToExistingMethod(IMethod)
  fullName: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Redirects the calls to an existing method.
  remarks: >-
    <p>

    The method must be static and accessible from the site. It can be generic and can be declared in a generic type. Pass the definition

    of such a method: its type parameters are resolved for each site.

    </p>

    <p>

    Each parameter of the method is bound to the first of these values that exists, and a required parameter that remains unbound is an

    error:

    </p>

    <ol><li>the value of the property of the same name of the arguments given to <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>;</li><li>the receiver of the site, when the parameter is the first one and the site has a receiver;</li><li>the argument of the site whose parameter has the same name;</li><li>the caller information that its attribute requests;</li><li>its own default value.</li></ol>

    <p>

    Each type parameter of the method and of its declaring types is bound to the first of these types that exists, and a type parameter

    that remains unbound is an error:

    </p>

    <ol><li>the value of the property of the same name of the arguments given to <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>, which is

    a <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, for instance <code>typeof(Order)</code>, or an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>;</li><li>the type argument of the type parameter of the same name of the intercepted method and of its declaring types.</li></ol>

    <p>

    The value of each argument must convert implicitly to the parameter type. A <code>ref</code>, <code>out</code> or <code>in</code> parameter must receive

    an argument of the site with the same reference kind and an identical type. The return type must be implicitly convertible to the

    return type of the intercepted method, and identical when the site is inside a conditional access (<code>?.</code>).

    </p>

    <p>

    For a method group converted to a delegate or to a function pointer, the method must have exactly the signature of the intercepted

    method.

    </p>
  example: []
  syntax:
    content: IExistingMethodInterception RedirectToExistingMethod(IMethod method)
    parameters:
    - id: method
      type: Metalama.Framework.Code.IMethod
      description: The existing method.
    return:
      type: Metalama.Extensions.Interceptors.IExistingMethodInterception
    content.vb: Function RedirectToExistingMethod(method As IMethod) As IExistingMethodInterception
  overload: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToExistingMethod*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">method</code> is <code>null</code>.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The method is a constructed generic method.
