- uid: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToSynthesizedMethod(Metalama.Framework.Advising.MethodTemplateSelector@)
  commentId: M:Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToSynthesizedMethod(Metalama.Framework.Advising.MethodTemplateSelector@)
  id: RedirectToSynthesizedMethod(Metalama.Framework.Advising.MethodTemplateSelector@)
  parent: Metalama.Extensions.Interceptors.IMethodResultFactory
  langs:
  - csharp
  - vb
  name: RedirectToSynthesizedMethod(in MethodTemplateSelector)
  nameWithType: IMethodResultFactory.RedirectToSynthesizedMethod(in MethodTemplateSelector)
  fullName: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToSynthesizedMethod(in Metalama.Framework.Advising.MethodTemplateSelector)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Redirects the calls to a method synthesized from a template given as a <xref href="Metalama.Framework.Advising.MethodTemplateSelector" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    The options of the synthesized method are set on the returned <xref href="Metalama.Extensions.Interceptors.ITemplateInterception" data-throw-if-not-resolved="false"></xref>. By default, the method is

    synthesized in the class <code>MetalamaInterceptors</code>, with the <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Global" data-throw-if-not-resolved="false"></xref> granularity, so that it is

    shared by all the call sites that have the same template, arguments, tags and signature. The template is then expanded once, for the

    representative call site and with its aspect instance, as described in <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    When the template has run-time type parameters, they bind to the type parameters of the intercepted method, and the synthesized method is

    generic over them, so that calls with different type arguments share it. Otherwise, the synthesized method is specialized for the type

    arguments of the call site, which the compile-time parameters of the template can receive through

    <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    The run-time parameters of the template bind to the parameters of the synthesized method by name, or else by position after the receiver

    parameter. A run-time parameter that binds to no parameter and has a default value receives its default value. The template reads the

    description of the interception through <code>meta.Interception</code>.

    </p>

    <p>

    The synthesized methods and classes are not visible in the code model to aspects, in any stage of the pipeline, and they are not in the

    code that the IDE generates, because they are added when the code is linked, after all aspects have executed.

    </p>
  example: []
  syntax:
    content: ITemplateInterception RedirectToSynthesizedMethod(in MethodTemplateSelector template)
    parameters:
    - id: template
      type: Metalama.Framework.Advising.MethodTemplateSelector
      description: The template.
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function RedirectToSynthesizedMethod(template As MethodTemplateSelector) As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToSynthesizedMethod*
  nameWithType.vb: IMethodResultFactory.RedirectToSynthesizedMethod(MethodTemplateSelector)
  fullName.vb: Metalama.Extensions.Interceptors.IMethodResultFactory.RedirectToSynthesizedMethod(Metalama.Framework.Advising.MethodTemplateSelector)
  name.vb: RedirectToSynthesizedMethod(MethodTemplateSelector)
