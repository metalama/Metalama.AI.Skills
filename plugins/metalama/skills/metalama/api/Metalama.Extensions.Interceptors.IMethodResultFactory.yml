  summary: >-
    Chooses how the selected calls are intercepted: redirected to an existing method, or redirected to a method synthesized from a template. It

    is the base of <xref href="Metalama.Extensions.Interceptors.IMethodSelection" data-throw-if-not-resolved="false"></xref>, for a result that applies to every call site, and of <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite" data-throw-if-not-resolved="false"></xref>,

    for the result of one call site.
