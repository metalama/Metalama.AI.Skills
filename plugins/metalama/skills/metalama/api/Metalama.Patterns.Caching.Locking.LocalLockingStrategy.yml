  summary: >-
    An implementation of <xref href="Metalama.Patterns.Caching.Locking.ILockingStrategy" data-throw-if-not-resolved="false"></xref> in which every instance of the <xref href="Metalama.Patterns.Caching.Locking.LocalLockingStrategy" data-throw-if-not-resolved="false"></xref>

    has its own set of named locks that are not shared in any way with other instances. The <xref href="Metalama.Patterns.Caching.Locking.LocalLockingStrategy" data-throw-if-not-resolved="false"></xref> can

    be used to synchronize the execution of methods in the current process and <xref href="System.AppDomain" data-throw-if-not-resolved="false"></xref>.
