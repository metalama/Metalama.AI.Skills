  name: InterceptionQueryExtensions
  nameWithType: InterceptionQueryExtensions
  fullName: Metalama.Extensions.Interceptors.InterceptionQueryExtensions
  type: Class
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Provides extension methods that register interceptors through a query. Each declaration selected by the query is a scope: the uses of

    the selected methods located in its code are intercepted.
  remarks: >-
    <p>

    Fabrics call these methods on their amender, and aspects can call them on <xref href="Metalama.Framework.Aspects.IAspectBuilder%601.Outbound" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    Registration only records the interception. Sites are found later, in the source compilation, after all aspects and fabrics have run.

    Sites in code introduced by aspects are never intercepted.

    </p>

    <p>

    At most one interceptor can apply to a site. When several registrations match the same site, each one is evaluated, and it is an error

    when more than one of them returns a result other than <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    The selected methods are the same for every scope declaration. A result that depends on the scope declaration is chosen per site with

    <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>, which reads <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.ScopeDeclaration" data-throw-if-not-resolved="false"></xref> and, for a tagged query,

    <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.ScopeTag" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    Only call sites written in the source code are intercepted. A call that the compiler, the runtime or a library makes on behalf of the

    code is not intercepted, because no call exists at the site. For instance, <code>ToString</code> cannot be intercepted reliably: an interpolated

    string, a string concatenation, <code>Console.WriteLine( object )</code> and <code>StringBuilder.Append( object )</code> call it inside the runtime.

    The same applies to <code>Equals</code> and <code>GetHashCode</code> called by collections, to <code>Dispose</code> called by a <code>using</code> statement, and

    to <code>GetEnumerator</code> called by a <code>foreach</code> statement.

    </p>
