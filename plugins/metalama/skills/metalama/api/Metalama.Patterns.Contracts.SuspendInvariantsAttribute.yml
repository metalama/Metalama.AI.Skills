  summary: >-
    Aspect that, when applied to a method or accessor, suspends the execution of invariants for the object while this method is

    executing. All threads and execution contexts are affected. The feature must be enabled through the <xref href="Metalama.Patterns.Contracts.ContractOptions.IsInvariantSuspensionSupported" data-throw-if-not-resolved="false"></xref>

    contract option.
