- uid: Metalama.Framework.Aspects.IObjectReader.Source
  commentId: P:Metalama.Framework.Aspects.IObjectReader.Source
  id: Source
  parent: Metalama.Framework.Aspects.IObjectReader
  langs:
  - csharp
  - vb
  name: Source
  nameWithType: IObjectReader.Source
  fullName: Metalama.Framework.Aspects.IObjectReader.Source
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets the original source object(s) used to set the tags.
  remarks: >-
    <p>
        Use this property when you want to work with the original tag object rather than accessing individual keys.
        This is particularly useful when using anonymous types or custom tag classes, as it preserves the original type.
        </p>
    <p>
        If there are multiple source objects (i.e., when both <xref href="Metalama.Framework.Aspects.IAspectBuilder.Tags" data-throw-if-not-resolved="false"></xref> and the
        <code>tags</code> advice method parameter are set), this property returns an <xref href="System.Collections.Immutable.ImmutableArray%601" data-throw-if-not-resolved="false"></xref>
        containing all source objects.
        </p>
  example: []
  syntax:
    content: object? Source { get; }
    parameters: []
    return:
      type: System.Object
    content.vb: ReadOnly Property Source As Object
