  name: IObjectReader
  nameWithType: IObjectReader
  fullName: Metalama.Framework.Aspects.IObjectReader
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Provides read-only dictionary access to tags passed from the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method to templates.

    Accessible in templates via <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Tags are compile-time name-value pairs used to pass contextual information from <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref>
        to template implementations. This interface exposes tags as a dictionary while also providing access to the original
        source object(s) via the <xref href="Metalama.Framework.Aspects.IObjectReader.Source" data-throw-if-not-resolved="false"></xref> property.
        </p>
    <p>
      <b>Setting tags:</b> Tags can be set in two ways:
        </p>
    <ul><li>By passing an argument to the <code>tags</code> parameter of advice methods (e.g., <code>builder.Override(nameof(Template), tags: new { Key = value })</code>)</li><li>By setting <xref href="Metalama.Framework.Aspects.IAspectBuilder.Tags" data-throw-if-not-resolved="false"></xref> at any point in <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref></li></ul>

    <p>
        When both methods are used, the tags are merged. In case of key conflicts, values from the advice method parameter take precedence.
        </p>
    <p>
      <b>Reading tags:</b> In template code, access tags through <code>meta.Tags</code> using two approaches:
        </p>
    <ul><li>
          <b>Dictionary access:</b> Use <code>meta.Tags["key"]</code> to read individual values. This is the typical approach
        when using anonymous types (e.g., <code>new { Key = value }</code>).</li><li>
          <b>Source property:</b> Use <code>meta.Tags.Source</code> to access the original object cast to a strongly-typed class.
        This is useful when using a dedicated tag class instead of anonymous types.</li></ul>
  example: []
