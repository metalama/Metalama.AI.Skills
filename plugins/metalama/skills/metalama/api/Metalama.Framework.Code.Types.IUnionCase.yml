  name: IUnionCase
  nameWithType: IUnionCase
  fullName: Metalama.Framework.Code.Types.IUnionCase
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: Represents one case of a union, reached through <xref href="Metalama.Framework.Code.Types.IUnionFacet.Cases" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        A case is more than its type. The compiler reports the case types of a union as a set, so two cases never have the
        same type and <xref href="Metalama.Framework.Code.Types.IUnionCase.Index" data-throw-if-not-resolved="false"></xref> cannot be recovered from <xref href="Metalama.Framework.Code.Types.IUnionCase.Type" data-throw-if-not-resolved="false"></xref>. The member that creates a value of
        the case is a constructor for one authoring form and a static method for another, so it cannot be derived from the
        type either.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IUnionCase
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IUnionCase
