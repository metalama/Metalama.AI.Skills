- uid: Metalama.Framework.Code.Types.IUnionCase.CreationMember
  commentId: P:Metalama.Framework.Code.Types.IUnionCase.CreationMember
  id: CreationMember
  parent: Metalama.Framework.Code.Types.IUnionCase
  langs:
  - csharp
  - vb
  name: CreationMember
  nameWithType: IUnionCase.CreationMember
  fullName: Metalama.Framework.Code.Types.IUnionCase.CreationMember
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the member that creates a value of the case: the constructor that the compiler synthesizes for a union

    declaration, the public single-parameter constructor of the attribute form, or the static <code>Create</code> method

    of the <code>IUnionMembers</code> interface of the attribute form, or of an interface that this interface inherits.
  remarks: >-
    The member is typed as <xref href="Metalama.Framework.Code.IMethodBase" data-throw-if-not-resolved="false"></xref> because it is a constructor for one authoring form and a

    method for another. A consumer that invokes it tests whether it is an <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref> or an

    <xref href="Metalama.Framework.Code.IConstructor" data-throw-if-not-resolved="false"></xref>, because <xref href="Metalama.Framework.Code.IMethodBase" data-throw-if-not-resolved="false"></xref> declares no invoker of its own.
  example: []
  syntax:
    content: IMethodBase CreationMember { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethodBase
    content.vb: ReadOnly Property CreationMember As IMethodBase
  overload: Metalama.Framework.Code.Types.IUnionCase.CreationMember*
