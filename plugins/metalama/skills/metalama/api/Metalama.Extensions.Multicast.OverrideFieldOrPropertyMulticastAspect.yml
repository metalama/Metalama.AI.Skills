  summary: An aspect equivalent to <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref> that also implements multicasting for backward compatibility with PostSharp.
  remarks: >-
    <p>

    This class combines the field/property overriding capabilities of <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref> with the multicasting features

    provided by <xref href="Metalama.Extensions.Multicast.MulticastAspect" data-throw-if-not-resolved="false"></xref>. It can be applied to fields, properties, types, or assemblies, and will automatically apply to

    matching fields and properties based on the multicasting filter properties inherited from <xref href="Metalama.Extensions.Multicast.IMulticastAttribute" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    For details on the template system and best practices, see the documentation of <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Property|AttributeTargets.Field, AllowMultiple = true)]

      public abstract class OverrideFieldOrPropertyMulticastAspect : MulticastAspect, IMulticastAttribute, IAspect<ICompilation>, IEligible<ICompilation>, IAspect<INamedType>, IEligible<INamedType>, IAspect<IFieldOrProperty>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IFieldOrProperty>
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.PropertyOrAttributeTargets.Field, AllowMultiple:=True)>

      Public MustInherit Class OverrideFieldOrPropertyMulticastAspect Inherits MulticastAspect Implements IMulticastAttribute, IAspect(Of ICompilation), IEligible(Of ICompilation), IAspect(Of INamedType), IEligible(Of INamedType), IAspect(Of IFieldOrProperty), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IFieldOrProperty)
