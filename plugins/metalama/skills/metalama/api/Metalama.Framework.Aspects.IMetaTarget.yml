- uid: Metalama.Framework.Aspects.IMetaTarget.Parameters
  commentId: P:Metalama.Framework.Aspects.IMetaTarget.Parameters
  id: Parameters
  parent: Metalama.Framework.Aspects.IMetaTarget
  langs:
  - csharp
  - vb
  name: Parameters
  nameWithType: IMetaTarget.Parameters
  fullName: Metalama.Framework.Aspects.IMetaTarget.Parameters
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Gets the list of parameters of the current <xref href="Metalama.Framework.Aspects.IMetaTarget.Method" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.IMetaTarget.Constructor" data-throw-if-not-resolved="false"></xref>,  <xref href="Metalama.Framework.Aspects.IMetaTarget.Property" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.IMetaTarget.Indexer" data-throw-if-not-resolved="false"></xref> or throws

    an exception if the advice does not target a method, constructor, property or indexer.
  remarks: >-
    <p>
        Access parameter values using indexer syntax: <code>meta.Target.Parameters[0].Value</code> or <code>meta.Target.Parameters["paramName"].Value</code>.
        You can also modify parameter values before calling <code>meta.Proceed()</code>, and the modified values will be passed to the original implementation.
        </p>
  example: []
  syntax:
    content: IParameterList Parameters { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.Collections.IParameterList
    content.vb: ReadOnly Property Parameters As IParameterList
  overload: Metalama.Framework.Aspects.IMetaTarget.Parameters*
