  fullName: Metalama.Framework.Aspects.IMetaTarget.Expression
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Gets the target field, property, or parameter as a unified <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>,

    or throws an exception if the declaration does not implement <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This property is useful when authoring contract templates because it provides unified access to <xref href="Metalama.Framework.Code.IField" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.IProperty" data-throw-if-not-resolved="false"></xref>, and <xref href="Metalama.Framework.Code.IParameter" data-throw-if-not-resolved="false"></xref>

    as an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IExpression Expression { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IExpression
    content.vb: ReadOnly Property Expression As IExpression
  overload: Metalama.Framework.Aspects.IMetaTarget.Expression*
