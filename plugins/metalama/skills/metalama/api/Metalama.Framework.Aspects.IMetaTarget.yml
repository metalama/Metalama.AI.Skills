  name: IMetaTarget
  nameWithType: IMetaTarget
  fullName: Metalama.Framework.Aspects.IMetaTarget
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Provides access to the target declaration being transformed by an aspect template. Access via <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref><code>.Target</code> in template code.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Aspects.IMetaTarget" data-throw-if-not-resolved="false"></xref> exposes properties to access the specific declaration type being targeted by a template (e.g., method, property, field, event).
        Use these properties to interact with and reference the target declaration within template code.
        </p>
    <p>
        For example, access <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref><code>.Target.Method</code> in a method template to get the method being overridden,
        or <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref><code>.Target.FieldOrProperty</code> in a property template to access the underlying field or property.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IMetaTarget
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IMetaTarget
