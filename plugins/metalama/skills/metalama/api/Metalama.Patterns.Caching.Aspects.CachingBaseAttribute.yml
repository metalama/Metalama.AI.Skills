- uid: Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.UseDependencyInjection
  commentId: P:Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.UseDependencyInjection
  id: UseDependencyInjection
  parent: Metalama.Patterns.Caching.Aspects.CachingBaseAttribute
  langs:
  - csharp
  - vb
  name: UseDependencyInjection
  nameWithType: CachingBaseAttribute.UseDependencyInjection
  fullName: Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.UseDependencyInjection
  type: Property
  assemblies:
  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Gets or sets a value indicating whether the <xref href="Metalama.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> should be obtained through dependency injection.

    The default value is <code>true</code>. When set to <code>false</code>, the <xref href="Metalama.Patterns.Caching.CachingService.Default" data-throw-if-not-resolved="false"></xref> static property is used instead.
  remarks: >-
    <p>When dependency injection is enabled, the aspect introduces a dependency to <xref href="Metalama.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> into

    the declaring type, which requires the type to be instantiated through a dependency injection container.</p>

    <p>When dependency injection is disabled, static methods can also be cached.</p>
  example: []
  syntax:
    content: public bool UseDependencyInjection { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property UseDependencyInjection As Boolean
  overload: Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.UseDependencyInjection*
