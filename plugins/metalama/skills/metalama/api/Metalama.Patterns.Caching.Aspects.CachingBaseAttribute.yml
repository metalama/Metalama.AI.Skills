  name: CachingBaseAttribute
  nameWithType: CachingBaseAttribute
  fullName: Metalama.Patterns.Caching.Aspects.CachingBaseAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Abstract base class for <xref href="Metalama.Patterns.Caching.Aspects.CacheAttribute" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute" data-throw-if-not-resolved="false"></xref>,

    providing common caching configuration properties.
  remarks: >-
    <p>This class provides compile-time configuration properties that control caching behavior such as

    expiration times, priority, and cache key generation. Properties set on this attribute take precedence

    over run-time configuration specified through <xref href="Metalama.Patterns.Caching.CachingProfile" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [RunTimeOrCompileTime]

      public abstract class CachingBaseAttribute : Attribute, IHierarchicalOptionsProvider
    content.vb: >-
      <RunTimeOrCompileTime>

      Public MustInherit Class CachingBaseAttribute Inherits Attribute Implements IHierarchicalOptionsProvider
