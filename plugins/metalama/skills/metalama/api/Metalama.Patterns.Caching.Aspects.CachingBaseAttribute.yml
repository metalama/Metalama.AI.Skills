  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Gets or sets a value indicating whether the <code>this</code> instance should be a part of the cache key. The default value of this property is <code>false</code>,

    which means that by default the <code>this</code> instance is a part of the cache key.
