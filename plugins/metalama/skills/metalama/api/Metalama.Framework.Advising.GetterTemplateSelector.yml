  name: GetterTemplateSelector
  nameWithType: GetterTemplateSelector
  fullName: Metalama.Framework.Advising.GetterTemplateSelector
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Specifies which T# templates to use when overriding property or field getters, enabling automatic selection

    of specialized templates for iterator getters.
  remarks: >-
    <p>
        When overriding field or property accessors with <xref href="Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cMetalama.Framework.Advising.GetterTemplateSelector%40%2cSystem.String%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>,
        you can provide different templates for properties that return <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref>.
        Template selection depends on the <xref href="Metalama.Framework.Advising.GetterTemplateSelector.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> flag.
        </p>
    <p>
      <b>Default behavior</b> (<xref href="Metalama.Framework.Advising.GetterTemplateSelector.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> is <code>false</code>): Templates are selected based
        on how the getter is <i>implemented</i>:
        <ul><li><xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumerableTemplate" data-throw-if-not-resolved="false"></xref>/<xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumeratorTemplate" data-throw-if-not-resolved="false"></xref>: Getters using <code>yield</code> statements</li><li><xref href="Metalama.Framework.Advising.GetterTemplateSelector.DefaultTemplate" data-throw-if-not-resolved="false"></xref>: All other getters (required if you want to override)</li></ul></p>
    <p>
      <b>When <xref href="Metalama.Framework.Advising.GetterTemplateSelector.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> is <code>true</code></b>: Iterator templates are selected based on
        the property's <i>return type</i> (e.g., <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref>), regardless of whether
        the getter uses <code>yield</code> statements.
        </p>
    <p>
        This type has an implicit conversion from <xref href="System.String" data-throw-if-not-resolved="false"></xref>, so if you only need a default template,
        you can pass the template name directly without constructing a <xref href="Metalama.Framework.Advising.GetterTemplateSelector" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public readonly struct GetterTemplateSelector
