- uid: Metalama.Framework.Advising.GetterTemplateSelector.#ctor(System.String,System.String,System.String,System.Boolean)
  commentId: M:Metalama.Framework.Advising.GetterTemplateSelector.#ctor(System.String,System.String,System.String,System.Boolean)
  id: '#ctor(System.String,System.String,System.String,System.Boolean)'
  parent: Metalama.Framework.Advising.GetterTemplateSelector
  langs:
  - csharp
  - vb
  name: GetterTemplateSelector(string, string?, string?, bool)
  nameWithType: GetterTemplateSelector.GetterTemplateSelector(string, string?, string?, bool)
  fullName: Metalama.Framework.Advising.GetterTemplateSelector.GetterTemplateSelector(string, string?, string?, bool)
  type: Constructor
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Initializes a new instance of the <xref href="Metalama.Framework.Advising.GetterTemplateSelector" data-throw-if-not-resolved="false"></xref> struct by specifying the name of the template methods to be applied. The named passed to this

    constructor must be the name of methods of the current aspect class, and these methods must be annotated with the <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.

    You can define several templates by passing a value to optional parameters. The appropriate template will be automatically selected according to

    the method to which the advice is applied. If several templates are eligible for a method, the template that is the last in the list of parameters is selected.
  remarks: >-
    Note that this type has also an implicit conversion from <xref href="System.String" data-throw-if-not-resolved="false"></xref>.

    If you only want to specify a default template, you can pass a string, without calling the constructor.
  example: []
  syntax:
    content: public GetterTemplateSelector(string defaultTemplate, string? enumerableTemplate = null, string? enumeratorTemplate = null, bool useEnumerableTemplateForAnyEnumerable = false)
    parameters:
    - id: defaultTemplate
      type: System.String
      description: Name of the template that must be applied if no other template is applicable. This parameter is required.
    - id: enumerableTemplate
      type: System.String
      description: >-
        Name of the template that must be applied to iterator methods returning an <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref>.
                    See <xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumerableTemplate" data-throw-if-not-resolved="false"></xref> for details.
    - id: enumeratorTemplate
      type: System.String
      description: >-
        Name of the template that must be applied to an iterator method returning an an <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref> or <xref href="System.Collections.IEnumerator" data-throw-if-not-resolved="false"></xref>.
                    See <xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumeratorTemplate" data-throw-if-not-resolved="false"></xref> for details.
    - id: useEnumerableTemplateForAnyEnumerable
      type: System.Boolean
      description: >-
        Indicates whether the <xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumerableTemplate" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Advising.GetterTemplateSelector.EnumeratorTemplate" data-throw-if-not-resolved="false"></xref>
                    must be applied to all methods returning compatible return type (if set to <code>true</code>), instead of only to methods using the <code>yield</code> statement.
                    See <xref href="Metalama.Framework.Advising.GetterTemplateSelector.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> for details.
    content.vb: Public Sub New(defaultTemplate As String, enumerableTemplate As String = Nothing, enumeratorTemplate As String = Nothing, useEnumerableTemplateForAnyEnumerable As Boolean = False)
