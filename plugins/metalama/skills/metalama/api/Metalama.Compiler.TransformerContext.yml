  name: TransformerContext
  nameWithType: TransformerContext
  fullName: Metalama.Compiler.TransformerContext
  type: Class
  assemblies:
  - Metalama.Compiler.Interface
  namespace: Metalama.Compiler
  summary: >-
    Context passed to a source transformer when <xref href="Metalama.Compiler.ISourceTransformer.Execute(Metalama.Compiler.TransformerContext)" data-throw-if-not-resolved="false"></xref> is

    called.

    The implementation can modify the compilation using the methods

    <xref href="Metalama.Compiler.TransformerContext.AddSyntaxTrees(Microsoft.CodeAnalysis.SyntaxTree%5b%5d)" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Compiler.TransformerContext.ReplaceSyntaxTree(Microsoft.CodeAnalysis.SyntaxTree%2cMicrosoft.CodeAnalysis.SyntaxTree)" data-throw-if-not-resolved="false"></xref> or

    <xref href="Metalama.Compiler.TransformerContext.AddResources(Metalama.Compiler.ManagedResource%5b%5d)" data-throw-if-not-resolved="false"></xref>. It can report a diagnostic using <xref href="Metalama.Compiler.TransformerContext.ReportDiagnostic(Microsoft.CodeAnalysis.Diagnostic)" data-throw-if-not-resolved="false"></xref> or

    suppress diagnostics using <xref href="Metalama.Compiler.TransformerContext.RegisterDiagnosticFilter(Metalama.Compiler.DiagnosticFilter%40)" data-throw-if-not-resolved="false"></xref>.
