  name: BackgroundTaskScheduler
  nameWithType: BackgroundTaskScheduler
  fullName: Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler
  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Backend
  namespace: Metalama.Patterns.Caching.Implementation
  summary: >-
    Schedules and manages background tasks for caching operations. This class provides a robust

    infrastructure for executing cache-related background work with support for concurrency control,

    retry policies, and overload detection.
  remarks: >-
    <p>

    <b>Execution Modes:</b>

    <ul><li><b>Parallel mode</b> (default): Tasks run concurrently up to the <code>maxConcurrency</code> limit.

    Additional tasks queue until a slot becomes available.</li><li><b>Sequential mode</b> (<code>sequential=true</code>): Tasks execute strictly one after another

    in enqueue order. Useful for operations that must not overlap.</li></ul>

    </p>

    <p>

    <b>Concurrency Control:</b>

    The scheduler uses an internal <xref href="System.Threading.SemaphoreSlim" data-throw-if-not-resolved="false"></xref> to throttle execution. The default

    <code>maxConcurrency</code> is 50, meaning up to 50 tasks can execute simultaneously in parallel mode.

    Additional tasks wait in a queue until a semaphore slot becomes available.

    </p>

    <p>

    <b>Overload Detection:</b>

    When the number of queued tasks exceeds the <code>overloadThreshold</code> (default: 500) above the

    <code>maxConcurrency</code>, the scheduler enters an overloaded state. The <xref href="Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler.IsOverloaded" data-throw-if-not-resolved="false"></xref>

    property reflects this state, and the <xref href="Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler.IsOverloadedChanged" data-throw-if-not-resolved="false"></xref> event fires on state transitions.

    </p>

    <p>

    <b>Retry Policy:</b>

    An optional <xref href="Metalama.Patterns.Caching.Resilience.IRetryPolicy" data-throw-if-not-resolved="false"></xref> can be provided to enable automatic retries for failed tasks.

    During retry delays, the semaphore is released to allow other tasks to proceed, then re-acquired

    before the next attempt.

    </p>

    <p>

    <b>Cancellation:</b>

    The scheduler supports two cancellation mechanisms:

    <ul><li>Global cancellation via <xref href="Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler.Cancel" data-throw-if-not-resolved="false"></xref>: Cancels all pending and running tasks.</li><li>Per-task cancellation: Each enqueued task can have its own <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>

    that is combined with the global token.</li></ul>

    </p>

    <p>

    <b>Disposal:</b>

    The <xref href="Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler.Dispose" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Patterns.Caching.Implementation.BackgroundTaskScheduler.DisposeAsync(System.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> methods wait for all pending tasks

    to complete before releasing resources. Use the overload with a <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>

    to abort waiting if needed.

    </p>
  example: []
