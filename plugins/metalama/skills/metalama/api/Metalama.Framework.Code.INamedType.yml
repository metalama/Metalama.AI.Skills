  name: INamedType
  nameWithType: INamedType
  fullName: Metalama.Framework.Code.INamedType
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: 'Represents a named type: class, struct, interface, enum, delegate, or record.'
  remarks: >-
    <p>
        Named types are the fundamental building blocks of C# programs. Unlike other types in the type system
        (such as arrays, pointers, or type parameters), named types have a fully qualified name, can contain members
        (methods, properties, fields, events, constructors), can implement interfaces, inherit from base types,
        and can have nested types.
        </p>
    <p>
        To obtain an <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>, you can:
        <ul><li>Use <xref href="Metalama.Framework.Code.TypeFactory.GetNamedType(System.Type)" data-throw-if-not-resolved="false"></xref> with a <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/operators/type-testing-and-cast#typeof-operator">typeof</a> expression.</li><li>Navigate from <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref> through namespaces to types.</li><li>Access the <xref href="Metalama.Framework.Code.IMember.DeclaringType" data-throw-if-not-resolved="false"></xref> property of a member.</li></ul></p>
    <p>
        For generic types, use <xref href="Metalama.Framework.Code.INamedType.MakeGenericInstance(System.Collections.Generic.IReadOnlyList%7bMetalama.Framework.Code.IType%7d)" data-throw-if-not-resolved="false"></xref> to create a constructed generic type from a generic definition.
        </p>
  example: []
  syntax:
    content: 'public interface INamedType : IType, IEquatable<IType>, IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>, IEquatable<INamedType>'
