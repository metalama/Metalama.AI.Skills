  summary: >-
    Gets or sets a value indicating whether the <xref href="Metalama.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> owns the <xref href="Metalama.Patterns.Caching.CachingProfile.Backend" data-throw-if-not-resolved="false"></xref>. The default value of this property

    is <code>true</code> if <xref href="Metalama.Patterns.Caching.CachingProfile.BackendFactory" data-throw-if-not-resolved="false"></xref> is non-null and <code>false</code> otherwise. When the profile owns the <xref href="Metalama.Patterns.Caching.Backends.CachingBackend" data-throw-if-not-resolved="false"></xref>,

    When the backend is owned, the <xref href="Metalama.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> will initialize it and dispose it. Otherwise, this should be performed by the caller.
