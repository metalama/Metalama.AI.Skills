  name: CachingProfile
  nameWithType: CachingProfile
  fullName: Metalama.Patterns.Caching.CachingProfile
  type: Class
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching
  summary: >-
    Set of options defined at run time when the <xref href="Metalama.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> is instantiated. Classes and methods can be assigned

    to a <xref href="Metalama.Patterns.Caching.CachingProfile" data-throw-if-not-resolved="false"></xref> using the <code>ProfileName</code> option or attribute property. Any compile-time setting takes

    precedence over the values defined in the <xref href="Metalama.Patterns.Caching.CachingProfile" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Caching profiles allow different groups of cached methods to have different configurations,

    such as different expiration times, backends, or locking strategies. Methods are assigned to profiles

    at compile time using the <code>CachingBaseAttribute.ProfileName</code> property.</p>

    <p>Profiles are registered when creating the <xref href="Metalama.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> using

    <xref href="Metalama.Patterns.Caching.Building.ICachingServiceBuilder.AddProfile(Metalama.Patterns.Caching.CachingProfile%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [RunTime]

      public sealed class CachingProfile : ICacheItemConfiguration
    content.vb: >-
      <RunTime>

      Public NotInheritable Class CachingProfile Implements ICacheItemConfiguration
