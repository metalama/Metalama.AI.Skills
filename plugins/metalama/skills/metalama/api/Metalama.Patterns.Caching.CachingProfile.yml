- uid: Metalama.Patterns.Caching.CachingProfile.LockingStrategy
  commentId: P:Metalama.Patterns.Caching.CachingProfile.LockingStrategy
  id: LockingStrategy
  parent: Metalama.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: LockingStrategy
  nameWithType: CachingProfile.LockingStrategy
  fullName: Metalama.Patterns.Caching.CachingProfile.LockingStrategy
  type: Property
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching
  summary: >-
    Gets or sets the lock manager used to synchronize the execution of methods

    that are cached with the current profile.  The default lock manager is <xref href="Metalama.Patterns.Caching.Locking.NullLockingStrategy" data-throw-if-not-resolved="false"></xref>,

    which allows for concurrent execution of all methods. An alternative implementation is <xref href="Metalama.Patterns.Caching.Locking.LocalLockingStrategy" data-throw-if-not-resolved="false"></xref>,

    which prevents concurrent execution of the same method with the same parameters, in the current process (or AppDomain).
  example: []
  syntax:
    content: public ILockingStrategy LockingStrategy { get; init; }
    parameters: []
    return:
      type: Metalama.Patterns.Caching.Locking.ILockingStrategy
    content.vb: Public Property LockingStrategy As ILockingStrategy
  overload: Metalama.Patterns.Caching.CachingProfile.LockingStrategy*
- uid: Metalama.Patterns.Caching.CachingProfile.AcquireLockTimeout
  commentId: P:Metalama.Patterns.Caching.CachingProfile.AcquireLockTimeout
  id: AcquireLockTimeout
  parent: Metalama.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: AcquireLockTimeout
  nameWithType: CachingProfile.AcquireLockTimeout
  fullName: Metalama.Patterns.Caching.CachingProfile.AcquireLockTimeout
  type: Property
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching
  summary: >-
    Gets or sets the maximum time that the caching aspect will wait for the <xref href="Metalama.Patterns.Caching.CachingProfile.LockingStrategy" data-throw-if-not-resolved="false"></xref> to acquire a lock.

    To specify an infinite waiting time, set this property to <code>TimeSpan.FromMilliseconds( -1 )</code>. The default

    behavior is to wait infinitely.
  example: []
  syntax:
    content: public TimeSpan AcquireLockTimeout { get; init; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property AcquireLockTimeout As TimeSpan
  overload: Metalama.Patterns.Caching.CachingProfile.AcquireLockTimeout*
- uid: Metalama.Patterns.Caching.CachingProfile.OnLockTimeout
  commentId: P:Metalama.Patterns.Caching.CachingProfile.OnLockTimeout
  id: OnLockTimeout
  parent: Metalama.Patterns.Caching.CachingProfile
  langs:
  - csharp
  - vb
  name: OnLockTimeout
  nameWithType: CachingProfile.OnLockTimeout
  fullName: Metalama.Patterns.Caching.CachingProfile.OnLockTimeout
  type: Property
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching
  summary: >-
    Gets or sets the behavior in case that the caching aspect could not acquire a lock because of a timeout. 

    The default behavior is to throw a <xref href="System.TimeoutException" data-throw-if-not-resolved="false"></xref>.

    If the delegate does not return any exception, the cached method will be evaluated (even without a lock).
  example: []
  syntax:
    content: public Action<LockTimeoutContext> OnLockTimeout { get; init; }
    parameters: []
    return:
      type: System.Action{Metalama.Patterns.Caching.Locking.LockTimeoutContext}
    content.vb: Public Property OnLockTimeout As Action(Of LockTimeoutContext)
  overload: Metalama.Patterns.Caching.CachingProfile.OnLockTimeout*
