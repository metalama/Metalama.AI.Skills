  name: UnderlyingType
  nameWithType: IEnumFacet.UnderlyingType
  fullName: Metalama.Framework.Code.Types.IEnumFacet.UnderlyingType
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: Gets the underlying integral type of the enum, which is <code>int</code> unless the declaration names another one.
  remarks: >-
    <p>
        This property has a single meaning. <xref href="Metalama.Framework.Code.INamedType.UnderlyingType" data-throw-if-not-resolved="false"></xref> returns the same type for an
        enum, but it returns other things for other kinds of type, so the caller has to know the kind of the type to
        know what it returned.
        </p>
  example: []
  syntax:
    content: INamedType UnderlyingType { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.INamedType
    content.vb: ReadOnly Property UnderlyingType As INamedType
