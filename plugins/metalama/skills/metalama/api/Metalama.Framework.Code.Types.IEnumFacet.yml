  name: IEnumFacet
  nameWithType: IEnumFacet
  fullName: Metalama.Framework.Code.Types.IEnumFacet
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Represents the structure of an enum: its underlying integral type, its members, and whether it carries

    <xref href="System.FlagsAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        The facet is reached through <xref href="Metalama.Framework.Code.Collections.ITypeFacetCollection.Enum" data-throw-if-not-resolved="false"></xref>, as in
        <code>type.Facets.Enum?.UnderlyingType</code>. It is <code>null</code> for a type that <xref href="Metalama.Framework.Code.INamedType.IsEnum" data-throw-if-not-resolved="false"></xref>
        reports as not being an enum.
        </p>
    <p>
        The members of an enum are exposed as <xref href="Metalama.Framework.Code.IField" data-throw-if-not-resolved="false"></xref>. An enum member is a field, so no interface of its own
        is declared for it.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IEnumFacet : ITypeFacet
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IEnumFacet Inherits ITypeFacet
