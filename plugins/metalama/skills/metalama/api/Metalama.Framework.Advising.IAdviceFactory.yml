        Specifies the strategy to follow when an attribute of the same type already exists on the target declaration. <xref href="Metalama.Framework.Aspects.OverrideStrategy.Fail" data-throw-if-not-resolved="false"></xref> will fail the
                        compilation with an error and is the default strategy. <xref href="Metalama.Framework.Aspects.OverrideStrategy.Ignore" data-throw-if-not-resolved="false"></xref> will silently ignore the introduction. <xref href="Metalama.Framework.Aspects.OverrideStrategy.Override" data-throw-if-not-resolved="false"></xref> will remove
                        all previous instances and replace them by the new one. <xref href="Metalama.Framework.Aspects.OverrideStrategy.New" data-throw-if-not-resolved="false"></xref> will add the new instance regardless.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IAttribute}
    content.vb: Function IntroduceAttribute(targetDeclaration As IDeclaration, attribute As IAttributeData, whenExists As OverrideStrategy = OverrideStrategy.Default) As IIntroductionAdviceResult(Of IAttribute)
