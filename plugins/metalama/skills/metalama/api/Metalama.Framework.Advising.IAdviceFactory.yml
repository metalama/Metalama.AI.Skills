  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Introduces a new event to the target type, or overrides the implementation of an existing one, by specifying an event template.
  example: []
  syntax:
    content: IIntroductionAdviceResult<IEvent> IntroduceEvent(INamedType targetType, string eventTemplate, IntroductionScope scope = IntroductionScope.Default, OverrideStrategy whenExists = OverrideStrategy.Default, Action<IEventBuilder>? buildEvent = null, object? tags = null)
    parameters:
    - id: targetType
      type: Metalama.Framework.Code.INamedType
      description: The type into which the event must be introduced.
    - id: eventTemplate
      type: System.String
      description: >-
        The name of the event in the aspect class that must be used as a template for the introduced event. This event
                        must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The type of the template event can be any delegate type. The type of the introduced event
                        can be changed dynamically thanks to the <xref href="Metalama.Framework.Code.DeclarationBuilders.IEventBuilder" data-throw-if-not-resolved="false"></xref> returned by this method.
    - id: scope
      type: Metalama.Framework.Aspects.IntroductionScope
      description: >-
        Determines the scope (e.g. <xref href="Metalama.Framework.Aspects.IntroductionScope.Instance" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.IntroductionScope.Static" data-throw-if-not-resolved="false"></xref>) of the introduced
                        event. The default scope depends on the scope of the template event. If the event is static, the introduced event is static. However, if the
                        template event is non-static, then the introduced event copies of the scope of the target declaration of the aspect.
    - id: whenExists
      type: Metalama.Framework.Aspects.OverrideStrategy
      description: >-
        Determines the implementation strategy when an event of the same name is already declared in the target type.
                        The default strategy is to fail with a compile-time error.
    - id: buildEvent
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IEventBuilder}
      description: An optional callback that allows you to configure the introduced event, such as changing its name, type, accessibility, or adding custom attributes.
    - id: tags
      type: System.Object
      description: >-
        An optional opaque object of anonymous type passed to the template event and exposed under the <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref> property of the
                        <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> API.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IEvent}
      description: An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> representing the result of the advice. The <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref> property provides access to the introduced event.
    content.vb: Function IntroduceEvent(targetType As INamedType, eventTemplate As String, scope As IntroductionScope = IntroductionScope.Default, whenExists As OverrideStrategy = OverrideStrategy.Default, buildEvent As Action(Of IEventBuilder) = Nothing, tags As Object = Nothing) As IIntroductionAdviceResult(Of IEvent)
