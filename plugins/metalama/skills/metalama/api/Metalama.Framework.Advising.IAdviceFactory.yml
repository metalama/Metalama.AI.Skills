  summary: >-
    Adds a custom annotation to a declaration. An annotation is an arbitrary but serializable object that can then be retrieved

    using the <xref href="Metalama.Framework.Code.DeclarationEnhancements%601.GetAnnotations%60%601" data-throw-if-not-resolved="false"></xref> method of the <xref href="Metalama.Framework.Code.DeclarationExtensions.Enhancements%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> object.

    Annotations are a way of communication between aspects or classes of aspects.
  example: []
