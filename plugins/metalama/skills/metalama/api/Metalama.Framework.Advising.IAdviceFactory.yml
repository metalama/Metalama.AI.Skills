  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Overrides a field or property by specifying a method template for the getter, the setter, or both.
  example: []
  syntax:
    content: IOverrideAdviceResult<IPropertyOrIndexer> OverrideAccessors(IFieldOrPropertyOrIndexer targetFieldOrPropertyOrIndexer, in GetterTemplateSelector getTemplate = default, string? setTemplate = null, object? args = null, object? tags = null)
    parameters:
    - id: targetFieldOrPropertyOrIndexer
      type: Metalama.Framework.Code.IFieldOrPropertyOrIndexer
      description: The field or property to override.
    - id: getTemplate
      type: Metalama.Framework.Advising.GetterTemplateSelector
      description: >-
        The name of the method of the aspect class whose implementation will be used as a template for the getter, or <code>null</code>
                        if the getter should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>T Get()</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the field or property.
                        To select a different templates for iterator getters, use the constructor of the <xref href="Metalama.Framework.Advising.GetterTemplateSelector" data-throw-if-not-resolved="false"></xref> type. To specify a single
                        template for all properties, pass a string.
    - id: setTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose implementation will be used as a template for the getter, or <code>null</code>
                        if the getter should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Set(T value)</code>  where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the field or property.
    - id: args
      type: System.Object
      description: An object (typically of anonymous type) whose properties map to parameters or type parameters of the template methods.
    - id: tags
      type: System.Object
      description: >-
        An optional opaque object of anonymous type passed to the template method and exposed under the <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref> property of the
                        <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> API.
    return:
      type: Metalama.Framework.Advising.IOverrideAdviceResult{Metalama.Framework.Code.IPropertyOrIndexer}
    content.vb: Function OverrideAccessors(targetFieldOrPropertyOrIndexer As IFieldOrPropertyOrIndexer, getTemplate As GetterTemplateSelector = Nothing, setTemplate As String = Nothing, args As Object = Nothing, tags As Object = Nothing) As IOverrideAdviceResult(Of IPropertyOrIndexer)
