  name: OverrideAccessors(IEvent, string?, string?, string?, string?, object?, object?)
  nameWithType: IAdviceFactory.OverrideAccessors(IEvent, string?, string?, string?, string?, object?, object?)
  fullName: Metalama.Framework.Advising.IAdviceFactory.OverrideAccessors(Metalama.Framework.Code.IEvent, string?, string?, string?, string?, object?, object?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Overrides an event by specifying a template for the adder, the remover, and/or the raiser.
  example: []
  syntax:
    content: IOverrideAdviceResult<IEvent> OverrideAccessors(IEvent targetEvent, string? addTemplate = null, string? removeTemplate = null, string? invokeTemplate = null, string? raiseTemplate = null, object? args = null, object? tags = null)
    parameters:
    - id: targetEvent
      type: Metalama.Framework.Code.IEvent
      description: The event to be overridden.
    - id: addTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the adder, or <code>null</code>
                        the adder should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Add(T value)</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the event.
    - id: removeTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the remover, or <code>null</code>
                        the adder should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Remove(T value)</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the event.
    - id: invokeTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for intercepting invocation of 
                        event's handlers. The signature of this method must be <code>T Invoke()</code>, <code>T Invoke(U handler)</code>, or <code>T Invoke(U handler, V1 param1, V2 param2, ...)</code>  
                        where <code>T</code> is either <code>dynamic</code> or a type compatible with the return value of the event's delegate type, <code>U</code> is either dynamic or the event's 
                        delegate type, <code>Vn</code> are types matching the delegate's parameters.
    - id: raiseTemplate
      type: System.String
      description: Not yet implemented.
    - id: args
      type: System.Object
      description: An object (typically of anonymous type) whose properties map to parameters or type parameters of the template methods.
    - id: tags
      type: System.Object
      description: >-
        An optional opaque object of anonymous type passed to the template method and exposed under the <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref> property of the
                        <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> API.
    return:
      type: Metalama.Framework.Advising.IOverrideAdviceResult{Metalama.Framework.Code.IEvent}
    content.vb: Function OverrideAccessors(targetEvent As IEvent, addTemplate As String = Nothing, removeTemplate As String = Nothing, invokeTemplate As String = Nothing, raiseTemplate As String = Nothing, args As Object = Nothing, tags As Object = Nothing) As IOverrideAdviceResult(Of IEvent)
