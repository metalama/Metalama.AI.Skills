- uid: Metalama.Framework.Advising.IAdviceFactory.IntroduceExtensionBlock(Metalama.Framework.Code.INamedType,Metalama.Framework.Code.IType,System.String,System.Action{Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder})
  commentId: M:Metalama.Framework.Advising.IAdviceFactory.IntroduceExtensionBlock(Metalama.Framework.Code.INamedType,Metalama.Framework.Code.IType,System.String,System.Action{Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder})
  id: IntroduceExtensionBlock(Metalama.Framework.Code.INamedType,Metalama.Framework.Code.IType,System.String,System.Action{Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder})
  parent: Metalama.Framework.Advising.IAdviceFactory
  langs:
  - csharp
  - vb
  name: IntroduceExtensionBlock(INamedType, IType, string?, Action<IExtensionBlockBuilder>?)
  nameWithType: IAdviceFactory.IntroduceExtensionBlock(INamedType, IType, string?, Action<IExtensionBlockBuilder>?)
  fullName: Metalama.Framework.Advising.IAdviceFactory.IntroduceExtensionBlock(Metalama.Framework.Code.INamedType, Metalama.Framework.Code.IType, string?, System.Action<Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder>?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Introduces a new extension block into a static class. Extension blocks allow adding

    extension members (methods, properties, operators) to a type (represented as an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>). Requires C# 14+ and Roslyn 5.0+.
  example: []
  syntax:
    content: IIntroductionAdviceResult<IExtensionBlock> IntroduceExtensionBlock(INamedType targetStaticClass, IType receiverType, string? receiverParameterName = null, Action<IExtensionBlockBuilder>? buildExtensionBlock = null)
    parameters:
    - id: targetStaticClass
      type: Metalama.Framework.Code.INamedType
      description: >-
        The static class into which the extension block must be introduced.
                        Only static classes can contain extension blocks.
    - id: receiverType
      type: Metalama.Framework.Code.IType
      description: >-
        The type being extended. Members introduced into this extension block
                        will appear as members of this type.
    - id: receiverParameterName
      type: System.String
      description: >-
        The name of the receiver parameter. Set to <code>null</code> or empty
                        for a static extension (members appear as static members of the extended type).
                        Set to a non-empty string (e.g., "self", "value") for an instance extension.
    - id: buildExtensionBlock
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder}
      description: >-
        An optional callback that allows you to configure the extension block,
                        such as adding type parameters or attributes to the receiver parameter.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IExtensionBlock}
      description: >-
        An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> representing the result of the advice.
                        The <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref> property provides access to the introduced extension block.
                        The result also implements <xref href="Metalama.Framework.Aspects.IAdviser%601" data-throw-if-not-resolved="false"></xref> and can be used to introduce members.
    content.vb: Function IntroduceExtensionBlock(targetStaticClass As INamedType, receiverType As IType, receiverParameterName As String = Nothing, buildExtensionBlock As Action(Of IExtensionBlockBuilder) = Nothing) As IIntroductionAdviceResult(Of IExtensionBlock)
  overload: Metalama.Framework.Advising.IAdviceFactory.IntroduceExtensionBlock*
  nameWithType.vb: IAdviceFactory.IntroduceExtensionBlock(INamedType, IType, String, Action(Of IExtensionBlockBuilder))
  fullName.vb: Metalama.Framework.Advising.IAdviceFactory.IntroduceExtensionBlock(Metalama.Framework.Code.INamedType, Metalama.Framework.Code.IType, String, System.Action(Of Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder))
