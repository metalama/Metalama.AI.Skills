      type: '{TDeclaration}'
      description: The declaration to which the annotation should be added.
    - id: annotation
      type: Metalama.Framework.Code.IAnnotation{{TDeclaration}}
      description: The annotation.
    - id: export
      type: System.Boolean
      description: >-
        A value indicating whether the annotation should be exported and made visible to other projects.
