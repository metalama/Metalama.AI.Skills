  summary: Introduces a field to the target type by specifying a template.
  example: []
  syntax:
    content: IIntroductionAdviceResult<IField> IntroduceField(INamedType targetType, string template, IntroductionScope scope = IntroductionScope.Default, OverrideStrategy whenExists = OverrideStrategy.Default, Action<IFieldBuilder>? buildField = null, object? tags = null)
    parameters:
    - id: targetType
      type: Metalama.Framework.Code.INamedType
      description: The type into which the field must be introduced.
    - id: template
      type: System.String
      description: Name of the introduced field.
    - id: scope
      type: Metalama.Framework.Aspects.IntroductionScope
      description: >-
        Determines the scope (e.g. <xref href="Metalama.Framework.Aspects.IntroductionScope.Instance" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.IntroductionScope.Static" data-throw-if-not-resolved="false"></xref>) of the introduced
                        field. The default scope is <xref href="Metalama.Framework.Aspects.IntroductionScope.Instance" data-throw-if-not-resolved="false"></xref>.
    - id: whenExists
      type: Metalama.Framework.Aspects.OverrideStrategy
      description: >-
        Determines the implementation strategy when a field of the same name is already declared in the target type.
                        The default strategy is to fail with a compile-time error.
    - id: buildField
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IFieldBuilder}
      description: An optional callback that allows you to configure the introduced field, such as changing its name, type, accessibility, or adding custom attributes.
    - id: tags
      type: System.Object
      description: An optional opaque object of anonymous type passed to the template and exposed under the <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref> property of the <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> API.
