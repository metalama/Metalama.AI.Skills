  namespace: Metalama.Extensions.Validation
  summary: >-
    Indicates that references to derived types should also be visited by the validation method.

    This value is only taken into when the validated declaration is an <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>.

    Equivalent to <xref href="Metalama.Extensions.Validation.BaseReferenceValidator.IncludeDerivedTypes" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IncludeDerivedTypes = 1
    return:
      type: Metalama.Extensions.Validation.ReferenceValidationOptions
