  fullName: Metalama.Framework.Aspects.AdviserExtensions.Override(Metalama.Framework.Aspects.IAdviser<Metalama.Framework.Code.IFieldOrProperty>, string, object?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Overrides a field or property by specifying a property template.

    Use the <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> method to apply the advice to a different field or property than the current one.
  remarks: >-
    <p>
        This is a simplified overload for overriding fields or properties using a template property. For an even simpler approach
        when the aspect's only purpose is to override a field or property, use <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref> instead.
        For fine-grained control over individual accessors (e.g., overriding only the getter), use
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrPropertyOrIndexer%7d%2cMetalama.Framework.Advising.GetterTemplateSelector%40%2cSystem.String%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> instead.
        </p>
    <p>
        When applied to a field or auto-property, a backing field is automatically introduced. Within the template property,
        access the underlying value via <code>meta.Target.FieldOrProperty.Value</code>.
        </p>
  example: []
  syntax:
    content: public static IOverrideAdviceResult<IProperty> Override(this IAdviser<IFieldOrProperty> adviser, string template, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.IFieldOrProperty}
      description: An adviser for a field or property.
    - id: template
      type: System.String
      description: >-
        The name of a template property in the aspect class. This property must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>.
                        The template property's accessors (get/set) define which accessors are overridden in the target.
    - id: tags
      type: System.Object
      description: An optional object (typically of anonymous type) passed to the template and accessible via <code>meta.Tags</code>. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    return:
      type: Metalama.Framework.Advising.IOverrideAdviceResult{Metalama.Framework.Code.IProperty}
      description: An <xref href="Metalama.Framework.Advising.IOverrideAdviceResult%601" data-throw-if-not-resolved="false"></xref> exposing the overridden <xref href="Metalama.Framework.Code.IProperty" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function Override(adviser As IAdviser(Of IFieldOrProperty), template As String, tags As Object = Nothing) As IOverrideAdviceResult(Of IProperty)
  overload: Metalama.Framework.Aspects.AdviserExtensions.Override*
