  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Introduces an indexer to the target type, or overrides the implementation of an existing one, by specifying individual template methods for each accessor.
  remarks: >-
    <p>
        This method introduces an indexer with a single index parameter. Use the overload that accepts <code>IReadOnlyList&lt;(IType, string)&gt;</code>
        for indexers with multiple index parameters.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> to introduce the indexer into a different type than the current target.
        </p>
  example: []
  syntax:
    content: public static IIntroductionAdviceResult<IIndexer> IntroduceIndexer(this IAdviser<INamedType> adviser, IType indexType, string? getTemplate, string? setTemplate, IntroductionScope scope = IntroductionScope.Default, OverrideStrategy whenExists = OverrideStrategy.Default, Action<IIndexerBuilder>? buildIndexer = null, object? args = null, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.INamedType}
      description: An adviser for a named type.
    - id: indexType
      type: Metalama.Framework.Code.IType
      description: The type of the initial index parameter.
    - id: getTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the getter, or <code>null</code>
                        if the introduced indexer should not have a getter. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>T Get()</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the indexer.
    - id: setTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the setter, or <code>null</code>
                        if the introduced indexer should not have a setter. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Set(T value)</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the indexer.
    - id: scope
      type: Metalama.Framework.Aspects.IntroductionScope
      description: >-
        Determines the scope (e.g. <xref href="Metalama.Framework.Aspects.IntroductionScope.Instance" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.IntroductionScope.Static" data-throw-if-not-resolved="false"></xref>) of the introduced
                        indexer. The default scope depends on the scope of the template accessors. If the accessors are static, the introduced indexer is static. However, if the
                        template accessors are non-static, then the introduced indexer copies the scope of the target declaration of the aspect.
    - id: whenExists
      type: Metalama.Framework.Aspects.OverrideStrategy
      description: >-
        Determines the implementation strategy when an indexer of the same signature is already declared in the target type.
                        The default strategy is to fail with a compile-time error.
    - id: buildIndexer
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IIndexerBuilder}
      description: An optional delegate that modifies the <xref href="Metalama.Framework.Code.DeclarationBuilders.IIndexerBuilder" data-throw-if-not-resolved="false"></xref> representing the introduced indexer.
    - id: args
      type: System.Object
      description: An optional object (typically of anonymous type) whose properties map to template method parameters or type parameters. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    - id: tags
      type: System.Object
      description: An optional object (typically of anonymous type) passed to the template and accessible via <code>meta.Tags</code>. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IIndexer}
      description: An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> exposing the introduced or overriding <xref href="Metalama.Framework.Code.IIndexer" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function IntroduceIndexer(adviser As IAdviser(Of INamedType), indexType As IType, getTemplate As String, setTemplate As String, scope As IntroductionScope = IntroductionScope.Default, whenExists As OverrideStrategy = OverrideStrategy.Default, buildIndexer As Action(Of IIndexerBuilder) = Nothing, args As Object = Nothing, tags As Object = Nothing) As IIntroductionAdviceResult(Of IIndexer)
