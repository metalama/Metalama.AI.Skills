  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Introduces a new extension block into a static class. Extension blocks allow adding

    extension members (methods, properties, indexers) to a type (represented as an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>). Requires C# 14+ and Roslyn 5.0+.
  example: []
  syntax:
    content: public static IIntroductionAdviceResult<IExtensionBlock> IntroduceExtensionBlock(this IAdviser<INamedType> adviser, IType receiverType, string? receiverParameterName = null, Action<IExtensionBlockBuilder>? buildExtensionBlock = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.INamedType}
      description: An adviser for a named type. Must be a static class.
    - id: receiverType
      type: Metalama.Framework.Code.IType
      description: >-
        The type being extended. Members introduced into this extension block
                        will appear as members of this type.
    - id: receiverParameterName
      type: System.String
      description: >-
        The name of the receiver parameter. Set to <code>null</code> or empty
                        for a static extension (members appear as static members of the extended type).
                        Set to a non-empty string (e.g., "self", "value") for an instance extension.
    - id: buildExtensionBlock
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder}
      description: >-
        An optional callback that allows you to configure the extension block,
                        such as adding type parameters or attributes to the receiver parameter.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IExtensionBlock}
      description: >-
        An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> representing the result of the advice.
                        The <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref> property provides access to the introduced extension block.
                        The result also implements <xref href="Metalama.Framework.Aspects.IAdviser%601" data-throw-if-not-resolved="false"></xref> and can be used to introduce members.
    content.vb: Public Shared Function IntroduceExtensionBlock(adviser As IAdviser(Of INamedType), receiverType As IType, receiverParameterName As String = Nothing, buildExtensionBlock As Action(Of IExtensionBlockBuilder) = Nothing) As IIntroductionAdviceResult(Of IExtensionBlock)
