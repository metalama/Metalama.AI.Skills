        Direction of the data flow to which the contract should apply. Use <xref href="Metalama.Framework.Aspects.ContractDirection.Input" data-throw-if-not-resolved="false"></xref> to validate values being assigned (setter),
                    <xref href="Metalama.Framework.Aspects.ContractDirection.Output" data-throw-if-not-resolved="false"></xref> to validate values being retrieved (getter), or <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref> to select automatically. See <xref href="Metalama.Framework.Aspects.ContractDirection" data-throw-if-not-resolved="false"></xref> for details.
