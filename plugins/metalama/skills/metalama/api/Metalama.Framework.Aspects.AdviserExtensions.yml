        For a declarative approach, use <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceAttribute(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IDeclaration%7d%2cMetalama.Framework.Code.IAttributeData%2cMetalama.Framework.Aspects.OverrideStrategy)" data-throw-if-not-resolved="false"></xref> on a template method in the aspect class.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> to introduce the method into a different type than the current target.
        </p>
  example: []
  syntax:
    content: public static IIntroductionAdviceResult<IMethod> IntroduceMethod(this IAdviser<INamedType> adviser, string template, IntroductionScope scope = IntroductionScope.Default, OverrideStrategy whenExists = OverrideStrategy.Default, Action<IMethodBuilder>? buildMethod = null, object? args = null, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.INamedType}
      description: An adviser for a named type.
    - id: template
      type: System.String
      description: >-
        Name of the template method in the aspect class. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>.

        The template method can have parameters and a return type, which can be further customized using <code class="paramref">buildMethod</code>.
    - id: scope
      type: Metalama.Framework.Aspects.IntroductionScope
      description: >-
        Determines whether the introduced method is instance or static. Default behavior:

        if the template is static, the introduced method is static; otherwise, it matches the target declaration's scope.
    - id: whenExists
      type: Metalama.Framework.Aspects.OverrideStrategy
      description: >-
        Strategy when a method with the same name and signature already exists in the target type.

        Default is <xref href="Metalama.Framework.Aspects.OverrideStrategy.Fail" data-throw-if-not-resolved="false"></xref> (compile-time error). Use <xref href="Metalama.Framework.Aspects.OverrideStrategy.Override" data-throw-if-not-resolved="false"></xref>

        to replace the existing method, or <xref href="Metalama.Framework.Aspects.OverrideStrategy.Ignore" data-throw-if-not-resolved="false"></xref> to skip introduction silently.
    - id: buildMethod
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IMethodBuilder}
      description: >-
        Optional delegate to customize the introduced method's characteristics (name, accessibility, modifiers, parameters, etc.)

        via <xref href="Metalama.Framework.Code.DeclarationBuilders.IMethodBuilder" data-throw-if-not-resolved="false"></xref>.
    - id: args
      type: System.Object
      description: An optional object (typically of anonymous type) whose properties map to template method parameters or type parameters. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    - id: tags
      type: System.Object
      description: An optional object (typically of anonymous type) passed to the template and accessible via <code>meta.Tags</code>. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IMethod}
      description: An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> providing access to the introduced method declaration.
    content.vb: Public Shared Function IntroduceMethod(adviser As IAdviser(Of INamedType), template As String, scope As IntroductionScope = IntroductionScope.Default, whenExists As OverrideStrategy = OverrideStrategy.Default, buildMethod As Action(Of IMethodBuilder) = Nothing, args As Object = Nothing, tags As Object = Nothing) As IIntroductionAdviceResult(Of IMethod)
