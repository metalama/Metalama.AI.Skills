  - csharp
  - vb
  name: OverrideAccessors(IAdviser<IFieldOrPropertyOrIndexer>, in GetterTemplateSelector, string?, object?, object?)
  nameWithType: AdviserExtensions.OverrideAccessors(IAdviser<IFieldOrPropertyOrIndexer>, in GetterTemplateSelector, string?, object?, object?)
  fullName: Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser<Metalama.Framework.Code.IFieldOrPropertyOrIndexer>, in Metalama.Framework.Advising.GetterTemplateSelector, string?, object?, object?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Overrides a field, property, or indexer by specifying templates for the getter and/or setter.

    Use the <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> method to apply the advice to a different field, property or indexer than the current one.
  remarks: >-
    <p>
        This method provides fine-grained control over accessor overriding by using separate method templates for getters and setters.
        Within templates, use <code>meta.Target.FieldOrProperty.Value</code> (for fields/properties) or <code>meta.Target.Indexer[...].Value</code>
        (for indexers) to access the underlying value, and <code>meta.Proceed()</code> to invoke the original accessor.
        </p>
    <p>
        When applied to a field or auto-property, a backing field is automatically introduced.
        </p>
  example: []
  syntax:
    content: public static IOverrideAdviceResult<IPropertyOrIndexer> OverrideAccessors(this IAdviser<IFieldOrPropertyOrIndexer> adviser, in GetterTemplateSelector getTemplate = default, string? setTemplate = null, object? args = null, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.IFieldOrPropertyOrIndexer}
      description: An adviser for a field, property or indexer.
    - id: getTemplate
      type: Metalama.Framework.Advising.GetterTemplateSelector
      description: >-
        The name of the method of the aspect class whose implementation will be used as a template for the getter, or <code>null</code>
                        if the getter should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>T Get()</code> where <code>T</code> is either <code>dynamic</code> or compatible with the field, property or indexer type.
                        To select different templates for iterator getters (IEnumerable/IEnumerator), use <xref href="Metalama.Framework.Advising.GetterTemplateSelector" data-throw-if-not-resolved="false"></xref> to avoid buffering.
    - id: setTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose implementation will be used as a template for the setter, or <code>null</code>
                        if the setter should not be overridden. This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Set(T value)</code> where <code>T</code> is either <code>dynamic</code> or compatible with the field, property or indexer type.
    - id: args
      type: System.Object
      description: An optional object (typically of anonymous type) whose properties map to template method parameters or type parameters. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    - id: tags
      type: System.Object
      description: An optional object (typically of anonymous type) passed to the template and accessible via <code>meta.Tags</code>. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    return:
      type: Metalama.Framework.Advising.IOverrideAdviceResult{Metalama.Framework.Code.IPropertyOrIndexer}
      description: An <xref href="Metalama.Framework.Advising.IOverrideAdviceResult%601" data-throw-if-not-resolved="false"></xref> exposing the overridden <xref href="Metalama.Framework.Code.IPropertyOrIndexer" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Function OverrideAccessors(adviser As IAdviser(Of IFieldOrPropertyOrIndexer), getTemplate As GetterTemplateSelector = Nothing, setTemplate As String = Nothing, args As Object = Nothing, tags As Object = Nothing) As IOverrideAdviceResult(Of IPropertyOrIndexer)
  overload: Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors*
