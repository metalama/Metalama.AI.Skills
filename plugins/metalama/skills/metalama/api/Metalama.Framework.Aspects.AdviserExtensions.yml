  commentId: M:Metalama.Framework.Aspects.AdviserExtensions.OverrideAccessors(Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.IFieldOrPropertyOrIndexer},Metalama.Framework.Advising.GetterTemplateSelector@,System.String,System.Object,System.Object)
