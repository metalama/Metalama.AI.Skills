  name: AddContract(IAdviser<IParameter>, string, ContractDirection, object?, object?)
  nameWithType: AdviserExtensions.AddContract(IAdviser<IParameter>, string, ContractDirection, object?, object?)
  fullName: Metalama.Framework.Aspects.AdviserExtensions.AddContract(Metalama.Framework.Aspects.IAdviser<Metalama.Framework.Code.IParameter>, string, Metalama.Framework.Aspects.ContractDirection, object?, object?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Adds a contract to a parameter. Contracts validate or normalize parameter values at different points in the data flow,

    typically used for precondition checks (input parameters) or postcondition checks (output parameters and return values).

    Use the <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> method to add the contract to a different parameter than the current one.
  remarks: >-
    <p>
      <b>Template Access:</b> Within the template, use <code>meta.Target.Expression</code> for unified access to the target as an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>,
        <code>meta.Target.Parameter</code> for parameter-specific access, and <code>meta.Target.ContractDirection</code> to determine whether you're validating input or output.
        </p>
    <p>
      <b>Performance Note:</b> When possible, provide all contracts to the same method from a single aspect. This approach yields better compile-time performance than using several separate aspects.
        </p>
    <p>
      <b>Ready-Made Contracts:</b> Consider using the <code>Metalama.Patterns.Contracts</code> package, which provides ready-made contract attributes for common validation scenarios
        (nullability, strings, numeric ranges, enums, collections). See <a href="@contract-patterns">@contract-patterns</a> for details.
        </p>
  example: []
  syntax:
    content: public static IAddContractAdviceResult<IParameter> AddContract(this IAdviser<IParameter> adviser, string template, ContractDirection direction = ContractDirection.Default, object? args = null, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Aspects.IAdviser{Metalama.Framework.Code.IParameter}
      description: An adviser for a parameter.
    - id: template
      type: System.String
      description: The name of the template method. This method must have a single run-time parameter named <code>value</code> and be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>.
    - id: direction
      type: Metalama.Framework.Aspects.ContractDirection
      description: >-
        Direction of the data flow to which the contract should apply. Use <xref href="Metalama.Framework.Aspects.ContractDirection.Input" data-throw-if-not-resolved="false"></xref> for preconditions,
                    <xref href="Metalama.Framework.Aspects.ContractDirection.Output" data-throw-if-not-resolved="false"></xref> for postconditions, or <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref> to select automatically based on parameter type. See <xref href="Metalama.Framework.Aspects.ContractDirection" data-throw-if-not-resolved="false"></xref> for details.
    - id: args
      type: System.Object
      description: An object (typically of anonymous type) whose properties map to parameters or type parameters of the template.
    - id: tags
      type: System.Object
      description: An optional object (typically of anonymous type) passed to the template and accessible via <code>meta.Tags</code>. See <a href="@sharing-state-with-advice">@sharing-state-with-advice</a> for details.
    return:
      type: Metalama.Framework.Advising.IAddContractAdviceResult{Metalama.Framework.Code.IParameter}
      description: An <xref href="Metalama.Framework.Advising.IAddContractAdviceResult%601" data-throw-if-not-resolved="false"></xref> exposing the added contract.
    content.vb: Public Shared Function AddContract(adviser As IAdviser(Of IParameter), template As String, direction As ContractDirection = ContractDirection.Default, args As Object = Nothing, tags As Object = Nothing) As IAddContractAdviceResult(Of IParameter)
  overload: Metalama.Framework.Aspects.AdviserExtensions.AddContract*
  seealso:
