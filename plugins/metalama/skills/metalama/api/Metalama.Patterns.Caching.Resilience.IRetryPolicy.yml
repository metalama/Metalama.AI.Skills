  namespace: Metalama.Patterns.Caching.Resilience
  summary: Determines if a Redis transaction should be tried, and throws a <xref href="Metalama.Patterns.Caching.CachingException" data-throw-if-not-resolved="false"></xref> if it cannot.
  example: []
  syntax:
    content: ValueTask<bool> TryAsync(OperationKind kind, int attempt, Exception? exception, ref object? state, CancellationToken cancellationToken = default)
    parameters:
    - id: kind
      type: Metalama.Patterns.Caching.Resilience.OperationKind
      description: The transaction kind.
    - id: attempt
      type: System.Int32
      description: The index of the attempt. <code>0</code> indicates the first attempt, i.e. not a retry.
    - id: exception
      type: System.Exception
      description: The <xref href="System.Exception" data-throw-if-not-resolved="false"></xref> of the previous attempt, if any.
    - id: state
      type: System.Object
      description: >-
        A to an optional state of the operation, optionally set by the <xref href="Metalama.Patterns.Caching.Resilience.IRetryPolicy" data-throw-if-not-resolved="false"></xref> implementation and
                    opaque to the caller.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>.
    return:
      type: System.Threading.Tasks.ValueTask{System.Boolean}
      description: Always <code>true</code>. Must throw an exception if it cannot retry.
    content.vb: Function TryAsync(kind As OperationKind, attempt As Integer, exception As Exception, state As Object, cancellationToken As CancellationToken = Nothing) As ValueTask(Of Boolean)
