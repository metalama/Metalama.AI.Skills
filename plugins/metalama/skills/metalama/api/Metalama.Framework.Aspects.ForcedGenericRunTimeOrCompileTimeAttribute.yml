  namespace: Metalama.Framework.Aspects
  summary: >-
    Attribute that means that the target declaration (and all children declarations) can be called both from compile-time

    and run-time code, even if the generic type arguments are not run-time-or-compile-time.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Interface|AttributeTargets.Delegate)]

      public sealed class ForcedGenericRunTimeOrCompileTimeAttribute : ScopeAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.InterfaceOrAttributeTargets.Delegate)>

      Public NotInheritable Class ForcedGenericRunTimeOrCompileTimeAttribute Inherits ScopeAttribute
