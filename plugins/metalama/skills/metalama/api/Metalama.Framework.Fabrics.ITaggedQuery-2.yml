    content: ITaggedQuery<INamedType, out TTag> SelectTypes(bool includeNestedTypes = true)
    parameters:
    - id: includeNestedTypes
      type: System.Boolean
      description: Indicates whether nested types should be recursively included in the output.
    return:
      type: Metalama.Framework.Fabrics.ITaggedQuery{Metalama.Framework.Code.INamedType,{TTag}}
    content.vb: Function SelectTypes(includeNestedTypes As Boolean = True) As ITaggedQuery(Of INamedType, Out TTag)
