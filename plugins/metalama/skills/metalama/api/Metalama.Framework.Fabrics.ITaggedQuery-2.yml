  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Fabrics
  summary: Selects all types enclosed in declarations of the current set.
  remarks: >-
    <p>
        This method projects <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.INamespace" data-throw-if-not-resolved="false"></xref> to all the types in the compilation or namespace.
        It projects <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> to itself. It projects members or parameters to their declaring types.
        </p>
    <p>The query on the <i>right</i> part of <xref href="Metalama.Framework.Fabrics.ITaggedQuery%602.SelectTypes(System.Boolean)" data-throw-if-not-resolved="false"></xref> is executed concurrently.</p>.
  example: []
