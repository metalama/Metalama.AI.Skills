  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Gets or sets a list of regular expression patterns that will be evaluated against method and/or property names to identify candidate can-execute members. 

    In this pattern, all occurrences of the substring <code>{CommandName}</code> will be replaced with the command name

    determined according to <xref href="Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern" data-throw-if-not-resolved="false"></xref> before the expression is evaluated.
