  name: CommandNamingConvention
  nameWithType: CommandNamingConvention
  fullName: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention
  type: Class
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Defines a naming convention for the <xref href="Metalama.Patterns.Wpf.CommandAttribute" data-throw-if-not-resolved="false"></xref> aspect, specifying how to derive the command property name

    and <code>CanExecute</code> member from the target method name.
  remarks: >-
    <p>Use <xref href="Metalama.Patterns.Wpf.Configuration.CommandOptionsBuilder.AddNamingConvention(Metalama.Patterns.Wpf.Configuration.CommandNamingConvention%2cSystem.Nullable%7bSystem.Int32%7d)" data-throw-if-not-resolved="false"></xref> to register custom naming conventions.</p>

    <p>Patterns can use the <code>{CommandName}</code> placeholder which is replaced with the command name extracted from the target method.</p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public sealed record CommandNamingConvention : ICompileTimeSerializable, IEquatable<CommandNamingConvention>
    content.vb: >-
      <CompileTime>

      Public NotInheritable Class CommandNamingConvention Implements ICompileTimeSerializable, IEquatable(Of CommandNamingConvention)
