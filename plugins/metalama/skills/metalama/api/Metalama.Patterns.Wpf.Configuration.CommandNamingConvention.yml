  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Gets or sets the name of the command property to be introduced. The substring  <code>{CommandName}</code> will be replaced with the

    command name determined according to <xref href="Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern" data-throw-if-not-resolved="false"></xref>. If <xref href="Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandPropertyName" data-throw-if-not-resolved="false"></xref> is not specified

    the name produced by appending the <code>Command</code> suffix to the command name.
  example: []
