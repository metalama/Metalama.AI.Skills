- uid: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern
  commentId: P:Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern
  id: CommandNamePattern
  parent: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention
  langs:
  - csharp
  - vb
  name: CommandNamePattern
  nameWithType: CommandNamingConvention.CommandNamePattern
  fullName: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Gets or sets a regular expression pattern that will be evaluated against the name of the target method of the <xref href="Metalama.Patterns.Wpf.CommandAttribute" data-throw-if-not-resolved="false"></xref> aspect. 

    The expression should yield a match group named <code>CommandName</code>. If <xref href="Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern" data-throw-if-not-resolved="false"></xref> is not specified,

    the name produced from the target method name, minus any <code>Execute</code> prefix and <code>Command</code> suffix.
  example: []
  syntax:
    content: public string? CommandNamePattern { get; init; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property CommandNamePattern As String
  overload: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandNamePattern*
- uid: Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandPropertyName
  commentId: P:Metalama.Patterns.Wpf.Configuration.CommandNamingConvention.CommandPropertyName
