  namespace: Metalama.Framework.Advising
  summary: Provides methods to introduce explicit interface member implementations.
  remarks: >-
    <p>
        This interface is obtained from the <xref href="Metalama.Framework.Advising.IImplementInterfaceAdviceResult.ExplicitMembers" data-throw-if-not-resolved="false"></xref> property or
        <xref href="Metalama.Framework.Advising.IInterfaceImplementationResult.ExplicitMembers" data-throw-if-not-resolved="false"></xref> property after calling
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Use the extension methods in <xref href="Metalama.Framework.Advising.InterfaceImplementationAdviserExtensions" data-throw-if-not-resolved="false"></xref> to introduce explicit
        interface member implementations such as methods, properties, events, and indexers.
        </p>
  example: []
  syntax:
    content: >-
