- uid: Metalama.Framework.Advising.IConstructorOverloadingStrategy.GetConstructorOverloadingAction(Metalama.Framework.Code.IConstructor,Metalama.Framework.Code.IParameter)
  commentId: M:Metalama.Framework.Advising.IConstructorOverloadingStrategy.GetConstructorOverloadingAction(Metalama.Framework.Code.IConstructor,Metalama.Framework.Code.IParameter)
  id: GetConstructorOverloadingAction(Metalama.Framework.Code.IConstructor,Metalama.Framework.Code.IParameter)
  parent: Metalama.Framework.Advising.IConstructorOverloadingStrategy
  langs:
  - csharp
  - vb
  name: GetConstructorOverloadingAction(IConstructor, IParameter)
  nameWithType: IConstructorOverloadingStrategy.GetConstructorOverloadingAction(IConstructor, IParameter)
  fullName: Metalama.Framework.Advising.IConstructorOverloadingStrategy.GetConstructorOverloadingAction(Metalama.Framework.Code.IConstructor, Metalama.Framework.Code.IParameter)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Gets the action the framework should apply when a constructor has just been mutated: generate a forwarding

    constructor (optionally decorated with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>), or do nothing.
  example: []
  syntax:
    content: ConstructorOverloadingAction GetConstructorOverloadingAction(IConstructor mutatedConstructor, IParameter introducedParameter)
    parameters:
    - id: mutatedConstructor
      type: Metalama.Framework.Code.IConstructor
      description: The constructor immediately after the new parameter has been appended.
    - id: introducedParameter
      type: Metalama.Framework.Code.IParameter
      description: The parameter that was just introduced.
    return:
      type: Metalama.Framework.Advising.ConstructorOverloadingAction
      description: >-
        A <xref href="Metalama.Framework.Advising.ConstructorOverloadingAction" data-throw-if-not-resolved="false"></xref> describing the decision; when
                    <xref href="Metalama.Framework.Advising.ConstructorOverloadingAction.ForwardAndMarkObsolete(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> is used, it also carries the
                    <code>[Obsolete]</code> metadata to emit on the generated forwarding constructor.
    content.vb: Function GetConstructorOverloadingAction(mutatedConstructor As IConstructor, introducedParameter As IParameter) As ConstructorOverloadingAction
  overload: Metalama.Framework.Advising.IConstructorOverloadingStrategy.GetConstructorOverloadingAction*
