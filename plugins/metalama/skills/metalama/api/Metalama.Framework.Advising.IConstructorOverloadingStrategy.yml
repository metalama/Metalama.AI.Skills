items:
- uid: Metalama.Framework.Advising.IConstructorOverloadingStrategy
  commentId: T:Metalama.Framework.Advising.IConstructorOverloadingStrategy
  id: IConstructorOverloadingStrategy
  parent: Metalama.Framework.Advising
  children:
  - Metalama.Framework.Advising.IConstructorOverloadingStrategy.GetConstructorOverloadingAction(Metalama.Framework.Code.IConstructor,Metalama.Framework.Code.IParameter)
  langs:
  - csharp
  - vb
  name: IConstructorOverloadingStrategy
  nameWithType: IConstructorOverloadingStrategy
  fullName: Metalama.Framework.Advising.IConstructorOverloadingStrategy
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    A strategy that decides whether the framework should generate an additional <em>forwarding constructor</em>

    when <xref href="Metalama.Framework.Advising.IAdviceFactory.IntroduceParameter(Metalama.Framework.Code.IConstructor%2cSystem.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Advising.IPullStrategy%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Framework.Code.DeclarationBuilders.AttributeConstruction%7d%2cMetalama.Framework.Advising.IConstructorOverloadingStrategy)" data-throw-if-not-resolved="false"></xref>

    mutates a constructor with a required parameter. A forwarding constructor is a compile-time stub that keeps

    the pre-mutation signature callable and chains via <code>: this(...)</code> to the now-mutated constructor,

    preserving both source and binary compatibility. For the standard implementation see

    <xref href="Metalama.Framework.Advising.ConstructorOverloadingStrategy" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
      <strong>Cross-Project Operation:</strong> Overloading strategies operate across project boundaries. Custom
        implementations must be serializable because the strategy is persisted in the transitive advice metadata and
        invoked again in projects that reference the project where the parameter was introduced. For example, when a
        parameter is introduced on a base-class constructor in project A and a derived class in project B has its
        constructor mutated as a result of the pull walk, the same overloading strategy decides whether project B's
        derived constructor should also receive a forwarding constructor.
        </p>
  example: []
  syntax:
    content: 'public interface IConstructorOverloadingStrategy : ICompileTimeSerializable'
    content.vb: Public Interface IConstructorOverloadingStrategy Inherits ICompileTimeSerializable
  seealso:
