- uid: Metalama.Extensions.Interceptors.IMethodInterceptionContext.UseKind
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionContext.UseKind
  id: UseKind
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionContext
  langs:
  - csharp
  - vb
  name: UseKind
  nameWithType: IMethodInterceptionContext.UseKind
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionContext.UseKind
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the kind of use at the site. Every registration receives every kind. A delegate given to <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>

    that does not support a kind returns <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Later versions can add values to <xref href="Metalama.Extensions.Interceptors.MethodUseKind" data-throw-if-not-resolved="false"></xref>. A provider that depends on the kind tests for the kinds that it supports

    and skips the others.
  example: []
  syntax:
    content: MethodUseKind UseKind { get; }
    parameters: []
    return:
      type: Metalama.Extensions.Interceptors.MethodUseKind
    content.vb: ReadOnly Property UseKind As MethodUseKind
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionContext.UseKind*
- uid: Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod
  id: InterceptedMethod
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionContext
  langs:
  - csharp
  - vb
  name: InterceptedMethod
  nameWithType: IMethodInterceptionContext.InterceptedMethod
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the method to which the C# compiler binds the call, or that the method-group conversion selects, constructed with the type

    arguments of the site. A classic extension method called in reduced form is represented in its static form, and its receiver is the

    first element of <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments" data-throw-if-not-resolved="false"></xref>. Its definition, without the type arguments of the site, is <xref href="Metalama.Framework.Code.IMethod.Definition" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IMethod InterceptedMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property InterceptedMethod As IMethod
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod*
- uid: Metalama.Extensions.Interceptors.IMethodInterceptionContext.MatchedMethod
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionContext.MatchedMethod
  id: MatchedMethod
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionContext
  langs:
  - csharp
  - vb
  name: MatchedMethod
  nameWithType: IMethodInterceptionContext.MatchedMethod
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionContext.MatchedMethod
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the method definition that the registration matched by its declaring type and its name. It differs from the definition of

    <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod" data-throw-if-not-resolved="false"></xref> when the site is bound to an override or to an interface implementation, which the registration matches

    by default and with <xref href="Metalama.Extensions.Interceptors.IMethodSelection.IncludingInterfaceImplementations" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IMethod MatchedMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property MatchedMethod As IMethod
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionContext.MatchedMethod*
