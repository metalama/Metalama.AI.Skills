- uid: Metalama.Extensions.Interceptors.IMethodInterceptionContext.IsResultUsed
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionContext.IsResultUsed
  id: IsResultUsed
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionContext
  langs:
  - csharp
  - vb
  name: IsResultUsed
  nameWithType: IMethodInterceptionContext.IsResultUsed
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionContext.IsResultUsed
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets a value indicating whether the value returned by the call is used. It is always <code>false</code> for a method-reference site, because

    the value is used by the code that invokes the delegate.
  example: []
  syntax:
    content: bool IsResultUsed { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsResultUsed As Boolean
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionContext.IsResultUsed*
- uid: Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments
  commentId: P:Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments
  id: Arguments
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionContext
  langs:
  - csharp
  - vb
  name: Arguments
  nameWithType: IMethodInterceptionContext.Arguments
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets one element for each parameter of <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext.InterceptedMethod" data-throw-if-not-resolved="false"></xref>, in parameter order, including parameters that receive default

    values. The list is empty for a method-reference site, because the arguments are passed when the delegate or the function pointer is

    invoked.
  example: []
  syntax:
    content: IReadOnlyList<InvocationArgument> Arguments { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyList{Metalama.Extensions.Interceptors.InvocationArgument}
    content.vb: ReadOnly Property Arguments As IReadOnlyList(Of InvocationArgument)
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments*
