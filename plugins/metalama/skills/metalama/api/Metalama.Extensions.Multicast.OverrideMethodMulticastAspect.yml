  name: OverrideMethodMulticastAspect
  nameWithType: OverrideMethodMulticastAspect
  fullName: Metalama.Extensions.Multicast.OverrideMethodMulticastAspect
  type: Class
  assemblies:
  - Metalama.Extensions.Multicast
  namespace: Metalama.Extensions.Multicast
  summary: An aspect equivalent to <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref> that also implements multicasting for backward compatibility with PostSharp.
  remarks: >-
    <p>

    This class combines the method overriding capabilities of <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref> with the multicasting features

    provided by <xref href="Metalama.Extensions.Multicast.MulticastAspect" data-throw-if-not-resolved="false"></xref>. It can be applied to methods, properties, events, types, or assemblies, and will

    automatically apply to matching method accessors based on the multicasting filter properties inherited from <xref href="Metalama.Extensions.Multicast.IMulticastAttribute" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    For details on the template system, template selection, and best practices, see the documentation of <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
