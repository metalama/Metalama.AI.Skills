  fullName: Metalama.Framework.Code.ITupleType
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Represents a tuple type, such as <code>(int, string)</code> or <code>(decimal Quantity, string ProductCode)</code>.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Code.ITupleType" data-throw-if-not-resolved="false"></xref> is derived from <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> because C# tuple types are syntactic sugar
        over the <xref href="System.ValueTuple" data-throw-if-not-resolved="false"></xref> type.
        </p>
    <p>
        To create a tuple type, use <xref href="Metalama.Framework.Code.TypeFactory.CreateTupleType(System.Collections.Generic.IEnumerable%7bMetalama.Framework.Code.IType%7d)" data-throw-if-not-resolved="false"></xref> or its overloads.
        To create an instance in generated code, use <xref href="Metalama.Framework.Code.ITupleType.CreateCreateInstanceExpression(System.Collections.Generic.IEnumerable%7bMetalama.Framework.Code.IExpression%7d)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
