  type: Method
  assemblies:
  - Metalama.Framework.Introspection
  namespace: Metalama.Framework.Introspection
  summary: >-
    Gets the reference graph for a compilation, which enables querying inbound and outbound

    references between declarations.
  example: []
  syntax:
    content: IIntrospectionReferenceGraph GetReferenceGraph(ICompilation compilation)
    parameters:
    - id: compilation
      type: Metalama.Framework.Code.ICompilation
      description: The compilation to get the reference graph for.
