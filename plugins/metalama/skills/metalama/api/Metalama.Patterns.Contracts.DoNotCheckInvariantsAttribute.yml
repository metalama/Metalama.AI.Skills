  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: Custom attribute that, when applied to a method, means that invariants should not be checked when this method completes.
  remarks: >-
    This custom attribute does not caused methods <i>called</i> by the target method to skip invariant checks.

    For this, enable the <xref href="Metalama.Patterns.Contracts.ContractOptions.IsInvariantSuspensionSupported" data-throw-if-not-resolved="false"></xref> contract option and call the generated <code>SuspendInvariant</code>

    method or the <xref href="Metalama.Patterns.Contracts.SuspendInvariantsAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      public sealed class DoNotCheckInvariantsAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method)>

      Public NotInheritable Class DoNotCheckInvariantsAttribute Inherits Attribute
