  fullName: Metalama.Framework.Advising.IImplementInterfaceAdviceResult
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Represents the result of <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> advice.
  remarks: >-
    <p>
        This result provides access to the <xref href="Metalama.Framework.Advising.IImplementInterfaceAdviceResult.ExplicitMembers" data-throw-if-not-resolved="false"></xref> property for introducing explicit interface
        member implementations, and the <xref href="Metalama.Framework.Advising.IImplementInterfaceAdviceResult.Interfaces" data-throw-if-not-resolved="false"></xref> collection to inspect which interfaces were implemented.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface IImplementInterfaceAdviceResult : IAdviceResult
    content.vb: >-
      <CompileTime>

      Public Interface IImplementInterfaceAdviceResult Inherits IAdviceResult
