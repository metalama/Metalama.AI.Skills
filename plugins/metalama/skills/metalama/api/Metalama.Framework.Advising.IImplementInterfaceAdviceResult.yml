  namespace: Metalama.Framework.Advising
  summary: Gets a list of interface members specified using <xref href="Metalama.Framework.Aspects.InterfaceMemberAttribute" data-throw-if-not-resolved="false"></xref> that were considered when implementing the given interface.
  remarks: This property contains only members of interfaces that were implemented. Members of interfaces that were ignored are not included in the list.
  example: []
  syntax:
    content: >-
      [Obsolete("This property is no longer supported because members may be resolved after the call to the ImplementInterface method.")]

