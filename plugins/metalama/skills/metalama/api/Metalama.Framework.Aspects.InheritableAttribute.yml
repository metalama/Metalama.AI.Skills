  name: InheritableAttribute
  nameWithType: InheritableAttribute
  fullName: Metalama.Framework.Aspects.InheritableAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Custom attribute that, when applied to an aspect class, causes all instances of this aspect

    to be inherited by derived declarations. The aspect's <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method is invoked

    not only for the direct target declaration but also for all derived declarations.
  remarks: >-
    <p>
        Aspects marked with this attribute are inherited in the following scenarios:
        </p>
    <ul><li>From a base class to all derived classes</li><li>From a base interface to all derived interfaces</li><li>From an interface to all types implementing that interface</li><li>From a <code>virtual</code> or <code>abstract</code> member to its <code>override</code> members</li><li>From an interface member to its implementations</li><li>From a parameter of a <code>virtual</code> or <code>abstract</code> method to the corresponding parameter of all <code>override</code> methods</li><li>From a parameter of an interface member to the corresponding parameter of all its implementations</li></ul>

    <p>
      <b>Cross-project inheritance:</b> Aspect inheritance works across project boundaries. When the base declaration
        is in a referenced assembly, the <xref href="Metalama.Framework.Aspects.IAspect" data-throw-if-not-resolved="false"></xref> object itself and its <xref href="Metalama.Framework.Aspects.IAspectState" data-throw-if-not-resolved="false"></xref> (if set)
        are serialized into that assembly and deserialized when compiling the derived project. This is why aspect classes
        must be compile-time serializable (they derive from <xref href="System.Attribute" data-throw-if-not-resolved="false"></xref>, which is automatically serializable).
        </p>
    <p>
      <b>Conditional inheritance:</b> For aspects that need to decide inheritability based on properties or context,
        implement <xref href="Metalama.Framework.Aspects.IConditionallyInheritableAspect" data-throw-if-not-resolved="false"></xref> instead of using this attribute.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class)]

      [CompileTime]

      public sealed class InheritableAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class)>

      <CompileTime>

      Public NotInheritable Class InheritableAttribute Inherits Attribute
