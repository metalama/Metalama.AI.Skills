  type: Class
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching.Dependencies
  summary: >-
    Wraps an <xref href="System.Object" data-throw-if-not-resolved="false"></xref> into an <xref href="Metalama.Patterns.Caching.Dependencies.ICacheDependency" data-throw-if-not-resolved="false"></xref>. The <xref href="Metalama.Patterns.Caching.Dependencies.ICacheDependency.GetCacheKey(Metalama.Patterns.Caching.ICachingService)" data-throw-if-not-resolved="false"></xref> method

    relies on the <xref href="Metalama.Patterns.Caching.CachingService.KeyBuilder" data-throw-if-not-resolved="false"></xref> to create the cache key of the wrapped object.
  remarks: >-
    <p>Use this class when you have objects that already implement cache key generation (through

    the <code>CacheKeyAttribute</code> aspect or a custom formatter) and want to use them as dependencies.</p>

    <p>Alternatively, you can use the <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.AddObjectDependency(Metalama.Patterns.Caching.ICachingService%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> and

    <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.InvalidateObject(Metalama.Patterns.Caching.ICachingService%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> extension methods to avoid creating wrapper objects.</p>
  example: []
