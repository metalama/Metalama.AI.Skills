  name: IInterceptionInfo
  nameWithType: IInterceptionInfo
  fullName: Metalama.Extensions.Interceptors.IInterceptionInfo
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Describes the interception that a template implements. A template reads it through the <code>meta.Interception</code> property.
  remarks: >-
    <p>

    The generated method is shared by the call sites that have the same template, arguments, tags, placement, granularity and signature. The

    <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.Granularity" data-throw-if-not-resolved="false"></xref> property decides which context of the call sites the template can read: the <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.CallingType" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.CallingMember" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.Caller" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Extensions.Interceptors.IInterceptionInfo.Source" data-throw-if-not-resolved="false"></xref> properties throw an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> when

    the granularity is too coarse. Information that differs between the call sites that share the method, for instance the line of the call, can also be passed to

    the template as an added parameter, through <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref> or

    <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.SetArgument(Metalama.Framework.Code.IParameter%2cMetalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>, which does not split the method.

    </p>

    <p>

    The template reads the generated method through the <code>meta.Target.Method</code> property. The generated method and its class are not visible

    through the members of the compilation, because they are added when the code is linked.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IInterceptionInfo : IMetaExtension
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IInterceptionInfo Inherits IMetaExtension
