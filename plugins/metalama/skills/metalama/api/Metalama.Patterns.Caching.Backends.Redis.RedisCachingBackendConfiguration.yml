- uid: Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.RunGarbageCollector
  commentId: P:Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.RunGarbageCollector
  id: RunGarbageCollector
  parent: Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration
  langs:
  - csharp
  - vb
  name: RunGarbageCollector
  nameWithType: RedisCachingBackendConfiguration.RunGarbageCollector
  fullName: Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.RunGarbageCollector
  type: Property
  assemblies:
  - Metalama.Patterns.Caching.Backends.Redis
  namespace: Metalama.Patterns.Caching.Backends.Redis
  summary: >-
    Gets or sets a value indicating whether the dependency garbage collector process should run while the caching back-end instance

    is alive. This property only makes sense when <xref href="Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.SupportsDependencies" data-throw-if-not-resolved="false"></xref> is set to <code>true</code>. The value of <xref href="Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.RunGarbageCollector" data-throw-if-not-resolved="false"></xref>

    is <code>false</code> by default. It is necessary to have at least one instance of the garbage collector active at any time. It is allowed but useless to

    have several concurrent instances of the garbage collector, but having a large number of them can hurt performance of the Redis server.

    The recommended approach to run the garbage collector is to deploy a separate application that only hosts this service. See <xref href="Metalama.Patterns.Caching.Backends.Redis.RedisCachingFactory.CreateRedisCacheDependencyGarbageCollector(Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration%2cSystem.IServiceProvider)" data-throw-if-not-resolved="false"></xref>

    for details.
  example: []
  syntax:
    content: public bool RunGarbageCollector { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property RunGarbageCollector As Boolean
  overload: Metalama.Patterns.Caching.Backends.Redis.RedisCachingBackendConfiguration.RunGarbageCollector*
