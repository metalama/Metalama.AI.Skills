  name: DependencyPropertyAttribute
  nameWithType: DependencyPropertyAttribute
  fullName: Metalama.Patterns.Wpf.DependencyPropertyAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    Aspect that transforms a C# automatic property into a WPF dependency property. When applied to an automatic property

    in a class derived from <xref href="System.Windows.DependencyObject" data-throw-if-not-resolved="false"></xref>, it generates the static <xref href="System.Windows.DependencyProperty" data-throw-if-not-resolved="false"></xref> field

    and replaces the property accessors to use <xref href="System.Windows.DependencyObject.GetValue(System.Windows.DependencyProperty)" data-throw-if-not-resolved="false"></xref> and <xref href="System.Windows.DependencyObject.SetValue(System.Windows.DependencyProperty%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>The aspect supports the following features:</p>

    <p>- <b>Default values</b>: Property initializers are used as the <xref href="System.Windows.PropertyMetadata.DefaultValue" data-throw-if-not-resolved="false"></xref> for the dependency property.</p>

    <p>- <b>Read-only properties</b>: Properties with a private setter are registered as read-only dependency properties.</p>

    <p>- <b>Validation</b>: A <code>ValidateFoo</code> method (where <code>Foo</code> is the property name) is automatically detected and called to validate values.</p>

    <p>- <b>Property changed callbacks</b>: An <code>OnFooChanged</code> method is automatically detected and called after property changes.</p>

    <p>- <b>Contract integration</b>: Contracts from <code>Metalama.Patterns.Contracts</code> (like <code>[NotNull]</code>) are enforced on the property.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property)]

      public sealed class DependencyPropertyAttribute : Attribute, IAspect<IProperty>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IProperty>, IHierarchicalOptionsProvider
    content.vb: >-
      <AttributeUsage(AttributeTargets.Property)>

      Public NotInheritable Class DependencyPropertyAttribute Inherits Attribute Implements IAspect(Of IProperty), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IProperty), IHierarchicalOptionsProvider
