  name: ITemplateInterception
  nameWithType: ITemplateInterception
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A method interception whose calls are redirected to a method synthesized from a template. Its methods set the options of the synthesized

    method. It is a complete interception, which the delegate given to <code>InterceptMethods</code> or to

    <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref> can return.
  remarks: >-
    The call sites whose synthesized methods have the same final signature, template, arguments, tags, placement and granularity share one

    synthesized method.
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface ITemplateInterception : IMethodInterception
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface ITemplateInterception Inherits IMethodInterception
