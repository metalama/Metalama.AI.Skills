- uid: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInStaticClass(System.String)
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInStaticClass(System.String)
  id: PlaceInStaticClass(System.String)
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: PlaceInStaticClass(string?)
  nameWithType: ITemplateInterception.PlaceInStaticClass(string?)
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInStaticClass(string?)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Synthesizes the method in an internal static class that Metalama generates in the project. It is the default placement, with the class

    <code>MetalamaInterceptors</code> of the global namespace.
  remarks: The method is internal. The generated class is not in the types of the compilation. A full name that is not valid is reported as LAMA1024.
  example: []
  syntax:
    content: ITemplateInterception PlaceInStaticClass(string? fullName = null)
    parameters:
    - id: fullName
      type: System.String
      description: >-
        The full name of the class, including its namespace, or <code>null</code> for the class <code>MetalamaInterceptors</code> of
                    the global namespace. The interceptions that give the same full name synthesize their methods in the same class. The namespace is created
                    when it does not exist, and a numeric suffix is added to the name of the class when a type of that name already exists.
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function PlaceInStaticClass(fullName As String = Nothing) As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInStaticClass*
  nameWithType.vb: ITemplateInterception.PlaceInStaticClass(String)
  fullName.vb: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInStaticClass(String)
  name.vb: PlaceInStaticClass(String)
- uid: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType
  id: PlaceInCallingType
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: PlaceInCallingType()
  nameWithType: ITemplateInterception.PlaceInCallingType()
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType()
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Synthesizes the method in the innermost type that contains the call site.
  remarks: >-
    <p>

    The method is private. The type does not need to be <code>partial</code>.

    </p>

    <p>

    The method is static by default. When the intercepted method is a protected method of a base type of the calling type, the method is an

    instance method without a receiver parameter: the call site calls it on its receiver, and <code>meta.Proceed()</code> calls the intercepted

    method on <code>this</code>. A delegate given to <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> can choose this form for other methods. See

    <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    A call site in top-level statements cannot use this placement, because the type that contains it is implicit. A call site that cannot use

    it is reported as LAMA1024. In <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>, use <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInCallingType" data-throw-if-not-resolved="false"></xref> to

    choose another placement for such a site.

    </p>
  example: []
  syntax:
    content: ITemplateInterception PlaceInCallingType()
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function PlaceInCallingType() As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType*
- uid: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInType(Metalama.Framework.Code.INamedType)
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInType(Metalama.Framework.Code.INamedType)
  id: PlaceInType(Metalama.Framework.Code.INamedType)
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: PlaceInType(INamedType)
  nameWithType: ITemplateInterception.PlaceInType(INamedType)
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInType(Metalama.Framework.Code.INamedType)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Synthesizes the method in a given type of the current project.
  remarks: >-
    <p>

    The method is private when the type contains the call site, private protected when the type is a base type of the calling type, and

    internal otherwise. The type does not need to be <code>partial</code>.

    </p>

    <p>

    A call site that cannot use the type is reported as LAMA1024. In <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>, use

    <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInType(Metalama.Framework.Code.INamedType)" data-throw-if-not-resolved="false"></xref> to choose another placement for such a site.

    </p>
  example: []
  syntax:
    content: ITemplateInterception PlaceInType(INamedType type)
    parameters:
    - id: type
      type: Metalama.Framework.Code.INamedType
      description: The type. It must be accessible from the call sites.
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function PlaceInType(type As INamedType) As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInType*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">type</code> is <code>null</code>.
