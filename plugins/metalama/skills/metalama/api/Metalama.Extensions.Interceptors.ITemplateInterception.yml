- uid: Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)
  id: WithArgs(System.Object)
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: WithArgs(object)
  nameWithType: ITemplateInterception.WithArgs(object)
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(object)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Sets the arguments of the template.
  remarks: The arguments are compared by value to decide which call sites share the synthesized method.
  example: []
  syntax:
    content: ITemplateInterception WithArgs(object args)
    parameters:
    - id: args
      type: System.Object
      description: >-
        An anonymous object, an <xref href="System.Collections.Generic.IReadOnlyDictionary%602" data-throw-if-not-resolved="false"></xref> of names and values, or an
                    <xref href="Metalama.Framework.Aspects.IObjectReader" data-throw-if-not-resolved="false"></xref>. A property whose name is a compile-time parameter or type parameter of the template gives the value of that
                    parameter. A property whose name is a run-time parameter of the template adds a parameter of that name and type to the synthesized method,
                    and gives the value that each call site passes to it. A property whose name is a parameter that a <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref> delegate adds
                    gives the value of that parameter. Such a value takes any form that <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref> accepts.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function WithArgs(args As Object) As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">args</code> is <code>null</code>.
  nameWithType.vb: ITemplateInterception.WithArgs(Object)
  fullName.vb: Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(Object)
  name.vb: WithArgs(Object)
