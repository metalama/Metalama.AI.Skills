- uid: Metalama.Extensions.Interceptors.ITemplateInterception.WithGranularity(Metalama.Extensions.Interceptors.InterceptorGranularity)
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.WithGranularity(Metalama.Extensions.Interceptors.InterceptorGranularity)
  id: WithGranularity(Metalama.Extensions.Interceptors.InterceptorGranularity)
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: WithGranularity(InterceptorGranularity)
  nameWithType: ITemplateInterception.WithGranularity(InterceptorGranularity)
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.WithGranularity(Metalama.Extensions.Interceptors.InterceptorGranularity)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Sets what the template depends on, and therefore which call sites share the synthesized method. The default value is

    <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Global" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    The engine does not detect what the template depends on. When several call sites share the method, the template is expanded once, for

    the representative call site and with its aspect instance, as described in <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity" data-throw-if-not-resolved="false"></xref>. A template that depends

    on the state of its aspect instance must include <xref href="Metalama.Extensions.Interceptors.InterceptorGranularity.Owner" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: ITemplateInterception WithGranularity(InterceptorGranularity granularity)
    parameters:
    - id: granularity
      type: Metalama.Extensions.Interceptors.InterceptorGranularity
      description: The granularity.
    return:
      type: Metalama.Extensions.Interceptors.ITemplateInterception
    content.vb: Function WithGranularity(granularity As InterceptorGranularity) As ITemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.WithGranularity*
- uid: Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action{Metalama.Extensions.Interceptors.IInterceptorMethodBuilder})
  commentId: M:Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action{Metalama.Extensions.Interceptors.IInterceptorMethodBuilder})
  id: Configure(System.Action{Metalama.Extensions.Interceptors.IInterceptorMethodBuilder})
  parent: Metalama.Extensions.Interceptors.ITemplateInterception
  langs:
  - csharp
  - vb
  name: Configure(Action<IInterceptorMethodBuilder>)
  nameWithType: ITemplateInterception.Configure(Action<IInterceptorMethodBuilder>)
  fullName: Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action<Metalama.Extensions.Interceptors.IInterceptorMethodBuilder>)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Adds a delegate that shapes the synthesized method for each call site, for instance to rename it, to change the type of a parameter, or to

    add a parameter and give its value at the call site.
  example: []
  syntax:
    content: IConfiguredTemplateInterception Configure(Action<IInterceptorMethodBuilder> configure)
    parameters:
    - id: configure
      type: System.Action{Metalama.Extensions.Interceptors.IInterceptorMethodBuilder}
      description: >-
        The delegate. It receives an <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder" data-throw-if-not-resolved="false"></xref>, whose rules it describes. It is stored with
                    the registration, so it must not capture a declaration or a compilation. The delegates given by several calls run in the order of the
                    calls.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.IConfiguredTemplateInterception
      description: >-
        An <xref href="Metalama.Extensions.Interceptors.IConfiguredTemplateInterception" data-throw-if-not-resolved="false"></xref>, which only allows further calls of <code>Configure</code>. The other methods of this
                    interface must therefore be called before this method, because they determine the signature that the delegate receives.
    content.vb: Function Configure(configure As Action(Of IInterceptorMethodBuilder)) As IConfiguredTemplateInterception
  overload: Metalama.Extensions.Interceptors.ITemplateInterception.Configure*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">configure</code> is <code>null</code>.
  nameWithType.vb: ITemplateInterception.Configure(Action(Of IInterceptorMethodBuilder))
  fullName.vb: Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action(Of Metalama.Extensions.Interceptors.IInterceptorMethodBuilder))
  name.vb: Configure(Action(Of IInterceptorMethodBuilder))
