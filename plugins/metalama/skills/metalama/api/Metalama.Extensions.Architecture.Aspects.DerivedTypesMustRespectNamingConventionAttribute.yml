  type: Class
  assemblies:
  - Metalama.Extensions.Architecture
  namespace: Metalama.Extensions.Architecture.Aspects
  summary: >-
    Aspect that, when applied to a type, reports a warning for any derived type that does not respect a naming convention

    given as a star pattern, i.e. a string where the <code>*</code> character matches any sequence of characters.
  example: []
  syntax:
    content: >-
      [CompileTime]

      public class DerivedTypesMustRespectNamingConventionAttribute : DerivedTypesMustRespectRegexNamingConventionAttribute, IAspect<INamedType>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<INamedType>
