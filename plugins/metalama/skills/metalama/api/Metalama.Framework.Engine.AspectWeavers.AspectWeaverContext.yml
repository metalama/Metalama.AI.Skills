- uid: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.GeneratedCodeAnnotation
  commentId: P:Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.GeneratedCodeAnnotation
  id: GeneratedCodeAnnotation
  parent: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext
  langs:
  - csharp
  - vb
  name: GeneratedCodeAnnotation
  nameWithType: AspectWeaverContext.GeneratedCodeAnnotation
  fullName: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.GeneratedCodeAnnotation
  type: Property
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.AspectWeavers
  summary: Gets the <xref href="Microsoft.CodeAnalysis.SyntaxAnnotation" data-throw-if-not-resolved="false"></xref> that must be applied to all code generated by the weaver.
  remarks: >-
    <p>Apply this annotation to generated syntax nodes using <xref href="Metalama.Framework.Engine.Formatting.FormattingAnnotations.WithGeneratedCodeAnnotation%60%601(%60%600%2cMicrosoft.CodeAnalysis.SyntaxAnnotation)" data-throw-if-not-resolved="false"></xref>.</p>

    <p>This annotation enables Metalama to distinguish generated code from source code for formatting, diff views, and IDE features.</p>

    <p>For source code nodes within generated code, use <xref href="Metalama.Framework.Engine.Formatting.FormattingAnnotations.WithSourceCodeAnnotation%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> instead.</p>
  example: []
  syntax:
    content: public SyntaxAnnotation GeneratedCodeAnnotation { get; }
    parameters: []
    return:
      type: Microsoft.CodeAnalysis.SyntaxAnnotation
    content.vb: Public ReadOnly Property GeneratedCodeAnnotation As SyntaxAnnotation
  overload: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.GeneratedCodeAnnotation*
