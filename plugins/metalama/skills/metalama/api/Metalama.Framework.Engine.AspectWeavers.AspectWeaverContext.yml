- uid: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.Compilation
  commentId: P:Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.Compilation
  id: Compilation
  parent: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext
  langs:
