  type: Property
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.AspectWeavers
  summary: Gets the dictionary of aspect instances that must be processed, keyed by their target <xref href="Microsoft.CodeAnalysis.ISymbol" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Iterate over this dictionary to process each aspect instance. Use the <xref href="Microsoft.CodeAnalysis.ISymbol" data-throw-if-not-resolved="false"></xref> key to locate
        the target declaration's syntax via <xref href="Microsoft.CodeAnalysis.ISymbol.DeclaringSyntaxReferences" data-throw-if-not-resolved="false"></xref>.</p>
    <p>To map the Metalama code model to an <xref href="Microsoft.CodeAnalysis.ISymbol" data-throw-if-not-resolved="false"></xref>, use extension methods in <xref href="Metalama.Framework.Engine.CodeModel.SymbolExtensions" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: public IReadOnlyDictionary<ISymbol, IAspectInstance> AspectInstances { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyDictionary{Microsoft.CodeAnalysis.ISymbol,Metalama.Framework.Aspects.IAspectInstance}
    content.vb: Public ReadOnly Property AspectInstances As IReadOnlyDictionary(Of ISymbol, IAspectInstance)
  overload: Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.AspectInstances*
