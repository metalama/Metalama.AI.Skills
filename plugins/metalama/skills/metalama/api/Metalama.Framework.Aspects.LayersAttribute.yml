  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Custom attribute that, when applied to an aspect class, means that this aspect class uses several

    layers, and defines the name and the order of execution of these layers. In multi-aspect layers,

    the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method is called several times, once for each layer.

    The current layer is exposed in the <xref href="Metalama.Framework.Aspects.IAspectBuilder.Layer" data-throw-if-not-resolved="false"></xref> property.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class)]

      public sealed class LayersAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class)>

      Public NotInheritable Class LayersAttribute Inherits Attribute
