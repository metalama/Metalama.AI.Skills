  summary: >-
    A base class for aspects that can be applied as custom attributes. Derive from this class or a specialized

    aspect base class to create aspects that transform or validate code at compile time.
  remarks: >-
    <p>
        This class derives from <xref href="System.Attribute" data-throw-if-not-resolved="false"></xref>, allowing aspects to be applied to code elements using C# attribute syntax
        such as <code>[MyAspect]</code>. Aspect classes must also implement a specific generic instance of the <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>
        interface, or derive from a specialized base class like <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.MethodAspect" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Aspects.FieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.EventAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.ConstructorAspect" data-throw-if-not-resolved="false"></xref>, or <xref href="Metalama.Framework.Aspects.CompilationAspect" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
      <b>Specialized base classes for common scenarios:</b> Instead of implementing <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> yourself,
        consider using specialized base classes that already implement <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> and provide simpler approaches based on virtual methods.
        For overriding members, use <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.OverrideEventAspect" data-throw-if-not-resolved="false"></xref>,
        or <xref href="Metalama.Framework.Aspects.ContractAspect" data-throw-if-not-resolved="false"></xref>. For aspects that target specific declaration kinds, use <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.MethodAspect" data-throw-if-not-resolved="false"></xref>, or similar.
        Derive directly from <xref href="Metalama.Framework.Aspects.Aspect" data-throw-if-not-resolved="false"></xref> only when you need a custom attribute applicable to multiple declaration kinds (e.g., both methods and fields).
        </p>
    <p>
        This class is a convenience base class. The aspect framework primarily requires implementation of the <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref> interface.
        You can create aspects that don't derive from <xref href="System.Attribute" data-throw-if-not-resolved="false"></xref> if you only apply them programmatically via fabrics.
        </p>
    <p>
      <b>How to create an aspect:</b>
    </p>

    <ol><li>Derive from a specialized aspect class (e.g., <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref>) or this base class</li><li>Override the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method to add advice, child aspects, or validations (not needed for override aspects)</li><li>Optionally override <xref href="Metalama.Framework.Eligibility.IEligible%601.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> to define where the aspect can be applied</li><li>Define template methods and annotate them with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref> for code generation</li><li>Optionally annotate the aspect class with <xref href="Metalama.Framework.Aspects.LayersAttribute" data-throw-if-not-resolved="false"></xref> to split <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> into multiple execution layers</li></ol>
  example: []
  syntax:
    content: 'public abstract class Aspect : Attribute, IAspect, ICompileTimeSerializable, ITemplateProvider'
    content.vb: Public MustInherit Class Aspect Inherits Attribute Implements IAspect, ICompileTimeSerializable, ITemplateProvider
