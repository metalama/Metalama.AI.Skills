- uid: Metalama.Framework.Options.IncrementalHashSet`1.ApplyChanges(Metalama.Framework.Options.IncrementalHashSet{`0},Metalama.Framework.Options.ApplyChangesContext@)
  commentId: M:Metalama.Framework.Options.IncrementalHashSet`1.ApplyChanges(Metalama.Framework.Options.IncrementalHashSet{`0},Metalama.Framework.Options.ApplyChangesContext@)
  id: ApplyChanges(Metalama.Framework.Options.IncrementalHashSet{`0},Metalama.Framework.Options.ApplyChangesContext@)
  parent: Metalama.Framework.Options.IncrementalHashSet`1
  langs:
  - csharp
  - vb
  name: ApplyChanges(IncrementalHashSet<T>, in ApplyChangesContext)
  nameWithType: IncrementalHashSet<T>.ApplyChanges(IncrementalHashSet<T>, in ApplyChangesContext)
  fullName: Metalama.Framework.Options.IncrementalHashSet<T>.ApplyChanges(Metalama.Framework.Options.IncrementalHashSet<T>, in Metalama.Framework.Options.ApplyChangesContext)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: Merges the current collection layer with another collection layer and returns the result.
  remarks: >-
    If <code class="paramref">other</code> contains a clear operation, it takes precedence and the result contains only the operations from <code class="paramref">other</code>.

    Otherwise, operations from both layers are combined. For any item that appears in both layers, the operation from <code class="paramref">other</code>

    takes precedence (i.e., if the current layer adds an item and <code class="paramref">other</code> removes it, the final result will not contain the item).
  example: []
  syntax:
    content: public IncrementalHashSet<T> ApplyChanges(IncrementalHashSet<T> other, in ApplyChangesContext context)
    parameters:
    - id: other
      type: Metalama.Framework.Options.IncrementalHashSet`1
      description: The collection layer to merge with the current layer.
    - id: context
      type: Metalama.Framework.Options.ApplyChangesContext
      description: The context of the merge operation.
    return:
      type: Metalama.Framework.Options.IncrementalHashSet`1
      description: A new <xref href="Metalama.Framework.Options.IncrementalHashSet%601" data-throw-if-not-resolved="false"></xref> representing the merged result.
    content.vb: Public Function ApplyChanges(other As IncrementalHashSet(Of T), context As ApplyChangesContext) As IncrementalHashSet(Of T)
