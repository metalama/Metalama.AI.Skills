  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    does not match a given regular expression. If the target is a nullable type, null strings are accepted and do not

    throw an exception.
  remarks: >-
    <p>To create a reusable regular expression contract, derive from <xref href="Metalama.Patterns.Contracts.RegularExpressionBaseAttribute" data-throw-if-not-resolved="false"></xref>

    and override <xref href="Metalama.Patterns.Contracts.RegularExpressionBaseAttribute.GetRegex" data-throw-if-not-resolved="false"></xref>.</p>
