  summary: A base class for aspects that target generic type parameter declarations.
  remarks: >-
    <p>
        This class provides a convenient base for creating generic type parameter aspects by implementing <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>
        with <code>T</code> set to <xref href="Metalama.Framework.Code.ITypeParameter" data-throw-if-not-resolved="false"></xref>. Derived classes override <xref href="Metalama.Framework.Aspects.TypeParameterAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.ITypeParameter%7d)" data-throw-if-not-resolved="false"></xref>
        to add advice (such as adding constraints, attributes, or validation) to the target generic type parameter.
        </p>
    <p>
        This is a convenience base class. The aspect framework primarily requires implementation of <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.GenericParameter)]

      public abstract class TypeParameterAspect : Aspect, IAspect<ITypeParameter>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<ITypeParameter>
    content.vb: >-
      <AttributeUsage(AttributeTargets.GenericParameter)>

      Public MustInherit Class TypeParameterAspect Inherits Aspect Implements IAspect(Of ITypeParameter), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of ITypeParameter)
