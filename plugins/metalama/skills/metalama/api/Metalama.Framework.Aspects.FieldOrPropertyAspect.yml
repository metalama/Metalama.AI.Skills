  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: A base class for aspects that target both field and property declarations uniformly.
  remarks: >-
    <p>
        This class provides a convenient base for creating aspects that apply to both fields and properties by implementing
        <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref> with <code>T</code> set to <xref href="Metalama.Framework.Code.IFieldOrProperty" data-throw-if-not-resolved="false"></xref>. Derived classes override
        <xref href="Metalama.Framework.Aspects.FieldOrPropertyAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.IFieldOrProperty%7d)" data-throw-if-not-resolved="false"></xref> to add advice (such as overriding accessors, adding contracts, or introducing attributes)
        to the target field or property.
        </p>
    <p>
        For aspects that specifically override field or property accessors with templates, consider deriving from
        <xref href="Metalama.Framework.Aspects.OverrideFieldOrPropertyAspect" data-throw-if-not-resolved="false"></xref> instead, which provides a simpler template-based API. For aspects
        that need to distinguish between fields and properties, use <xref href="Metalama.Framework.Aspects.FieldAspect" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Aspects.PropertyAspect" data-throw-if-not-resolved="false"></xref>
        separately.
        </p>
    <p>
        Aspects can only be applied to run-time code, never to compile-time types or their members. This eligibility
        restriction is enforced by the <xref href="Metalama.Framework.Aspects.FieldOrPropertyAspect.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7bMetalama.Framework.Code.IFieldOrProperty%7d)" data-throw-if-not-resolved="false"></xref> method.
        </p>
    <p>
        This is a convenience base class. The aspect framework primarily requires implementation of <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property|AttributeTargets.Field)]

      public abstract class FieldOrPropertyAspect : Aspect, IAspect<IFieldOrProperty>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IFieldOrProperty>
    content.vb: >-
      <AttributeUsage(AttributeTargets.PropertyOrAttributeTargets.Field)>

      Public MustInherit Class FieldOrPropertyAspect Inherits Aspect Implements IAspect(Of IFieldOrProperty), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IFieldOrProperty)
