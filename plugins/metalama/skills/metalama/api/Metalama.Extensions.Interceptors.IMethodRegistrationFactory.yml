  langs:
  - csharp
  - vb
  name: IMethodRegistrationFactory
  nameWithType: IMethodRegistrationFactory
  fullName: Metalama.Extensions.Interceptors.IMethodRegistrationFactory
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Chooses how the selected calls are intercepted by a result that applies to every call site: redirected to an existing method, or redirected

    to a method synthesized from a template. It is the base of <xref href="Metalama.Extensions.Interceptors.IMethodSelection" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    A result created by this interface is a registration, which is kept across compilations. Its arguments must therefore be durable, and they are

    resolved in the compilation of each call site. <xref href="Metalama.Extensions.Interceptors.IMethodResultFactory" data-throw-if-not-resolved="false"></xref> is the counterpart of this interface for the result of one

    call site, in the delegate given to <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>, whose arguments can be any code model value.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IMethodRegistrationFactory
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IMethodRegistrationFactory
  extensionMethods:
