  nameWithType: IFlashtraceLogger
  fullName: Flashtrace.IFlashtraceLogger
  type: Interface
  assemblies:
  - Flashtrace
  namespace: Flashtrace
  summary: Abstraction of the Logging facility, through which other components emit their log records.
  remarks: >-
    <p>If you want to implement this interface, you should also implement the <xref href="Flashtrace.IFlashtraceRoleLoggerFactory" data-throw-if-not-resolved="false"></xref> interface

    and register it to the <xref href="System.IServiceProvider" data-throw-if-not-resolved="false"></xref> or, if you use the dependency mechanism, to <xref href="Flashtrace.FlashtraceSourceFactory" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
