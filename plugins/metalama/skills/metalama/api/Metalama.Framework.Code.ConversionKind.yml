- uid: Metalama.Framework.Code.ConversionKind.Default
  commentId: F:Metalama.Framework.Code.ConversionKind.Default
  id: Default
  parent: Metalama.Framework.Code.ConversionKind
  langs:
  - csharp
  - vb
  name: Default
  nameWithType: ConversionKind.Default
  fullName: Metalama.Framework.Code.ConversionKind.Default
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Accepts any value that is type-compatible, including boxing conversions, but excluding user-defined implicit operators. This corresponds to the behavior of C# <code>is</code> operator.
  example: []
  syntax:
    content: Default = 0
    return:
      type: Metalama.Framework.Code.ConversionKind
- uid: Metalama.Framework.Code.ConversionKind.Reference
  commentId: F:Metalama.Framework.Code.ConversionKind.Reference
