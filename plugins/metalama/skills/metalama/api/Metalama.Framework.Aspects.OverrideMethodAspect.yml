- uid: Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod
  commentId: M:Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod
  id: OverrideAsyncMethod
  parent: Metalama.Framework.Aspects.OverrideMethodAspect
  langs:
  - csharp
  - vb
  name: OverrideAsyncMethod()
  nameWithType: OverrideMethodAspect.OverrideAsyncMethod()
  fullName: Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Template for overriding asynchronous methods.
  remarks: >-
    <p>
        By default, this template is selected for methods with the <code>async</code> modifier. When <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable" data-throw-if-not-resolved="false"></xref>
        is set to <code>true</code>, it applies to all methods returning an awaitable type (<code>Task</code>, <code>ValueTask</code>, <code>IAsyncEnumerable</code>,
        <code>IAsyncEnumerator</code>).
        </p>
    <p>
        If not overridden in a derived class, <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> is used instead. This template is marked with
        <code>[Template(IsEmpty = true)]</code>, making it optional to override.
        </p>
  example: []
  syntax:
    content: >-
      [Template(IsEmpty = true)]

      public virtual Task<dynamic?> OverrideAsyncMethod()
    return:
      type: System.Threading.Tasks.Task{System.Object}
      description: A <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> representing the asynchronous operation.
    content.vb: >-
      <Template(IsEmpty:=True)>

      Public Overridable Function OverrideAsyncMethod() As Task(Of Object)
  overload: Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod*
  attributes:
  - type: Metalama.Framework.Aspects.TemplateAttribute
    ctor: Metalama.Framework.Aspects.TemplateAttribute.#ctor
    arguments: []
    namedArguments:
    - name: IsEmpty
      type: System.Boolean
      value: true
- uid: Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumerableMethod
