  nameWithType: OverrideMethodAspect.OverrideEnumerableMethod()
  fullName: Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumerableMethod()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Template of the new method implementation for methods returning <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>. By default, this template is used for methods using the <code>yield</code> statement.

    When <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> is <code>true</code>, this template is used for all methods returning <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>.

    If this template is not overridden, <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> is used instead.
  example: []
  syntax:
    content: >-
      [Template(IsEmpty = true)]

      public virtual IEnumerable<dynamic?> OverrideEnumerableMethod()
    return:
      type: System.Collections.Generic.IEnumerable{System.Object}
    content.vb: >-
      <Template(IsEmpty:=True)>

      Public Overridable Function OverrideEnumerableMethod() As IEnumerable(Of Object)
