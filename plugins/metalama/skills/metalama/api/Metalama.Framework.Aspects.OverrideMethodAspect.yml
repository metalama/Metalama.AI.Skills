    When <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> is <code>true</code>, this template is used for all methods returning <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref>.

    If this template is not overridden, <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> is used instead.
