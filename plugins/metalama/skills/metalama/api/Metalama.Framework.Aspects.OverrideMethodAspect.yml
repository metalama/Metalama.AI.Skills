- uid: Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable
  commentId: P:Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable
  id: UseEnumerableTemplateForAnyEnumerable
  parent: Metalama.Framework.Aspects.OverrideMethodAspect
  langs:
  - csharp
  - vb
  name: UseEnumerableTemplateForAnyEnumerable
  nameWithType: OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable
  fullName: Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets a value indicating whether enumerable templates should be selected based on return type rather than the <code>yield</code> modifier.
  remarks: >-
    <p>
        When <code>false</code> (default), the <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumerableMethod" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumeratorMethod" data-throw-if-not-resolved="false"></xref> templates
        are used only for methods that use the <code>yield</code> statement.
        </p>
    <p>
        When <code>true</code>, these templates are used for <i>all</i> methods returning <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref>
        or <xref href="System.Collections.Generic.IEnumerator%601" data-throw-if-not-resolved="false"></xref>, regardless of whether they use <code>yield</code>.
        </p>
    <p>
        This property is useful when you want to handle all methods returning enumerable types uniformly, even if they don't use iterators.
        </p>
  example: []
  syntax:
    content: protected bool UseEnumerableTemplateForAnyEnumerable { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Protected Property UseEnumerableTemplateForAnyEnumerable As Boolean
  overload: Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable*
- uid: Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable
  commentId: P:Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable
  id: UseAsyncTemplateForAnyAwaitable
  parent: Metalama.Framework.Aspects.OverrideMethodAspect
  langs:
  - csharp
  - vb
  name: UseAsyncTemplateForAnyAwaitable
  nameWithType: OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable
  fullName: Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets a value indicating whether async templates should be selected based on return type rather than the <code>async</code> modifier.
  remarks: >-
    <p>
        When <code>false</code> (default), the <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod" data-throw-if-not-resolved="false"></xref> template is used only for methods with the <code>async</code> modifier.
        </p>
    <p>
        When <code>true</code>, this template is used for <i>all</i> methods returning awaitable types (<xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>,
        <code>ValueTask</code>, <code>IAsyncEnumerable</code>, <code>IAsyncEnumerator</code>), regardless of the <code>async</code> modifier.
        </p>
    <p>
        This property is useful when you want to handle all methods returning awaitable types uniformly, even if they're not marked <code>async</code>.
        </p>
  example: []
  syntax:
    content: protected bool UseAsyncTemplateForAnyAwaitable { get; init; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Protected Property UseAsyncTemplateForAnyAwaitable As Boolean
  overload: Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable*
