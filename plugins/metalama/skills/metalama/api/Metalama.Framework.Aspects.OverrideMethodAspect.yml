  name: OverrideMethodAspect
  nameWithType: OverrideMethodAspect
  fullName: Metalama.Framework.Aspects.OverrideMethodAspect
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: A base class for aspects that override method implementations using T# templates.
  remarks: >-
    <p>
        This class simplifies creating aspects that replace method implementations using the decorator pattern.
        Derived classes must implement the <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> template method, which is a T# template that executes
        at compile-time to generate the new method implementation. Use <code>meta.Proceed()</code> within the template to invoke
        the original method implementation, and <code>meta.Target.Method</code> to access method metadata.
        </p>
    <p>
        This aspect automatically selects the appropriate template based on the target method's characteristics:
        <ul><li><xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideAsyncMethod" data-throw-if-not-resolved="false"></xref> for <code>async</code> methods (or all awaitable types if <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable" data-throw-if-not-resolved="false"></xref> is <code>true</code>)</li><li><xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumerableMethod" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumeratorMethod" data-throw-if-not-resolved="false"></xref> for iterator methods using <code>yield</code> (or all enumerable types if <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref> is <code>true</code>)</li><li><code>OverrideAsyncEnumerableMethod</code> or <code>OverrideAsyncEnumeratorMethod</code> for async iterator methods (or all async enumerable types if both properties are <code>true</code>)</li><li><xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> for all other methods</li></ul>
        If specialized templates are not overridden, <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> is used as the fallback.
        </p>
    <p>
      <strong>Important:</strong> When the default <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideMethod" data-throw-if-not-resolved="false"></xref> template is applied to iterator methods,
        the stream is buffered into a <code>List&lt;T&gt;</code> using <xref href="Metalama.Framework.RunTime.RunTimeAspectHelper.Buffer(System.Collections.IEnumerable)" data-throw-if-not-resolved="false"></xref>.
        For long-running or infinite streams, implement the specific iterator templates (<xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumerableMethod" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.OverrideEnumeratorMethod" data-throw-if-not-resolved="false"></xref>) to avoid buffering and support streaming.
        </p>
    <p>
        The properties <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseAsyncTemplateForAnyAwaitable" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Aspects.OverrideMethodAspect.UseEnumerableTemplateForAnyEnumerable" data-throw-if-not-resolved="false"></xref>
        control template selection strategy. By default (<code>false</code>), templates are selected based on method modifiers
        (<code>async</code>, <code>yield</code>). When set to <code>true</code>, selection is based solely on return type, which is useful
        when you need to handle all methods of certain return types consistently.
        </p>
    <p>
        For overriding multiple methods from a single aspect or for more control, use
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.Override(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IMethod%7d%2cMetalama.Framework.Advising.MethodTemplateSelector%40%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> from your
        <code>BuildAspect</code> method instead of deriving from this class.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      public abstract class OverrideMethodAspect : MethodAspect, IAspect<IMethod>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IMethod>
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method)>

      Public MustInherit Class OverrideMethodAspect Inherits MethodAspect Implements IAspect(Of IMethod), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of IMethod)
