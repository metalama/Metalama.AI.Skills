  summary: >-
    A utility class that makes it easy to report diagnostics from code queries in different environments.

    The default implementation writes messages to the console using the <xref href="Metalama.Framework.Workspaces.DiagnosticReporter.ReportToConsole(System.Collections.Generic.IReadOnlyList%7bMetalama.Framework.Introspection.IIntrospectionDiagnostic%7d)" data-throw-if-not-resolved="false"></xref> method.

    The action can be changed by setting the <xref href="Metalama.Framework.Workspaces.DiagnosticReporter.ReportAction" data-throw-if-not-resolved="false"></xref> property.
