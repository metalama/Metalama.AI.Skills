  name: IUnionBuilder
  nameWithType: IUnionBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Allows to complete the construction of a union that has been created by the <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceUnion(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamespaceOrNamedType%7d%2cSystem.String%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IUnionBuilder%7d%2cMetalama.Framework.Aspects.OverrideStrategy)" data-throw-if-not-resolved="false"></xref> advice.
  remarks: >-
    <p>
        The union is written with the <code>union</code> keyword. The language applies the restrictions on the members of a
        union to that form, so an instance field, an automatic property and a field-like event may not be introduced
        into it.
        </p>
    <p>
        A union requires at least one case, so an advice whose callback adds none reports an error.
        </p>
    <p>
        The members that the compiler synthesizes for a union, which are one constructor per case and the <code>Value</code>
        property, are not set through this interface. They are created by the advice and are read through
        <xref href="Metalama.Framework.Code.INamedType.Facets" data-throw-if-not-resolved="false"></xref> on the introduced type.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IUnionBuilder : INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, INamedType, IType, IEquatable<IType>, IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>, IEquatable<INamedType>
    content.vb: >-
      <InternalImplement>

      Public Interface IUnionBuilder Inherits INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, INamedType, IType, IEquatable(Of IType), IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration), IEquatable(Of INamedType)
