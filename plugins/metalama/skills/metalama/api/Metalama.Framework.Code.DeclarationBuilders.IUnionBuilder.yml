  id: Cases
  parent: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder
  langs:
  - csharp
  - vb
  name: Cases
  nameWithType: IUnionBuilder.Cases
  fullName: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder.Cases
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Gets the case types that have been added so far, in the order in which they were added.
  remarks: >-
    <p>
        The list holds types and not cases, because a case of a union under construction is fully described by its
        type. <xref href="Metalama.Framework.Code.Types.IUnionCase" data-throw-if-not-resolved="false"></xref>, which the introduced type reports, carries the
        index and the creation member in addition, and neither exists while the union is being built.
        </p>
  example: []
