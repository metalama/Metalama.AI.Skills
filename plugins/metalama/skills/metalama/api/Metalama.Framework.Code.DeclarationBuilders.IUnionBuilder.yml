- uid: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder.AddCase(Metalama.Framework.Code.IType)
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder.AddCase(Metalama.Framework.Code.IType)
  id: AddCase(Metalama.Framework.Code.IType)
  parent: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder
