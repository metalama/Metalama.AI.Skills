  name: AddCase(IType)
  nameWithType: IUnionBuilder.AddCase(IType)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder.AddCase(Metalama.Framework.Code.IType)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Adds a case to the union.
  remarks: >-
    <p>
        The compiler reports the case types of a union as a set, so adding a case whose type is already a case of
        this union throws an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> rather than declaring a second case.
        </p>
    <p>
        The type of a case is an ordinary type declared elsewhere, and the union declares no type itself.
        </p>
  example: []
  syntax:
    content: void AddCase(IType caseType)
    parameters:
    - id: caseType
      type: Metalama.Framework.Code.IType
      description: The type of the case.
    content.vb: Sub AddCase(caseType As IType)
  overload: Metalama.Framework.Code.DeclarationBuilders.IUnionBuilder.AddCase*
