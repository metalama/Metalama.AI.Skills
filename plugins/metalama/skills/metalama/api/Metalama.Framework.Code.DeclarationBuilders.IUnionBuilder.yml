    content: IReadOnlyList<IType> Cases { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyList{Metalama.Framework.Code.IType}
    content.vb: ReadOnly Property Cases As IReadOnlyList(Of IType)
