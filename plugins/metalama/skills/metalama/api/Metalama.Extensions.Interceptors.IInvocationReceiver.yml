  summary: 'Describes the receiver written at a site: the object on which the method is called or from which the method group is taken.'
  remarks: >-
    The object has the lifetime of the <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext" data-throw-if-not-resolved="false"></xref> that exposes it, so it must not be stored after

    the delegate that received the context returns.
