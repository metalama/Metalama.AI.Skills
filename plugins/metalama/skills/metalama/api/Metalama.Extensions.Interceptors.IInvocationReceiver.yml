- uid: Metalama.Extensions.Interceptors.IInvocationReceiver.Expression
  commentId: P:Metalama.Extensions.Interceptors.IInvocationReceiver.Expression
  id: Expression
  parent: Metalama.Extensions.Interceptors.IInvocationReceiver
  langs:
  - csharp
  - vb
  name: Expression
  nameWithType: IInvocationReceiver.Expression
  fullName: Metalama.Extensions.Interceptors.IInvocationReceiver.Expression
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the receiver expression written at the site, for inspection only, or <code>null</code> when the intercepted method is static or the

    receiver is implicit. For a classic extension method called in reduced form, the receiver is the first element of

    <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext.Arguments" data-throw-if-not-resolved="false"></xref>, and this property is <code>null</code>. For a conditional access <code>a?.M()</code>, it is the

    expression <code>a</code>. For a method-reference site <code>obj.M</code>, it is <code>obj</code>, which C# evaluates when the delegate is created.
  remarks: >-
    The value is an <xref href="Metalama.Framework.Code.ISourceExpression" data-throw-if-not-resolved="false"></xref>. Its type and its constant value can be read. The Roslyn syntax is available through

    the SDK method <code>SourceExpressionExtensions.GetSourceSyntax</code>. The expression cannot be emitted in generated code (LAMA0297), because

    the site already evaluates it. The type of the expression is the type of the written receiver, which differs from <xref href="Metalama.Extensions.Interceptors.IInvocationReceiver.Type" data-throw-if-not-resolved="false"></xref> in a

    conditional access: in <code>a?.M()</code> with a nullable value type, <code>a</code> has the nullable type.
  example: []
  syntax:
    content: IExpression? Expression { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IExpression
    content.vb: ReadOnly Property Expression As IExpression
  overload: Metalama.Extensions.Interceptors.IInvocationReceiver.Expression*
