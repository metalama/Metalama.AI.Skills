  fullName: Metalama.Patterns.Caching.Implementation.IWorkItemDispatcher
  type: Interface
  assemblies:
  - Metalama.Patterns.Caching.Backend
  namespace: Metalama.Patterns.Caching.Implementation
  summary: Dispatches a work item for execution outside of the calling thread.
  remarks: >-
    <p>

    The caching backends dispatch every event and every background operation through this interface. The default

    implementation is <xref href="Metalama.Patterns.Caching.Implementation.ThreadPoolWorkItemDispatcher" data-throw-if-not-resolved="false"></xref>, which queues the work item to the thread pool.

    A different implementation is supplied by registering it in the service provider of the backend.

    </p>

    <p>

    The interface only queues. The ability to wait for the completion of the pending work items belongs to the

    implementation that a test substitutes, not to this interface.

    </p>
