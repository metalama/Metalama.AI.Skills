  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Attribute that means that the target declaration (and all children declarations) can be called both from compile-time

    and run-time code. See <xref href="Metalama.Framework.Aspects.CompileTimeAttribute" data-throw-if-not-resolved="false"></xref> for declarations that cannot be called from run-time code.
  remarks: >-
    <p>
        You can use this attribute on classes that must be included in the compile-time project and therefore made
        available to your aspects.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Interface|AttributeTargets.Delegate)]

      public sealed class RunTimeOrCompileTimeAttribute : ScopeAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.EnumOrAttributeTargets.InterfaceOrAttributeTargets.Delegate)>

      Public NotInheritable Class RunTimeOrCompileTimeAttribute Inherits ScopeAttribute
