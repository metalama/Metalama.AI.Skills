  summary: >-
    Provides default implementations for the code templates used by code contract aspects (derived from <xref href="Metalama.Patterns.Contracts.ContractBaseAttribute" data-throw-if-not-resolved="false"></xref>).

    This class can be derived and templates can be overridden. To register the new template implementations, use the <xref href="Metalama.Patterns.Contracts.ContractOptions.Templates" data-throw-if-not-resolved="false"></xref>

    contract options.
