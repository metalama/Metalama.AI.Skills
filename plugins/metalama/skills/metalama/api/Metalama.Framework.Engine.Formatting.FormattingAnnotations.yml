  type: Method
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Formatting
  summary: >-
    Annotates a syntax node with an annotation meaning that the syntax node and all its children are user code.

    The annotation is typically obtained from <xref href="Metalama.Framework.Engine.AspectWeavers.AspectWeaverContext.GeneratedCodeAnnotation" data-throw-if-not-resolved="false"></xref>, but it can also

    be created from <xref href="Metalama.Compiler.MetalamaCompilerAnnotations.CreateGeneratedCodeAnnotation(System.String)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public static T? WithSourceCodeAnnotation<T>(this T? node) where T : SyntaxNode'
    parameters:
    - id: node
      type: '{T}'
      description: The input node.
    typeParameters:
    - id: T
    return:
      type: '{T}'
      description: The annotated node.
    content.vb: Public Shared Function WithSourceCodeAnnotation(Of T As SyntaxNode)(node As T) As T
