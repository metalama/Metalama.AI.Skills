    parameters:
    - id: args
      type: Metalama.Framework.Code.IExpression[]
      description: A list of <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> to be passed to the indexer.
    return:
      type: Metalama.Framework.Code.IExpression
      description: An <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> representing the specified item.
    content.vb: ReadOnly Default Property this[](ParamArray args As IExpression()) As IExpression
