  name: IIndexerInvoker
  nameWithType: IIndexerInvoker
  fullName: Metalama.Framework.Code.Invokers.IIndexerInvoker
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Allows generating run-time code that accesses indexer items when you have the compile-time <xref href="Metalama.Framework.Code.IIndexer" data-throw-if-not-resolved="false"></xref> representation.
  remarks: >-
    <p>
        Invokers are APIs that allow you to generate run-time code from compile-time declarations. When you have an <xref href="Metalama.Framework.Code.IIndexer" data-throw-if-not-resolved="false"></xref>
        object (a compile-time representation of an indexer), you can use its indexer syntax to create <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> objects
        that represent indexed access. The returned expression can be used to get or set indexer values in template code via the
        <xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref> property.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Code.Invokers.IIndexerInvoker.WithObject(System.Object)" data-throw-if-not-resolved="false"></xref> to specify the target instance and <xref href="Metalama.Framework.Code.Invokers.IIndexerInvoker.WithOptions(Metalama.Framework.Code.Invokers.InvokerOptions)" data-throw-if-not-resolved="false"></xref> to control nullability behavior
        (such as using the <code>?.</code> operator) and which implementation layer (base, current, or final) to access.
        </p>
    <p>
        By default, the indexer is accessed on the current object (<code>this</code>) for instance indexers. The <code>base</code> implementation
        is accessed, i.e. the implementation <i>before</i> the current aspect layer.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface IIndexerInvoker
    content.vb: >-
      <CompileTime>

      Public Interface IIndexerInvoker
