  summary: Gets an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> representing an item, with arguments represented as a list of <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    By default, the indexer is accessed on the current object (<code>this</code>), unless it is static. The <code>base</code> implementation 

    of the indexer is invoked, i.e. the implementation <i>before</i> the current aspect layer. To change the default values,

    or to use the <code>?</code> null-conditional operator, use the <xref href="Metalama.Framework.Code.Invokers.IIndexerInvoker.WithOptions(Metalama.Framework.Code.Invokers.InvokerOptions)" data-throw-if-not-resolved="false"></xref> method.
  example: []
  syntax:
