    content: public override ReferenceKinds ValidatedReferenceKinds { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.ReferenceKinds
    content.vb: Public Overrides ReadOnly Property ValidatedReferenceKinds As ReferenceKinds
