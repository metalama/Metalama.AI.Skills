  nameWithType: DependencyPropertyNamingConvention.OnPropertyChangedPattern
  fullName: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.OnPropertyChangedPattern
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Gets or sets a regular expression pattern used to identify a method invoked <i>after</i> the property has changed. 

    All occurrences of the substring <code>{PropertyName}</code> will be replaced with the name

    determined according to <xref href="Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern" data-throw-if-not-resolved="false"></xref> before the expression is evaluated. The default value is <code>On{PropertyName}Changed</code>.
  example: []
