- uid: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.OnPropertyChangedPattern
  commentId: P:Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.OnPropertyChangedPattern
