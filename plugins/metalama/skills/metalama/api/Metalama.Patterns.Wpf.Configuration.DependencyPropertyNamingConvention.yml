- uid: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern
  commentId: P:Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern
  id: PropertyNamePattern
  parent: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention
  langs:
