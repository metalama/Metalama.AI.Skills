  name: DependencyPropertyNamingConvention
  nameWithType: DependencyPropertyNamingConvention
  fullName: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention
  type: Class
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Defines a naming convention for the <xref href="Metalama.Patterns.Wpf.DependencyPropertyAttribute" data-throw-if-not-resolved="false"></xref> aspect, specifying how to derive

    the registration field name, property changed callback, and validation method from the target property name.
  remarks: >-
    <p>Use <xref href="Metalama.Patterns.Wpf.Configuration.DependencyPropertyOptionsBuilder.AddNamingConvention(Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention%2cSystem.Nullable%7bSystem.Int32%7d)" data-throw-if-not-resolved="false"></xref> to register custom naming conventions.</p>

    <p>Patterns can use the <code>{PropertyName}</code> placeholder which is replaced with the property name extracted from the target.</p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public sealed record DependencyPropertyNamingConvention : ICompileTimeSerializable, IEquatable<DependencyPropertyNamingConvention>
    content.vb: >-
      <CompileTime>

      Public NotInheritable Class DependencyPropertyNamingConvention Implements ICompileTimeSerializable, IEquatable(Of DependencyPropertyNamingConvention)
