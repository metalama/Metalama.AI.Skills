  name: PropertyNamePattern
  nameWithType: DependencyPropertyNamingConvention.PropertyNamePattern
  fullName: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf.Configuration
  summary: >-
    Gets or sets the regular expression pattern that will be evaluated against the name of the target property of the <xref href="Metalama.Patterns.Wpf.DependencyPropertyAttribute" data-throw-if-not-resolved="false"></xref> aspect. 

    The expression should yield a match group named <code>Name</code>. If <xref href="Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern" data-throw-if-not-resolved="false"></xref> is not specified, the name of the target property is used

    as the name of the dependency property.
  example: []
  syntax:
    content: public string? PropertyNamePattern { get; init; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property PropertyNamePattern As String
  overload: Metalama.Patterns.Wpf.Configuration.DependencyPropertyNamingConvention.PropertyNamePattern*
