- uid: Metalama.Extensions.Interceptors.ITypeSelection.AllMethods
  commentId: M:Metalama.Extensions.Interceptors.ITypeSelection.AllMethods
  id: AllMethods
  parent: Metalama.Extensions.Interceptors.ITypeSelection
  langs:
  - csharp
  - vb
  name: AllMethods()
  nameWithType: ITypeSelection.AllMethods()
  fullName: Metalama.Extensions.Interceptors.ITypeSelection.AllMethods()
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Selects all the methods that the type declares.
  remarks: >-
    <p>

    The selected methods are the ordinary methods that the type definition itself declares, static and instance. Operators, conversions,

    explicit interface implementations, accessors, constructors and finalizers are not selected. An explicit interface implementation is

    reached through a selection of the interface with <xref href="Metalama.Extensions.Interceptors.IMethodSelection.IncludingInterfaceImplementations" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    The methods that the type inherits are not selected. A call to an inherited method binds to the method of the base type, so selecting

    it would also intercept the calls on other types that inherit it.

    </p>

    <p>

    The names of the methods are listed when the description is created. In the IDE, a registration made by a fabric does not select a

    method that is added to the type later, until the fabric executes again.

    </p>
  example: []
  syntax:
    content: IMethodSelection AllMethods()
    return:
      type: Metalama.Extensions.Interceptors.IMethodSelection
    content.vb: Function AllMethods() As IMethodSelection
  overload: Metalama.Extensions.Interceptors.ITypeSelection.AllMethods*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: The type declares no method that can be intercepted.
