  name: GreaterThanAttribute
  nameWithType: GreaterThanAttribute
  fullName: Metalama.Patterns.Contracts.GreaterThanAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is smaller than a given bound. The behavior when the target is exactly assigned to the bound depends

    on the <xref href="Metalama.Patterns.Contracts.ContractOptions.DefaultInequalityStrictness" data-throw-if-not-resolved="false"></xref> option. If this option

    is not specified, a warning is reported.
  remarks: "    <p>Null values are accepted and do not throw an exception.\r\n</p>"
  example: []
  syntax:
    content: 'public class GreaterThanAttribute : RangeAttribute, IAspect<IParameter>, IEligible<IParameter>, IAspect<IFieldOrPropertyOrIndexer>, IEligible<IFieldOrPropertyOrIndexer>, IConditionallyInheritableAspect, IAspect, ICompileTimeSerializable, ITemplateProvider'
