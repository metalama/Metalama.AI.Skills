  nameWithType: DiagnosticDefinition
  fullName: Metalama.Framework.Diagnostics.DiagnosticDefinition
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Diagnostics
  summary: Defines a diagnostic that does not accept any parameters. For diagnostics with parameters, use <xref href="Metalama.Framework.Diagnostics.DiagnosticDefinition%601" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
         Diagnostic definitions must be declared as static fields in compile-time classes (such as aspect classes,
         fabric classes, or other compile-time helper classes) and include a unique ID, severity level, and message
         format string. The aspect framework requires diagnostics to be defined this way to ensure they can be
         properly detected by static analysis of the code.
         </p>
    <p>
         This class implements both <xref href="Metalama.Framework.Diagnostics.IDiagnosticDefinition" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Diagnostics.IDiagnostic" data-throw-if-not-resolved="false"></xref>, which means
         instances can be used directly with <xref href="Metalama.Framework.Diagnostics.ScopedDiagnosticSink.Report(Metalama.Framework.Diagnostics.IDiagnostic)" data-throw-if-not-resolved="false"></xref> without needing
         to call <code>WithArguments</code>.
         </p>
  example:
  - >-
    <pre><code class="lang-csharp">private static readonly DiagnosticDefinition _missingFieldError = new(
        "MY001",
        Severity.Error,
        "The type must have a field named '_logger'.");

    // In BuildAspect:

    builder.Diagnostics.Report(_missingFieldError);</code></pre>
  syntax:
    content: 'public sealed class DiagnosticDefinition : DiagnosticDefinition<None>, IDiagnosticDefinition, IDiagnostic'
