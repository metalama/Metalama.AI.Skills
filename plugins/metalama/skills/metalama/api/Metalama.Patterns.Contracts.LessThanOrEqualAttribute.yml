  name: LessThanOrEqualAttribute
  nameWithType: LessThanOrEqualAttribute
  fullName: Metalama.Patterns.Contracts.LessThanOrEqualAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is greater than a given value.
  remarks: "    <p>Null values are accepted and do not throw an exception.</p>\r\n<p>Error message can use additional argument <returns>{4}</returns> to refer to the minimum value used.</p>"
  example: []
  syntax:
    content: 'public class LessThanOrEqualAttribute : RangeAttribute, IAspect<IParameter>, IEligible<IParameter>, IAspect<IFieldOrPropertyOrIndexer>, IEligible<IFieldOrPropertyOrIndexer>, IConditionallyInheritableAspect, IAspect, ICompileTimeSerializable, ITemplateProvider'
