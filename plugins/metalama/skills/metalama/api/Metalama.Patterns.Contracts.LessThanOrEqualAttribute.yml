- uid: Metalama.Patterns.Contracts.LessThanOrEqualAttribute.#ctor(System.Int64,System.Int32)
  commentId: M:Metalama.Patterns.Contracts.LessThanOrEqualAttribute.#ctor(System.Int64,System.Int32)
  id: '#ctor(System.Int64,System.Int32)'
  parent: Metalama.Patterns.Contracts.LessThanOrEqualAttribute
  langs:
  - csharp
  - vb
  name: LessThanOrEqualAttribute(long, int)
  nameWithType: LessThanOrEqualAttribute.LessThanOrEqualAttribute(long, int)
  fullName: Metalama.Patterns.Contracts.LessThanOrEqualAttribute.LessThanOrEqualAttribute(long, int)
  type: Constructor
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: Initializes a new instance of the <xref href="Metalama.Patterns.Contracts.LessThanOrEqualAttribute" data-throw-if-not-resolved="false"></xref> class specifying a maximum value of type <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public LessThanOrEqualAttribute(long max, int decimalPlaces = 0)
    parameters:
    - id: max
      type: System.Int64
      description: The maximum allowed value.
    - id: decimalPlaces
      type: System.Int32
      description: >-
        When non-zero, interprets the <code class="paramref">max</code> number as <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> instead
                    of <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> by adding a decimal point at the specified position. For instance, if <code class="paramref">max</code> is set to 1234 and <code class="paramref">decimalPlaces</code>
                    is set to 3, the <code class="paramref">max</code> parameter will be reinterpreted as <code>1.234m</code>.
    content.vb: Public Sub New(max As Long, decimalPlaces As Integer = 0)
  overload: Metalama.Patterns.Contracts.LessThanOrEqualAttribute.#ctor*
  nameWithType.vb: LessThanOrEqualAttribute.New(Long, Integer)
  fullName.vb: Metalama.Patterns.Contracts.LessThanOrEqualAttribute.New(Long, Integer)
  name.vb: New(Long, Integer)
