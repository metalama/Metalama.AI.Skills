- uid: Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(System.Object[])
  commentId: M:Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(System.Object[])
  id: Invoke(System.Object[])
  parent: Metalama.Framework.Code.Invokers.IMethodInvoker
  langs:
  - csharp
  - vb
  name: Invoke(params dynamic?[])
  nameWithType: IMethodInvoker.Invoke(params dynamic?[])
  fullName: Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(params dynamic?[])
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Generates run-time code that invokes the current method with a given list of arguments.
  remarks: >-
    By default, the method is invoked on the current object (<code>this</code>), unless the method is static. The <code>base</code> implementation 

    of the method is invoked, i.e. the implementation <i>before</i> the current aspect layer. To change the default values,

    or to use the <code>?.</code> null-conditional operator, use the <xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.WithOptions(Metalama.Framework.Code.Invokers.InvokerOptions)" data-throw-if-not-resolved="false"></xref> method.
  example: []
  syntax:
    content: dynamic? Invoke(params dynamic?[] args)
    parameters:
    - id: args
      type: dynamic[]
      description: >-
        A list of C# expressions to be passed to the method. If the compile-time type
                    of any expression is <code>dynamic</code>, it must be explicitly cast to <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>.
    return:
      type: dynamic
      description: A dynamic object representing the return value of the method, if any.
    content.vb: Function Invoke(ParamArray args As Object()) As Object
  overload: Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke*
  nameWithType.vb: IMethodInvoker.Invoke(ParamArray Object())
  fullName.vb: Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(ParamArray Object())
  name.vb: Invoke(ParamArray Object())
