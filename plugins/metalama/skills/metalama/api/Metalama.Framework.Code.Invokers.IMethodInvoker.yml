  langs:
  - csharp
  - vb
  name: IMethodInvoker
  nameWithType: IMethodInvoker
  fullName: Metalama.Framework.Code.Invokers.IMethodInvoker
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Allows generating run-time code that invokes a method when you have its compile-time <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref> representation.
  remarks: >-
    <p>
        Invokers are APIs that allow you to generate run-time code from compile-time declarations. When you have an <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>
        object (a compile-time representation of a method), you can use its invoker methods to create <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> objects
        that represent method calls. These expressions can then be used in templates and will be expanded into actual C# code.
        </p>
    <p>
        The <xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> method returns a <code>dynamic</code> value that can be used directly in template code, while
        <xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.CreateInvokeExpression(System.Collections.Generic.IEnumerable%7bMetalama.Framework.Code.IExpression%7d)" data-throw-if-not-resolved="false"></xref> returns an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> for use in compile-time APIs.
        Use <xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.WithObject(System.Object)" data-throw-if-not-resolved="false"></xref> to specify the target instance and <xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.WithOptions(Metalama.Framework.Code.Invokers.InvokerOptions)" data-throw-if-not-resolved="false"></xref> to control nullability behavior and
        which implementation layer (base, current, or final) to invoke.
        </p>
    <p>
        The invoker API is not type-safe. It will generate code even with mismatched argument types, which will only be caught when
        the transformed code is compiled. Always verify that generated code matches actual member signatures.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface IMethodInvoker
    content.vb: >-
      <CompileTime>

      Public Interface IMethodInvoker
