        parameters (e.g. <code>List&lt;T&gt;</code> where <code>T</code> is <code>List</code>'s type parameter), the generated

        <code>typeof</code> expression keeps the constructed form (e.g. <code>typeof(List&lt;T&gt;)</code>) instead of

        emitting the unbound generic type (e.g. <code>typeof(List&lt;&gt;)</code>). Use this only when the type

        parameters are in scope at the emission site. The default is <code>false</code>, which emits the unbound

        generic type for such inputs.
    return:
      type: Metalama.Framework.Code.IExpression
      description: An <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> representing <code>typeof(type)</code>.
