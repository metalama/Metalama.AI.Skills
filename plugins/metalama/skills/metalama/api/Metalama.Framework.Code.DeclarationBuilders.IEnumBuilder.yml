  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Adds a member of the given value.
  remarks: >-
    <p>
        The name must not be the name of a member already added, and a duplicate throws an
        <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref>. The value is converted to <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType" data-throw-if-not-resolved="false"></xref>, and a value that
        does not fit in that type throws an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref>. The members are declared in
        the order in which they were added.
        </p>
  example: []
  syntax:
    content: IEnumMemberBuilder AddMember(string name, sbyte value)
    parameters:
    - id: name
      type: System.String
      description: The name of the member.
    - id: value
      type: System.SByte
      description: The value of the member, converted to <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
      description: An <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder" data-throw-if-not-resolved="false"></xref> that allows you to add custom attributes to the new member.
    content.vb: Function AddMember(name As String, value As SByte) As IEnumMemberBuilder
