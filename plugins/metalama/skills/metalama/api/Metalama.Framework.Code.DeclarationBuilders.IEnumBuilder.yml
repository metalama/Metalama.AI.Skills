  name: IEnumBuilder
  nameWithType: IEnumBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Allows to complete the construction of an enum that has been created by the <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceEnum(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamespaceOrNamedType%7d%2cSystem.String%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IEnumBuilder%7d%2cMetalama.Framework.Aspects.OverrideStrategy)" data-throw-if-not-resolved="false"></xref> advice.
  remarks: >-
    <p>
        The following inherited properties are not valid for an enum, and their setter throws a
        <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>: <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsStatic" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsSealed" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsAbstract" data-throw-if-not-resolved="false"></xref> and
        <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsPartial" data-throw-if-not-resolved="false"></xref>. An enum is implicitly sealed, it may not be abstract or
        static, and the language has no partial enum.
        </p>
    <p>
        An enum builder is not an <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>, so it may not be used where an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref> is
        expected. The introduced enum is read from
        <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IEnumBuilder : IMemberOrNamedTypeBuilder, IMemberOrNamedType, INamedDeclaration, IDeclarationBuilder, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>
    content.vb: >-
      <InternalImplement>

      Public Interface IEnumBuilder Inherits IMemberOrNamedTypeBuilder, IMemberOrNamedType, INamedDeclaration, IDeclarationBuilder, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration)
