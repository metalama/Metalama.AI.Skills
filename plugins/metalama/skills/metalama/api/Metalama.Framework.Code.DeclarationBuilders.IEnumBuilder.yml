- uid: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(System.String,Metalama.Framework.Code.TypedConstant)
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(System.String,Metalama.Framework.Code.TypedConstant)
  id: AddMember(System.String,Metalama.Framework.Code.TypedConstant)
  parent: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder
  langs:
  - csharp
  - vb
  name: AddMember(string, TypedConstant)
  nameWithType: IEnumBuilder.AddMember(string, TypedConstant)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(string, Metalama.Framework.Code.TypedConstant)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Adds a member whose value is given as a <xref href="Metalama.Framework.Code.TypedConstant" data-throw-if-not-resolved="false"></xref>, which is the form in which the value of

    a member of another enum is read.
  remarks: >-
    <p>
        The name must not be the name of a member already added, and a duplicate throws an
        <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref>. The type of the constant must be an integral type or an enum, and any other
        type throws an <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref> as well. This overload therefore accepts the value of a member
        of another enum directly, which is how such a value is read from the code model.
        </p>
    <p>
        The value is converted to <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType" data-throw-if-not-resolved="false"></xref> and the type of the constant is replaced by it,
        including when the constant came from another enum. The language converts neither one enum to another nor an
        enum to an integral type implicitly, so a member that kept the type of the constant it came from would not
        compile. A value that does not fit in the underlying type throws an
        <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        An uninitialized constant, and a constant whose value is <code>null</code>, add a member whose value the language
        assigns, exactly as <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(System.String)" data-throw-if-not-resolved="false"></xref> does.
        </p>
  example: []
  syntax:
    content: IEnumMemberBuilder AddMember(string name, TypedConstant value)
    parameters:
    - id: name
      type: System.String
      description: The name of the member.
    - id: value
      type: Metalama.Framework.Code.TypedConstant
      description: The value of the member, converted to <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
      description: An <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder" data-throw-if-not-resolved="false"></xref> that allows you to add custom attributes to the new member.
    content.vb: Function AddMember(name As String, value As TypedConstant) As IEnumMemberBuilder
  overload: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember*
  nameWithType.vb: IEnumBuilder.AddMember(String, TypedConstant)
  fullName.vb: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(String, Metalama.Framework.Code.TypedConstant)
  name.vb: AddMember(String, TypedConstant)
- uid: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType
  commentId: P:Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType
  id: UnderlyingType
  parent: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder
  langs:
  - csharp
  - vb
  name: UnderlyingType
  nameWithType: IEnumBuilder.UnderlyingType
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Gets or sets the underlying integral type of the enum. The default value is <xref href="Metalama.Framework.Code.SpecialType.Int32" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        The language allows one of <xref href="Metalama.Framework.Code.SpecialType.Byte" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.SpecialType.SByte" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Code.SpecialType.Int16" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.SpecialType.UInt16" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.SpecialType.Int32" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Code.SpecialType.UInt32" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.SpecialType.Int64" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.SpecialType.UInt64" data-throw-if-not-resolved="false"></xref>. The
        setter throws an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> for any other value.
        </p>
    <p>
        Setting this property after a member has been added throws an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>,
        because the value of a member is validated against the underlying type when the member is added.
        </p>
  example: []
  syntax:
    content: SpecialType UnderlyingType { get; set; }
    parameters: []
    return:
      type: Metalama.Framework.Code.SpecialType
    content.vb: Property UnderlyingType As SpecialType
  overload: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.UnderlyingType*
  seealso:
  - linkId: Metalama.Framework.Code.Types.IEnumFacet.UnderlyingType
    commentId: P:Metalama.Framework.Code.Types.IEnumFacet.UnderlyingType
- uid: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.IsFlags
  commentId: P:Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.IsFlags
  id: IsFlags
  parent: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder
  langs:
  - csharp
  - vb
  name: IsFlags
  nameWithType: IEnumBuilder.IsFlags
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.IsFlags
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Gets or sets a value indicating whether the enum is annotated with <xref href="System.FlagsAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Setting this property to <code>true</code> adds the attribute, and setting it to <code>false</code> removes it. Adding
        the attribute through <xref href="Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttribute(Metalama.Framework.Code.DeclarationBuilders.AttributeConstruction)" data-throw-if-not-resolved="false"></xref> has the same effect, and this property
        then reports <code>true</code>.
        </p>
    <p>
        The attribute changes how the value of the enum is formatted and parsed at run time, and it does not change
        the value of any member. An author who sets this property assigns the value of every member explicitly,
        because neither the language nor Metalama derives a power of two from the position of a member.
        </p>
  example: []
  syntax:
    content: bool IsFlags { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Property IsFlags As Boolean
  overload: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.IsFlags*
  seealso:
  - linkId: Metalama.Framework.Code.Types.IEnumFacet.IsFlags
    commentId: P:Metalama.Framework.Code.Types.IEnumFacet.IsFlags
