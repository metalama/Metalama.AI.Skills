- uid: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(System.String)
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(System.String)
  id: AddMember(System.String)
  parent: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder
  langs:
  - csharp
  - vb
  name: AddMember(string)
  nameWithType: IEnumBuilder.AddMember(string)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(string)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Adds a member whose value the language assigns, which is zero for the first member and the value of the

    preceding member plus one for any other.
  remarks: >-
    <p>
        The name must not be the name of a member already added, and a duplicate throws an
        <xref href="System.ArgumentException" data-throw-if-not-resolved="false"></xref>. The members are declared in the order in which they were added.
        </p>
  example: []
  syntax:
    content: IEnumMemberBuilder AddMember(string name)
    parameters:
    - id: name
      type: System.String
      description: The name of the member.
    return:
      type: Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
      description: An <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder" data-throw-if-not-resolved="false"></xref> that allows you to add custom attributes to the new member.
    content.vb: Function AddMember(name As String) As IEnumMemberBuilder
  overload: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember*
  nameWithType.vb: IEnumBuilder.AddMember(String)
  fullName.vb: Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder.AddMember(String)
  name.vb: AddMember(String)
