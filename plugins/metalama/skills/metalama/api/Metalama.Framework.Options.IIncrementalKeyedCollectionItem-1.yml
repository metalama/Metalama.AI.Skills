  name: IIncrementalKeyedCollectionItem<TKey>
  nameWithType: IIncrementalKeyedCollectionItem<TKey>
  fullName: Metalama.Framework.Options.IIncrementalKeyedCollectionItem<TKey>
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: An item in a <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Classes that implement this interface can be used as values in an <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref>.
        Each item must provide a unique <xref href="Metalama.Framework.Options.IIncrementalKeyedCollectionItem%601.Key" data-throw-if-not-resolved="false"></xref> and implement the <xref href="Metalama.Framework.Options.IIncrementalObject.ApplyChanges(System.Object%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref> method
        to support merging of items with the same key across different configuration layers.
        </p>
    <p>
        Because this interface extends <xref href="Metalama.Framework.Options.IIncrementalObject" data-throw-if-not-resolved="false"></xref>, items in the collection must be immutable and use the
        same pattern as hierarchical options: properties should typically be nullable, and <xref href="Metalama.Framework.Options.IIncrementalObject.ApplyChanges(System.Object%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref>
        should merge properties from two instances, with the <code>changes</code> parameter taking precedence for non-null values.
        </p>
  example: []
  syntax:
    content: 'public interface IIncrementalKeyedCollectionItem<out TKey> : IIncrementalObject, ICompileTimeSerializable where TKey : notnull'
    typeParameters:
    - id: TKey
      description: The type of the key that identifies items in the collection.
    content.vb: Public Interface IIncrementalKeyedCollectionItem(Of Out TKey) Inherits IIncrementalObject, ICompileTimeSerializable
