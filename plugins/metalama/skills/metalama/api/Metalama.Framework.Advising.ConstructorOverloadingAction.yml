items:
- uid: Metalama.Framework.Advising.ConstructorOverloadingAction
  commentId: T:Metalama.Framework.Advising.ConstructorOverloadingAction
  id: ConstructorOverloadingAction
  parent: Metalama.Framework.Advising
  children:
  - Metalama.Framework.Advising.ConstructorOverloadingAction.Forward
  - Metalama.Framework.Advising.ConstructorOverloadingAction.ForwardAndMarkObsolete(System.String,System.Boolean)
  - Metalama.Framework.Advising.ConstructorOverloadingAction.None
  langs:
  - csharp
  - vb
  name: ConstructorOverloadingAction
  nameWithType: ConstructorOverloadingAction
  fullName: Metalama.Framework.Advising.ConstructorOverloadingAction
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Describes what an <xref href="Metalama.Framework.Advising.IConstructorOverloadingStrategy" data-throw-if-not-resolved="false"></xref> wants the framework to do with

    a mutated constructor: do nothing, generate a forwarding constructor to keep source and binary compatibility with the original constructor,

    or generate a forwarding constructor decorated with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [CompileTime]

      public readonly struct ConstructorOverloadingAction
    content.vb: >-
      <CompileTime>

      Public Structure ConstructorOverloadingAction
  seealso:
