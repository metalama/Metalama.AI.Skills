  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Describes what an <xref href="Metalama.Framework.Advising.IConstructorOverloadingStrategy" data-throw-if-not-resolved="false"></xref> wants the framework to do with

    a mutated constructor: do nothing, generate a forwarding constructor to keep source and binary compatibility with the original constructor,

    or generate a forwarding constructor decorated with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
