- uid: Metalama.Framework.Advising.ConstructorOverloadingAction.None
  commentId: P:Metalama.Framework.Advising.ConstructorOverloadingAction.None
  id: None
  parent: Metalama.Framework.Advising.ConstructorOverloadingAction
  langs:
  - csharp
  - vb
  name: None
  nameWithType: ConstructorOverloadingAction.None
  fullName: Metalama.Framework.Advising.ConstructorOverloadingAction.None
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Gets a <xref href="Metalama.Framework.Advising.ConstructorOverloadingAction" data-throw-if-not-resolved="false"></xref> that means no forwarding constructor should

    be generated for the mutated constructor.
  remarks: >-
    <strong>This is a source-breaking change.</strong> Existing C# call sites that match the pre-mutation
        signature will fail to compile because no overload with the original parameter list remains on the type.
        Choose this action only when you intentionally want to force callers to update their code (for example,
        in an internal codebase where every caller can be migrated in lockstep, or as the final step of a
        multi-release deprecation rolled out via <xref href="Metalama.Framework.Advising.ConstructorOverloadingAction.ForwardAndMarkObsolete(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: public static ConstructorOverloadingAction None { get; }
    parameters: []
    return:
      type: Metalama.Framework.Advising.ConstructorOverloadingAction
    content.vb: Public Shared ReadOnly Property None As ConstructorOverloadingAction
  overload: Metalama.Framework.Advising.ConstructorOverloadingAction.None*
