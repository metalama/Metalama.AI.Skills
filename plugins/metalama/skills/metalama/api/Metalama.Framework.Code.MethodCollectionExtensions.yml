      description: Staticity of the method.
    - id: conversionKind
      type: Metalama.Framework.Code.ConversionKind
      description: The <xref href="Metalama.Framework.Code.ConversionKind" data-throw-if-not-resolved="false"></xref> to use for parameter type comparison.
    return:
      type: Metalama.Framework.Code.IMethod
      description: A <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref> that matches the given signature.
    content.vb: Public Shared Function OfCompatibleSignature(methods As IMethodCollection, name As String, parameterTypes As IReadOnlyList(Of IType), refKinds As IReadOnlyList(Of RefKind), isStatic As Boolean?, conversionKind As ConversionKind) As IMethod
