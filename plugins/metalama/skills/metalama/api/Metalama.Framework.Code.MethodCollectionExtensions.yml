  summary: >-
    Gets a method that matches the specified signature using the specified <xref href="Metalama.Framework.Code.ConversionKind" data-throw-if-not-resolved="false"></xref> for parameter type comparison.

    Unlike <xref href="Metalama.Framework.Code.MethodCollectionExtensions.OfExactSignature(Metalama.Framework.Code.Collections.IMethodCollection%2cSystem.String%2cSystem.Collections.Generic.IReadOnlyList%7bMetalama.Framework.Code.IType%7d%2cSystem.Collections.Generic.IReadOnlyList%7bMetalama.Framework.Code.RefKind%7d%2cSystem.Nullable%7bSystem.Boolean%7d)" data-throw-if-not-resolved="false"></xref> which requires identical types,

    this overload allows specifying a <xref href="Metalama.Framework.Code.ConversionKind" data-throw-if-not-resolved="false"></xref> such as <xref href="Metalama.Framework.Code.ConversionKind.Default" data-throw-if-not-resolved="false"></xref> for implicit conversions.
  example: []
  syntax:
    content: public static IMethod? OfCompatibleSignature(this IMethodCollection methods, string name, IReadOnlyList<IType> parameterTypes, IReadOnlyList<RefKind>? refKinds, bool? isStatic, ConversionKind conversionKind)
    parameters:
