  name: TemplateInvocation
  nameWithType: TemplateInvocation
  fullName: Metalama.Framework.Aspects.TemplateInvocation
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Represents a delegate-like encapsulation of a template method invocation. This enables passing template calls

    as parameters to other templates, supporting advanced patterns like decorator composition.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Aspects.TemplateInvocation" data-throw-if-not-resolved="false"></xref> is similar to a delegate in that it captures everything needed to invoke a template:
        the template name, the template provider, and any compile-time arguments. Unlike a delegate, it is a compile-time
        construct that generates code when invoked via <xref href="Metalama.Framework.Aspects.meta.InvokeTemplate(Metalama.Framework.Aspects.TemplateInvocation%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        This is useful when an aspect allows customizations that must call back to the aspect's logic. For example, a caching
        aspect could allow derived classes to wrap the caching logic in a try/catch by accepting a <xref href="Metalama.Framework.Aspects.TemplateInvocation" data-throw-if-not-resolved="false"></xref>
        that the customization template must invoke.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public sealed record TemplateInvocation : IEquatable<TemplateInvocation>
    content.vb: >-
      <CompileTime>

      Public NotInheritable Class TemplateInvocation Implements IEquatable(Of TemplateInvocation)
