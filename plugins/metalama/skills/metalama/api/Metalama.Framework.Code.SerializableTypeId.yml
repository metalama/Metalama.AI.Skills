  name: SerializableTypeId
  nameWithType: SerializableTypeId
  fullName: Metalama.Framework.Code.SerializableTypeId
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Encapsulates a string that uniquely identifies a type within a compilation (except in the situation where the compilation

    contains several assemblies providing types of the same name) and that is safe to persist in a file.
  remarks: >-
    <p>
        The identifier is composed of the <code>Y:</code> prefix, the type written in C# syntax, an optional <code>!</code> marker, and an
        optional generic context introduced by <code>|</code>. The type is written with <code>global::</code>-qualified names, with the
        arguments of a generic type separated by a comma and no space, and with <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref> written as
        <code>T?</code>.
        </p>
    <p>
        The two nullability markers describe different things and are not alternatives. <code>?</code> belongs to one type reference and means
        that this type reference is nullable, exactly as in C#. The <code>!</code> at the end belongs to the whole identifier and means that
        the type was written in an annotated nullable context, so that every type reference without a <code>?</code> is non-nullable rather
        than oblivious. A reference belongs to a single nullable context, that of the place it was written, which is why one
        marker suffices for all of its type references.
        </p>
    <table><thead><tr><th class="term">Identifier</th><th class="description">Type</th></tr></thead><tbody><tr><td class="term">
          <code>Y:global::System.String!</code>
        </td><td class="description">the non-nullable <code>string</code>.</td></tr><tr><td class="term">
          <code>Y:global::System.String?!</code>
        </td><td class="description">the nullable <code>string?</code>.</td></tr><tr><td class="term">
          <code>Y:global::System.String</code>
        </td><td class="description">the <code>string</code> of a context that is oblivious to nullability.</td></tr><tr><td class="term">
          <code>Y:global::System.Collections.Generic.List&lt;global::System.String?&gt;!</code>
        </td><td class="description">a non-nullable <code>List&lt;string?&gt;</code>, the list itself carrying no <code>?</code> and its argument carrying
        one.</td></tr></tbody></table>
    <p>
        An identifier that carries no marker therefore resolves to a type every type reference of which is oblivious to nullability, and
        not to a non-nullable one.
        </p>
    <p>
        The marker is written whenever any type reference of the type proves the context annotated, and applies to every type the
        identifier names when it is resolved. Only a reference type and a type parameter prove anything: a value type is not
        annotated in an unannotated context any more than in an annotated one, because it can never be oblivious. A type with no
        reference type and no type parameter anywhere in it, such as <code>KeyValuePair&lt;int, int&gt;</code>, therefore carries no
        marker and needs none.
        </p>
