  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    A reference assembly, implementing <xref href="Metalama.Framework.Code.IAssembly" data-throw-if-not-resolved="false"></xref>. Note

    that the current assembly is represented by <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref> that inherits <xref href="Metalama.Framework.Code.IAssembly" data-throw-if-not-resolved="false"></xref>, but the

    <xref href="Metalama.Framework.Code.DeclarationKind" data-throw-if-not-resolved="false"></xref> for the current compilation is <xref href="Metalama.Framework.Code.DeclarationKind.Compilation" data-throw-if-not-resolved="false"></xref> and not <xref href="Metalama.Framework.Code.DeclarationKind.AssemblyReference" data-throw-if-not-resolved="false"></xref>.
