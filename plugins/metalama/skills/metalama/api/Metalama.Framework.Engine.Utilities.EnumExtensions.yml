- uid: Metalama.Framework.Engine.Utilities.EnumExtensions.ToStringSafe(System.Enum)
  commentId: M:Metalama.Framework.Engine.Utilities.EnumExtensions.ToStringSafe(System.Enum)
  id: ToStringSafe(System.Enum)
  isExtensionMethod: true
  parent: Metalama.Framework.Engine.Utilities.EnumExtensions
  langs:
  - csharp
  - vb
  name: ToStringSafe(Enum)
  nameWithType: EnumExtensions.ToStringSafe(Enum)
  fullName: Metalama.Framework.Engine.Utilities.EnumExtensions.ToStringSafe(System.Enum)
  type: Method
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Utilities
  summary: >-
    Returns a deterministic string representation of an enum value. For enums with alias members

    (multiple names sharing the same underlying value, e.g. <code>Default = 0, Success = 0</code>), the

    built-in <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref> picks one of the names in an implementation-defined way

    that can vary across .NET runtimes. This method returns the alphabetically-first preferred

    name among aliases — names marked <code>[Obsolete]</code> and the literal name

    <code>Default</code> are deprioritized and only used as a fallback when no preferred alias exists,

    so diagnostic messages and log output stay stable.
  example: []
  syntax:
    content: public static string ToStringSafe(this Enum value)
    parameters:
    - id: value
      type: System.Enum
    return:
      type: System.String
    content.vb: Public Shared Function ToStringSafe(value As [Enum]) As String
  overload: Metalama.Framework.Engine.Utilities.EnumExtensions.ToStringSafe*
