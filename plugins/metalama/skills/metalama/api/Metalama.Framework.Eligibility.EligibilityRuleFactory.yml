  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Eligibility
  summary: Gets the default eligibility rules that apply to a contract advice for a specific contract direction.
  remarks: >-
    <p>
        The rules returned by this method are those used by the <xref href="Metalama.Framework.Aspects.ContractAspect" data-throw-if-not-resolved="false"></xref> class.
        If you implement the <xref href="Metalama.Framework.Eligibility.IEligible%601.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method manually, you can use this method to get the base rules
        and add only rules that are specific to your aspect.
        </p>
  example: []
  syntax:
    content: public static IEligibilityRule<IDeclaration> GetContractAdviceEligibilityRule(ContractDirection contractDirection)
    parameters:
    - id: contractDirection
      type: Metalama.Framework.Aspects.ContractDirection
      description: The contract direction (e.g., <xref href="Metalama.Framework.Aspects.ContractDirection.Input" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.ContractDirection.Output" data-throw-if-not-resolved="false"></xref>).
    return:
      type: Metalama.Framework.Eligibility.IEligibilityRule{Metalama.Framework.Code.IDeclaration}
      description: An <xref href="Metalama.Framework.Eligibility.IEligibilityRule%601" data-throw-if-not-resolved="false"></xref> that encapsulates the default eligibility requirements for contract advice with the specified direction.
    content.vb: Public Shared Function GetContractAdviceEligibilityRule(contractDirection As ContractDirection) As IEligibilityRule(Of IDeclaration)
