- uid: Metalama.Framework.Eligibility.EligibilityRuleFactory.CreateRule``1(System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}},System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}}[])
  commentId: M:Metalama.Framework.Eligibility.EligibilityRuleFactory.CreateRule``1(System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}},System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}}[])
  id: CreateRule``1(System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}},System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{``0}}[])
  parent: Metalama.Framework.Eligibility.EligibilityRuleFactory
  langs:
  - csharp
  - vb
  name: CreateRule<T>(Action<IEligibilityBuilder<T>>, params Action<IEligibilityBuilder<T>>[]?)
  nameWithType: EligibilityRuleFactory.CreateRule<T>(Action<IEligibilityBuilder<T>>, params Action<IEligibilityBuilder<T>>[]?)
  fullName: Metalama.Framework.Eligibility.EligibilityRuleFactory.CreateRule<T>(System.Action<Metalama.Framework.Eligibility.IEligibilityBuilder<T>>, params System.Action<Metalama.Framework.Eligibility.IEligibilityBuilder<T>>[]?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Eligibility
  summary: Creates a custom instance of the <xref href="Metalama.Framework.Eligibility.IEligibilityRule%601" data-throw-if-not-resolved="false"></xref> interface using a builder pattern.
  remarks: >-
    <p>
        Eligibility rules are relatively expensive objects to create, although their evaluation is fast and efficient.
        It is strongly recommended to store rules in static fields of the aspect class to avoid recreating them for each aspect instance.
        </p>
    <p>
        The created rule can be used with <xref href="Metalama.Framework.Aspects.IAspectBuilder%601.VerifyEligibility(Metalama.Framework.Eligibility.IEligibilityRule%7b%600%7d)" data-throw-if-not-resolved="false"></xref> to programmatically validate
        eligibility within aspect logic.
        </p>
  example: []
  syntax:
    content: 'public static IEligibilityRule<T> CreateRule<T>(Action<IEligibilityBuilder<T>> predicate, params Action<IEligibilityBuilder<T>>[]? otherPredicates) where T : class'
    parameters:
    - id: predicate
      type: System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}}
      description: An action that configures the eligibility builder by adding rules using methods from <xref href="Metalama.Framework.Eligibility.EligibilityExtensions" data-throw-if-not-resolved="false"></xref>.
    - id: otherPredicates
      type: System.Action{Metalama.Framework.Eligibility.IEligibilityBuilder{{T}}}[]
      description: Additional actions that configure the eligibility builder. All actions are combined with AND logic.
    typeParameters:
    - id: T
      description: The type of declaration that the rule validates.
    return:
      type: Metalama.Framework.Eligibility.IEligibilityRule{{T}}
      description: An immutable <xref href="Metalama.Framework.Eligibility.IEligibilityRule%601" data-throw-if-not-resolved="false"></xref> that can be used to validate declarations.
    content.vb: Public Shared Function CreateRule(Of T As Class)(predicate As Action(Of IEligibilityBuilder(Of T)), ParamArray otherPredicates As Action(Of IEligibilityBuilder(Of T))()) As IEligibilityRule(Of T)
  overload: Metalama.Framework.Eligibility.EligibilityRuleFactory.CreateRule*
  nameWithType.vb: EligibilityRuleFactory.CreateRule(Of T)(Action(Of IEligibilityBuilder(Of T)), ParamArray Action(Of IEligibilityBuilder(Of T))())
  fullName.vb: Metalama.Framework.Eligibility.EligibilityRuleFactory.CreateRule(Of T)(System.Action(Of Metalama.Framework.Eligibility.IEligibilityBuilder(Of T)), ParamArray System.Action(Of Metalama.Framework.Eligibility.IEligibilityBuilder(Of T))())
  name.vb: CreateRule(Of T)(Action(Of IEligibilityBuilder(Of T)), ParamArray Action(Of IEligibilityBuilder(Of T))())
