  langs:
  - csharp
  - vb
  name: InitializationContext
  nameWithType: InitializationContext
  fullName: Metalama.Framework.RunTime.Initialization.InitializationContext
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    A context passed to constructors and <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> methods to coordinate

    post-initialization behavior. Carries the caller's intent, aspect behavior slots,

    and optional metadata.
  remarks: >-
    <p>
        This struct is 16 bytes on x64 (no wasted padding): a <xref href="Metalama.Framework.RunTime.Initialization.CallerIntent" data-throw-if-not-resolved="false"></xref> byte,
        a <code>uint</code> slot bitmask, and an optional <xref href="Metalama.Framework.RunTime.Initialization.InitializationMetadata" data-throw-if-not-resolved="false"></xref> reference.
        </p>
    <p>
      <code>default(InitializationContext)</code> is valid and equivalent to <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.Default" data-throw-if-not-resolved="false"></xref>:
        <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.Intent" data-throw-if-not-resolved="false"></xref> is <xref href="Metalama.Framework.RunTime.Initialization.CallerIntent.None" data-throw-if-not-resolved="false"></xref>, no slots, no metadata.
        </p>
  example: []
  syntax:
    content: public readonly struct InitializationContext
    content.vb: Public Structure InitializationContext
