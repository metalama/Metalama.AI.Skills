- uid: Metalama.Framework.RunTime.Initialization.InitializationContext.Create(Metalama.Framework.RunTime.Initialization.InitializationMetadata)
  commentId: M:Metalama.Framework.RunTime.Initialization.InitializationContext.Create(Metalama.Framework.RunTime.Initialization.InitializationMetadata)
  id: Create(Metalama.Framework.RunTime.Initialization.InitializationMetadata)
  parent: Metalama.Framework.RunTime.Initialization.InitializationContext
  langs:
  - csharp
  - vb
  name: Create(InitializationMetadata)
  nameWithType: InitializationContext.Create(InitializationMetadata)
  fullName: Metalama.Framework.RunTime.Initialization.InitializationContext.Create(Metalama.Framework.RunTime.Initialization.InitializationMetadata)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Creates a context with the given metadata. Used when calling <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref>

    directly (not via a constructor), e.g., after deserialization or a <code>with</code> expression.

    The resulting context has <xref href="Metalama.Framework.RunTime.Initialization.CallerIntent.WillInitialize" data-throw-if-not-resolved="false"></xref>, signaling to descendants

    that <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> is being invoked.
  example: []
  syntax:
    content: public static InitializationContext Create(InitializationMetadata metadata)
    parameters:
    - id: metadata
      type: Metalama.Framework.RunTime.Initialization.InitializationMetadata
    return:
      type: Metalama.Framework.RunTime.Initialization.InitializationContext
    content.vb: Public Shared Function Create(metadata As InitializationMetadata) As InitializationContext
  overload: Metalama.Framework.RunTime.Initialization.InitializationContext.Create*
- uid: Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  commentId: M:Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  id: IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  parent: Metalama.Framework.RunTime.Initialization.InitializationContext
  langs:
  - csharp
  - vb
  name: IsHandled(InitializationSlot)
  nameWithType: InitializationContext.IsHandled(InitializationSlot)
  fullName: Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Returns <code>true</code> when the given <xref href="Metalama.Framework.RunTime.Initialization.InitializationSlot" data-throw-if-not-resolved="false"></xref> is set in this context, meaning a

    derived type has guaranteed it will handle the corresponding concern itself. Aspects whose templates

    share a slot use this to skip work that a more-derived layer has already taken responsibility for.
  example: []
  syntax:
    content: public bool IsHandled(InitializationSlot slot)
    parameters:
    - id: slot
      type: Metalama.Framework.RunTime.Initialization.InitializationSlot
    return:
      type: System.Boolean
    content.vb: Public Function IsHandled(slot As InitializationSlot) As Boolean
  overload: Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled*
- uid: Metalama.Framework.RunTime.Initialization.InitializationContext.Descend(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  commentId: M:Metalama.Framework.RunTime.Initialization.InitializationContext.Descend(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  id: Descend(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  parent: Metalama.Framework.RunTime.Initialization.InitializationContext
  langs:
  - csharp
  - vb
  name: Descend(InitializationSlot)
  nameWithType: InitializationContext.Descend(InitializationSlot)
  fullName: Metalama.Framework.RunTime.Initialization.InitializationContext.Descend(Metalama.Framework.RunTime.Initialization.InitializationSlot)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Returns a copy of the current context with the given slots added to the handled set, suitable for

    passing to <code>base.Initialize(...)</code> from a derived <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> override.

    Each slot tells the base layer that the derived type will handle the corresponding concern itself.
  remarks: >-
    <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.Intent" data-throw-if-not-resolved="false"></xref> is normalized to <xref href="Metalama.Framework.RunTime.Initialization.CallerIntent.WillInitialize" data-throw-if-not-resolved="false"></xref> to preserve the promise
        that <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> is being invoked, and <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.Metadata" data-throw-if-not-resolved="false"></xref> is propagated
        unchanged from the current context.
  example: []
  syntax:
    content: public InitializationContext Descend(InitializationSlot slots = default)
    parameters:
    - id: slots
      type: Metalama.Framework.RunTime.Initialization.InitializationSlot
      description: >-
        The aspect-coordination slots to mark as handled. Combine multiple slots with the
                    <code>|</code> operator on <xref href="Metalama.Framework.RunTime.Initialization.InitializationSlot" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Metalama.Framework.RunTime.Initialization.InitializationContext
    content.vb: Public Function Descend(slots As InitializationSlot = Nothing) As InitializationContext
  overload: Metalama.Framework.RunTime.Initialization.InitializationContext.Descend*
