  fullName: Metalama.Framework.Engine.Services.IProjectServiceFactory
  type: Interface
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Services
  summary: >-
    A factory interface that creates <xref href="Metalama.Framework.Services.IProjectService" data-throw-if-not-resolved="false"></xref> instances to be added to the project's service provider.

    Implement this interface and export it using <xref href="Metalama.Framework.Engine.Extensibility.ExportExtensionAttribute" data-throw-if-not-resolved="false"></xref> with

    <xref href="Metalama.Framework.Engine.Extensibility.ExtensionKinds.ServiceFactory" data-throw-if-not-resolved="false"></xref> to provide custom services that can be consumed by aspects at compile time.
  example:
  - >-
    <pre><code class="lang-csharp">[assembly: ExportExtension(typeof(MyServiceFactory), ExtensionKinds.ServiceFactory)]


    internal class MyServiceFactory : IProjectServiceFactory

    {
        public IEnumerable&lt;IProjectService&gt; CreateServices(in ProjectServiceProvider serviceProvider)
        {
            return [new MyCustomService(serviceProvider)];
        }
    }</code></pre>
