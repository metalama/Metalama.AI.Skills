  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: A compile-time representation of a run-time object creation expression.
  remarks: >-
    <p>
        The main use case for this interface is to add object initializers to constructor invocation expressions created via
        <xref href="Metalama.Framework.Code.Invokers.IConstructorInvoker.CreateInvokeExpression" data-throw-if-not-resolved="false"></xref>. Use the <xref href="Metalama.Framework.Code.IObjectCreationExpression.WithObjectInitializer(System.ValueTuple%7bMetalama.Framework.Code.IFieldOrProperty%2cMetalama.Framework.Code.IExpression%7d%5b%5d)" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Code.IObjectCreationExpression.WithObjectInitializer(System.ValueTuple%7bSystem.String%2cMetalama.Framework.Code.IExpression%7d%5b%5d)" data-throw-if-not-resolved="false"></xref> methods to specify the fields or properties to initialize.
        </p>
    <p>
        For example, to create a <code>new MyClass() { Field = 42, Property = "value" }</code> expression:
        </p>

    <pre><code class="lang-csharp">var expr = constructor.CreateInvokeExpression()
        .WithObjectInitializer(
            (fieldDeclaration, ExpressionFactory.Literal(42)),
            (propertyDeclaration, ExpressionFactory.Literal("value")));</code></pre>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      [Hidden]

      public interface IObjectCreationExpression : IExpression, IHasType
    content.vb: >-
