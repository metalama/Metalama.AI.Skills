  type: Class
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine
  summary: Marks a class as a Metalama plug-in that extends the compiler pipeline.
  remarks: >-
    <p>
        Classes marked with this attribute are discovered and instantiated by Metalama during compilation.
        The class must have a public parameterless constructor.
        </p>
    <p>
        This attribute is used for:
        </p>
    <ul><li>
          <xref href="Metalama.Framework.Engine.AspectWeavers.IAspectWeaver" data-throw-if-not-resolved="false"></xref> implementations: Low-level aspect weavers that perform Roslyn-based transformations.</li><li>Custom metric providers: Classes deriving from <code>MetricProvider&lt;T&gt;</code> or <code>SyntaxMetricProvider&lt;T&gt;</code>.</li><li>
          <xref href="Metalama.Framework.Services.IProjectService" data-throw-if-not-resolved="false"></xref> implementations: Project-scoped services that are automatically added to the service collection.</li></ul>
    <p>
        Plug-in classes must be in an assembly that references <code>Metalama.Framework.Sdk</code> with <code>PrivateAssets="all"</code>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class)]

      [CompileTime]

      public sealed class MetalamaPlugInAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class)>

      <CompileTime>

      Public NotInheritable Class MetalamaPlugInAttribute Inherits Attribute
