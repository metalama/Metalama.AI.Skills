  name: ExcludeAspectAttribute
  nameWithType: ExcludeAspectAttribute
  fullName: Metalama.Framework.Aspects.ExcludeAspectAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Custom attribute that, when applied to a declaration, prevents specified aspect types from being applied to this declaration

    and all its members, except when the aspect is explicitly added as a custom attribute on the declaration.
  remarks: >-
    <p>
        This attribute is useful for excluding aspects that would otherwise be applied through:
        </p>
    <ul><li>
          <b>Aspect inheritance:</b> Prevents inherited aspects from propagating to this declaration</li><li>
          <b>Fabrics:</b> Prevents fabric-added aspects from targeting this declaration</li><li>
          <b>Child aspects:</b> Prevents child aspects from being added to this declaration by other aspects</li></ul>
    <p>
        Aspects explicitly applied as custom attributes directly on the declaration are not excluded. This allows
        intentional opt-in for specific declarations while excluding automatic application.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.All)]

      public sealed class ExcludeAspectAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.All)>

      Public NotInheritable Class ExcludeAspectAttribute Inherits Attribute
