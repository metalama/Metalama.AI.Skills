- uid: Metalama.Framework.Code.IConstructor.ToConstructorInfo
  commentId: M:Metalama.Framework.Code.IConstructor.ToConstructorInfo
  id: ToConstructorInfo
  parent: Metalama.Framework.Code.IConstructor
  langs:
  - csharp
  - vb
  name: ToConstructorInfo()
  nameWithType: IConstructor.ToConstructorInfo()
  fullName: Metalama.Framework.Code.IConstructor.ToConstructorInfo()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> that represents the current constructor at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> object for the current
        constructor. While Metalama is designed to eliminate the need for reflection in most scenarios, this method
        is useful when you need to pass constructor metadata to APIs that require <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on constructor signatures and may break if your
        project is obfuscated. Consider using constructor invokers (such as
        <xref href="Metalama.Framework.Code.Invokers.IConstructorInvoker.Invoke(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>) when possible, as this approach is obfuscation-safe.
        </p>
  example: []
  syntax:
    content: ConstructorInfo ToConstructorInfo()
    return:
      type: System.Reflection.ConstructorInfo
      description: A <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToConstructorInfo() As ConstructorInfo
  overload: Metalama.Framework.Code.IConstructor.ToConstructorInfo*
  seealso:
  - linkId: Metalama.Framework.Code.IMethodBase.ToMethodBase
    commentId: M:Metalama.Framework.Code.IMethodBase.ToMethodBase
  - linkId: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
    commentId: M:Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
  - linkType: HRef
    linkId: '@reflection'
    altText: '@reflection'
- uid: Metalama.Framework.Code.IConstructor.ToRef
  commentId: M:Metalama.Framework.Code.IConstructor.ToRef
  id: ToRef
  parent: Metalama.Framework.Code.IConstructor
  langs:
  - csharp
  - vb
  name: ToRef()
  nameWithType: IConstructor.ToRef()
  fullName: Metalama.Framework.Code.IConstructor.ToRef()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a reference that can be used to identify the current declaration across different compilation versions.
  remarks: >-
    <p>
        References are essential in Metalama because <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref> objects are bound to a specific
        <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>. As aspects execute, the compilation evolves through multiple immutable versions.
        References provide a stable way to track the same declaration across these versions.
        </p>
    <p>
      <b>Common use cases:</b>
    </p>

    <ul><li>Storing declaration references in aspect fields for use in later compilation versions.</li><li>Serializing references for cross-project scenarios (inheritable aspects, validators).</li><li>Passing references to child aspects via <xref href="Metalama.Framework.Aspects.IAspectState" data-throw-if-not-resolved="false"></xref>.</li></ul>

    <p>
        To resolve a reference back to the declaration, use <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: IRef<IConstructor> ToRef()
    return:
      type: Metalama.Framework.Code.IRef{Metalama.Framework.Code.IConstructor}
      description: A compile-time serializable reference to the current declaration.
    content.vb: Function ToRef() As IRef(Of IConstructor)
  overload: Metalama.Framework.Code.IConstructor.ToRef*
  seealso:
  - linkId: Metalama.Framework.Code.IRef`1
    commentId: T:Metalama.Framework.Code.IRef`1
  - linkId: Metalama.Framework.Code.RefExtensions
    commentId: T:Metalama.Framework.Code.RefExtensions
  - linkId: Metalama.Framework.Code.IDeclaration.ToSerializableId
    commentId: M:Metalama.Framework.Code.IDeclaration.ToSerializableId
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
