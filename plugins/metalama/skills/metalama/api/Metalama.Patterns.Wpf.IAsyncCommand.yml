  summary: >-
    Represents an <xref href="System.Windows.Input.ICommand" data-throw-if-not-resolved="false"></xref> that executes asynchronously, providing properties to monitor execution state

    and methods to cancel running executions.
  remarks: >-
    <p>This interface extends both <xref href="System.Windows.Input.ICommand" data-throw-if-not-resolved="false"></xref> and <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> to enable

    data binding to command state properties in WPF applications.</p>
