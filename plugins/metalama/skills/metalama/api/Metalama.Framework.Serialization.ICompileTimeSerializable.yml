items:
- uid: Metalama.Framework.Serialization.ICompileTimeSerializable
  commentId: T:Metalama.Framework.Serialization.ICompileTimeSerializable
  id: ICompileTimeSerializable
  parent: Metalama.Framework.Serialization
  children: []
  langs:
  - csharp
  - vb
  name: ICompileTimeSerializable
  nameWithType: ICompileTimeSerializable
  fullName: Metalama.Framework.Serialization.ICompileTimeSerializable
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Serialization
  summary: >-
    Marks the implementing type as being serializable. Aspects and fabrics are typically serialized when they affect a different project than the current one (by inheritance

    or reference validation). Serialized objects may be deserialized on a different machine than the one on which they have been serialized, and

    a long time after.
  remarks: >-
    <p>When a type is marked as compile-time-serializable, all fields and automatic properties should be of a serializable type, except those
        annotated with the <xref href="Metalama.Framework.Serialization.NonCompileTimeSerializedAttribute" data-throw-if-not-resolved="false"></xref> custom attribute. </p>
    <p>The following system types are serializable: intrinsic types, arrays of serializable types, <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref>, <xref href="System.TimeSpan" data-throw-if-not-resolved="false"></xref>, <xref href="System.Globalization.CultureInfo" data-throw-if-not-resolved="false"></xref>, <xref href="System.Guid" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref>,
        <xref href="System.Collections.Generic.List%601" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Immutable.ImmutableArray%601" data-throw-if-not-resolved="false"></xref>, <xref href="System.Collections.Immutable.ImmutableDictionary%602" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>To serialize another system type, implement a <xref href="Metalama.Framework.Serialization.ReferenceTypeSerializer" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Serialization.ValueTypeSerializer%601" data-throw-if-not-resolved="false"></xref> and register it by
        adding a <xref href="Metalama.Framework.Serialization.ImportSerializerAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the types that uses it.</p>
    <p>To serialize an <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref>, use the <xref href="Metalama.Framework.Code.IDeclaration.ToRef" data-throw-if-not-resolved="false"></xref> method and store the <xref href="Metalama.Framework.Code.IRef%601" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface ICompileTimeSerializable
    content.vb: >-
      <CompileTime>

      Public Interface ICompileTimeSerializable
