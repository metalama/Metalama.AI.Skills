  type: Constructor
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Initializes a new instance of the <xref href="Metalama.Framework.Aspects.AspectOrderAttribute" data-throw-if-not-resolved="false"></xref> class that specified the order of execution

    of aspect layers. This constructor allows to specify the order of execution of individual layers.
  example: []
  syntax:
    content: public AspectOrderAttribute(AspectOrderDirection direction, params string[] orderedAspectLayers)
    parameters:
    - id: direction
      type: Metalama.Framework.Aspects.AspectOrderDirection
      description: >-
        The direction in which the aspect types are supplied. <xref href="Metalama.Framework.Aspects.AspectOrderDirection.RunTime" data-throw-if-not-resolved="false"></xref>
                    means that the <code class="paramref">orderedAspectLayers</code> parameter specifies the run-time execution order, which is more intuitive to aspect users.
                    <xref href="Metalama.Framework.Aspects.AspectOrderDirection.CompileTime" data-throw-if-not-resolved="false"></xref> means that the compile-time execution order is supplied, which is intuitive to aspect authors.
    - id: orderedAspectLayers
      type: System.String[]
      description: >-
        A list of layer names composed of the full name of the aspect type and the name
                    of the aspect layer. The following formats are allowed: <code>MyNamespace.MyAspectType</code> to match the default layer,
                    <code>MyNamespace.MyAspectType:MyLayer</code> to match a non-default layer, or <code>MyNamespace.MyAspectType:*</code> to match
                    all layers of an aspect.
    content.vb: Public Sub New(direction As AspectOrderDirection, ParamArray orderedAspectLayers As String())
  overload: Metalama.Framework.Aspects.AspectOrderAttribute.#ctor*
  nameWithType.vb: AspectOrderAttribute.New(AspectOrderDirection, ParamArray String())
  fullName.vb: Metalama.Framework.Aspects.AspectOrderAttribute.New(Metalama.Framework.Aspects.AspectOrderDirection, ParamArray String())
