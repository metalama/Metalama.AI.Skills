  name: AspectOrderAttribute(AspectOrderDirection, params Type[])
  nameWithType: AspectOrderAttribute.AspectOrderAttribute(AspectOrderDirection, params Type[])
  fullName: Metalama.Framework.Aspects.AspectOrderAttribute.AspectOrderAttribute(Metalama.Framework.Aspects.AspectOrderDirection, params System.Type[])
  type: Constructor
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Initializes a new instance of the <xref href="Metalama.Framework.Aspects.AspectOrderAttribute" data-throw-if-not-resolved="false"></xref> class that specifies the order of execution

    of aspects. This constructor does not allow multi-layer aspects to overlap each other. If aspects are composed

    of several layers, all layers of each aspect are ordered as a single group. To order layers individually, use

    the other constructor.
  example: []
  syntax:
    content: public AspectOrderAttribute(AspectOrderDirection direction, params Type[] orderedAspectTypes)
    parameters:
    - id: direction
      type: Metalama.Framework.Aspects.AspectOrderDirection
      description: >-
        The direction in which the aspect types are supplied. <xref href="Metalama.Framework.Aspects.AspectOrderDirection.RunTime" data-throw-if-not-resolved="false"></xref>
                    means that the <code class="paramref">orderedAspectTypes</code> parameter specifies the run-time execution order, which is more intuitive to aspect users.
                    <xref href="Metalama.Framework.Aspects.AspectOrderDirection.CompileTime" data-throw-if-not-resolved="false"></xref> means that the compile-time execution order is supplied, which is intuitive to aspect authors.
    - id: orderedAspectTypes
      type: System.Type[]
      description: A list of aspect types given the desired order of execution.
    content.vb: Public Sub New(direction As AspectOrderDirection, ParamArray orderedAspectTypes As Type())
  overload: Metalama.Framework.Aspects.AspectOrderAttribute.#ctor*
