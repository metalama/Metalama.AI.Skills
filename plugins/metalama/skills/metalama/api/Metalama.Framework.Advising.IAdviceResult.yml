  langs:
  - csharp
  - vb
  name: IAdviceResult
  nameWithType: IAdviceResult
  fullName: Metalama.Framework.Advising.IAdviceResult
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Represents the result of applying an advice (code transformation) through <xref href="Metalama.Framework.Aspects.AdviserExtensions" data-throw-if-not-resolved="false"></xref> methods.

    Check the <xref href="Metalama.Framework.Advising.IAdviceResult.Outcome" data-throw-if-not-resolved="false"></xref> property to determine whether the advice was successfully applied.
  remarks: >-
    <p>
        All advice methods in <xref href="Metalama.Framework.Aspects.AdviserExtensions" data-throw-if-not-resolved="false"></xref> return an <xref href="Metalama.Framework.Advising.IAdviceResult" data-throw-if-not-resolved="false"></xref> or a derived interface.
        The result provides information about:
        </p>
    <ul><li>
          <xref href="Metalama.Framework.Advising.IAdviceResult.AdviceKind" data-throw-if-not-resolved="false"></xref>: The type of transformation attempted (override, introduce, etc.)</li><li>
          <xref href="Metalama.Framework.Advising.IAdviceResult.Outcome" data-throw-if-not-resolved="false"></xref>: Whether the advice succeeded, was ignored, or encountered an error</li></ul>
    <p>
        Derived result interfaces (e.g., <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref>) provide additional properties
        such as the introduced declaration or specific outcome details.
        </p>
    <p>
      <b>Typical usage:</b> Check the <xref href="Metalama.Framework.Advising.IAdviceResult.Outcome" data-throw-if-not-resolved="false"></xref> property after applying advice to determine if follow-up
        actions are needed or to conditionally proceed based on success/failure.
        </p>
  example:
  - >-
    <pre><code class="lang-csharp">var result = builder.IntroduceMethod(nameof(MyMethod));

    if (result.Outcome == AdviceOutcome.Success)

    {
        // Use result.Declaration to reference the introduced method
    }</code></pre>
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IAdviceResult
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IAdviceResult
