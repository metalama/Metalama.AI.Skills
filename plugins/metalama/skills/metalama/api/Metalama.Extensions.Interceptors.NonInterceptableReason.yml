  langs:
  - csharp
  - vb
  name: NonInterceptableReason
  nameWithType: NonInterceptableReason
  fullName: Metalama.Extensions.Interceptors.NonInterceptableReason
  type: Enum
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Reasons why a site that matches a registration cannot be intercepted in this version.
  remarks: >-
    <p>

    Later versions can append members to this enumeration. A version that lifts a limitation stops reporting its member, but keeps the member,

    so that the enumeration stays binary compatible. A provider that tests the reason must therefore expect values that it does not know.

    </p>

    <p>

    This version does not report <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.UnnameableType" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.CovariantArrayElementReceiver" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.RequiresNewerLanguageVersion" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.ReceiverReassignedByArguments" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.MethodReferenceRequiresMaterializedDefaults" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.DelegateEqualityRequired" data-throw-if-not-resolved="false"></xref>. They concern interceptors that

    later versions generate from templates.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public enum NonInterceptableReason
    content.vb: >-
      <CompileTime>

      Public Enum NonInterceptableReason
  attributes:
  - type: Metalama.Framework.Aspects.CompileTimeAttribute
    ctor: Metalama.Framework.Aspects.CompileTimeAttribute.#ctor
    arguments: []
