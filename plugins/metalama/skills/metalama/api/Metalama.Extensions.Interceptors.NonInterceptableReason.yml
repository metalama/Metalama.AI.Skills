  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The site is in a lambda that is converted to an expression tree, for instance in a query over <xref href="System.Linq.IQueryable" data-throw-if-not-resolved="false"></xref>. The

    compiler does not emit a call for the site, but an expression that describes it, which a library interprets or translates, so the site

    cannot be redirected.
  example: []
  syntax:
    content: ExpressionTree = 15
    return:
      type: Metalama.Extensions.Interceptors.NonInterceptableReason
