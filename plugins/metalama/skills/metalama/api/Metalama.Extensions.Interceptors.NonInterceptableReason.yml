  type: Field
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The method-reference site is the handler of <code>+=</code> or <code>-=</code> on an event, and the result would need a wrapper, which creates a

    delegate that no other delegate equals, so <code>-=</code> could not remove the handler.
  example: []
  syntax:
    content: DelegateEqualityRequired = 14
    return:
      type: Metalama.Extensions.Interceptors.NonInterceptableReason
