- uid: Metalama.Framework.Code.SyntaxBuilders.INotNullExpressionBuilder
  commentId: T:Metalama.Framework.Code.SyntaxBuilders.INotNullExpressionBuilder
  id: INotNullExpressionBuilder
  parent: Metalama.Framework.Code.SyntaxBuilders
  children: []
  langs:
  - csharp
  - vb
  name: INotNullExpressionBuilder
  nameWithType: INotNullExpressionBuilder
  fullName: Metalama.Framework.Code.SyntaxBuilders.INotNullExpressionBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: An <xref href="Metalama.Framework.Code.SyntaxBuilders.IExpressionBuilder" data-throw-if-not-resolved="false"></xref> that is guaranteed to produce a non-null expression value.
  remarks: >-
    <p>
        This interface is a specialization of <xref href="Metalama.Framework.Code.SyntaxBuilders.IExpressionBuilder" data-throw-if-not-resolved="false"></xref> that indicates the builder will always produce
        a non-null result. This allows the <xref href="Metalama.Framework.Code.SyntaxBuilders.ExpressionBuilderExtensions.ToValue(Metalama.Framework.Code.SyntaxBuilders.INotNullExpressionBuilder)" data-throw-if-not-resolved="false"></xref> extension
        method to return a non-nullable <code>dynamic</code> instead of <code>dynamic?</code>.
        </p>
    <p>
        Builders like <xref href="Metalama.Framework.Code.SyntaxBuilders.ArrayBuilder" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.SyntaxBuilders.InterpolatedStringBuilder" data-throw-if-not-resolved="false"></xref> implement this interface because
        they always produce valid, non-null expressions (arrays and interpolated strings are never null).
        </p>
  example: []
  syntax:
    content: 'public interface INotNullExpressionBuilder : IExpressionBuilder'
    content.vb: Public Interface INotNullExpressionBuilder Inherits IExpressionBuilder
