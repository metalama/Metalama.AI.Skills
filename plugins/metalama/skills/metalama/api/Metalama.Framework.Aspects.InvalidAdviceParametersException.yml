  fullName: Metalama.Framework.Aspects.InvalidAdviceParametersException
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    An exception thrown by <xref href="Metalama.Framework.Advising.IAdviceFactory" data-throw-if-not-resolved="false"></xref> methods when the parameters passed to an advice method

    are invalid or incompatible with the target declaration.
  remarks: >-
    <p>
        This exception is thrown at compile time when an aspect's <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method
        calls an advice factory method (such as <xref href="Metalama.Framework.Aspects.AdviserExtensions.Override(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IFieldOrProperty%7d%2cSystem.String%2cSystem.Object)?text=Override" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceMethod(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IMethodBuilder%7d%2cSystem.Object%2cSystem.Object)?text=IntroduceMethod" data-throw-if-not-resolved="false"></xref>)
        with parameters that are not valid for the target declaration.
        </p>
    <p>
        Common causes include:
        </p>
    <ul><li>Specifying a template name that does not exist in the aspect class.</li><li>Passing incompatible tag values or compile-time arguments.</li><li>Using an <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> that is not applicable to the target.</li></ul>
  example: []
