- uid: Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod
  commentId: P:Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod
  id: CanExecuteMethod
  parent: Metalama.Patterns.Wpf.CommandAttribute
  langs:
  - csharp
  - vb
  name: CanExecuteMethod
  nameWithType: CommandAttribute.CanExecuteMethod
  fullName: Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    Gets or sets the name of the method that is called to determine whether the command can be executed.

    This method corresponds to the <xref href="System.Windows.Input.ICommand.CanExecute(System.Object)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>

    The <code>CanExecute</code> method must be declared in the same class as the command property, return a <code>bool</code> value and can have zero or one parameter.

    </p>

    <p>

    If this property is not set, then the aspect will look for a method named <code>CanFoo</code> or <code>CanExecuteFoo</code>, where <code>Foo</code> is the name of the command without the <code>Command</code> suffix.

    </p>

    <p>

    At most one of the <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteProperty" data-throw-if-not-resolved="false"></xref> properties may be set.

    </p>
  example: []
  syntax:
    content: public string? CanExecuteMethod { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property CanExecuteMethod As String
  overload: Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod*
