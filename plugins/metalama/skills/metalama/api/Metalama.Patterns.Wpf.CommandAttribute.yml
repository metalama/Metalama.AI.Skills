  summary: >-
    Aspect that generates a WPF command property from a method. When applied to a method, it introduces an <xref href="System.Windows.Input.ICommand" data-throw-if-not-resolved="false"></xref>

    property that invokes the method when executed. The aspect supports synchronous commands, asynchronous commands (returning <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>),

    and background commands.
  remarks: >-
    <p>The target method becomes the implementation of <xref href="System.Windows.Input.ICommand.Execute(System.Object)" data-throw-if-not-resolved="false"></xref>. It must have one of the following signatures:

    <code>void Execute()</code>, <code>void Execute(T)</code>, <code>Task ExecuteAsync()</code>, <code>Task ExecuteAsync(T)</code>,

    or variants with a <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref> parameter.</p>

    <p>An optional <code>CanExecute</code> property or method can be associated with the command to control when it can be executed.

    The association can be implicit (based on naming conventions like <code>CanFoo</code>, <code>CanExecuteFoo</code>, or <code>IsFooEnabled</code>)

    or explicit (via <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteProperty" data-throw-if-not-resolved="false"></xref>).</p>

    <p>When the containing type implements <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> and a <code>CanExecute</code> property is used,

    the <xref href="System.Windows.Input.ICommand.CanExecuteChanged" data-throw-if-not-resolved="false"></xref> event is automatically raised when the property changes.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      public sealed class CommandAttribute : Attribute, IAspect<IMethod>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IMethod>
