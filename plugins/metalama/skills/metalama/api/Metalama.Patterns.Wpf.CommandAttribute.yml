- uid: Metalama.Patterns.Wpf.CommandAttribute.EnableINotifyPropertyChangedIntegration
  commentId: P:Metalama.Patterns.Wpf.CommandAttribute.EnableINotifyPropertyChangedIntegration
  id: EnableINotifyPropertyChangedIntegration
  parent: Metalama.Patterns.Wpf.CommandAttribute
  langs:
  - csharp
