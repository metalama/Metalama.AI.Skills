  name: EnableINotifyPropertyChangedIntegration
  nameWithType: CommandAttribute.EnableINotifyPropertyChangedIntegration
  fullName: Metalama.Patterns.Wpf.CommandAttribute.EnableINotifyPropertyChangedIntegration
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: Gets or sets a value indicating whether integration with <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> is enabled. The default is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>.
  remarks: >-
    <p>

    When <xref href="Metalama.Patterns.Wpf.CommandAttribute.EnableINotifyPropertyChangedIntegration" data-throw-if-not-resolved="false"></xref> is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> (the default), and when a can-execute property (not a method) is used,

    and when the containing type of the target property implements <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref>,then the <xref href="System.Windows.Input.ICommand.CanExecuteChanged" data-throw-if-not-resolved="false"></xref> event of 

    the command will be raised when the can-execute property changes. A warning is reported if the can-execute property is not public because <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref>

    implementations typically only notify changes to public properties.

    </p>
  example: []
  syntax:
    content: public bool? EnableINotifyPropertyChangedIntegration { get; set; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: Public Property EnableINotifyPropertyChangedIntegration As Boolean?
  overload: Metalama.Patterns.Wpf.CommandAttribute.EnableINotifyPropertyChangedIntegration*
- uid: Metalama.Patterns.Wpf.CommandAttribute.SupportsConcurrentExecution
  commentId: P:Metalama.Patterns.Wpf.CommandAttribute.SupportsConcurrentExecution
  id: SupportsConcurrentExecution
  parent: Metalama.Patterns.Wpf.CommandAttribute
  langs:
  - csharp
  - vb
  name: SupportsConcurrentExecution
  nameWithType: CommandAttribute.SupportsConcurrentExecution
  fullName: Metalama.Patterns.Wpf.CommandAttribute.SupportsConcurrentExecution
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    Gets or sets a value indicating whether several executions of the command can run concurrently. This property is only considered for asynchronous methods.

    Its default value is <code>false</code>, which means that the <xref href="System.Windows.Input.ICommand.CanExecute(System.Object)" data-throw-if-not-resolved="false"></xref> method will return <code>false</code> if another execution is still running.

    This property is ignored if the execution method is non-<xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> and the <xref href="Metalama.Patterns.Wpf.CommandAttribute.Background" data-throw-if-not-resolved="false"></xref> property is left to <code>false</code>.
  remarks: >-
    <p>When <xref href="Metalama.Patterns.Wpf.CommandAttribute.SupportsConcurrentExecution" data-throw-if-not-resolved="false"></xref> is <code>true</code>, the <xref href="Metalama.Patterns.Wpf.BaseAsyncDelegateCommand.ExecutionTask" data-throw-if-not-resolved="false"></xref> is set

    to the last started task, and the <xref href="Metalama.Patterns.Wpf.BaseAsyncDelegateCommand.Cancel" data-throw-if-not-resolved="false"></xref> only cancels the last started task. To track or cancel individual executions,

    use the <xref href="Metalama.Patterns.Wpf.DelegateCommandExecution" data-throw-if-not-resolved="false"></xref> returned by the <xref href="Metalama.Patterns.Wpf.AsyncDelegateCommand.Execute" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
  syntax:
    content: public bool SupportsConcurrentExecution { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property SupportsConcurrentExecution As Boolean
  overload: Metalama.Patterns.Wpf.CommandAttribute.SupportsConcurrentExecution*
- uid: Metalama.Patterns.Wpf.CommandAttribute.Background
  commentId: P:Metalama.Patterns.Wpf.CommandAttribute.Background
  id: Background
  parent: Metalama.Patterns.Wpf.CommandAttribute
  langs:
  - csharp
  - vb
  name: Background
  nameWithType: CommandAttribute.Background
  fullName: Metalama.Patterns.Wpf.CommandAttribute.Background
  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    Gets or sets a value indicating whether the command will execute in a background thread. The default value is <code>false</code>, meaning that the command will be

    executed in the UI thread. If this property is set to <code>true</code>, a property of type <xref href="Metalama.Patterns.Wpf.AsyncDelegateCommand" data-throw-if-not-resolved="false"></xref> is generated,

    even for non-<xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> execution methods.
  example: []
  syntax:
    content: public bool Background { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property Background As Boolean
  overload: Metalama.Patterns.Wpf.CommandAttribute.Background*
