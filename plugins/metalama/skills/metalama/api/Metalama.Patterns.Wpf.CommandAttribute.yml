  type: Property
  assemblies:
  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    Gets or sets the name of the property that is evaluated to determine whether the command can be executed.

    This property corresponds to the <xref href="System.Windows.Input.ICommand.CanExecute(System.Object)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>

    The <code>CanExecute</code> property must be declared in the same class as the command property and return a <code>bool</code> value.

    </p>

    <p>

    If this property is not set, then the aspect will look for a property named <code>CanFoo</code> or <code>CanExecuteFoo</code>, where <code>Foo</code> is the name of the command without the <code>Command</code> suffix.

    </p>

    <p>

    At most one of the <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteMethod" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Patterns.Wpf.CommandAttribute.CanExecuteProperty" data-throw-if-not-resolved="false"></xref> properties may be set.

    </p>
  example: []
