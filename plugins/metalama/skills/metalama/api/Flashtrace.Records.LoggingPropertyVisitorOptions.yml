  example: []
  syntax:
    content: public LoggingPropertyVisitorOptions(bool onlyInherited = false, bool includeInherited = false, bool onlyRendered = false)
    parameters:
    - id: onlyInherited
      type: System.Boolean
      description: >-
        Determines if only inherited properties (those with the
                    <xref href="Flashtrace.Records.LoggingPropertyOptions.IsInherited" data-throw-if-not-resolved="false"></xref> flag set to <code>true</code>) must be visited.
    - id: includeInherited
      type: System.Boolean
      description: >-
        Determines if inherited properties must be included. This flag is taken into account by the visitors implemented on the logging contexts
                    only. It is ignored by other visiting methods.
    - id: onlyRendered
      type: System.Boolean
      description: Determines if only rendered properties must be visited.
