- uid: Metalama.Framework.Aspects.IntroduceAttribute.WhenExists
  commentId: P:Metalama.Framework.Aspects.IntroduceAttribute.WhenExists
  id: WhenExists
  parent: Metalama.Framework.Aspects.IntroduceAttribute
  langs:
  - csharp
  - vb
  name: WhenExists
  nameWithType: IntroduceAttribute.WhenExists
  fullName: Metalama.Framework.Aspects.IntroduceAttribute.WhenExists
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets the strategy to use when a member with the same name already exists in the target type.
  remarks: >-
    <p>
        The default value is <xref href="Metalama.Framework.Aspects.OverrideStrategy.Fail" data-throw-if-not-resolved="false"></xref>, which reports an error when a conflict is detected.
        Other options include:
        <ul><li><xref href="Metalama.Framework.Aspects.OverrideStrategy.Override" data-throw-if-not-resolved="false"></xref>: Replace the existing member with the introduced one</li><li><xref href="Metalama.Framework.Aspects.OverrideStrategy.Ignore" data-throw-if-not-resolved="false"></xref>: Skip introducing the member without reporting an error</li><li><xref href="Metalama.Framework.Aspects.OverrideStrategy.New" data-throw-if-not-resolved="false"></xref>: Introduce the member with the <code>new</code> modifier, hiding the existing member</li></ul></p>
  example: []
  syntax:
    content: public OverrideStrategy WhenExists { get; set; }
    parameters: []
    return:
      type: Metalama.Framework.Aspects.OverrideStrategy
    content.vb: Public Property WhenExists As OverrideStrategy
  overload: Metalama.Framework.Aspects.IntroduceAttribute.WhenExists*
