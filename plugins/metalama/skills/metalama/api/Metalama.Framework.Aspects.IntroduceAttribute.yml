  name: IntroduceAttribute
  nameWithType: IntroduceAttribute
  fullName: Metalama.Framework.Aspects.IntroduceAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Marks a member in an aspect class to be introduced (added) to the target type.
  remarks: >-
    <p>
        This attribute enables <i>declarative member introduction</i>, the simplest way to add members through aspects.
        When applied to a method, property, field, or event in an aspect class, that member is automatically introduced
        into the target type when the aspect is applied.
        </p>
    <p>
        The introduced member is based on a T# template - compile-time logic executes to generate the run-time code.
        Properties like <xref href="Metalama.Framework.Aspects.IntroduceAttribute.Name" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.IntroduceAttribute.Accessibility" data-throw-if-not-resolved="false"></xref>, and <xref href="Metalama.Framework.Aspects.IntroduceAttribute.IsVirtual" data-throw-if-not-resolved="false"></xref> allow you to
        customize the introduced member's characteristics. When not set, these properties default to the values from
        the template member.
        </p>
    <p>
        Use <xref href="Metalama.Framework.Aspects.IntroduceAttribute.WhenExists" data-throw-if-not-resolved="false"></xref> to control behavior when a member with the same name already exists in the target type.
        The default is <xref href="Metalama.Framework.Aspects.OverrideStrategy.Fail" data-throw-if-not-resolved="false"></xref>, which reports an error.
        </p>
    <p>
        For programmatic member introduction with more control, use <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceMethod(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IMethodBuilder%7d%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceProperty(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IPropertyBuilder%7d%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceField(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IFieldBuilder%7d%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, or
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceEvent(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IEventBuilder%7d%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> in the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event)]

      public sealed class IntroduceAttribute : DeclarativeAdviceAttribute, ITemplateAttribute, IAdviceAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.Event)>

      Public NotInheritable Class IntroduceAttribute Inherits DeclarativeAdviceAttribute Implements ITemplateAttribute, IAdviceAttribute
