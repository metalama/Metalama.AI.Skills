- uid: Metalama.Framework.Code.ConstructorInitializerKind.None
  commentId: F:Metalama.Framework.Code.ConstructorInitializerKind.None
  id: None
  parent: Metalama.Framework.Code.ConstructorInitializerKind
  langs:
  - csharp
  - vb
  name: None
  nameWithType: ConstructorInitializerKind.None
  fullName: Metalama.Framework.Code.ConstructorInitializerKind.None
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    The constructor has no initializer calling a base or sibling constructor. This applies to value types (structs)

    and static constructors, which never have a <code>base</code> or <code>this</code> initializer. For instance constructors of reference types (classes),

    the C# compiler always implicitly calls a base constructor, so <xref href="Metalama.Framework.Code.ConstructorInitializerKind.Base" data-throw-if-not-resolved="false"></xref> is returned instead.
  example: []
  syntax:
    content: None = 0
    return:
      type: Metalama.Framework.Code.ConstructorInitializerKind
- uid: Metalama.Framework.Code.ConstructorInitializerKind.Base
