  fullName: Metalama.Framework.Code.ConstructorInitializerKind.Base
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    The constructor invokes a constructor of the base class, either explicitly via a <code>: base(...)</code> initializer

    or implicitly when the instance constructor has no explicit initializer and the declaring type is a reference type.
  example: []
  syntax:
    content: Base = 1
    return:
      type: Metalama.Framework.Code.ConstructorInitializerKind
