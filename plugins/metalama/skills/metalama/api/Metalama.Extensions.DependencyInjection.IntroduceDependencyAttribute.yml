  summary: >-
    Builds the aspect, i.e. translates the current declarative advice into a programmatic advice or possibly diagnostics

    and validators. In case of error, the implementation must report diagnostics and call <xref href="Metalama.Framework.Aspects.IAspectBuilder.SkipAspect" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public override sealed void BuildAdvice(IMemberOrNamedType templateMember, string templateMemberId, IAspectBuilder<IDeclaration> builder)
    parameters:
    - id: templateMember
      type: Metalama.Framework.Code.IMemberOrNamedType
      description: The member or type to which the current attribute is applied.
    - id: templateMemberId
      type: System.String
      description: >-
        The a value that represents <code class="paramref">templateMember</code> and that must be supplied to <xref href="Metalama.Framework.Advising.IAdviceFactory" data-throw-if-not-resolved="false"></xref>.
                        It is not actually the name, but a unique identifier of <code class="paramref">templateMember</code>.
    - id: builder
      type: Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IDeclaration}
      description: An <xref href="Metalama.Framework.Aspects.IAspectBuilder%601" data-throw-if-not-resolved="false"></xref>.
