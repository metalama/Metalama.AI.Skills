  name: IntroduceDependencyAttribute
  nameWithType: IntroduceDependencyAttribute
  fullName: Metalama.Extensions.DependencyInjection.IntroduceDependencyAttribute
  type: Class
  assemblies:
  - Metalama.Extensions.DependencyInjection
  namespace: Metalama.Extensions.DependencyInjection
  summary: >-
    Marks a field or property in an aspect as a service dependency to be introduced into the target type.

    This attribute is used in an aspect class to introduce dependencies, whereas <xref href="Metalama.Extensions.DependencyInjection.DependencyAttribute" data-throw-if-not-resolved="false"></xref> is used in user code.
  remarks: >-
    <p>

    When applied to a field or property within an aspect, this advice will introduce a corresponding dependency into the

    target type and implement the injection logic according to the configured DI framework. This allows aspects to declare

    dependencies that will be automatically injected into types where the aspect is applied.

    </p>

    <p>

    The implementation of dependency injection depends on the selected framework, which can be configured using

    <xref href="Metalama.Extensions.DependencyInjection.DependencyInjectionExtensions.ConfigureDependencyInjection(Metalama.Framework.Fabrics.IQuery%7bMetalama.Framework.Code.ICompilation%7d%2cSystem.Action%7bMetalama.Extensions.DependencyInjection.DependencyInjectionOptionsBuilder%7d)" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Property|AttributeTargets.Field)]

      public class IntroduceDependencyAttribute : DeclarativeAdviceAttribute, IAdviceAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.PropertyOrAttributeTargets.Field)>

      Public Class IntroduceDependencyAttribute Inherits DeclarativeAdviceAttribute Implements IAdviceAttribute
