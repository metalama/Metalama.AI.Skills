  name: RequireAspectWeaverAttribute
  nameWithType: RequireAspectWeaverAttribute
  fullName: Metalama.Framework.Aspects.RequireAspectWeaverAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Binds an aspect class to a low-level weaver implementation built with <code>Metalama.Framework.Sdk</code>.

    When this attribute is applied to an aspect class, the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method is bypassed

    and the specified weaver handles all transformations instead.
  remarks: >-
    <p>
        Use this attribute when you need to perform C# code transformations that are not possible with the standard
        <xref href="Metalama.Framework.Aspects.IAspectBuilder" data-throw-if-not-resolved="false"></xref> advice API and require direct access to the Roslyn API.
        </p>
    <p>
        The weaver type must:
        </p>
    <ul><li>Implement <code>IAspectWeaver</code> from the <code>Metalama.Framework.Engine.AspectWeavers</code> namespace.</li><li>Be annotated with <code>[MetalamaPlugIn]</code>.</li><li>Have a public parameterless constructor.</li></ul>

    <p>
        Although <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> is not called, <xref href="Metalama.Framework.Eligibility.IEligible%601.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref>
        is still invoked, allowing you to define eligibility rules as usual.
        </p>
    <p>
      <b>Warning:</b> Weaver-based aspects are significantly more complex to implement, have worse IDE integration,
        and have a significant performance impact. Prefer the standard aspect approach when possible.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class)]

      [CompileTime]

      public sealed class RequireAspectWeaverAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class)>

