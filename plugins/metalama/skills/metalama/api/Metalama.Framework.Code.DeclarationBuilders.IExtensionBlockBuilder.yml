- uid: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder
  commentId: T:Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder
  id: IExtensionBlockBuilder
  parent: Metalama.Framework.Code.DeclarationBuilders
  children:
  - Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder.ReceiverParameter
  langs:
  - csharp
  - vb
  name: IExtensionBlockBuilder
  nameWithType: IExtensionBlockBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Builder for introducing a new extension block. Inherits from <xref href="Metalama.Framework.Code.DeclarationBuilders.INamedTypeBuilder" data-throw-if-not-resolved="false"></xref>

    to allow introducing members, but restricts operations that are not valid for extension blocks.
  remarks: >-
    <p>Extension blocks have the following restrictions compared to regular named types:</p>

    <ul><li>Cannot have a base type (always throws on <xref href="Metalama.Framework.Code.DeclarationBuilders.INamedTypeBuilder.BaseType" data-throw-if-not-resolved="false"></xref> setter).</li><li>The <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.Name" data-throw-if-not-resolved="false"></xref> property is used internally to generate deterministic file names for the design-time syntax tree. It is automatically assigned if not set.</li><li>Cannot set accessibility (extension blocks don't have access modifiers).</li><li>Cannot be abstract, sealed, or partial.</li><li>Cannot contain fields (will fail at advice execution time).</li><li>Cannot contain auto-properties (will fail at advice execution time).</li><li>Cannot contain nested types (will fail at advice execution time).</li><li>Cannot contain constructors (will fail at advice execution time).</li></ul>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IExtensionBlockBuilder : INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, IExtensionBlock, INamedType, IType, IEquatable<IType>, IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>, IEquatable<INamedType>
    content.vb: >-
      <InternalImplement>

      Public Interface IExtensionBlockBuilder Inherits INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, IExtensionBlock, INamedType, IType, IEquatable(Of IType), IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration), IEquatable(Of INamedType)
