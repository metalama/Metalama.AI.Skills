- uid: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder.ReceiverParameter
  commentId: P:Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder.ReceiverParameter
  id: ReceiverParameter
  parent: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder
  langs:
  - csharp
  - vb
  name: ReceiverParameter
  nameWithType: IExtensionBlockBuilder.ReceiverParameter
  fullName: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder.ReceiverParameter
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Gets the receiver parameter builder. Use this to configure the receiver type and name.
  remarks: >-
    <p>
        To create a <b>static extension</b> (members appear as static members of the extended type),
        set <xref href="Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder.Name" data-throw-if-not-resolved="false"></xref> to <code>null</code> or empty string.
        </p>
    <p>
        To create an <b>instance extension</b> (members appear as instance members of the extended type),
        set <xref href="Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder.Name" data-throw-if-not-resolved="false"></xref> to a non-empty string (e.g., "self", "value").
        </p>
    <p>
        The <xref href="Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder.Type" data-throw-if-not-resolved="false"></xref> property specifies the type being extended.
        </p>
  example: []
  syntax:
    content: IParameterBuilder ReceiverParameter { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder
    content.vb: ReadOnly Property ReceiverParameter As IParameterBuilder
  overload: Metalama.Framework.Code.DeclarationBuilders.IExtensionBlockBuilder.ReceiverParameter*
