  summary: >-
    Determines if a given declaration is a child of another given declaration, using the <xref href="Metalama.Framework.Code.IDeclaration.ContainingDeclaration" data-throw-if-not-resolved="false"></xref>

    relationship for all declarations except for named type, where the parent namespace is considered.
  example: []
  syntax:
    content: public static bool IsContainedIn(this IDeclaration declaration, IDeclaration containingDeclaration)
    parameters:
    - id: declaration
      type: Metalama.Framework.Code.IDeclaration
      description: The declaration to check.
    - id: containingDeclaration
      type: Metalama.Framework.Code.IDeclaration
      description: The potential containing declaration.
    return:
      type: System.Boolean
      description: <code>true</code> if <code class="paramref">declaration</code> is contained in <code class="paramref">containingDeclaration</code>; otherwise, <code>false</code>.
    content.vb: Public Shared Function IsContainedIn(declaration As IDeclaration, containingDeclaration As IDeclaration) As Boolean
  overload: Metalama.Framework.Code.DeclarationExtensions.IsContainedIn*
