items:
- uid: Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
  commentId: T:Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
  id: IEnumMemberBuilder
  parent: Metalama.Framework.Code.DeclarationBuilders
  children: []
  langs:
  - csharp
  - vb
  name: IEnumMemberBuilder
  nameWithType: IEnumMemberBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IEnumMemberBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Allows to add custom attributes to a member of an enum that has been created by one of the <code>AddMember</code>

    methods of <xref href="Metalama.Framework.Code.DeclarationBuilders.IEnumBuilder" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        This interface declares no member of its own. It exists for the custom attributes that
        <xref href="Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder" data-throw-if-not-resolved="false"></xref> declares. The custom attributes are all that remains to be chosen once a
        member is added, because its name and its value are arguments of <code>AddMember</code>.
        </p>
    <p>
        A member of an enum is a constant field, and the code model reports it as an <xref href="Metalama.Framework.Code.IField" data-throw-if-not-resolved="false"></xref> once the enum is
        introduced. This interface is nevertheless not an <xref href="Metalama.Framework.Code.DeclarationBuilders.IFieldBuilder" data-throw-if-not-resolved="false"></xref>: a member of an enum has no type of
        its own, no accessibility of its own, no initializer and no modifier, so almost every operation of a field builder
        would be invalid on it.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IEnumMemberBuilder : IDeclarationBuilder, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>
    content.vb: >-
      <InternalImplement>

      Public Interface IEnumMemberBuilder Inherits IDeclarationBuilder, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration)
