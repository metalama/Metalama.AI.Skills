- uid: Metalama.Framework.Code.IFieldOrProperty.InitializerExpression
  commentId: P:Metalama.Framework.Code.IFieldOrProperty.InitializerExpression
  id: InitializerExpression
  parent: Metalama.Framework.Code.IFieldOrProperty
  langs:
  - csharp
  - vb
  name: InitializerExpression
  nameWithType: IFieldOrProperty.InitializerExpression
  fullName: Metalama.Framework.Code.IFieldOrProperty.InitializerExpression
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the initializer expression (i.e. the expression at the right hand of the equal sign), if any.

    When the field or property is defined in source code, this property returns an <xref href="Metalama.Framework.Code.ISourceExpression" data-throw-if-not-resolved="false"></xref>, which

    exposes a <xref href="Metalama.Framework.Code.TypedConstant" data-throw-if-not-resolved="false"></xref> when possible.
  example: []
  syntax:
    content: IExpression? InitializerExpression { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IExpression
    content.vb: ReadOnly Property InitializerExpression As IExpression
  overload: Metalama.Framework.Code.IFieldOrProperty.InitializerExpression*
