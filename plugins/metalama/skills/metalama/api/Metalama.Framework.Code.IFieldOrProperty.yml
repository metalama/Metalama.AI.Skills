    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
- uid: Metalama.Framework.Code.IFieldOrProperty.IsAutoPropertyOrField
  commentId: P:Metalama.Framework.Code.IFieldOrProperty.IsAutoPropertyOrField
  id: IsAutoPropertyOrField
  parent: Metalama.Framework.Code.IFieldOrProperty
  langs:
  - csharp
  - vb
  name: IsAutoPropertyOrField
  nameWithType: IFieldOrProperty.IsAutoPropertyOrField
  fullName: Metalama.Framework.Code.IFieldOrProperty.IsAutoPropertyOrField
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the declaration is an auto-property or a field, or <code>null</code> if the

    implementation of the property cannot be determined, for instance for properties in a referenced assembly.
  remarks: >-
    When an automatic property has been overridden, this property will still return <code>true</code>, even if the actual

    property implementation no longer corresponds to the one of an automatic property.
  example: []
  syntax:
    content: bool? IsAutoPropertyOrField { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
    content.vb: ReadOnly Property IsAutoPropertyOrField As Boolean?
  overload: Metalama.Framework.Code.IFieldOrProperty.IsAutoPropertyOrField*
