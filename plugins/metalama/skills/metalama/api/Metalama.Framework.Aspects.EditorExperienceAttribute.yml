  summary: >-
    Gets or sets the title of the code refactoring menu item that applies the aspect as a live template. By default, the title is <code>Apply Foo</code> if the aspect class is named <code>FooAttribute</code>.

    To organize several aspects into sub-menus, use the vertical pipe (<code>|</code>) to separate the different menu levels.
