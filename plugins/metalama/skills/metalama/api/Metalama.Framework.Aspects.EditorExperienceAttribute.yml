- uid: Metalama.Framework.Aspects.EditorExperienceAttribute.SuggestAsLiveTemplate
  commentId: P:Metalama.Framework.Aspects.EditorExperienceAttribute.SuggestAsLiveTemplate
  id: SuggestAsLiveTemplate
  parent: Metalama.Framework.Aspects.EditorExperienceAttribute
  langs:
