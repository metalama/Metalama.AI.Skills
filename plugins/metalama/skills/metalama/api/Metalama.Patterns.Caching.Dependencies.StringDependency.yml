  summary: A cache dependency that is already represented as a string.
  remarks: >-
    <p>Use this class to represent singleton or global dependencies that don't have a corresponding object

    (for example, "ProductList" or "PriceList" dependencies that represent entire collections).</p>

    <p>For object-based dependencies, consider using <xref href="Metalama.Patterns.Caching.Dependencies.ObjectDependency" data-throw-if-not-resolved="false"></xref> instead.</p>
