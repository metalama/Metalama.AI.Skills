  name: ObservedExpressionsAttribute
  nameWithType: ObservedExpressionsAttribute
  fullName: Metalama.Patterns.Observability.ObservedExpressionsAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability
  summary: >-
    Attribute generated by the <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect on <code>OnChildPropertyChanged</code> and

    <code>OnObservablePropertyChanged</code> methods, indicating which property expressions are observed by these methods.
  remarks: >-
    <p>

    This attribute forms a contract between base types and derived types in class hierarchies. It informs derived

    types about which properties the base class monitors for changes, allowing derived classes to efficiently add

    their own change handling logic.

    </p>

    <p>

    The <code>OnChildPropertyChanged</code> method is called when a property of a child object (i.e., an object stored

    in a field or property of the current type) has changed. The <code>OnObservablePropertyChanged</code> method is called

    when a property implementing <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> has changed, providing

    both the old and new values to allow derived classes to subscribe and unsubscribe from change events.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method)]

      public sealed class ObservedExpressionsAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Method)>

      Public NotInheritable Class ObservedExpressionsAttribute Inherits Attribute
