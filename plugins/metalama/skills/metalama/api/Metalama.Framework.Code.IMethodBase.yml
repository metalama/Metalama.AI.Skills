- uid: Metalama.Framework.Code.IMethodBase.ToMethodBase
  commentId: M:Metalama.Framework.Code.IMethodBase.ToMethodBase
  id: ToMethodBase
  parent: Metalama.Framework.Code.IMethodBase
  langs:
  - csharp
  - vb
  name: ToMethodBase()
  nameWithType: IMethodBase.ToMethodBase()
  fullName: Metalama.Framework.Code.IMethodBase.ToMethodBase()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> that represents the current method or constructor at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> object (either
        <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref> or <xref href="System.Reflection.ConstructorInfo" data-throw-if-not-resolved="false"></xref>) for the current
        method or constructor. For more specific return types, use <xref href="Metalama.Framework.Code.IMethod.ToMethodInfo" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Code.IConstructor.ToConstructorInfo" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        While Metalama is designed to eliminate the need for reflection in most scenarios, this method is useful
        when you need to pass method metadata to APIs that require <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on method names and signatures, and may break if your
        project is obfuscated. Consider using method invokers (see <code>IMethod.Invoke</code>) when possible, as this approach
        is obfuscation-safe.
        </p>
  example: []
  syntax:
    content: MethodBase ToMethodBase()
    return:
      type: System.Reflection.MethodBase
      description: A <xref href="System.Reflection.MethodBase" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToMethodBase() As MethodBase
  overload: Metalama.Framework.Code.IMethodBase.ToMethodBase*
  seealso:
