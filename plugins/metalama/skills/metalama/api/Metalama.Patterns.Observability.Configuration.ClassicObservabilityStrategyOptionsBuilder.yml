  namespace: Metalama.Patterns.Observability.Configuration
  summary: Builder for configuring options specific to the classic (default) implementation strategy of the <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>

    The classic strategy generates code that follows standard MVVM patterns with an <code>OnPropertyChanged</code> method

    and support for child object monitoring through <code>OnChildPropertyChanged</code> and <code>OnObservablePropertyChanged</code> methods.

    </p>
