  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Tries to gets the value of an argument given its name, considering both <xref href="Metalama.Framework.Code.IAttributeData.NamedArguments" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.IAttributeData.ConstructorArguments" data-throw-if-not-resolved="false"></xref>.

    For constructor arguments, the name of the corresponding parameter is taken into account. Comparisons are case-insensitive.

    In case of ambiguity, the first match wins.
  example: []
  syntax:
    content: public static T? GetArgumentValue<T>(this IAttribute attribute, string name, T? defaultValue = default)
    parameters:
    - id: attribute
      type: Metalama.Framework.Code.IAttribute
      description: The attribute to query.
    - id: name
      type: System.String
      description: The name of the argument.
    - id: defaultValue
      type: '{T}'
      description: The value to return if the argument is not found.
    typeParameters:
    - id: T
      description: The expected type of the argument value.
    return:
      type: '{T}'
      description: The value of the argument, or <code class="paramref">defaultValue</code> if not found.
