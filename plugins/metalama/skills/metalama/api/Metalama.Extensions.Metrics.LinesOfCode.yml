  namespace: Metalama.Extensions.Metrics
  summary: A metric that counts lines of code in a declaration using multiple counting methods.
  remarks: >-
    <p>

    This metric provides three line count measurements:

    </p>

    <ul><li><xref href="Metalama.Extensions.Metrics.LinesOfCode.Logical" data-throw-if-not-resolved="false"></xref>: Lines containing code tokens, excluding braces, comments, and blank lines.</li><li><xref href="Metalama.Extensions.Metrics.LinesOfCode.NonBlank" data-throw-if-not-resolved="false"></xref>: Lines containing any tokens (including braces), excluding blank lines and comments.</li><li><xref href="Metalama.Extensions.Metrics.LinesOfCode.Total" data-throw-if-not-resolved="false"></xref>: Total line span from start to end of the declaration.</li></ul>

    <p>

    Use this metric with <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Metrics.MetricsExtensions.Metrics%60%601(%60%600)" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Metrics.Metrics%601.Get%60%601" data-throw-if-not-resolved="false"></xref>.

    </p>
