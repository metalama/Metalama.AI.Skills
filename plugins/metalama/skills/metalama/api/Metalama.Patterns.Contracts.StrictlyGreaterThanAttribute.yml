- uid: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute.#ctor(System.Int64,System.Int32)
  commentId: M:Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute.#ctor(System.Int64,System.Int32)
  id: '#ctor(System.Int64,System.Int32)'
  parent: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute
  langs:
  - csharp
  - vb
  name: StrictlyGreaterThanAttribute(long, int)
  nameWithType: StrictlyGreaterThanAttribute.StrictlyGreaterThanAttribute(long, int)
  fullName: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute.StrictlyGreaterThanAttribute(long, int)
  type: Constructor
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: Initializes a new instance of the <xref href="Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute" data-throw-if-not-resolved="false"></xref> class specifying a minimum value of type <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public StrictlyGreaterThanAttribute(long min, int decimalPlaces = 0)
    parameters:
    - id: min
      type: System.Int64
      description: The minimum allowed value.
    - id: decimalPlaces
      type: System.Int32
      description: >-
        When non-zero, interprets the <code class="paramref">min</code> number as <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> instead
                    of <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> by adding a decimal point at the specified position. For instance, if <code class="paramref">min</code> is set to 1234 and <code class="paramref">decimalPlaces</code>
                    is set to 3, the <code class="paramref">min</code> parameter will be reinterpreted as <code>1.234m</code>.
    content.vb: Public Sub New(min As Long, decimalPlaces As Integer = 0)
  overload: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute.#ctor*
  nameWithType.vb: StrictlyGreaterThanAttribute.New(Long, Integer)
  fullName.vb: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute.New(Long, Integer)
  name.vb: New(Long, Integer)
