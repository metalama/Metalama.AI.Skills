  name: StrictlyGreaterThanAttribute
  nameWithType: StrictlyGreaterThanAttribute
  fullName: Metalama.Patterns.Contracts.StrictlyGreaterThanAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is smaller than or equal to a given value.
  remarks: "    <p>Null values are accepted and do not throw an exception.\r\n</p>\r\n<p>\r\n    Floating-point values are tested to be greater than or equal to the minimum value\r\n    plus a tolerance value. The tolerance value is equal to the distance\r\n    of the value closest to the minimum value according to the precision\r\n    of the respective floating-point numerical data type.\r\n</p>"
  example: []
  syntax:
    content: 'public class StrictlyGreaterThanAttribute : RangeAttribute, IAspect<IParameter>, IEligible<IParameter>, IAspect<IFieldOrPropertyOrIndexer>, IEligible<IFieldOrPropertyOrIndexer>, IConditionallyInheritableAspect, IAspect, ICompileTimeSerializable, ITemplateProvider'
