  nameWithType: ITypeFacet
  fullName: Metalama.Framework.Code.Types.ITypeFacet
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: Represents the structure that a named type has because of its kind, and that other named types do not have.
  remarks: >-
    <p>
        A facet names the members that the compiler synthesizes for a kind of type, so that no consumer has to reach such
        a member by its identifier. The facets of a type are reached through <xref href="Metalama.Framework.Code.INamedType.Facets" data-throw-if-not-resolved="false"></xref>.
        </p>
