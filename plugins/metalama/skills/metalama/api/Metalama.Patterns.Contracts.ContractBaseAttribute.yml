  type: Property
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Gets or sets the direction of the contract. When this property is not set, its

    default value is read from <xref href="Metalama.Patterns.Contracts.ContractOptions" data-throw-if-not-resolved="false"></xref>. When no value is defined

    in <xref href="Metalama.Patterns.Contracts.ContractOptions" data-throw-if-not-resolved="false"></xref>, the default value of this property is <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public ContractDirection Direction { get; init; }
    parameters: []
    return:
      type: Metalama.Framework.Aspects.ContractDirection
