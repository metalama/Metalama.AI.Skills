  - vb
  name: IsInheritable
  nameWithType: ContractBaseAttribute.IsInheritable
  fullName: Metalama.Patterns.Contracts.ContractBaseAttribute.IsInheritable
  type: Property
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Gets or sets a value indicating whether this contract should be inherited to derived types or overriding members.

    When this property is not set, its default value is read from <xref href="Metalama.Patterns.Contracts.ContractOptions" data-throw-if-not-resolved="false"></xref>. When no value

    is defined in <xref href="Metalama.Patterns.Contracts.ContractOptions" data-throw-if-not-resolved="false"></xref>, the default value of this property is <code>true</code>.
  example: []
  syntax:
    content: public bool IsInheritable { get; init; }
    parameters: []
    return:
      type: System.Boolean
