- uid: Metalama.Patterns.Contracts.ContractBaseAttribute.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)
  commentId: M:Metalama.Patterns.Contracts.ContractBaseAttribute.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)
  id: GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)
  parent: Metalama.Patterns.Contracts.ContractBaseAttribute
  langs:
  - csharp
  - vb
  name: GetDefinedDirection(IAspectBuilder)
  nameWithType: ContractBaseAttribute.GetDefinedDirection(IAspectBuilder)
  fullName: Metalama.Patterns.Contracts.ContractBaseAttribute.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)
  type: Method
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Gets or sets the direction of the data flow (<xref href="Metalama.Framework.Aspects.ContractDirection.Input" data-throw-if-not-resolved="false"></xref>,  <xref href="Metalama.Framework.Aspects.ContractDirection.Output" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.ContractDirection.Both" data-throw-if-not-resolved="false"></xref>)

    to which this contract applies, as defined by the current aspect. This method returns <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref> by default. When this method returns <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref>,

    the actual direction is determined according to the characteristics of the target declaration.
  remarks: >-
    In general, it is the responsibility of the <i>author</i> of the aspect, and not of its <i>user</i>, to define the eligible directions of a contract.

    However, the aspect's author can opt to allow users to define the contract direction by exposing this property as <code>public</code> in derived classes.
  example: []
  syntax:
    content: protected override ContractDirection GetDefinedDirection(IAspectBuilder builder)
    parameters:
    - id: builder
      type: Metalama.Framework.Aspects.IAspectBuilder
    return:
      type: Metalama.Framework.Aspects.ContractDirection
    content.vb: Protected Overrides Function GetDefinedDirection(builder As IAspectBuilder) As ContractDirection
  overridden: Metalama.Framework.Aspects.ContractAspect.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)
  overload: Metalama.Patterns.Contracts.ContractBaseAttribute.GetDefinedDirection*
- uid: Metalama.Patterns.Contracts.ContractBaseAttribute.GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder,Metalama.Framework.Aspects.ContractDirection)
  commentId: M:Metalama.Patterns.Contracts.ContractBaseAttribute.GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder,Metalama.Framework.Aspects.ContractDirection)
  id: GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder,Metalama.Framework.Aspects.ContractDirection)
  parent: Metalama.Patterns.Contracts.ContractBaseAttribute
  langs:
  - csharp
  - vb
  name: GetActualDirection(IAspectBuilder, ContractDirection)
  nameWithType: ContractBaseAttribute.GetActualDirection(IAspectBuilder, ContractDirection)
  fullName: Metalama.Patterns.Contracts.ContractBaseAttribute.GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder, Metalama.Framework.Aspects.ContractDirection)
  type: Method
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Gets the actual direction of the contract given the direction returned by <xref href="Metalama.Framework.Aspects.ContractAspect.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)" data-throw-if-not-resolved="false"></xref>, after resolving the <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref>

    value according to the characteristics of the target declaration, and after taking predecessors and secondary instances into account. The implementation of this method

    may return <xref href="Metalama.Framework.Aspects.ContractDirection.None" data-throw-if-not-resolved="false"></xref> to skip the aspect.
  example: []
  syntax:
    content: protected override ContractDirection GetActualDirection(IAspectBuilder builder, ContractDirection direction)
    parameters:
    - id: builder
      type: Metalama.Framework.Aspects.IAspectBuilder
    - id: direction
      type: Metalama.Framework.Aspects.ContractDirection
    return:
      type: Metalama.Framework.Aspects.ContractDirection
    content.vb: Protected Overrides Function GetActualDirection(builder As IAspectBuilder, direction As ContractDirection) As ContractDirection
  overridden: Metalama.Framework.Aspects.ContractAspect.GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder,Metalama.Framework.Aspects.ContractDirection)
  overload: Metalama.Patterns.Contracts.ContractBaseAttribute.GetActualDirection*
