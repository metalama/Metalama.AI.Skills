- uid: Metalama.Patterns.Contracts.ContractBaseAttribute.IsInheritable
  commentId: P:Metalama.Patterns.Contracts.ContractBaseAttribute.IsInheritable
  id: IsInheritable
  parent: Metalama.Patterns.Contracts.ContractBaseAttribute
  langs:
