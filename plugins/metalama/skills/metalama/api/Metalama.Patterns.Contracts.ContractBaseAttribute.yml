  namespace: Metalama.Patterns.Contracts
  summary: Base class for all contract aspects defined in the <code>Metalama.Patterns.Contracts</code> namespace.
  remarks: >-
    <p>This class extends <xref href="Metalama.Framework.Aspects.ContractAspect" data-throw-if-not-resolved="false"></xref> to provide common functionality for all contracts,

    including support for conditional inheritance via <xref href="Metalama.Framework.Aspects.IConditionallyInheritableAspect" data-throw-if-not-resolved="false"></xref>,

    configurable contract direction via <xref href="Metalama.Patterns.Contracts.ContractBaseAttribute.Direction" data-throw-if-not-resolved="false"></xref>, and hierarchical options integration

    via <xref href="Metalama.Patterns.Contracts.ContractOptions" data-throw-if-not-resolved="false"></xref>.</p>
  example: []
  syntax:
    content: 'public abstract class ContractBaseAttribute : ContractAspect, IAspect<IParameter>, IEligible<IParameter>, IAspect<IFieldOrPropertyOrIndexer>, IEligible<IFieldOrPropertyOrIndexer>, IConditionallyInheritableAspect, IAspect, ICompileTimeSerializable, ITemplateProvider'
