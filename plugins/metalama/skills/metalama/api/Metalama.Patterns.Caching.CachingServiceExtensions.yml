  summary: >-
    Extension methods for the <xref href="Metalama.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> interface, providing methods for cache invalidation,

    dependency management, and cache refresh operations.
  remarks: >-
    <p>This class provides the primary API for imperative cache operations at run time, including:</p>

    <ul><li>Adding dependencies to the current caching context (<xref href="Metalama.Patterns.Caching.CachingServiceExtensions.AddDependency(Metalama.Patterns.Caching.ICachingService%2cSystem.String)" data-throw-if-not-resolved="false"></xref>).</li><li>Invalidating cached items by dependency (<xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Invalidate(Metalama.Patterns.Caching.ICachingService%2cSystem.String)" data-throw-if-not-resolved="false"></xref>).</li><li>Invalidating specific cached method calls (<xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Invalidate%60%601(Metalama.Patterns.Caching.ICachingService%2cSystem.Func%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>).</li><li>Refreshing cached values (<xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Refresh%60%601(Metalama.Patterns.Caching.ICachingService%2cSystem.Func%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref>).</li></ul>
