items:
- uid: Metalama.Framework.Code.IDurableRef
  commentId: T:Metalama.Framework.Code.IDurableRef
  id: IDurableRef
  parent: Metalama.Framework.Code
  children: []
  langs:
  - csharp
  - vb
  name: IDurableRef
  nameWithType: IDurableRef
  fullName: Metalama.Framework.Code.IDurableRef
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    An <xref href="Metalama.Framework.Code.IRef" data-throw-if-not-resolved="false"></xref> that stores only a string identifier and therefore does not keep the compilation it came

    from in memory. Its <xref href="Metalama.Framework.Code.IRef.IsDurable" data-throw-if-not-resolved="false"></xref> property is always <code>true</code>.
  remarks: >-
    <p>
        Use this type in the signature of anything that stores a reference for longer than a single pipeline run: a field
        of a fabric, a field of an inheritable aspect, or a parameter of an API that keeps what it is given. The compiler
        then enforces what would otherwise only be a comment, because an ordinary <xref href="Metalama.Framework.Code.IRef%601" data-throw-if-not-resolved="false"></xref> obtained from
        <xref href="Metalama.Framework.Code.IDeclaration.ToRef" data-throw-if-not-resolved="false"></xref> holds the compilation and cannot be converted implicitly.
        </p>
    <p>
        Call <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> on a declaration or a type to obtain one, or
        <xref href="Metalama.Framework.Code.IRef.ToDurable" data-throw-if-not-resolved="false"></xref> when a reference is already at hand. Resolving a durable reference costs an
        identifier lookup, which is why references are not durable by default.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IDurableRef : IRef, IEquatable<IRef>
    content.vb: >-
