  name: IDependencyInjectionFrameworkSelector
  nameWithType: IDependencyInjectionFrameworkSelector
  fullName: Metalama.Extensions.DependencyInjection.IDependencyInjectionFrameworkSelector
  type: Interface
  assemblies:
  - Metalama.Extensions.DependencyInjection
  namespace: Metalama.Extensions.DependencyInjection
  summary: Exposes a method <xref href="Metalama.Extensions.DependencyInjection.IDependencyInjectionFrameworkSelector.SelectFramework(Metalama.Extensions.DependencyInjection.DependencyProperties%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Extensions.DependencyInjection.Implementation.IDependencyInjectionFramework%7d)" data-throw-if-not-resolved="false"></xref> that gets called when there are many candidate frameworks for a dependency.
  remarks: >-
    <p>

    This interface allows customization of dependency injection framework selection when multiple frameworks

    are registered and eligible to handle a specific dependency. To provide a custom selector, set

    <xref href="Metalama.Extensions.DependencyInjection.DependencyInjectionOptionsBuilder.Selector" data-throw-if-not-resolved="false"></xref> when configuring dependency injection options

    via <xref href="Metalama.Extensions.DependencyInjection.DependencyInjectionExtensions.ConfigureDependencyInjection(Metalama.Framework.Fabrics.IQuery%7bMetalama.Framework.Code.ICompilation%7d%2cSystem.Action%7bMetalama.Extensions.DependencyInjection.DependencyInjectionOptionsBuilder%7d)" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    By default, Metalama selects the framework with the lowest priority value among the eligible ones.

    </p>
