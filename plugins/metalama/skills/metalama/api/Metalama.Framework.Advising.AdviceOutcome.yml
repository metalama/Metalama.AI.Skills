- uid: Metalama.Framework.Advising.AdviceOutcome.Ignore
  commentId: F:Metalama.Framework.Advising.AdviceOutcome.Ignore
  id: Ignore
  parent: Metalama.Framework.Advising.AdviceOutcome
  langs:
  - csharp
  - vb
  name: Ignore
  nameWithType: AdviceOutcome.Ignore
  fullName: Metalama.Framework.Advising.AdviceOutcome.Ignore
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    The advice was ignored due to a conflict or <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> settings. Common scenarios include:

    a member with the same signature already exists and the <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> prevents overriding it,

    or another aspect with higher priority already introduced the same member.
  example: []
  syntax:
    content: Ignore = 3
    return:
      type: Metalama.Framework.Advising.AdviceOutcome
- uid: Metalama.Framework.Advising.AdviceOutcome.Error
  commentId: F:Metalama.Framework.Advising.AdviceOutcome.Error
  id: Error
  parent: Metalama.Framework.Advising.AdviceOutcome
  langs:
  - csharp
  - vb
  name: Error
  nameWithType: AdviceOutcome.Error
  fullName: Metalama.Framework.Advising.AdviceOutcome.Error
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    An error diagnostic was reported during advice application. The advice was ignored and the whole aspect was automatically skipped.

    The <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method continues executing without throwing an exception; check <xref href="Metalama.Framework.Advising.IAdviceResult.Outcome" data-throw-if-not-resolved="false"></xref>

    to detect errors and handle them appropriately.
  example: []
  syntax:
    content: Error = 4
    return:
      type: Metalama.Framework.Advising.AdviceOutcome
- uid: Metalama.Framework.Advising.AdviceOutcome.Skipped
  commentId: F:Metalama.Framework.Advising.AdviceOutcome.Skipped
  id: Skipped
  parent: Metalama.Framework.Advising.AdviceOutcome
  langs:
  - csharp
  - vb
  name: Skipped
  nameWithType: AdviceOutcome.Skipped
  fullName: Metalama.Framework.Advising.AdviceOutcome.Skipped
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    The advice was skipped by the pipeline because the current <xref href="Metalama.Framework.Project.IExecutionScenario" data-throw-if-not-resolved="false"></xref> does not capture the kind of

    transformation it would have produced (typically non-observable transformations at design time). The skip is invisible to the design-time output.
  example: []
  syntax:
    content: Skipped = 5
    return:
      type: Metalama.Framework.Advising.AdviceOutcome
