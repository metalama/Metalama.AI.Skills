  summary: >-
    Indicates the result of applying an advice (code transformation). This enum is returned via <xref href="Metalama.Framework.Advising.IAdviceResult.Outcome" data-throw-if-not-resolved="false"></xref>

    by all advice methods to indicate whether the transformation succeeded, was ignored, or encountered an error.
