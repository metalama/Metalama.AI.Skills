  fullName: Metalama.Framework.RunTime.Initialization.CallerIntent
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Specifies the caller's intent regarding <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> invocation.

    Values are mutually exclusive (not a flags enum).
  remarks: >-
    This value is carried by <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.Intent" data-throw-if-not-resolved="false"></xref> and indicates whether

    the caller has committed to invoking <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> after construction.
  example: []
  syntax:
    content: 'public enum CallerIntent : byte'
    content.vb: Public Enum CallerIntent As Byte
