  nameWithType: IAspectBuilder<TAspectTarget>.VerifyEligibility(IEligibilityRule<TAspectTarget>)
  fullName: Metalama.Framework.Aspects.IAspectBuilder<TAspectTarget>.VerifyEligibility(Metalama.Framework.Eligibility.IEligibilityRule<TAspectTarget>)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Verifies that the target of the aspect matches an eligibility rule. If not, reports an eligibility error (unless the aspect can be used by inheritance) and skips the aspect.
  example: []
  syntax:
    content: bool VerifyEligibility(IEligibilityRule<out TAspectTarget> rule)
    parameters:
    - id: rule
      type: Metalama.Framework.Eligibility.IEligibilityRule{{TAspectTarget}}
      description: >-
        An eligibility rule created by <xref href="Metalama.Framework.Eligibility.EligibilityRuleFactory" data-throw-if-not-resolved="false"></xref>. For performance reasons, it is recommended that you store the rule in a static
                    field of the aspect.
    return:
      type: System.Boolean
      description: <code>true</code> if the aspect target qualifies for the given rule, otherwise <code>false</code> (in this case, the <xref href="Metalama.Framework.Aspects.IAspectBuilder.SkipAspect" data-throw-if-not-resolved="false"></xref> method is automatically called.
    content.vb: Function VerifyEligibility(rule As IEligibilityRule(Of Out TAspectTarget)) As Boolean
