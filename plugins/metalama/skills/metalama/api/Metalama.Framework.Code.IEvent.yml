- uid: Metalama.Framework.Code.IEvent.RaiseMethod
  commentId: P:Metalama.Framework.Code.IEvent.RaiseMethod
  id: RaiseMethod
  parent: Metalama.Framework.Code.IEvent
  langs:
  - csharp
  - vb
  name: RaiseMethod
  nameWithType: IEvent.RaiseMethod
  fullName: Metalama.Framework.Code.IEvent.RaiseMethod
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets an object that represents the <code>raise</code> semantic and allows to add aspects and advice

    as with a normal method, or <code>null</code> if the event cannot be raised.
  remarks: >-
    <p>
        In C#, only field-like events (events without explicit <code>add</code>/<code>remove</code> accessors) can be raised
        because they have a backing delegate field. For non-field-like events (events with explicit accessors),
        there is no backing delegate to invoke, so this property returns <code>null</code>.
        </p>
    <p>
        Use the <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.CanRaise" data-throw-if-not-resolved="false"></xref> property to programmatically check whether an event can be raised
        before attempting to use this property or the <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.Raise(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> method.
        </p>
  example: []
  syntax:
    content: IMethod? RaiseMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property RaiseMethod As IMethod
  overload: Metalama.Framework.Code.IEvent.RaiseMethod*
