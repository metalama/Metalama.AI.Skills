- uid: Metalama.Framework.Advising.PullStrategy.IntroduceParameterAndPull(System.String,Metalama.Framework.Code.IType,Metalama.Framework.Code.IExpression,Metalama.Framework.Code.IExpression,System.Boolean,System.Boolean)
  commentId: M:Metalama.Framework.Advising.PullStrategy.IntroduceParameterAndPull(System.String,Metalama.Framework.Code.IType,Metalama.Framework.Code.IExpression,Metalama.Framework.Code.IExpression,System.Boolean,System.Boolean)
  id: IntroduceParameterAndPull(System.String,Metalama.Framework.Code.IType,Metalama.Framework.Code.IExpression,Metalama.Framework.Code.IExpression,System.Boolean,System.Boolean)
  parent: Metalama.Framework.Advising.PullStrategy
  langs:
  - csharp
  - vb
  name: IntroduceParameterAndPull(string?, IType?, IExpression?, IExpression?, bool, bool)
  nameWithType: PullStrategy.IntroduceParameterAndPull(string?, IType?, IExpression?, IExpression?, bool, bool)
  fullName: Metalama.Framework.Advising.PullStrategy.IntroduceParameterAndPull(string?, Metalama.Framework.Code.IType?, Metalama.Framework.Code.IExpression?, Metalama.Framework.Code.IExpression?, bool, bool)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Creates a pull strategy that introduces a new parameter in the child constructor and passes its value to the introduced parameter.
  remarks: >-
    <p>
        This strategy propagates the parameter requirement down the inheritance hierarchy. When a parameter is introduced in a base constructor
        using this strategy, each child constructor will also receive a new parameter (with the specified name, type, and default value),
        and that parameter's value will be passed to the base constructor.
        </p>
    <p>
        This pull strategy operates across project boundaries. Changes are applied to all types derived from the modified type,
        even if those derived types are defined in different projects that reference the project containing the base type.
        </p>
    <p>
        This is the most common pull strategy when you want derived classes to provide values for the introduced parameter,
        especially for dependency injection scenarios where dependencies should flow through the constructor hierarchy.
        </p>
    <p>
        Example: If you introduce an <code>ILogger</code> parameter to a base class constructor with this strategy, all derived
        class constructors will also get an <code>ILogger</code> parameter added, and they will pass it to the base constructor.
        </p>
  example: []
  syntax:
    content: public static IPullStrategy IntroduceParameterAndPull(string? name = null, IType? type = null, IExpression? defaultValue = null, IExpression? forwarderExpression = null, bool reuseExistingParameterOfCompatibleType = false, bool materializeOnRecord = false)
    parameters:
    - id: name
      type: System.String
      description: The name for the new parameter in the child constructor. If <code>null</code>, the introduced parameter's name is used.
    - id: type
      type: Metalama.Framework.Code.IType
      description: The type for the new parameter in the child constructor. If <code>null</code>, the introduced parameter's type is used.
    - id: defaultValue
      type: Metalama.Framework.Code.IExpression
      description: >-
        The default value for the new parameter in the child constructor. If <code>null</code>, no default value is specified.
                        Must be a compile-time constant expression (or <code>null</code>).
    - id: forwarderExpression
      type: Metalama.Framework.Code.IExpression
      description: >-
        Expression passed for the introduced parameter inside the framework-emitted forwarding
                        constructor (the stub that preserves the pre-mutation signature when the required-parameter overload is used). Unlike
                        <code class="paramref">defaultValue</code>, this expression does not need to be a compile-time constant. When a forwarder is
                        emitted and this argument is <code>null</code>, <code class="paramref">defaultValue</code> is used if non-null; otherwise the framework
                        falls back to <code>default(T)!</code>.
    - id: reuseExistingParameterOfCompatibleType
      type: System.Boolean
      description: >-
        When <code>true</code>, if a child constructor already has a parameter whose type is
                        convertible to the introduced parameter's type (i.e. equally or more specific), that existing parameter is forwarded to the
                        base constructor instead of introducing a duplicate. If an existing <em>introduced</em> (aspect-generated) parameter has a
                        less-specific type (e.g. <code>ILogger&lt;Base&gt;</code> when <code>ILogger&lt;Derived&gt;</code> is needed), its type is automatically
                        replaced with the more specific type. Source-defined parameters are never modified; when a source-defined parameter has the
                        same name but an incompatible type, a new parameter with a deduplicated name is introduced instead.
                        The default is <code>false</code>: a new parameter is always introduced.
    - id: materializeOnRecord
      type: System.Boolean
      description: >-
        When <code>true</code> and the target is a record, the introduced parameter is appended to the positional
                        (primary) constructor and becomes part of the record's value shape (property, <code>Deconstruct</code>, <code>Equals</code>, <code>ToString</code>).
                        When <code>false</code> (the default), the parameter is carried on a non-primary sibling constructor synthesized by Metalama, and the
                        record's positional list is left untouched. Ignored for non-record targets.
    return:
      type: Metalama.Framework.Advising.IPullStrategy
      description: A pull strategy that introduces a new parameter in child constructors.
    content.vb: Public Shared Function IntroduceParameterAndPull(name As String = Nothing, type As IType = Nothing, defaultValue As IExpression = Nothing, forwarderExpression As IExpression = Nothing, reuseExistingParameterOfCompatibleType As Boolean = False, materializeOnRecord As Boolean = False) As IPullStrategy
  overload: Metalama.Framework.Advising.PullStrategy.IntroduceParameterAndPull*
