  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: >-
    Provides factory methods to create <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatement" data-throw-if-not-resolved="false"></xref> objects, which are compile-time representations

    of run-time C# statements.
  remarks: >-
    <p>
        The <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory" data-throw-if-not-resolved="false"></xref> class provides multiple approaches to creating <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatement" data-throw-if-not-resolved="false"></xref> objects:
        <ul><li><xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.Parse(System.String)" data-throw-if-not-resolved="false"></xref> - Parse C# statement strings into <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatement" data-throw-if-not-resolved="false"></xref> objects</li><li><xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.FromExpression(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref> - Create expression statements from <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> objects</li><li><xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.FromTemplate(Metalama.Framework.Aspects.TemplateInvocation%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> and overloads - Create statements by invoking templates</li><li><xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.Block(Metalama.Framework.Code.SyntaxBuilders.IStatement%5b%5d)" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementFactory.List(System.Collections.Generic.IEnumerable%7bMetalama.Framework.Code.SyntaxBuilders.IStatement%7d)" data-throw-if-not-resolved="false"></xref> - Create blocks and statement lists</li></ul>
        For complex statements that need programmatic construction with indentation, use <xref href="Metalama.Framework.Code.SyntaxBuilders.StatementBuilder" data-throw-if-not-resolved="false"></xref> instead,
        which provides a StringBuilder-like API with automatic indentation management.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public static class StatementFactory
    content.vb: >-
      <CompileTime>

      Public Module StatementFactory
