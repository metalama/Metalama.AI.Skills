  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: Extracts an <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatementList" data-throw-if-not-resolved="false"></xref> from a block statement, or creates a singleton list if the statement is not a block.
  remarks: >-
    This method is useful when you need to work with the individual statements inside a block, or when you want to treat

    any statement uniformly as a list of statements.
  example: []
  syntax:
    content: public static IStatementList UnwrapBlock(IStatement statement)
    parameters:
    - id: statement
      type: Metalama.Framework.Code.SyntaxBuilders.IStatement
      description: The statement to unwrap.
    return:
      type: Metalama.Framework.Code.SyntaxBuilders.IStatementList
      description: >-
        An <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatementList" data-throw-if-not-resolved="false"></xref> containing the statements from the block if <code class="paramref">statement</code> is a block,

        or a singleton list containing the statement itself if it is not a block.
    content.vb: Public Shared Function UnwrapBlock(statement As IStatement) As IStatementList
  overload: Metalama.Framework.Code.SyntaxBuilders.StatementFactory.UnwrapBlock*
