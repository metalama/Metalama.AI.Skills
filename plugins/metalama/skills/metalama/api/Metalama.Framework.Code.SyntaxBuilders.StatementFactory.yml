  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: Creates a block statement (enclosed in braces) containing zero, one, or many statements.
  remarks: >-
    Blocks are useful for grouping multiple statements together, such as in control flow structures or when a single

    statement is expected but you need to execute multiple operations. The generated code will include the opening and

    closing braces.
  example: []
  syntax:
    content: public static IStatement Block(params IStatement[] statements)
    parameters:
    - id: statements
      type: Metalama.Framework.Code.SyntaxBuilders.IStatement[]
      description: The statements to include in the block.
    return:
      type: Metalama.Framework.Code.SyntaxBuilders.IStatement
      description: An <xref href="Metalama.Framework.Code.SyntaxBuilders.IStatement" data-throw-if-not-resolved="false"></xref> representing a block with the specified statements.
    content.vb: Public Shared Function Block(ParamArray statements As IStatement()) As IStatement
