- uid: Metalama.Framework.Code.SyntaxBuilders.StatementFactory.Block(Metalama.Framework.Code.SyntaxBuilders.IStatement[])
  commentId: M:Metalama.Framework.Code.SyntaxBuilders.StatementFactory.Block(Metalama.Framework.Code.SyntaxBuilders.IStatement[])
