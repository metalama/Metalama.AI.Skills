  name: SpecialType
  nameWithType: SpecialType
  fullName: Metalama.Framework.Code.SpecialType
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Identifies well-known types for efficient type checking without string comparisons.
  remarks: >-
    <p>
        Use <xref href="Metalama.Framework.Code.IType.SpecialType" data-throw-if-not-resolved="false"></xref> to check if a type is one of the well-known types,
        or <xref href="Metalama.Framework.Code.IType.Equals(Metalama.Framework.Code.SpecialType)" data-throw-if-not-resolved="false"></xref> for comparison.
        Use <xref href="Metalama.Framework.Code.TypeFactory.GetType(Metalama.Framework.Code.SpecialType)" data-throw-if-not-resolved="false"></xref> to obtain an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref> for a special type.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public enum SpecialType
    content.vb: >-
      <CompileTime>

      Public Enum SpecialType
