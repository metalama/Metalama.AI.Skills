  fullName: Metalama.Framework.Code.Comparers.RefEqualityComparer
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Comparers
  summary: >-
    An implementation of <xref href="System.Collections.Generic.IEqualityComparer%601" data-throw-if-not-resolved="false"></xref> for <xref href="Metalama.Framework.Code.IRef" data-throw-if-not-resolved="false"></xref> that compares references based on

    <xref href="Metalama.Framework.Code.RefComparison" data-throw-if-not-resolved="false"></xref> semantics.
  remarks: >-
    <p>
        This comparer allows using <xref href="Metalama.Framework.Code.IRef" data-throw-if-not-resolved="false"></xref> instances as keys in dictionaries or elements in hash sets.
        Use the appropriate static property to obtain a comparer with the desired comparison strategy:
        </p>
    <ul><li>
          <xref href="Metalama.Framework.Code.Comparers.RefEqualityComparer.Default" data-throw-if-not-resolved="false"></xref>: Fast comparison within the same compilation, ignores nullability.</li><li>
          <xref href="Metalama.Framework.Code.Comparers.RefEqualityComparer.IncludeNullability" data-throw-if-not-resolved="false"></xref>: Same compilation, considers nullable annotations.</li><li>
          <xref href="Metalama.Framework.Code.Comparers.RefEqualityComparer.Structural" data-throw-if-not-resolved="false"></xref>: Cross-compilation comparison, ignores nullability.</li><li>
          <xref href="Metalama.Framework.Code.Comparers.RefEqualityComparer.StructuralIncludeNullability" data-throw-if-not-resolved="false"></xref>: Cross-compilation, considers nullable annotations.</li></ul>
