  summary: Default implementation of the <xref href="Metalama.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> interface, providing the run-time caching infrastructure.
  remarks: >-
    <p>The <xref href="Metalama.Patterns.Caching.CachingService" data-throw-if-not-resolved="false"></xref> class is the main run-time component of Metalama Caching. It manages

    caching profiles, backends, key builders, and value adapters.</p>

    <p>When using dependency injection, instances are created via <xref href="Metalama.Patterns.Caching.Building.CachingServiceFactory.AddMetalamaCaching(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cSystem.Action%7bMetalama.Patterns.Caching.Building.ICachingServiceBuilder%7d)" data-throw-if-not-resolved="false"></xref>.

    When not using dependency injection, use the <xref href="Metalama.Patterns.Caching.CachingService.Default" data-throw-if-not-resolved="false"></xref> static property, initialized via the <xref href="Metalama.Patterns.Caching.CachingService.Create(System.Action%7bMetalama.Patterns.Caching.Building.ICachingServiceBuilder%7d%2cSystem.IServiceProvider)" data-throw-if-not-resolved="false"></xref> method.</p>
