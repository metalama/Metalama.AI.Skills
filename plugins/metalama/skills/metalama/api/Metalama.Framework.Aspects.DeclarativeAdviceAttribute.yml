  fullName: Metalama.Framework.Aspects.DeclarativeAdviceAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    A base class for attributes that define declarative advice on aspect members. These attributes enable

    aspects to transform code without requiring explicit calls in <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Declarative advice attributes allow you to mark members of an aspect class (methods, properties, fields, events)
        with attributes that automatically generate advice when the aspect is applied. This is in contrast to imperative
        advice, where transformations are explicitly added in the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method via
        <xref href="Metalama.Framework.Aspects.AdviserExtensions" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Built-in declarative advice attributes include:
        <ul><li><xref href="Metalama.Framework.Aspects.IntroduceAttribute" data-throw-if-not-resolved="false"></xref>: Introduces the annotated member into the target type</li><li><code>IntroduceDependencyAttribute</code> (in Metalama.Extensions.DependencyInjection): Introduces a dependency as a property or field</li></ul>
        Derived attributes can implement more complex advice patterns.
        </p>
    <p>
        Use the <xref href="Metalama.Framework.Aspects.DeclarativeAdviceAttribute.Layer" data-throw-if-not-resolved="false"></xref> property to control when the advice executes relative to other advice in the same aspect.
        This is useful when an aspect has multiple pieces of advice that must execute in a specific order.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public abstract class DeclarativeAdviceAttribute : Attribute, IAdviceAttribute
    content.vb: >-
      <CompileTime>

      Public MustInherit Class DeclarativeAdviceAttribute Inherits Attribute Implements IAdviceAttribute
