- uid: Metalama.Framework.Serialization.ISerializer.IsTwoPhase
  commentId: P:Metalama.Framework.Serialization.ISerializer.IsTwoPhase
  id: IsTwoPhase
  parent: Metalama.Framework.Serialization.ISerializer
  langs:
  - csharp
  - vb
  name: IsTwoPhase
  nameWithType: ISerializer.IsTwoPhase
  fullName: Metalama.Framework.Serialization.ISerializer.IsTwoPhase
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Serialization
  summary: >-
    Gets a value indicating whether <xref href="Metalama.Framework.Serialization.ISerializer.DeserializeFields(System.Object%40%2cMetalama.Framework.Serialization.IArgumentsReader)" data-throw-if-not-resolved="false"></xref> should be invoked during deserialization.

    The value is <code>false</code> if <xref href="Metalama.Framework.Serialization.ISerializer.CreateInstance(System.Type%2cMetalama.Framework.Serialization.IArgumentsReader)" data-throw-if-not-resolved="false"></xref> return fully created object, <code>true</code> otherwise.
  example: []
  syntax:
    content: bool IsTwoPhase { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsTwoPhase As Boolean
  overload: Metalama.Framework.Serialization.ISerializer.IsTwoPhase*
