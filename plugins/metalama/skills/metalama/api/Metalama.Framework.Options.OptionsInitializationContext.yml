  summary: Context of the <xref href="Metalama.Framework.Options.IHierarchicalOptions.GetDefaultOptions(Metalama.Framework.Options.OptionsInitializationContext)" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>
        This context is provided when Metalama calls <xref href="Metalama.Framework.Options.IHierarchicalOptions.GetDefaultOptions(Metalama.Framework.Options.OptionsInitializationContext)" data-throw-if-not-resolved="false"></xref> to retrieve project-level
        default options. The context allows the options class to access project properties (such as MSBuild properties) and report
        diagnostics if configuration values are invalid.
        </p>
