  namespace: Metalama.Framework.Aspects
  summary: >-
    Attribute that means that the target declaration (and all children declarations) can only be called from run-time

    code and, therefore, not from compile-time code. Code is run-time by default, so this attribute only makes sense on classes or interface that

    are run-time-only but derive a run-time-or-compile-time type. See <xref href="Metalama.Framework.Aspects.RunTimeOrCompileTimeAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Constructor|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event|AttributeTargets.Interface|AttributeTargets.Parameter|AttributeTargets.Delegate|AttributeTargets.ReturnValue|AttributeTargets.GenericParameter)]

      public sealed class RunTimeAttribute : ScopeAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.EnumOrAttributeTargets.ConstructorOrAttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.EventOrAttributeTargets.InterfaceOrAttributeTargets.ParameterOrAttributeTargets.DelegateOrAttributeTargets.ReturnValueOrAttributeTargets.GenericParameter)>

      Public NotInheritable Class RunTimeAttribute Inherits ScopeAttribute
