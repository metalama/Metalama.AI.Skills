- uid: Metalama.Framework.Advising.ConstructorOverloadingStrategy
  commentId: T:Metalama.Framework.Advising.ConstructorOverloadingStrategy
  id: ConstructorOverloadingStrategy
  parent: Metalama.Framework.Advising
  children:
  - Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor
  - Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors
  langs:
  - csharp
  - vb
  name: ConstructorOverloadingStrategy
  nameWithType: ConstructorOverloadingStrategy
  fullName: Metalama.Framework.Advising.ConstructorOverloadingStrategy
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Provides factory access to the standard implementations of the <xref href="Metalama.Framework.Advising.IConstructorOverloadingStrategy" data-throw-if-not-resolved="false"></xref>

    interface. Each factory returns a <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy" data-throw-if-not-resolved="false"></xref> whose

    <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> method can be used to additionally decorate

    the generated forwarding constructor with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static class ConstructorOverloadingStrategy
    content.vb: Public Module ConstructorOverloadingStrategy
  seealso:
