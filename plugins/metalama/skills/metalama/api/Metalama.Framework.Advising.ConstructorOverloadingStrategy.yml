- uid: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors
  commentId: P:Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors
  id: ForwardSourceConstructors
  parent: Metalama.Framework.Advising.ConstructorOverloadingStrategy
  langs:
  - csharp
  - vb
  name: ForwardSourceConstructors
  nameWithType: ConstructorOverloadingStrategy.ForwardSourceConstructors
  fullName: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Gets a strategy that generates a forwarding constructor for every source constructor

    that the framework mutates. Aspect-introduced constructors are not themselves overloaded. Call

    <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> on the returned instance to additionally

    decorate the generated forwarding constructor with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static ForwardConstructorStrategy ForwardSourceConstructors { get; }
    parameters: []
    return:
      type: Metalama.Framework.Advising.ForwardConstructorStrategy
    content.vb: Public Shared ReadOnly Property ForwardSourceConstructors As ForwardConstructorStrategy
  overload: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardSourceConstructors*
- uid: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor
  commentId: P:Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor
  id: ForwardDefaultConstructor
  parent: Metalama.Framework.Advising.ConstructorOverloadingStrategy
  langs:
  - csharp
  - vb
  name: ForwardDefaultConstructor
  nameWithType: ConstructorOverloadingStrategy.ForwardDefaultConstructor
  fullName: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Gets a strategy that generates a forwarding constructor only when the mutated constructor is

    the parameterless constructor, if it exists. This is the typical choice for types that must remain

    constructible via <xref href="System.Activator.CreateInstance%60%601" data-throw-if-not-resolved="false"></xref> or a <code>new()</code> generic constraint

    while the aspect enriches the constructor signature with additional parameters. Call

    <xref href="Metalama.Framework.Advising.ForwardConstructorStrategy.WithObsoleteAttribute(System.String%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> on the returned instance to additionally

    decorate the generated forwarding constructor with <xref href="System.ObsoleteAttribute" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static ForwardConstructorStrategy ForwardDefaultConstructor { get; }
    parameters: []
    return:
      type: Metalama.Framework.Advising.ForwardConstructorStrategy
    content.vb: Public Shared ReadOnly Property ForwardDefaultConstructor As ForwardConstructorStrategy
  overload: Metalama.Framework.Advising.ConstructorOverloadingStrategy.ForwardDefaultConstructor*
