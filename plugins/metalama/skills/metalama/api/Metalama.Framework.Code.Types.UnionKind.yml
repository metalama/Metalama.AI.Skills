  name: UnionKind
  nameWithType: UnionKind
  fullName: Metalama.Framework.Code.Types.UnionKind
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: Authoring forms of a union of C# 15, reported by <xref href="Metalama.Framework.Code.Types.IUnionFacet.UnionKind" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        The distinction matters because the language checks the restrictions on the members of a union for
        <xref href="Metalama.Framework.Code.Types.UnionKind.Declaration" data-throw-if-not-resolved="false"></xref> only. An instance field, an automatic property and a field-like event are forbidden in a
        union declaration and are allowed in the attribute form.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public enum UnionKind
    content.vb: >-
      <CompileTime>

      Public Enum UnionKind
