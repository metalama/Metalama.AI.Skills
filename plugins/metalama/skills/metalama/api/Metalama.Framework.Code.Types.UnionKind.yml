  fullName: Metalama.Framework.Code.Types.UnionKind.Attribute
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    The union is a class or a struct that carries the <code>System.Runtime.CompilerServices.UnionAttribute</code>

    attribute. A union read from a referenced assembly is reported as this form, because the compiled form of

    every union carries that attribute and does not record whether the source used the <code>union</code> keyword.
  example: []
  syntax:
    content: Attribute = 2
    return:
      type: Metalama.Framework.Code.Types.UnionKind
