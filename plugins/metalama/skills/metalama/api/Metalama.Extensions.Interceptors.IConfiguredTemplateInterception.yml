  name: IConfiguredTemplateInterception
  nameWithType: IConfiguredTemplateInterception
  fullName: Metalama.Extensions.Interceptors.IConfiguredTemplateInterception
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A method interception whose calls are redirected to a method synthesized from a template, after the first call of

    <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>. It is a complete interception, which the delegate given to <code>InterceptMethods</code> or to

    <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref> can return.
  remarks: >-
    <p>

    The other methods of <xref href="Metalama.Extensions.Interceptors.ITemplateInterception" data-throw-if-not-resolved="false"></xref>, such as <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType" data-throw-if-not-resolved="false"></xref> and

    <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref>, must be called before <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>, because they determine the

    signature that the engine derives and that the <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder" data-throw-if-not-resolved="false"></xref> exposes to the delegates. This interface therefore only

    allows further calls of <xref href="Metalama.Extensions.Interceptors.IConfiguredTemplateInterception.Configure(System.Action%7bMetalama.Extensions.Interceptors.IInterceptorMethodBuilder%7d)" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IConfiguredTemplateInterception : IMethodInterception
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IConfiguredTemplateInterception Inherits IMethodInterception
