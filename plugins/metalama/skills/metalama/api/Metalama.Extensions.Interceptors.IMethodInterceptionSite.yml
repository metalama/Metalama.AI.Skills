  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionSite
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    One call site in the delegate given to <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>. It describes the site, through the members of

    <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext" data-throw-if-not-resolved="false"></xref>, and creates the result of the site.
  remarks: This object must not be stored after the delegate returns.
