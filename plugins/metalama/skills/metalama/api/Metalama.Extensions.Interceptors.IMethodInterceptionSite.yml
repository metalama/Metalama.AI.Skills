- uid: Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip
  commentId: M:Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip
  id: Skip
  parent: Metalama.Extensions.Interceptors.IMethodInterceptionSite
  langs:
  - csharp
  - vb
  name: Skip()
  nameWithType: IMethodInterceptionSite.Skip()
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip()
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Leaves the call site unchanged for this registration. Other registrations for the same site are still evaluated. To explain a skip,

    report a diagnostic through <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.Diagnostics" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: IMethodInterception Skip()
    return:
      type: Metalama.Extensions.Interceptors.IMethodInterception
    content.vb: Function Skip() As IMethodInterception
