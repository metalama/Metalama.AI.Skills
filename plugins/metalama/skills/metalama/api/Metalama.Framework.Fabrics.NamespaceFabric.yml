  fullName: Metalama.Framework.Fabrics.NamespaceFabric
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Fabrics
  summary: >-
    A compile-time entry point that executes within the compiler and IDE to add aspects and implement architecture rules

    for a specific namespace and its nested namespaces.
  remarks: >-
    <p>
        Namespace fabrics are unique classes that execute at compile time and design time. Unlike aspects, fabrics do not need to be applied
        to any declaration or called from anywhere—their primary method (<xref href="Metalama.Framework.Fabrics.NamespaceFabric.AmendNamespace(Metalama.Framework.Fabrics.INamespaceAmender)" data-throw-if-not-resolved="false"></xref>) is invoked automatically simply because
        the class exists in the namespace.
        </p>
    <p>
        A <xref href="Metalama.Framework.Fabrics.NamespaceFabric" data-throw-if-not-resolved="false"></xref> applies transformations to the namespace that contains it, allowing you to scope aspect application
        and validation rules to specific namespace hierarchies. This provides more granular control than <xref href="Metalama.Framework.Fabrics.ProjectFabric" data-throw-if-not-resolved="false"></xref> but
        broader scope than <xref href="Metalama.Framework.Fabrics.TypeFabric" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public abstract class NamespaceFabric : Fabric, ICompileTimeSerializable, ITemplateProvider'
    content.vb: Public MustInherit Class NamespaceFabric Inherits Fabric Implements ICompileTimeSerializable, ITemplateProvider
