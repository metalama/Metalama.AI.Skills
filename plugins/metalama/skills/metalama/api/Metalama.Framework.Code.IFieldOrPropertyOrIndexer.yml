- uid: Metalama.Framework.Code.IFieldOrPropertyOrIndexer.GetMethod
  commentId: P:Metalama.Framework.Code.IFieldOrPropertyOrIndexer.GetMethod
  id: GetMethod
  parent: Metalama.Framework.Code.IFieldOrPropertyOrIndexer
  langs:
  - csharp
  - vb
  name: GetMethod
  nameWithType: IFieldOrPropertyOrIndexer.GetMethod
  fullName: Metalama.Framework.Code.IFieldOrPropertyOrIndexer.GetMethod
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the property getter, or <code>null</code> if the property is write-only. In case of automatic properties, this property returns

    an object that does not map to source code but allows to add aspects and advice as with a normal method. In case of fields,

    this property returns a pseudo-method that can be the target of aspects and advice, as if the field were a property.
  example: []
  syntax:
    content: IMethod? GetMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property GetMethod As IMethod
  overload: Metalama.Framework.Code.IFieldOrPropertyOrIndexer.GetMethod*
