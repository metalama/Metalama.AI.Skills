  name: CacheKeyBuilder
  nameWithType: CacheKeyBuilder
  fullName: Metalama.Patterns.Caching.Formatters.CacheKeyBuilder
  type: Class
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching.Formatters
  summary: Default implementation of <xref href="Metalama.Patterns.Caching.Formatters.ICacheKeyBuilder" data-throw-if-not-resolved="false"></xref> that builds cache item keys and dependency keys.
  remarks: >-
    <h4>Key Building Strategy</h4>

    <p>This class generates cache keys by combining method signature information with formatted argument values.</p>

    <p><b>Method keys</b> follow this format:</p>


    <pre><code class="lang-csharp">Namespace.DeclaringType.MethodName&lt;GenericArgs&gt;(this={instance}, (ParamType) paramValue, ...)</code></pre>

    <p>For example: <code>MyApp.Services.UserService.GetUser(this={MyApp.Services.UserService}, (int) 42)</code></p>

    <p><b>Dependency keys</b> are formatted representations of the dependency object using the registered formatters.</p>


    <h4>Key Compression (Hashing)</h4>

    <p>When <xref href="Metalama.Patterns.Caching.Formatters.CacheKeyBuilder.HashingAlgorithm" data-throw-if-not-resolved="false"></xref> is set to <xref href="Metalama.Patterns.Caching.Formatters.CacheKeyHashingAlgorithm.XxHash64" data-throw-if-not-resolved="false"></xref> or

    <xref href="Metalama.Patterns.Caching.Formatters.CacheKeyHashingAlgorithm.XxHash128" data-throw-if-not-resolved="false"></xref>, keys exceeding <xref href="Metalama.Patterns.Caching.Formatters.CacheKeyBuilder.KeyCompressingThreshold" data-throw-if-not-resolved="false"></xref> characters

    are compressed using a hash. This is useful for backends with key length limits (e.g., Redis, Memcached).</p>

    <p><b>For method keys:</b> The class and method name are preserved as a prefix (with generic arguments stripped),

    followed by a tilde (<code>~</code>) and the base64-encoded hash of the full key.</p>

    <p>Example: <code>MyApp.Services.UserService.GetUser~9XwmlUowFDE</code></p>

    <p><b>For dependency keys:</b> The entire key is replaced with the base64-encoded hash (no prefix).</p>

    <p>XxHash64 produces ~11 character hashes; XxHash128 produces ~22 character hashes.</p>


    <h4>Customization</h4>

    <p>To customize key generation, either derive from this class and override the virtual methods,

    or implement <xref href="Metalama.Patterns.Caching.Formatters.ICacheKeyBuilder" data-throw-if-not-resolved="false"></xref> directly. Register custom implementations using

    <xref href="Metalama.Patterns.Caching.Building.ICachingServiceBuilder.WithKeyBuilder(System.Func%7bFlashtrace.Formatters.IFormatterRepository%2cMetalama.Patterns.Caching.Formatters.CacheKeyBuilderOptions%2cMetalama.Patterns.Caching.Formatters.ICacheKeyBuilder%7d)" data-throw-if-not-resolved="false"></xref>.</p>
