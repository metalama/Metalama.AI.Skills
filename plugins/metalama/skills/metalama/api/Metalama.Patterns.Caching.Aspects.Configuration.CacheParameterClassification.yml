  type: Class
  assemblies:
  - Metalama.Patterns.Caching.Aspects
  namespace: Metalama.Patterns.Caching.Aspects.Configuration
  summary: Represents the result of classifying a method parameter for cache key generation.
  remarks: >-
    <p>This class is returned by <xref href="Metalama.Patterns.Caching.Aspects.Configuration.ICacheParameterClassifier.GetClassification(Metalama.Framework.Code.IParameter)" data-throw-if-not-resolved="false"></xref> and determines

    how a parameter is handled by the caching aspect:</p>

    <ul><li><xref href="Metalama.Patterns.Caching.Aspects.Configuration.CacheParameterClassification.Default" data-throw-if-not-resolved="false"></xref>: The parameter is included in the cache key using standard formatting.</li><li><xref href="Metalama.Patterns.Caching.Aspects.Configuration.CacheParameterClassification.ExcludeFromCacheKey" data-throw-if-not-resolved="false"></xref>: The parameter is excluded from the cache key.</li><li><xref href="Metalama.Patterns.Caching.Aspects.Configuration.CacheParameterClassification.Ineligible" data-throw-if-not-resolved="false"></xref>: The method cannot be cached because of this parameter (reports a compile-time error).</li></ul>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public sealed class CacheParameterClassification
    content.vb: >-
      <CompileTime>

      Public NotInheritable Class CacheParameterClassification
