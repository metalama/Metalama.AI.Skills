    from any type specified by the <xref href="Metalama.Extensions.Architecture.Aspects.BaseUsageValidationAttribute.Types" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Extensions.Architecture.Aspects.BaseUsageValidationAttribute.Namespaces" data-throw-if-not-resolved="false"></xref>,

