  fullName: Metalama.Framework.Advising.InterfaceImplementationAdviserExtensions
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Provides extension methods for introducing explicit interface member implementations via <xref href="Metalama.Framework.Advising.IInterfaceImplementationAdviser" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Use these methods to programmatically add explicit interface member implementations after calling
        <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
        Access the <xref href="Metalama.Framework.Advising.IInterfaceImplementationAdviser" data-throw-if-not-resolved="false"></xref> through the <xref href="Metalama.Framework.Advising.IImplementInterfaceAdviceResult.ExplicitMembers" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Advising.IInterfaceImplementationResult.ExplicitMembers" data-throw-if-not-resolved="false"></xref> property.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public static class InterfaceImplementationAdviserExtensions
    content.vb: >-
      <CompileTime>

      Public Module InterfaceImplementationAdviserExtensions
