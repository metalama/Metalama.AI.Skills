  fullName: Metalama.Framework.Advising.InterfaceImplementationAdviserExtensions.IntroduceEvent(Metalama.Framework.Advising.IInterfaceImplementationAdviser, string, string, string, string?, string?, Metalama.Framework.Aspects.IntroductionScope, Metalama.Framework.Aspects.OverrideStrategy, System.Action<Metalama.Framework.Code.DeclarationBuilders.IEventBuilder>?, object?, object?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Introduces a new event to the target type, or overrides the implementation of an existing one, by specifying individual template methods

    for the adder, the remover, and the raiser.

    Use the <xref href="Metalama.Framework.Aspects.IAdviser.With%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> method to apply the advice to another declaration than the current one.
  example: []
  syntax:
    content: public static IIntroductionAdviceResult<IEvent> IntroduceEvent(this IInterfaceImplementationAdviser adviser, string eventName, string addTemplate, string removeTemplate, string? raiseTemplate = null, string? invokeTemplate = null, IntroductionScope scope = IntroductionScope.Default, OverrideStrategy whenExists = OverrideStrategy.Default, Action<IEventBuilder>? buildEvent = null, object? args = null, object? tags = null)
    parameters:
    - id: adviser
      type: Metalama.Framework.Advising.IInterfaceImplementationAdviser
      description: An <xref href="Metalama.Framework.Advising.IInterfaceImplementationAdviser" data-throw-if-not-resolved="false"></xref>.
    - id: eventName
      type: System.String
      description: The name of the introduced event.
    - id: addTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the adder.
                        This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Add(T value)</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the event.
    - id: removeTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for the remover.
                        This method must be annotated with <xref href="Metalama.Framework.Aspects.TemplateAttribute" data-throw-if-not-resolved="false"></xref>. The signature of this method must
                        be <code>void Add(T value)</code> where <code>T</code> is either <code>dynamic</code> or a type compatible with the type of the event.
    - id: raiseTemplate
      type: System.String
      description: Not implemented.
    - id: invokeTemplate
      type: System.String
      description: >-
        The name of the method of the aspect class whose type and implementation will be used as a template for intercepting invocation of 
                        event's handlers. The signature of this method must be <code>T Remove()</code>, <code>T Remove(U handler)</code>, or <code>T Remove(U handler, V1 param1, V2 param2, ...)</code>  
                        where <code>T</code> is either <code>dynamic</code> or a type compatible with the return value of the event's delegate type, <code>U</code> is either dynamic or the event's 
                        delegate type, <code>Vn</code> are types matching the delegate's parameters.
    - id: scope
      type: Metalama.Framework.Aspects.IntroductionScope
      description: >-
        Determines the scope (e.g. <xref href="Metalama.Framework.Aspects.IntroductionScope.Instance" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Framework.Aspects.IntroductionScope.Static" data-throw-if-not-resolved="false"></xref>) of the introduced
                        event. The default scope depends on the scope of the template event. If the event is static, the introduced event is static. However, if the
                        template event is non-static, then the introduced event copies of the scope of the target declaration of the aspect.
    - id: whenExists
      type: Metalama.Framework.Aspects.OverrideStrategy
      description: >-
        Determines the implementation strategy when an event of the same name is already declared in the target type.
                        The default strategy is to fail with a compile-time error.
    - id: buildEvent
      type: System.Action{Metalama.Framework.Code.DeclarationBuilders.IEventBuilder}
      description: An optional callback that allows you to configure the introduced event, such as changing its name, type, accessibility, or adding custom attributes.
    - id: args
      type: System.Object
      description: An object (typically of anonymous type) whose properties map to parameters or type parameters of the template methods.
    - id: tags
      type: System.Object
      description: >-
        An optional opaque object of anonymous type passed to the template method and exposed under the <xref href="Metalama.Framework.Aspects.meta.Tags" data-throw-if-not-resolved="false"></xref> property of the
                        <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> API.
    return:
      type: Metalama.Framework.Advising.IIntroductionAdviceResult{Metalama.Framework.Code.IEvent}
      description: An <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601" data-throw-if-not-resolved="false"></xref> where the <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref> property exposes the introduced or overridden event.
    content.vb: Public Shared Function IntroduceEvent(adviser As IInterfaceImplementationAdviser, eventName As String, addTemplate As String, removeTemplate As String, raiseTemplate As String = Nothing, invokeTemplate As String = Nothing, scope As IntroductionScope = IntroductionScope.Default, whenExists As OverrideStrategy = OverrideStrategy.Default, buildEvent As Action(Of IEventBuilder) = Nothing, args As Object = Nothing, tags As Object = Nothing) As IIntroductionAdviceResult(Of IEvent)
