        <ul><li><xref href="Metalama.Testing.UnitTesting.TestContextOptions.Timeout" data-throw-if-not-resolved="false"></xref>: Maximum time before the test's <xref href="Metalama.Testing.UnitTesting.TestContext.CancellationToken" data-throw-if-not-resolved="false"></xref> is signaled</li><li><xref href="Metalama.Testing.UnitTesting.TestContextOptions.AdditionalAssemblies" data-throw-if-not-resolved="false"></xref>: Assemblies to add as references to compile-time compilation</li><li><xref href="Metalama.Testing.UnitTesting.TestContextOptions.AdditionalMetadataReferences" data-throw-if-not-resolved="false"></xref>: References to add to test compilations</li><li><xref href="Metalama.Testing.UnitTesting.TestContextOptions.RequireOrderedAspects" data-throw-if-not-resolved="false"></xref>: Whether to require explicit aspect ordering</li></ul></p>
