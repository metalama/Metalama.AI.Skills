  remarks: >-
    <p>
        Pass an instance of this record to <xref href="Metalama.Testing.UnitTesting.UnitTestClass.CreateTestContext(Metalama.Testing.UnitTesting.TestContextOptions%2cMetalama.Framework.Engine.Services.IAdditionalServiceCollection%2cSystem.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>
