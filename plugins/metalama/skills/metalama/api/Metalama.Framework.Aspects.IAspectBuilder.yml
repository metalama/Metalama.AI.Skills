  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Gets or sets an arbitrary object that is then exposed on the <xref href="Metalama.Framework.Aspects.IAspectInstance.AspectState" data-throw-if-not-resolved="false"></xref> property of

    the <xref href="Metalama.Framework.Aspects.IAspectInstance" data-throw-if-not-resolved="false"></xref> interface. While a single instance of an aspect class can be used for

    several target declarations, the <xref href="Metalama.Framework.Aspects.IAspectBuilder.AspectState" data-throw-if-not-resolved="false"></xref> is specific to the target declaration. If the aspect

    is inherited, the <xref href="Metalama.Framework.Aspects.IAspectBuilder.AspectState" data-throw-if-not-resolved="false"></xref> must be compile-time-serializable (<xref href="Metalama.Framework.Serialization.ICompileTimeSerializable" data-throw-if-not-resolved="false"></xref> or

    default serializable classes).
  example: []
