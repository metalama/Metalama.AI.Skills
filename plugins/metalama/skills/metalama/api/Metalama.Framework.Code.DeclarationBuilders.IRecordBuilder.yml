  nameWithType: IRecordBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Allows to complete the construction of a record that has been created by the <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceRecord(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamespaceOrNamedType%7d%2cSystem.String%2cMetalama.Framework.Code.RecordKind%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IRecordBuilder%7d)" data-throw-if-not-resolved="false"></xref> advice. One interface serves a

    record class and a record struct.
  remarks: >-
    <p>
        The authoring form is chosen when the advice is called and is reported by <xref href="Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.RecordKind" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        The members that the compiler synthesizes for a record are not set through this interface. They are created by
        the advice and are read through <xref href="Metalama.Framework.Code.INamedType.Facets" data-throw-if-not-resolved="false"></xref> on the introduced type, as they are for a record
        that the user wrote.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IRecordBuilder : INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, INamedType, IType, IEquatable<IType>, IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>, IEquatable<INamedType>
    content.vb: >-
      <InternalImplement>

      Public Interface IRecordBuilder Inherits INamedTypeBuilder, IMemberOrNamedTypeBuilder, IDeclarationBuilder, INamedType, IType, IEquatable(Of IType), IGeneric, IMemberOrNamedType, INamespaceOrNamedType, INamedDeclaration, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration), IEquatable(Of INamedType)
