- uid: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddPositionalParameter(System.String,Metalama.Framework.Code.IType,System.Nullable{Metalama.Framework.Code.TypedConstant})
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddPositionalParameter(System.String,Metalama.Framework.Code.IType,System.Nullable{Metalama.Framework.Code.TypedConstant})
  id: AddPositionalParameter(System.String,Metalama.Framework.Code.IType,System.Nullable{Metalama.Framework.Code.TypedConstant})
  parent: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder
  langs:
  - csharp
  - vb
  name: AddPositionalParameter(string, IType, TypedConstant?)
  nameWithType: IRecordBuilder.AddPositionalParameter(string, IType, TypedConstant?)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddPositionalParameter(string, Metalama.Framework.Code.IType, Metalama.Framework.Code.TypedConstant?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Appends a positional parameter to the record, which declares a parameter of the primary constructor and a

    public init-only property of the same name and type.
  remarks: >-
    <p>
        A record that has at least one positional parameter is a positional record, and the compiler synthesizes a
        <code>Deconstruct</code> method for it. A record that has none declares no parameter list, and
        <xref href="Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod" data-throw-if-not-resolved="false"></xref> is then <code>null</code> on the
        introduced type.
        </p>
  example: []
  syntax:
    content: IParameterBuilder AddPositionalParameter(string name, IType type, TypedConstant? defaultValue = null)
    parameters:
    - id: name
      type: System.String
      description: The name of the parameter, which is also the name of the property it declares.
    - id: type
      type: Metalama.Framework.Code.IType
      description: The type of the parameter.
    - id: defaultValue
      type: System.Nullable{Metalama.Framework.Code.TypedConstant}
      description: The default value of the parameter, or <code>null</code> when it has none.
    return:
      type: Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder
      description: >-
        An <xref href="Metalama.Framework.Code.DeclarationBuilders.IParameterBuilder" data-throw-if-not-resolved="false"></xref> that allows you to further build the new parameter, in particular
                        to add custom attributes to it.
    content.vb: Function AddPositionalParameter(name As String, type As IType, defaultValue As TypedConstant? = Nothing) As IParameterBuilder
  overload: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddPositionalParameter*
  nameWithType.vb: IRecordBuilder.AddPositionalParameter(String, IType, TypedConstant?)
  fullName.vb: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddPositionalParameter(String, Metalama.Framework.Code.IType, Metalama.Framework.Code.TypedConstant?)
  name.vb: AddPositionalParameter(String, IType, TypedConstant?)
