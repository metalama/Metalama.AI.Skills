- uid: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddBaseArgument(Metalama.Framework.Code.IExpression,System.String)
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddBaseArgument(Metalama.Framework.Code.IExpression,System.String)
  id: AddBaseArgument(Metalama.Framework.Code.IExpression,System.String)
  parent: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder
  langs:
  - csharp
  - vb
  name: AddBaseArgument(IExpression, string?)
  nameWithType: IRecordBuilder.AddBaseArgument(IExpression, string?)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IRecordBuilder.AddBaseArgument(Metalama.Framework.Code.IExpression, string?)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Adds an argument that the record passes to the primary constructor of its base record, which the language

    writes in the base list of the declaration, as in <code>record Derived( int X ) : BaseRecord( X )</code>.
  remarks: >-
    <p>
        A record class that derives from a record whose only constructor is a primary constructor must pass
        arguments to it, and the compiler reports CS1729 on the generated declaration when it does not.
        </p>
    <p>
        Set <xref href="Metalama.Framework.Code.DeclarationBuilders.INamedTypeBuilder.BaseType" data-throw-if-not-resolved="false"></xref> before calling this method. The method throws a
        <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref> on a record struct, which has no base list, and an
        <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> when the base type is still <xref href="System.Object" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: void AddBaseArgument(IExpression argument, string? parameterName = null)
    parameters:
    - id: argument
      type: Metalama.Framework.Code.IExpression
      description: >-
        The expression to pass as an argument. A positional parameter of the record is
