  name: IDurableExpression
  nameWithType: IDurableExpression
  fullName: Metalama.Framework.Code.IDurableExpression
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    A representation of an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> that is safe to be held across compilations. Obtain one by

    calling <xref href="Metalama.Framework.Code.ExpressionExtensions.ToDurable(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>, and turn it back into an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> by

    calling <xref href="Metalama.Framework.Code.IDurableExpression.ToExpression(Metalama.Framework.Code.ICompilation)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        This is to <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> what <xref href="Metalama.Framework.Code.IDurableRef%601" data-throw-if-not-resolved="false"></xref> is to <xref href="Metalama.Framework.Code.IRef%601" data-throw-if-not-resolved="false"></xref>. An
        <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> is not durable: one captured in a template holds its compilation, and one read from the
        code model holds the syntax tree of its source file. Aspect state that must survive an edit cannot hold either.
        </p>
    <p>
        The conversion renders the expression immediately and keeps the result, so it works for every kind of expression.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      [Durable]

      [ImmutableType]

      public interface IDurableExpression
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      <Durable>

      <ImmutableType>

      Public Interface IDurableExpression
