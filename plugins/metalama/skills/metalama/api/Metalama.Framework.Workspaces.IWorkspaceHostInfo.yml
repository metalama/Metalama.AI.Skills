- uid: Metalama.Framework.Workspaces.IWorkspaceHostInfo.TelemetryContext
  commentId: P:Metalama.Framework.Workspaces.IWorkspaceHostInfo.TelemetryContext
  id: TelemetryContext
  parent: Metalama.Framework.Workspaces.IWorkspaceHostInfo
  langs:
  - csharp
  - vb
  name: TelemetryContext
  nameWithType: IWorkspaceHostInfo.TelemetryContext
  fullName: Metalama.Framework.Workspaces.IWorkspaceHostInfo.TelemetryContext
  type: Property
  assemblies:
  - Metalama.Framework.Workspaces
  namespace: Metalama.Framework.Workspaces
  summary: >-
    Gets the telemetry context that the workspace opened when it was loaded, or <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> when the telemetry

    service is not available.
  remarks: >-
    <p>
        The context decides whether telemetry is collected: the consent of the user, the opt-out of the repository
        (<code>metalama.json</code>), and the gates of the process. A host uses it for the usage session of the workspace and for the
        exceptions of the workspace. The service provider of each project of the workspace exposes the same context to the
        engine. A reload of the workspace opens a new context.
        </p>
    <p>
        The policy of the context is resolved from the directory of the first loaded path. When the workspace contains a
        project of another repository, the <code>metalama.json</code> file of that repository is not consulted.
        </p>
  example: []
  syntax:
    content: ITelemetryContext? TelemetryContext { get; }
    parameters: []
    return:
      type: SharpCrafters.Backstage.Telemetry.ITelemetryContext
    content.vb: ReadOnly Property TelemetryContext As ITelemetryContext
  overload: Metalama.Framework.Workspaces.IWorkspaceHostInfo.TelemetryContext*
