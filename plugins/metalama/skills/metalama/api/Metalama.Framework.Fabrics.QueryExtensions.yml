  summary: >-
    Provides extension methods for <xref href="Metalama.Framework.Fabrics.IQuery%601" data-throw-if-not-resolved="false"></xref> to enable additional querying capabilities,

    such as selecting types by reflection, finding declarations with attributes, and selecting referenced assemblies.
  remarks: >-
    <p>
        These extension methods complement the core query methods defined in <xref href="Metalama.Framework.Fabrics.IQuery%601" data-throw-if-not-resolved="false"></xref>,
        providing convenience methods for common querying scenarios within fabrics.
        </p>
