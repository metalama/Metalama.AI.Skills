  type: Property
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.CodeModel
  summary: Gets the syntax trees in the current subset.
  remarks: >-
    Replaces <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation.SyntaxTrees" data-throw-if-not-resolved="false"></xref> for the majority of uses, which enumerate the trees and never read the path

    that keyed them. The collection is identified by the trees themselves, so it costs no string hashing, and it is

    not an <xref href="System.Collections.Immutable.ImmutableDictionary%602" data-throw-if-not-resolved="false"></xref>, which is only useful to a caller building a modified copy.
  example: []
