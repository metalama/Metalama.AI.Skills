  name: IPartialCompilation
  nameWithType: IPartialCompilation
  fullName: Metalama.Framework.Engine.CodeModel.IPartialCompilation
  type: Interface
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.CodeModel
  summary: >-
    Represents a subset of a Roslyn <xref href="Microsoft.CodeAnalysis.Compilation" data-throw-if-not-resolved="false"></xref>, limited to specific syntax trees.

    This interface provides an immutable view of the compilation that can be transformed by aspect weavers.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation" data-throw-if-not-resolved="false"></xref> is the primary interface for manipulating compilations in <xref href="Metalama.Framework.Engine.AspectWeavers.IAspectWeaver" data-throw-if-not-resolved="false"></xref> implementations.
        It wraps a Roslyn <xref href="Microsoft.CodeAnalysis.Compilation" data-throw-if-not-resolved="false"></xref> and provides methods to transform syntax trees.
        </p>
    <p>
      <b>Compile-time vs design-time behavior:</b> At compile time, this always represents the complete compilation.
        At design time (IDE), this represents only the inheritance closure of files that have been modified and need to be recompiled,
        which is why the <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation.IsPartial" data-throw-if-not-resolved="false"></xref> property exists.
        </p>
    <p>
        Key operations:
        </p>
    <ul><li>
          <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation.WithSyntaxTreeTransformations(System.Collections.Generic.IReadOnlyList%7bMetalama.Compiler.SyntaxTreeTransformation%7d)" data-throw-if-not-resolved="false"></xref>: Apply syntax tree modifications (add, remove, replace).</li><li>
          <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation.WithAdditionalResources(Metalama.Compiler.ManagedResource%5b%5d)" data-throw-if-not-resolved="false"></xref>: Add managed resources to the compilation.</li></ul>
    <p>
        This interface is immutable. All modification methods return a new <xref href="Metalama.Framework.Engine.CodeModel.IPartialCompilation" data-throw-if-not-resolved="false"></xref> instance.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IPartialCompilation
    content.vb: >-
      <InternalImplement>

      Public Interface IPartialCompilation
