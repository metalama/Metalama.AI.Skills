  - Metalama.Patterns.Wpf
  namespace: Metalama.Patterns.Wpf
  summary: >-
    An implementation of <xref href="System.Windows.Input.ICommand" data-throw-if-not-resolved="false"></xref> that uses delegates for the execute and can-execute logic,

    without accepting a command parameter. This class is typically generated by the <xref href="Metalama.Patterns.Wpf.CommandAttribute" data-throw-if-not-resolved="false"></xref> aspect.
  remarks: >-
    <p>This class implements <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> to notify when <xref href="Metalama.Patterns.Wpf.DelegateCommand.CanExecute" data-throw-if-not-resolved="false"></xref> changes.

    When integrated with an <xref href="System.ComponentModel.INotifyPropertyChanged" data-throw-if-not-resolved="false"></xref> implementation for the <code>CanExecute</code> property,

    the <xref href="Metalama.Patterns.Wpf.BaseDelegateCommand.CanExecuteChanged" data-throw-if-not-resolved="false"></xref> event is automatically raised.</p>
