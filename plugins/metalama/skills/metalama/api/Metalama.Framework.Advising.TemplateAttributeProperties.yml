  summary: >-
    Represents a set of properties that configure how a T# template member should be introduced into target code.

    These properties allow overriding the name, accessibility, and modifiers of members introduced from templates.

    When a property is <code>null</code>, its value is inherited from the template member itself.
  remarks: >-
    This record is used by <xref href="Metalama.Framework.Advising.ITemplateAttribute" data-throw-if-not-resolved="false"></xref> to store configuration properties for template members.

    It supports progressive enhancement of template attributes in future versions by encapsulating all configuration

    in a single object.
  example: []
  syntax:
    content: public TemplateAttributeProperties(string? Name = null, Accessibility? Accessibility = null, bool? IsVirtual = null, bool? IsSealed = null, bool? IsRequired = null, bool? IsAbstract = null, bool? IsPartial = null, bool? IsExtern = null, string? Id = null)
    parameters:
    - id: Name
      type: System.String
      description: The name of the introduced member. When <code>null</code>, the name is taken from the template member.
    - id: Accessibility
      type: System.Nullable{Metalama.Framework.Code.Accessibility}
      description: The accessibility level of the introduced member (e.g., public, private, protected). When <code>null</code>, the accessibility is taken from the template member.
    - id: IsVirtual
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is virtual. When <code>null</code>, the value is taken from the template member.
    - id: IsSealed
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is sealed. When <code>null</code>, the value is taken from the template member.
    - id: IsRequired
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is required (C# 11+ feature). When <code>null</code>, the value is taken from the template member.
    - id: IsAbstract
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is abstract. When <code>null</code>, the value is taken from the template member.
    - id: IsPartial
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is partial. When <code>null</code>, the value is taken from the template member.
    - id: IsExtern
      type: System.Nullable{System.Boolean}
      description: A value indicating whether the introduced member is extern. When <code>null</code>, the value is taken from the template member.
    - id: Id
      type: System.String
      description: >-
        An identifier that can be used to reference this template from advising methods. When set, this identifier can be passed
                    to advising methods such as <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceMethod(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IMethodBuilder%7d%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> instead of the member name. This allows referencing templates
                    by a stable identifier, which is useful when templates are defined in a separate assembly from the code that uses them.
    content.vb: Public Sub New(Name As String = Nothing, Accessibility As Accessibility? = Nothing, IsVirtual As Boolean? = Nothing, IsSealed As Boolean? = Nothing, IsRequired As Boolean? = Nothing, IsAbstract As Boolean? = Nothing, IsPartial As Boolean? = Nothing, IsExtern As Boolean? = Nothing, Id As String = Nothing)
