  commentId: P:Metalama.Extensions.Multicast.MulticastAspect.AttributeTargetMemberAttributes
  id: AttributeTargetMemberAttributes
  parent: Metalama.Extensions.Multicast.MulticastAspect
  langs:
  - csharp
