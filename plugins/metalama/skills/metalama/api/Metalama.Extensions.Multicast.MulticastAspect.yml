  name: MulticastAspect
  nameWithType: MulticastAspect
  fullName: Metalama.Extensions.Multicast.MulticastAspect
  type: Class
  assemblies:
  - Metalama.Extensions.Multicast
  namespace: Metalama.Extensions.Multicast
  summary: >-
    A base class that can be used to build aspects that mimic PostSharp attribute multicasting. This class implements multicasting

    from the assembly- or type-level custom attributes. Implementations of this class must provide the other implementations of the

    <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref> generic interface for the final type of declarations.
  remarks: >-
    <p>

    This class serves as the foundation for aspects that support PostSharp-style multicasting, allowing aspects to be applied

    at the assembly or type level and automatically cascade to matching members based on filtering criteria defined through

    <xref href="Metalama.Extensions.Multicast.IMulticastAttribute" data-throw-if-not-resolved="false"></xref> properties.

    </p>

    <p>

    Derived classes should implement <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref> for the specific target declaration types they want to support

    (e.g., <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.IProperty" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.IField" data-throw-if-not-resolved="false"></xref>).

    </p>

    <p>

    For an example implementation, see the source code of <xref href="Metalama.Extensions.Multicast.OverrideMethodMulticastAspect" data-throw-if-not-resolved="false"></xref> at

    <a href="https://github.com/postsharp/Metalama.Extensions/blob/HEAD/src/Metalama.Extensions.Multicast/OverrideMethodMulticastAspect.cs">https://github.com/postsharp/Metalama.Extensions/blob/HEAD/src/Metalama.Extensions.Multicast/OverrideMethodMulticastAspect.cs</a>.

    </p>
  example: []
