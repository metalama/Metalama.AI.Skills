  type: Class
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Excludes the code of the declaration from interception, or includes it again: when excluded, no site inside the declaration, or inside a

    declaration that it contains, is presented to any interceptor registration.
  remarks: >-
    <p>

    The typical use is an interceptor method that calls the method that it intercepts. Without the attribute, the call in the interceptor

    would be intercepted when the scope of the registration contains the interceptor, and the interceptor would call itself.

    </p>

    <p>

    The attribute applies to the declaration that carries it and to everything that the declaration contains: the members and nested types of

    a type, and the lambdas and local functions of a member. A lambda or a local function follows the member that contains it, so the attribute

    is not honored on a local function. On the assembly, it excludes the whole project. Derived types and overriding members are not excluded by

    the exclusion of their base.

    </p>

    <p>

    The attribute is equivalent to <xref href="Metalama.Extensions.Interceptors.InterceptorConfigurationExtensions" data-throw-if-not-resolved="false"></xref> in a fabric. When a declaration and a declaration that

    contains it are configured differently, the configuration of the innermost declaration applies, so <code>[ExcludeInterceptors( false )]</code>

    includes a declaration again in an excluded scope.

    </p>
  example: []
  syntax:
    content: >-
      [RunTimeOrCompileTime]

      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Constructor|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event|AttributeTargets.Interface, Inherited = false)]

