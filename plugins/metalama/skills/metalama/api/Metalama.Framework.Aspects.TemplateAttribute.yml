  namespace: Metalama.Framework.Aspects
  summary: Marks a method, property, field, or event as a T# template that can be used to generate or transform code.
  remarks: >-
    <p>
        Templates are methods written in T#, a template language that is fully compatible with C# but has different semantics.
        T# combines compile-time logic with run-time code generation: templates execute at compile-time to produce the C# code
        that will run in your application. The T# compiler analyzes your code and separates compile-time portions from run-time
        portions, typically using the <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref> pseudo-keyword to identify compile-time expressions and statements.
        </p>
    <p>
        This attribute marks a member as a template. When used with <xref href="Metalama.Framework.Aspects.IntroduceAttribute" data-throw-if-not-resolved="false"></xref> for declarative member
        introduction, or with advising methods like <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceMethod(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IMethodBuilder%7d%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>, the properties of this
        attribute (such as <xref href="Metalama.Framework.Aspects.TemplateAttribute.Name" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.TemplateAttribute.Accessibility" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Aspects.TemplateAttribute.IsVirtual" data-throw-if-not-resolved="false"></xref>) control the characteristics
        of the introduced member. When a property is not explicitly set, its value defaults to the corresponding characteristic
        of the template member itself.
        </p>
    <p>
        Within templates, you can use <code>meta.Target</code> to access the declaration being overridden or introduced, and
        <code>meta.Proceed()</code> to invoke the original implementation when overriding. T# supports compile-time control flow
        (compile-time <code>if</code> and <code>foreach</code>) and dynamic typing through the <code>dynamic</code> keyword, which represents
        values whose types are unknown at template authoring time but are resolved when the template is applied to a specific
        target.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event)]

      public class TemplateAttribute : Attribute, ITemplateAttribute, IAdviceAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.Event)>

      Public Class TemplateAttribute Inherits Attribute Implements ITemplateAttribute, IAdviceAttribute
