- uid: Metalama.Framework.Aspects.TemplateAttribute.Id
  commentId: P:Metalama.Framework.Aspects.TemplateAttribute.Id
  id: Id
  parent: Metalama.Framework.Aspects.TemplateAttribute
  langs:
  - csharp
