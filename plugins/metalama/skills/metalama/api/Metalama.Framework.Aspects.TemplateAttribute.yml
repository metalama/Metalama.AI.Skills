  name: Id
  nameWithType: TemplateAttribute.Id
  fullName: Metalama.Framework.Aspects.TemplateAttribute.Id
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets an identifier that can be used to reference this template from advising methods.
  remarks: >-
    <p>
        When set, this identifier can be passed to advising methods such as <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceMethod(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cSystem.String%2cMetalama.Framework.Aspects.IntroductionScope%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IMethodBuilder%7d%2cSystem.Object%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>
        and other methods that accept a template name parameter. This allows referencing templates by a stable identifier
        instead of the member name, which is useful when templates are defined in a separate assembly from the code that uses them.
        </p>
    <p>
        When not set, templates can only be referenced by their member name using <code>nameof(TemplateMember)</code>.
        </p>
  example: []
  syntax:
    content: public string? Id { get; set; }
    parameters: []
    return:
      type: System.String
    content.vb: Public Property Id As String
  overload: Metalama.Framework.Aspects.TemplateAttribute.Id*
