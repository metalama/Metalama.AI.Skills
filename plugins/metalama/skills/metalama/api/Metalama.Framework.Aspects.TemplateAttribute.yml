- uid: Metalama.Framework.Aspects.TemplateAttribute.IsEmpty
  commentId: P:Metalama.Framework.Aspects.TemplateAttribute.IsEmpty
  id: IsEmpty
  parent: Metalama.Framework.Aspects.TemplateAttribute
  langs:
  - csharp
  - vb
  name: IsEmpty
  nameWithType: TemplateAttribute.IsEmpty
  fullName: Metalama.Framework.Aspects.TemplateAttribute.IsEmpty
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets a value indicating whether this template is an empty placeholder implementation.
  remarks: >-
    <p>
        When set to <code>true</code>, this template is treated as undefined unless overridden in a derived aspect class.
        This is similar to an abstract template, but unlike abstract templates, derived aspects are not required to
        provide an implementation.
        </p>
    <p>
        Empty templates are useful when creating aspect base classes that provide default no-op implementations for
        optional template methods (e.g., async or iterator method templates in <xref href="Metalama.Framework.Aspects.OverrideMethodAspect" data-throw-if-not-resolved="false"></xref>).
        </p>
  example: []
  syntax:
    content: public bool IsEmpty { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property IsEmpty As Boolean
  overload: Metalama.Framework.Aspects.TemplateAttribute.IsEmpty*
