  name: ICacheDependency
  nameWithType: ICacheDependency
  fullName: Metalama.Patterns.Caching.Dependencies.ICacheDependency
  type: Interface
  assemblies:
  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching.Dependencies
  summary: >-
    Interface that must be implemented by classes that need to be used as cache dependencies,

    for use with the <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.AddDependency(Metalama.Patterns.Caching.ICachingService%2cMetalama.Patterns.Caching.Dependencies.ICacheDependency)" data-throw-if-not-resolved="false"></xref> method.

    Alternatively, custom classes may implement the <xref href="Flashtrace.Formatters.IFormattable%601" data-throw-if-not-resolved="false"></xref> interface or simply

    the <xref href="System.Object.ToString" data-throw-if-not-resolved="false"></xref> method.
  remarks: >-
    <p>Cache dependencies provide an indirect way to invalidate cache items. Instead of directly invalidating

    a specific cached method, you can invalidate a dependency, which automatically invalidates all cache items

    that depend on it.</p>

    <p>Dependencies are added to the current caching context using the

    <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.AddDependency(Metalama.Patterns.Caching.ICachingService%2cMetalama.Patterns.Caching.Dependencies.ICacheDependency)" data-throw-if-not-resolved="false"></xref> method and invalidated using the

    <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Invalidate(Metalama.Patterns.Caching.ICachingService%2cMetalama.Patterns.Caching.Dependencies.ICacheDependency)" data-throw-if-not-resolved="false"></xref> method.</p>
  example: []
