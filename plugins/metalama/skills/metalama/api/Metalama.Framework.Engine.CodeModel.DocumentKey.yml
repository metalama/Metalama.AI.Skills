  fullName: Metalama.Framework.Engine.CodeModel.DocumentKey
  type: Struct
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.CodeModel
  summary: >-
    Identifies a document of a project across the compilations of that project. This is the key of every design-time

    cache that has to survive an edit.
  remarks: >-
    <p>
        A <xref href="Microsoft.CodeAnalysis.SyntaxTree" data-throw-if-not-resolved="false"></xref> is a transient artifact: the IDE produces a new <xref href="Microsoft.CodeAnalysis.Compilation" data-throw-if-not-resolved="false"></xref> holding new
        trees on every keystroke, so reference identity distinguishes trees only <em>within</em> one compilation and cannot
        key a cache that outlives it. The permanent identity of a document is therefore needed, and
        <xref href="Microsoft.CodeAnalysis.SyntaxTree.FilePath" data-throw-if-not-resolved="false"></xref> is the only candidate reachable where it is needed: a Roslyn analyzer callback
        carries a <xref href="Microsoft.CodeAnalysis.SemanticModel" data-throw-if-not-resolved="false"></xref> and nothing else, the cross-process contract passes a path, and
        <code>WorkspaceProvider</code> returns no workspace at all in a supported host, so no <code>DocumentId</code> is available. See
        issue #1742.
        </p>
    <p>
        This type exists because a bare <xref href="System.String" data-throw-if-not-resolved="false"></xref> made two mistakes easy. It let the comparer be chosen per
        dictionary, which is how the design-time indexes came to compare paths ordinally while the command-line compiler
        deduplicates them with <xref href="System.StringComparer.OrdinalIgnoreCase" data-throw-if-not-resolved="false"></xref>. And it let one key space be confused with
        another, because a document path, an introduced syntax tree name and a source generator hint name are all strings;
        the duplicate-introduction assertion of <code>DesignTimeAspectPipelineResult</code> was exactly such a confusion. Keeping
        document paths in a distinct type makes both a compile error.
        </p>
    <p>
        The comparison is ordinal. Case-insensitive comparison would match the command-line compiler on Windows and be
        wrong on Linux, where two paths differing in case are two files.
        </p>
    <p>
        The hash code is computed once, on construction. These keys are long strings compared and hashed on every lookup of
        the design-time hot path, so caching the hash is why this type is not slower than the string it replaces.
        </p>
    <p>
        A key is a value, not a reference into a compilation. It does not guarantee that the document exists in any given
        compilation, and it deliberately does not carry the <xref href="Microsoft.CodeAnalysis.SyntaxTree" data-throw-if-not-resolved="false"></xref>: a cache entry that held one would
        root the syntax tree of an earlier compilation.
        </p>
  example: []
