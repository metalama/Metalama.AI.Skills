- uid: Metalama.Framework.Engine.CodeModel.DocumentKey.IsDefault
  commentId: P:Metalama.Framework.Engine.CodeModel.DocumentKey.IsDefault
  id: IsDefault
  parent: Metalama.Framework.Engine.CodeModel.DocumentKey
  langs:
  - csharp
  - vb
  name: IsDefault
  nameWithType: DocumentKey.IsDefault
  fullName: Metalama.Framework.Engine.CodeModel.DocumentKey.IsDefault
  type: Property
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.CodeModel
  summary: >-
    Gets a value indicating whether this key is the default value, which identifies no document. This is the key

    under which a design-time cache files what belongs to the compilation rather than to any document.
  remarks: >-
    The default key cannot collide with a document, which is the reason it, rather than a key over the empty path,

    marks the absence of one. It wraps a null path, and no key of a document can: <xref href="Metalama.Framework.Engine.CodeModel.DocumentKey.FromPath(System.String)" data-throw-if-not-resolved="false"></xref> rejects

    null and <xref href="Metalama.Framework.Engine.CodeModel.DocumentKey.FromSyntaxTree(Microsoft.CodeAnalysis.SyntaxTree)" data-throw-if-not-resolved="false"></xref> reads <xref href="Microsoft.CodeAnalysis.SyntaxTree.FilePath" data-throw-if-not-resolved="false"></xref>, which Roslyn never returns as

    null. The empty path carries no such guarantee, because a syntax tree may have one.
  example: []
  syntax:
    content: public bool IsDefault { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public ReadOnly Property IsDefault As Boolean
  overload: Metalama.Framework.Engine.CodeModel.DocumentKey.IsDefault*
