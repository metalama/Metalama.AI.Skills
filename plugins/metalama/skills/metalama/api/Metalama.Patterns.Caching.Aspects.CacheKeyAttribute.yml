  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Aspect that, when applied to a field or property, includes that member in the cache key generation

    for the declaring type when instances are used as parameters of cached methods.
  remarks: >-
    <p>When a cached method has a parameter of a custom type, Metalama Caching needs to generate a unique

    string to represent the value in the cache key. The <xref href="Metalama.Patterns.Caching.Aspects.CacheKeyAttribute" data-throw-if-not-resolved="false"></xref> aspect automatically

    implements the <xref href="Flashtrace.Formatters.IFormattable%601" data-throw-if-not-resolved="false"></xref> interface for the

    <xref href="Metalama.Patterns.Caching.Formatters.CacheKeyFormatting" data-throw-if-not-resolved="false"></xref> role, including all marked

    fields and properties in the generated cache key.</p>

    <p>As a best practice, include the full type name in cache keys to avoid collisions between different types

    that share the same identifying properties.</p>
  example:
  - >-
    <pre><code class="lang-csharp">public class Product

    {
        [CacheKey]
        public int Id { get; }

        [CacheKey]
        public string Category { get; }

        public string Description { get; } // Not part of cache key
    }</code></pre>
