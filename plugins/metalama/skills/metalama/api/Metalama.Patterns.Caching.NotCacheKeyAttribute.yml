  - Metalama.Patterns.Caching
  namespace: Metalama.Patterns.Caching
  summary: >-
    Custom attribute that, when applied to a parameter of a cached method (i.e. a method enhanced by the <code>CacheAttribute</code> aspect),

    excludes this parameter from being a part of the cache key.
  remarks: >-
    <p>Use this attribute to exclude parameters that don't affect the method's return value but may vary between calls,

    such as correlation IDs, loggers, or cancellation tokens. Note that <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref>

    parameters are automatically excluded by default.</p>

    <p>For excluding parameters by rule across multiple methods, consider implementing

    the <code>ICacheParameterClassifier</code> interface.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter)]

      public sealed class NotCacheKeyAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Parameter)>

      Public NotInheritable Class NotCacheKeyAttribute Inherits Attribute
