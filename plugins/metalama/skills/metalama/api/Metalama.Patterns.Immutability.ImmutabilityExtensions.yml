- uid: Metalama.Patterns.Immutability.ImmutabilityExtensions.GetImmutabilityKind(Metalama.Framework.Code.IType)
  commentId: M:Metalama.Patterns.Immutability.ImmutabilityExtensions.GetImmutabilityKind(Metalama.Framework.Code.IType)
  id: GetImmutabilityKind(Metalama.Framework.Code.IType)
  isExtensionMethod: true
  parent: Metalama.Patterns.Immutability.ImmutabilityExtensions
  langs:
  - csharp
  - vb
  name: GetImmutabilityKind(IType)
  nameWithType: ImmutabilityExtensions.GetImmutabilityKind(IType)
  fullName: Metalama.Patterns.Immutability.ImmutabilityExtensions.GetImmutabilityKind(Metalama.Framework.Code.IType)
  type: Method
  assemblies:
  - Metalama.Patterns.Immutability
  namespace: Metalama.Patterns.Immutability
  summary: Returns the <xref href="Metalama.Patterns.Immutability.ImmutabilityKind" data-throw-if-not-resolved="false"></xref> for a given type.
  remarks: >-
    <p>

    The rule for a union rests on the definition that <xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Shallow" data-throw-if-not-resolved="false"></xref> gives, which is about

    instance fields and automatic property setters, and not on the type being declared <code>readonly</code>. A union

    declaration satisfies that definition whether or not it carries the modifier, because its only instance field is

    the read-only backing field of the synthesized get-only <code>Value</code> property, and the language reports an error

    for an instance field, an automatic property or a field-like event declared in a union.

    </p>

    <p>

    The rule applies to the declaration form only. A class or a struct that carries the

    <code>System.Runtime.CompilerServices.UnionAttribute</code> attribute is also a union, its state is unconstrained, and

    it is classified by the rules that apply to any other class or struct. A union read from a referenced assembly

    is reported as the attribute form, because the compiled form of a union does not record whether the source used

    the <code>union</code> keyword, so a union of another project is classified by those rules as well.

    </p>
  example: []
  syntax:
    content: public static ImmutabilityKind GetImmutabilityKind(this IType type)
    parameters:
    - id: type
      type: Metalama.Framework.Code.IType
      description: The type to evaluate.
    return:
      type: Metalama.Patterns.Immutability.ImmutabilityKind
      description: >-
        The <xref href="Metalama.Patterns.Immutability.ImmutabilityKind" data-throw-if-not-resolved="false"></xref> of the type, determined by the following rules in order:

        <ul><li><xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Deep" data-throw-if-not-resolved="false"></xref> for intrinsic types (<code>bool</code>, <code>byte</code>, <code>int</code>,

        <code>string</code>, etc.), delegates, enums, pointers, and function pointers.</li><li>The <xref href="Metalama.Patterns.Immutability.ImmutabilityKind" data-throw-if-not-resolved="false"></xref> configured via <xref href="Metalama.Patterns.Immutability.ImmutableAttribute" data-throw-if-not-resolved="false"></xref> or

        <xref href="Metalama.Patterns.Immutability.Configuration.ImmutabilityConfigurationExtensions.ConfigureImmutability(Metalama.Framework.Fabrics.IQuery%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Patterns.Immutability.ImmutabilityKind)" data-throw-if-not-resolved="false"></xref>.</li><li>The result of a configured <xref href="Metalama.Patterns.Immutability.Configuration.IImmutabilityClassifier" data-throw-if-not-resolved="false"></xref> if one is set.</li><li><xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Deep" data-throw-if-not-resolved="false"></xref> for value types in the <code>System</code> namespace, except

        <code>ValueTuple</code>, <code>Span</code>, <code>ReadOnlySpan</code>, <code>Memory</code>, and <code>ReadOnlyMemory</code>.</li><li><xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Deep" data-throw-if-not-resolved="false"></xref> for a union declared with the <code>union</code> keyword whose

        every case type is deeply immutable, and <xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Shallow" data-throw-if-not-resolved="false"></xref> for any other such

        union.</li><li><xref href="Metalama.Patterns.Immutability.ImmutabilityKind.Shallow" data-throw-if-not-resolved="false"></xref> for read-only structs.</li><li><xref href="Metalama.Patterns.Immutability.ImmutabilityKind.None" data-throw-if-not-resolved="false"></xref> for all other types.</li></ul>
    content.vb: Public Shared Function GetImmutabilityKind(type As IType) As ImmutabilityKind
