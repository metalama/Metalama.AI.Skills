    content: public IncrementalKeyedCollection<TKey, TValue> ApplyChanges(IncrementalKeyedCollection<TKey, TValue> overridingOptions, in ApplyChangesContext context)
    parameters:
    - id: overridingOptions
      type: Metalama.Framework.Options.IncrementalKeyedCollection`2
      description: The collection layer to merge with the current layer.
    - id: context
      type: Metalama.Framework.Options.ApplyChangesContext
      description: The context of the merge operation.
    return:
      type: Metalama.Framework.Options.IncrementalKeyedCollection`2
      description: A new <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref> representing the merged result.
