  fullName: Metalama.Framework.Options.IncrementalKeyedCollection<TKey, TValue>.AddOrApplyChanges(TValue)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: >-
    Creates a <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref> that contains all operations already contained in the current object,

    plus the operation of adding an item, or merging it with an existing item if the same key already exists.
  remarks: >-
    This method does not modify the current instance; it returns a new instance with the combined operations.

    If an item with the same key exists in the current layer, the items are merged using <xref href="Metalama.Framework.Options.IIncrementalObject.ApplyChanges(System.Object%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref>.
