  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: Merges the current collection layer with another collection layer and returns the result.
  remarks: >-
    If <code class="paramref">overridingOptions</code> contains a clear operation, it takes precedence and the result contains only the operations from <code class="paramref">overridingOptions</code>.

    Otherwise, items from both layers are combined. When an item with the same key exists in both layers and both are enabled (not marked for removal),

    the two item instances are themselves merged using <xref href="Metalama.Framework.Options.IIncrementalObject.ApplyChanges(System.Object%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref>. In all other cases (removal operations,

    or item present in only one layer), the operation from <code class="paramref">overridingOptions</code> takes precedence if it defines that key.
  example: []
