    parameters:
    - id: item
      type: '{TValue}'
      description: The item to add or merge.
    return:
      type: Metalama.Framework.Options.IncrementalKeyedCollection`2
      description: A new <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref> with the additional operation.
    content.vb: Public Function AddOrApplyChanges(item As TValue) As IncrementalKeyedCollection(Of TKey, TValue)
