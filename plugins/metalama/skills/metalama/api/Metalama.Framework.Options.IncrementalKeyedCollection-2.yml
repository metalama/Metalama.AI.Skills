  name: IncrementalKeyedCollection<TKey, TValue>
  nameWithType: IncrementalKeyedCollection<TKey, TValue>
  fullName: Metalama.Framework.Options.IncrementalKeyedCollection<TKey, TValue>
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: >-
    An immutable keyed collection where each class instance does not represent the full collection but a modification of another collection (possibly empty).

    This class implements the <xref href="Metalama.Framework.Options.IIncrementalObject" data-throw-if-not-resolved="false"></xref> interface and can be easily used in the context of an <xref href="Metalama.Framework.Options.IHierarchicalOptions%601" data-throw-if-not-resolved="false"></xref>.

    The class can represent the <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602.AddOrApplyChanges(%601)" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602.Remove(%600)" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Options.IncrementalKeyedCollection.Clear%60%602" data-throw-if-not-resolved="false"></xref> operations.
  remarks: >-
    <p>
      <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602" data-throw-if-not-resolved="false"></xref> is designed for use as a property type within hierarchical options classes when
        you need to work with collections of complex, keyed items. Unlike a regular dictionary or keyed collection, each instance represents
        a <i>layer of changes</i> rather than the complete collection. When multiple layers are merged using <xref href="Metalama.Framework.Options.IncrementalKeyedCollection%602.ApplyChanges(Metalama.Framework.Options.IncrementalKeyedCollection%7b%600%2c%601%7d%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref>,
        the operations from each layer are combined intelligently.
        </p>
    <p>
        The key feature of this collection is that when an item with the same key exists in both the base collection and the overriding collection,
        the two items are themselves merged using <xref href="Metalama.Framework.Options.IIncrementalObject.ApplyChanges(System.Object%2cMetalama.Framework.Options.ApplyChangesContext%40)" data-throw-if-not-resolved="false"></xref>. This allows for fine-grained incremental
        modifications to complex configuration objects.
        </p>
    <p>
        For example, if one layer has a rule with key "DefaultPolicy" specifying cache duration of 60 seconds, and another layer provides a rule
        with the same key specifying a different setting, the two rules are merged, allowing partial updates rather than complete replacement.
        </p>
    <p>
        This class is immutable. All operations return new instances rather than modifying the current instance.
        </p>
