- uid: Metalama.Extensions.Interceptors.InvocationArgument.Expression
  commentId: P:Metalama.Extensions.Interceptors.InvocationArgument.Expression
  id: Expression
  parent: Metalama.Extensions.Interceptors.InvocationArgument
  langs:
  - csharp
  - vb
  name: Expression
  nameWithType: InvocationArgument.Expression
  fullName: Metalama.Extensions.Interceptors.InvocationArgument.Expression
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the argument expression written at the call site, for inspection only. The value is <code>null</code> when the argument is omitted

    (<xref href="Metalama.Extensions.Interceptors.InvocationArgumentKind.DefaultValue" data-throw-if-not-resolved="false"></xref>) and when the compiler materializes it from several expressions

    (<xref href="Metalama.Extensions.Interceptors.InvocationArgumentKind.ParamsElements" data-throw-if-not-resolved="false"></xref>). For a <code>ref</code>, <code>out</code> or <code>in</code> argument, it is the expression after

    the modifier.
  remarks: >-
    <p>

    The rules of <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionContext.Receiver" data-throw-if-not-resolved="false"></xref> apply.

    </p>

    <p>

    The value of a constant argument is <xref href="Metalama.Framework.Code.ISourceExpression.AsTypedConstant" data-throw-if-not-resolved="false"></xref> of this expression. The value of an omitted argument

    is <xref href="Metalama.Framework.Code.IParameter.DefaultValue" data-throw-if-not-resolved="false"></xref> of <xref href="Metalama.Extensions.Interceptors.InvocationArgument.Parameter" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
  syntax:
    content: public IExpression? Expression { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IExpression
    content.vb: Public ReadOnly Property Expression As IExpression
  overload: Metalama.Extensions.Interceptors.InvocationArgument.Expression*
