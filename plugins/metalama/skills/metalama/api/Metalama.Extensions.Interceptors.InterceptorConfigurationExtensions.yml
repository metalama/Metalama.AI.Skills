  nameWithType: InterceptorConfigurationExtensions
  fullName: Metalama.Extensions.Interceptors.InterceptorConfigurationExtensions
  type: Class
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Extension methods that configure interception from a fabric, for the declarations that a query selects.
  remarks: >-
    <p>

    <code>ExcludeInterceptors</code> excludes from interception every site in the selected declarations and in the declarations that they contain:

    the members and nested types of a type, the types of a namespace, and the whole project for the compilation. A lambda or a local function

    follows the member that contains it. Derived types and overriding members are not excluded by the exclusion of their base.

    </p>

    <p>

    The configuration is equivalent to <xref href="Metalama.Extensions.Interceptors.ExcludeInterceptorsAttribute" data-throw-if-not-resolved="false"></xref>. When a declaration and a declaration that contains it are

    configured differently, the configuration of the innermost declaration applies, so passing <code>false</code> enables interception again in a

    part of an excluded scope.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public static class InterceptorConfigurationExtensions
    content.vb: >-
      <CompileTime>

      Public Module InterceptorConfigurationExtensions
