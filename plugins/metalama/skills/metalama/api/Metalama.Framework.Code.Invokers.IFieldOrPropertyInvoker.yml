  name: IFieldOrPropertyInvoker
  nameWithType: IFieldOrPropertyInvoker
  fullName: Metalama.Framework.Code.Invokers.IFieldOrPropertyInvoker
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Allows generating run-time code that accesses a field or property when you have its compile-time <xref href="Metalama.Framework.Code.IFieldOrProperty" data-throw-if-not-resolved="false"></xref> representation.
  remarks: >-
    <p>
        Invokers are APIs that allow you to generate run-time code from compile-time declarations. When you have an <xref href="Metalama.Framework.Code.IFieldOrProperty" data-throw-if-not-resolved="false"></xref>
        object (a compile-time representation of a field or property), you can use it as an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> to access its value
        in generated code. Since this interface implements <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>, you can use the <xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref>
        property to get or set the field or property value directly in template code.
        </p>
    <p>
        For fields, you can also use <code>ref</code> when accessing the <xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref> property, allowing you to pass fields
        by reference. Use <xref href="Metalama.Framework.Code.Invokers.IFieldOrPropertyInvoker.WithObject(System.Object)" data-throw-if-not-resolved="false"></xref> to specify the target instance and <xref href="Metalama.Framework.Code.Invokers.IFieldOrPropertyInvoker.WithOptions(Metalama.Framework.Code.Invokers.InvokerOptions)" data-throw-if-not-resolved="false"></xref> to control nullability
        behavior and which implementation layer (base, current, or final) to access.
        </p>
    <p>
        By default, the field or property is accessed on the current object (<code>this</code>) for instance members. The <code>base</code>
        implementation is accessed, i.e. the implementation <i>before</i> the current aspect layer.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public interface IFieldOrPropertyInvoker : IExpression, IHasType
    content.vb: >-
      <CompileTime>

      Public Interface IFieldOrPropertyInvoker Inherits IExpression, IHasType
