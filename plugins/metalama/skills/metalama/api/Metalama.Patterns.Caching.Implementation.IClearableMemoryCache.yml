  summary: An <xref href="Microsoft.Extensions.Caching.Memory.IMemoryCache" data-throw-if-not-resolved="false"></xref> that can remove all of its entries.
  remarks: >-
    <xref href="Microsoft.Extensions.Caching.Memory.MemoryCache" data-throw-if-not-resolved="false"></xref> exposes these two operations, but

    <xref href="Microsoft.Extensions.Caching.Memory.IMemoryCache" data-throw-if-not-resolved="false"></xref> does not declare them. An implementation of <xref href="Microsoft.Extensions.Caching.Memory.IMemoryCache" data-throw-if-not-resolved="false"></xref> that also

    implements this interface supports the <code>Clear</code> feature of

    <xref href="Metalama.Patterns.Caching.Backends.MemoryCachingBackend" data-throw-if-not-resolved="false"></xref>.
