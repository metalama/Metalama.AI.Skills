  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Resolves a reference to its target declaration using the current Metalama execution context.
  remarks: >-
    <p>
        This is the most common way to resolve a reference. It uses <xref href="Metalama.Framework.Project.MetalamaExecutionContext.Current" data-throw-if-not-resolved="false"></xref>
        to obtain the current compilation. Use this method when resolving references during aspect execution.
        </p>
    <p>
        For resolving references in a specific compilation (e.g., when comparing declarations across compilation versions),
        use <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref> instead.
        </p>
  example: []
  syntax:
    content: 'public static T GetTarget<T>(this IRef<T> reference) where T : class, ICompilationElement'
    parameters:
    - id: reference
      type: Metalama.Framework.Code.IRef{{T}}
      description: The reference to resolve.
    typeParameters:
    - id: T
      description: The type of compilation element, such as <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.IProperty" data-throw-if-not-resolved="false"></xref>, or <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>.
    return:
      type: '{T}'
      description: The resolved declaration.
    content.vb: Public Shared Function GetTarget(Of T As {Class, ICompilationElement})(reference As IRef(Of T)) As T
  overload: Metalama.Framework.Code.RefExtensions.GetTarget*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: >-
      Thrown when the reference cannot be resolved or when called outside
                  of a Metalama execution context (e.g., from a template, <code>BuildAspect</code>, or fabric).
  nameWithType.vb: RefExtensions.GetTarget(Of T)(IRef(Of T))
  fullName.vb: Metalama.Framework.Code.RefExtensions.GetTarget(Of T)(Metalama.Framework.Code.IRef(Of T))
  name.vb: GetTarget(Of T)(IRef(Of T))
