  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when the reference cannot be resolved in the specified compilation.
  nameWithType.vb: RefExtensions.GetTarget(Of T)(IRef(Of T), ICompilation, IGenericContext)
