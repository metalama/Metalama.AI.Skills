  fullName: Metalama.Framework.Aspects.ContractAspect.RedirectContracts(Metalama.Framework.Aspects.IAspectBuilder, Metalama.Framework.Code.IFieldOrPropertyOrIndexer, Metalama.Framework.Code.IParameter)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Redirects validation logic of <xref href="Metalama.Framework.Aspects.ContractAspect" data-throw-if-not-resolved="false"></xref> from the specified property to the specified parameter.
  remarks: >-
    <p>
        This call will only redirect validation logic of contracts applied after the current aspect. 
        Contracts applied before the current aspect will not be affected.
        </p>
    <p>
        If an aspect needs to see the contract aspect instances and redirect their validation logic at the same time, 
        it should be applied after the default layer of <xref href="Metalama.Framework.Aspects.ContractAspect" data-throw-if-not-resolved="false"></xref> and before the layer that applies the contract logic, i.e. <xref href="Metalama.Framework.Aspects.ContractAspect.BuildLayer" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: public static void RedirectContracts(IAspectBuilder aspectBuilder, IFieldOrPropertyOrIndexer sourceTarget, IParameter targetParameter)
    parameters:
    - id: aspectBuilder
      type: Metalama.Framework.Aspects.IAspectBuilder
      description: Current aspect builder.
    - id: sourceTarget
      type: Metalama.Framework.Code.IFieldOrPropertyOrIndexer
      description: A declaration to redirect the validation logic from.
    - id: targetParameter
      type: Metalama.Framework.Code.IParameter
      description: A parameter to redirect the validation logic to.
    content.vb: Public Shared Sub RedirectContracts(aspectBuilder As IAspectBuilder, sourceTarget As IFieldOrPropertyOrIndexer, targetParameter As IParameter)
