- uid: Metalama.Framework.Aspects.ContractAspect.Validate(System.Object)
  commentId: M:Metalama.Framework.Aspects.ContractAspect.Validate(System.Object)
  id: Validate(System.Object)
  parent: Metalama.Framework.Aspects.ContractAspect
