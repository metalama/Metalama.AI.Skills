  nameWithType: ContractAspect.GetActualDirection(IAspectBuilder, ContractDirection)
  fullName: Metalama.Framework.Aspects.ContractAspect.GetActualDirection(Metalama.Framework.Aspects.IAspectBuilder, Metalama.Framework.Aspects.ContractDirection)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Gets the actual direction of the contract given the direction returned by <xref href="Metalama.Framework.Aspects.ContractAspect.GetDefinedDirection(Metalama.Framework.Aspects.IAspectBuilder)" data-throw-if-not-resolved="false"></xref>, after resolving the <xref href="Metalama.Framework.Aspects.ContractDirection.Default" data-throw-if-not-resolved="false"></xref>

    value according to the characteristics of the target declaration, and after taking predecessors and secondary instances into account. The implementation of this method

    may return <xref href="Metalama.Framework.Aspects.ContractDirection.None" data-throw-if-not-resolved="false"></xref> to skip the aspect.
