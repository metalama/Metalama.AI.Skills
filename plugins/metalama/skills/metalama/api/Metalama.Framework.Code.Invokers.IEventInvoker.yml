  fullName: Metalama.Framework.Code.Invokers.IEventInvoker.CanRaise
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Invokers
  summary: Gets a value indicating whether the event can be raised.
  remarks: >-
    <p>
        In C#, only field-like events (events without explicit <code>add</code>/<code>remove</code> accessors) can be raised
        because they have a backing delegate field that can be invoked. For non-field-like events (events with explicit accessors),
        there is no backing delegate to invoke, so this property returns <code>false</code>.
        </p>
    <p>
        When this property returns <code>false</code>, calling <xref href="Metalama.Framework.Code.Invokers.IEventInvoker.Raise(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> will throw an <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref>,
        and <xref href="Metalama.Framework.Code.IEvent.RaiseMethod" data-throw-if-not-resolved="false"></xref> will return <code>null</code>.
        </p>
  example: []
  syntax:
    content: bool CanRaise { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property CanRaise As Boolean
  overload: Metalama.Framework.Code.Invokers.IEventInvoker.CanRaise*
