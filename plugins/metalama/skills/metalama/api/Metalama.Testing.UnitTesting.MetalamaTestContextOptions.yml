  summary: Options that configure the behavior of a <xref href="Metalama.Testing.UnitTesting.MetalamaTestContext" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Pass an instance of this record to <xref href="Metalama.Testing.UnitTesting.UnitTestClass.CreateTestContext(Metalama.Testing.UnitTesting.MetalamaTestContextOptions%2cMetalama.Framework.Engine.Services.IAdditionalServiceCollection%2cSystem.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref>
        to customize test behavior. Common options include:

        <ul><li><xref href="Metalama.Testing.UnitTesting.MetalamaTestContextOptions.Timeout" data-throw-if-not-resolved="false"></xref>: Maximum time before the test's <xref href="Metalama.Testing.UnitTesting.MetalamaTestContext.CancellationToken" data-throw-if-not-resolved="false"></xref> is signaled</li><li><xref href="Metalama.Testing.UnitTesting.MetalamaTestContextOptions.AdditionalAssemblies" data-throw-if-not-resolved="false"></xref>: Assemblies to add as references to compile-time compilation</li><li><xref href="Metalama.Testing.UnitTesting.MetalamaTestContextOptions.AdditionalMetadataReferences" data-throw-if-not-resolved="false"></xref>: References to add to test compilations</li><li><xref href="Metalama.Testing.UnitTesting.MetalamaTestContextOptions.RequireOrderedAspects" data-throw-if-not-resolved="false"></xref>: Whether to require explicit aspect ordering</li></ul></p>
