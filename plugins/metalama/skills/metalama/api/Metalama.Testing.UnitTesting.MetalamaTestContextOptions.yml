- uid: Metalama.Testing.UnitTesting.MetalamaTestContextOptions.LanguageVersion
  commentId: P:Metalama.Testing.UnitTesting.MetalamaTestContextOptions.LanguageVersion
  id: LanguageVersion
  parent: Metalama.Testing.UnitTesting.MetalamaTestContextOptions
  langs:
  - csharp
  - vb
  name: LanguageVersion
  nameWithType: MetalamaTestContextOptions.LanguageVersion
  fullName: Metalama.Testing.UnitTesting.MetalamaTestContextOptions.LanguageVersion
  type: Property
  assemblies:
  - Metalama.Testing.UnitTesting
  namespace: Metalama.Testing.UnitTesting
  summary: >-
    Gets the version of the C# language of the project under test, or <code>null</code> to use

    <xref href="Metalama.Framework.Engine.Utilities.SupportedCSharpVersions.Latest" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This option is the equivalent of the <code>LangVersion</code> MSBuild property for a test. It is read by

    <xref href="Metalama.Testing.UnitTesting.TestProjectOptions" data-throw-if-not-resolved="false"></xref>, and through it by the provider that gives the compile-time compilation its

    language version, so a test that requests the preview version covers compile-time code as well as run-time

    code. The value <xref href="Microsoft.CodeAnalysis.CSharp.LanguageVersion.Preview" data-throw-if-not-resolved="false"></xref> also allows the preview language features, which a user

    project allows with the <code>MetalamaAllowPreviewLanguageFeatures</code> MSBuild property.
  example: []
  syntax:
    content: public LanguageVersion? LanguageVersion { get; init; }
    parameters: []
    return:
      type: System.Nullable{Microsoft.CodeAnalysis.CSharp.LanguageVersion}
    content.vb: Public Property LanguageVersion As LanguageVersion?
  overload: Metalama.Testing.UnitTesting.MetalamaTestContextOptions.LanguageVersion*
