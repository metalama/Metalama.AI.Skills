  namespace: Metalama.Testing.UnitTesting
  summary: >-
    Gets or sets a value indicating whether the test deliberately reports exceptions through the telemetry capture

    path. When <code>true</code>, the end-of-test assertion that no exceptions were reported is skipped (the test is expected

    to assert on <xref href="Metalama.Testing.UnitTesting.TestContext.ReportedTelemetryExceptions" data-throw-if-not-resolved="false"></xref> itself). See #1701.
  example: []
