  namespace: Metalama.Testing.UnitTesting
  summary: >-
    Switches the execution context to a test context for a given <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>,

    enabling APIs such as <xref href="Metalama.Framework.Code.SyntaxBuilders.ExpressionFactory" data-throw-if-not-resolved="false"></xref> to work correctly.
  remarks: >-
    Some Metalama APIs require an active execution context. In normal aspect execution, this context is set automatically.

    In unit tests, you must explicitly set it using this method before calling such APIs.
