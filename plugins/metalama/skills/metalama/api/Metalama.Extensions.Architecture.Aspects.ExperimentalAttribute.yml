- uid: Metalama.Extensions.Architecture.Aspects.ExperimentalAttribute.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IDeclaration})
  commentId: M:Metalama.Extensions.Architecture.Aspects.ExperimentalAttribute.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder{Metalama.Framework.Code.IDeclaration})
