- uid: Metalama.Patterns.Contracts.StrictRangeAttribute.#ctor(System.Int64,System.Int64,System.Int32)
  commentId: M:Metalama.Patterns.Contracts.StrictRangeAttribute.#ctor(System.Int64,System.Int64,System.Int32)
  id: '#ctor(System.Int64,System.Int64,System.Int32)'
  parent: Metalama.Patterns.Contracts.StrictRangeAttribute
  langs:
  - csharp
  - vb
  name: StrictRangeAttribute(long, long, int)
  nameWithType: StrictRangeAttribute.StrictRangeAttribute(long, long, int)
  fullName: Metalama.Patterns.Contracts.StrictRangeAttribute.StrictRangeAttribute(long, long, int)
  type: Constructor
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: Initializes a new instance of the <xref href="Metalama.Patterns.Contracts.StrictRangeAttribute" data-throw-if-not-resolved="false"></xref> class specifying bounds of type <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public StrictRangeAttribute(long min, long max, int decimalPlaces = 0)
    parameters:
    - id: min
      type: System.Int64
      description: The minimum value.
    - id: max
      type: System.Int64
      description: The maximum value.
    - id: decimalPlaces
      type: System.Int32
      description: >-
        When non-zero, interprets the <code class="paramref">min</code> and <code class="paramref">max</code> numbers as <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> instead
                    of <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> by adding a decimal point at the specified position. For instance, if <code class="paramref">min</code> is set to 1234 and <code class="paramref">decimalPlaces</code>
                    is set to 3, the <code class="paramref">min</code> parameter will be reinterpreted as <code>1.234m</code>.
    content.vb: Public Sub New(min As Long, max As Long, decimalPlaces As Integer = 0)
  overload: Metalama.Patterns.Contracts.StrictRangeAttribute.#ctor*
  nameWithType.vb: StrictRangeAttribute.New(Long, Long, Integer)
  fullName.vb: Metalama.Patterns.Contracts.StrictRangeAttribute.New(Long, Long, Integer)
  name.vb: New(Long, Long, Integer)
