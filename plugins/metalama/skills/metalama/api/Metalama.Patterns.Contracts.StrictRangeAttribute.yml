  name: StrictRangeAttribute
  nameWithType: StrictRangeAttribute
  fullName: Metalama.Patterns.Contracts.StrictRangeAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is not strictly within the given range.
  remarks: "    <p>Null values are accepted and do not throw an exception.\r\n</p>\r\n<p>\r\n    Floating-point values are tested to be strictly within the given bounds\r\n    with a tolerance value. The tolerance value is equal to the distance\r\n    of the value closest to the bounds according to the precision\r\n    of the respective floating-point numerical data type.\r\n</p>"
  example: []
