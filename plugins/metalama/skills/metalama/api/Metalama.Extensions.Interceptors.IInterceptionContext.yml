  name: IInterceptionContext
  nameWithType: IInterceptionContext
  fullName: Metalama.Extensions.Interceptors.IInterceptionContext
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The base interface of the contexts of a call site. It describes one site. <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite" data-throw-if-not-resolved="false"></xref> and

    <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.Context" data-throw-if-not-resolved="false"></xref> implement or expose it.
  remarks: >-
    <p>

    Declarations exposed by this interface belong to the source compilation, before any aspect transformation. The aspect repository of the

    compilation is the final one, so <code>Enhancements().HasAspect</code> reports the aspects of the whole pipeline. Declarations introduced by

    aspects are not visible.

    </p>

    <p>

    All information in this interface is specific to one site. It is not available to templates, because a generated interceptor method can be

    shared by several sites. To pass site information to a template, pass it as a template argument.

    </p>

    <p>

    This object must not be stored after the delegate that received it returns.

    </p>

    <p>

    Source expressions exposed by the derived interfaces, such as the receiver and the arguments, are available for inspection only. They

    cannot be emitted in generated code, because the site already evaluates them.

    </p>

    <p>

    The sub-objects of the context, such as <xref href="Metalama.Extensions.Interceptors.IInterceptionContext.Caller" data-throw-if-not-resolved="false"></xref>, have the lifetime of the context.

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IInterceptionContext
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IInterceptionContext
