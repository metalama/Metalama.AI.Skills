  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Gets the reason why the site cannot be intercepted, or <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.None" data-throw-if-not-resolved="false"></xref> when it can be

    intercepted. When this property is not <xref href="Metalama.Extensions.Interceptors.NonInterceptableReason.None" data-throw-if-not-resolved="false"></xref>, any result other than

    <xref href="Metalama.Extensions.Interceptors.IMethodInterceptionSite.Skip" data-throw-if-not-resolved="false"></xref> produces a warning and the site is left unchanged.
