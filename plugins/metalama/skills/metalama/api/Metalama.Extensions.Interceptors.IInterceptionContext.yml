- uid: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInType(Metalama.Framework.Code.INamedType)
  commentId: M:Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInType(Metalama.Framework.Code.INamedType)
  id: CanPlaceInType(Metalama.Framework.Code.INamedType)
  parent: Metalama.Extensions.Interceptors.IInterceptionContext
  langs:
  - csharp
  - vb
  name: CanPlaceInType(INamedType)
  nameWithType: IInterceptionContext.CanPlaceInType(INamedType)
  fullName: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInType(Metalama.Framework.Code.INamedType)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Determines whether a method synthesized with <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInType(Metalama.Framework.Code.INamedType)" data-throw-if-not-resolved="false"></xref> in a given type can intercept

    the site.
  remarks: The method does not check the signature of the synthesized method.
  example: []
  syntax:
    content: bool CanPlaceInType(INamedType type)
    parameters:
    - id: type
      type: Metalama.Framework.Code.INamedType
      description: The type.
    return:
      type: System.Boolean
      description: <code>true</code> when the type belongs to the current project and is accessible from the site; otherwise <code>false</code>.
    content.vb: Function CanPlaceInType(type As INamedType) As Boolean
  overload: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInType*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: <code class="paramref">type</code> is <code>null</code>.
