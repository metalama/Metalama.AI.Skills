- uid: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInCallingType
  commentId: P:Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInCallingType
  id: CanPlaceInCallingType
  parent: Metalama.Extensions.Interceptors.IInterceptionContext
  langs:
  - csharp
  - vb
  name: CanPlaceInCallingType
  nameWithType: IInterceptionContext.CanPlaceInCallingType
  fullName: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInCallingType
  type: Property
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Gets a value indicating whether a method synthesized with <xref href="Metalama.Extensions.Interceptors.ITemplateInterception.PlaceInCallingType" data-throw-if-not-resolved="false"></xref> can intercept the site.
  remarks: >-
    The value is <code>false</code> for instance when the site is in top-level statements, because the type that contains them is implicit. A

    delegate given to <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref> can then keep the default placement, which is a generated static class. The

    property does not check the signature of the synthesized method.
  example: []
  syntax:
    content: bool CanPlaceInCallingType { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property CanPlaceInCallingType As Boolean
  overload: Metalama.Extensions.Interceptors.IInterceptionContext.CanPlaceInCallingType*
