  namespace: Metalama.Patterns.Caching.Aspects
  summary: >-
    Custom attribute that, when applied on a method, causes the return value of the method to be cached

    for the specific list of arguments passed to this method call.
  remarks: >-
    <p>There are several ways to configure the behavior of the <xref href="Metalama.Patterns.Caching.Aspects.CacheAttribute" data-throw-if-not-resolved="false"></xref> aspect: you can set the properties of the

    <xref href="Metalama.Patterns.Caching.Aspects.CacheAttribute" data-throw-if-not-resolved="false"></xref> class, such as <xref href="Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.AbsoluteExpiration" data-throw-if-not-resolved="false"></xref> or <xref href="Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.SlidingExpiration" data-throw-if-not-resolved="false"></xref>. You can

    add the <xref href="Metalama.Patterns.Caching.Aspects.CachingConfigurationAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to the declaring type, a base type, or the declaring assembly.

    Finally, you can define a profile by setting the <xref href="Metalama.Patterns.Caching.Aspects.CachingBaseAttribute.ProfileName" data-throw-if-not-resolved="false"></xref> property and configure the profile at run time

    by accessing the <xref href="Metalama.Patterns.Caching.CachingService.Profiles" data-throw-if-not-resolved="false"></xref> collection of the <xref href="Metalama.Patterns.Caching.ICachingService" data-throw-if-not-resolved="false"></xref> class.</p>

    <p>Use the <xref href="Metalama.Patterns.Caching.NotCacheKeyAttribute" data-throw-if-not-resolved="false"></xref> custom attribute to exclude a parameter from being a part of the cache key.</p>

    <p>To invalidate a cached method, see <xref href="Metalama.Patterns.Caching.Aspects.InvalidateCacheAttribute" data-throw-if-not-resolved="false"></xref> and the <xref href="Metalama.Patterns.Caching.CachingServiceExtensions.Invalidate%60%602(Metalama.Patterns.Caching.ICachingService%2cSystem.Func%7b%60%601%2c%60%600%7d%2c%60%601)" data-throw-if-not-resolved="false"></xref> method.</p>
