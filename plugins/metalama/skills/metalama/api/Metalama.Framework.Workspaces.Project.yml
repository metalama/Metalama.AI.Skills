  assemblies:
  - Metalama.Framework.Workspaces
  namespace: Metalama.Framework.Workspaces
  summary: >-
    Gets a value indicating whether the processing of the compilation by Metalama was successful

    for all projects in the current set. This property returns <code>true</code> if the Metalama compilation

    process completed successfully, even if it resulted the compilation processes reported errors.

    These errors would be visible in the <xref href="Metalama.Framework.Introspection.IIntrospectionCompilationDetails.Diagnostics" data-throw-if-not-resolved="false"></xref> collection.
  example: []
