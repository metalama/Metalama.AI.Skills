  name: Project
  nameWithType: Project
  fullName: Metalama.Framework.Workspaces.Project
  type: Class
  assemblies:
  - Metalama.Framework.Workspaces
  namespace: Metalama.Framework.Workspaces
  summary: >-
    Represents a C# project for a specific compilation. When a project targets multiple frameworks,

    each target framework is represented by a separate <xref href="Metalama.Framework.Workspaces.Project" data-throw-if-not-resolved="false"></xref> instance.
  remarks: >-
    <p>
        The <xref href="Metalama.Framework.Workspaces.Project" data-throw-if-not-resolved="false"></xref> class provides access to the project's source code through the <xref href="Metalama.Framework.Workspaces.Project.SourceCode" data-throw-if-not-resolved="false"></xref> property,
        and to Metalama's transformed output through the <xref href="Metalama.Framework.Workspaces.Project.TransformedCode" data-throw-if-not-resolved="false"></xref> property. It also exposes introspection
        information about aspect instances, transformations, and diagnostics.
        </p>
  example: []
  syntax:
    content: 'public sealed class Project : IProjectSet, ICompilationSetResult, IIntrospectionCompilationDetails'
    content.vb: Public NotInheritable Class Project Implements IProjectSet, ICompilationSetResult, IIntrospectionCompilationDetails
