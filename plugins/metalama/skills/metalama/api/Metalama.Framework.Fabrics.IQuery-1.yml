  namespace: Metalama.Framework.Fabrics
  summary: Projects each declaration of the current set to an <xref href="System.Collections.Generic.IEnumerable%601" data-throw-if-not-resolved="false"></xref> (typically a list of child declarations) and flattens the resulting sequences into one set.
  remarks: >-
    <p>The query on the <i>right</i> part of <xref href="Metalama.Framework.Fabrics.IQuery%601.SelectMany%60%601(System.Func%7b%600%2cSystem.Collections.Generic.IEnumerable%7b%60%600%7d%7d)" data-throw-if-not-resolved="false"></xref> is executed concurrently. It is therefore preferable to use the <xref href="Metalama.Framework.Fabrics.IQuery%601.Where(System.Func%7b%600%2cSystem.Boolean%7d)" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Fabrics.IQuery%601.Select%60%601(System.Func%7b%600%2c%60%600%7d)" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Fabrics.IQuery%601.SelectMany%60%601(System.Func%7b%600%2cSystem.Collections.Generic.IEnumerable%7b%60%600%7d%7d)" data-throw-if-not-resolved="false"></xref> methods of the current interface instead of using the equivalent system methods inside the <code class="paramref">selector</code> query.</p>
