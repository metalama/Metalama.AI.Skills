  name: RangeAttribute
  nameWithType: RangeAttribute
  fullName: Metalama.Patterns.Contracts.RangeAttribute
  type: Class
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value that

    is outside a given range.
  remarks: "    <p>Null values are accepted and do not throw an exception.\r\n</p>\r\n<p>Error message can use additional argument <returns>{4}</returns> to refer to the minimum value used and <returns>{5}</returns> to refer to the maximum value used.</p>"
