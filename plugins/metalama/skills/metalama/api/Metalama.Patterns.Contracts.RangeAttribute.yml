- uid: Metalama.Patterns.Contracts.RangeAttribute.#ctor(System.Int64,System.Int64,System.Boolean,System.Boolean,System.Int32)
  commentId: M:Metalama.Patterns.Contracts.RangeAttribute.#ctor(System.Int64,System.Int64,System.Boolean,System.Boolean,System.Int32)
  id: '#ctor(System.Int64,System.Int64,System.Boolean,System.Boolean,System.Int32)'
  parent: Metalama.Patterns.Contracts.RangeAttribute
  langs:
  - csharp
  - vb
  name: RangeAttribute(long, long, bool, bool, int)
  nameWithType: RangeAttribute.RangeAttribute(long, long, bool, bool, int)
  fullName: Metalama.Patterns.Contracts.RangeAttribute.RangeAttribute(long, long, bool, bool, int)
  type: Constructor
  assemblies:
  - Metalama.Patterns.Contracts
  namespace: Metalama.Patterns.Contracts
  summary: Initializes a new instance of the <xref href="Metalama.Patterns.Contracts.RangeAttribute" data-throw-if-not-resolved="false"></xref> class specifying bounds of type <xref href="System.Int64" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public RangeAttribute(long min, long max, bool minAllowed = true, bool maxAllowed = true, int decimalPlaces = 0)
    parameters:
    - id: min
      type: System.Int64
      description: The minimum value.
    - id: max
      type: System.Int64
      description: The maximum value.
    - id: minAllowed
      type: System.Boolean
      description: Determines if the <code class="paramref">min</code> value is allowed (i.e. if the inequality is <code>&gt;=</code> instead of <code>&gt;</code>.
    - id: maxAllowed
      type: System.Boolean
      description: Determines if the <code class="paramref">max</code> value is allowed (i.e. if the inequality is <code>&lt;=</code> instead of <code>&lt;</code>.
    - id: decimalPlaces
      type: System.Int32
      description: >-
        When non-zero, interprets the <code class="paramref">min</code> and <code class="paramref">max</code> numbers as <xref href="System.Decimal" data-throw-if-not-resolved="false"></xref> instead
                    of <xref href="System.Int64" data-throw-if-not-resolved="false"></xref> by adding a decimal point at the specified position. For instance, if <code class="paramref">min</code> is set to 1234 and <code class="paramref">decimalPlaces</code>
                    is set to 3, the <code class="paramref">min</code> parameter will be reinterpreted as <code>1.234m</code>.
    content.vb: Public Sub New(min As Long, max As Long, minAllowed As Boolean = True, maxAllowed As Boolean = True, decimalPlaces As Integer = 0)
  overload: Metalama.Patterns.Contracts.RangeAttribute.#ctor*
  nameWithType.vb: RangeAttribute.New(Long, Long, Boolean, Boolean, Integer)
  fullName.vb: Metalama.Patterns.Contracts.RangeAttribute.New(Long, Long, Boolean, Boolean, Integer)
  name.vb: New(Long, Long, Boolean, Boolean, Integer)
