- uid: Metalama.Framework.Code.DeclarationBuilders.IConstructorBuilder.AddInitializerArgument(Metalama.Framework.Code.IExpression,System.String)
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IConstructorBuilder.AddInitializerArgument(Metalama.Framework.Code.IExpression,System.String)
  id: AddInitializerArgument(Metalama.Framework.Code.IExpression,System.String)
