  syntax:
    content: 'public interface IConstructorBuilder : IConstructor, IConstructorInvoker, IMethodBaseBuilder, IMethodBase, IHasParametersBuilder, IHasParameters, IMemberBuilder, IMember, IMemberOrNamedTypeBuilder, IMemberOrNamedType, INamedDeclaration, IDeclarationBuilder, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>'
