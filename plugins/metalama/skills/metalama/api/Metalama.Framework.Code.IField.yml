  fullName: Metalama.Framework.Code.IField.ConstantValue
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets the value of the field, if the field is a <code>const</code>. Not to be confused with the <xref href="Metalama.Framework.Code.IFieldOrProperty.InitializerExpression" data-throw-if-not-resolved="false"></xref>,

    which is available even if the field is not <code>const</code>, but only when the field is defined in source code (as opposed to being defined

    in a referenced assembly).
  example: []
  syntax:
    content: TypedConstant? ConstantValue { get; }
    parameters: []
    return:
      type: System.Nullable{Metalama.Framework.Code.TypedConstant}
    content.vb: ReadOnly Property ConstantValue As TypedConstant?
  overload: Metalama.Framework.Code.IField.ConstantValue*
