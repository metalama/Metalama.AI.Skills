- uid: Metalama.Framework.Code.IField.ToFieldInfo
  commentId: M:Metalama.Framework.Code.IField.ToFieldInfo
  id: ToFieldInfo
  parent: Metalama.Framework.Code.IField
  langs:
  - csharp
  - vb
  name: ToFieldInfo()
  nameWithType: IField.ToFieldInfo()
  fullName: Metalama.Framework.Code.IField.ToFieldInfo()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> that represents the current field at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> object for the current field.
        While Metalama is designed to eliminate the need for reflection in most scenarios, this method is useful
        when you need to pass field metadata to APIs that require <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on field names and may break if your project
        is obfuscated. Consider using the <xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref> property to access field values directly
        when possible, as this approach is obfuscation-safe.
        </p>
  example: []
  syntax:
    content: FieldInfo ToFieldInfo()
    return:
      type: System.Reflection.FieldInfo
      description: A <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToFieldInfo() As FieldInfo
  overload: Metalama.Framework.Code.IField.ToFieldInfo*
  seealso:
  - linkId: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
    commentId: M:Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
  - linkType: HRef
    linkId: '@reflection'
    altText: '@reflection'
- uid: Metalama.Framework.Code.IField.ToRef
  commentId: M:Metalama.Framework.Code.IField.ToRef
  id: ToRef
  parent: Metalama.Framework.Code.IField
  langs:
  - csharp
  - vb
  name: ToRef()
  nameWithType: IField.ToRef()
  fullName: Metalama.Framework.Code.IField.ToRef()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a reference that can be used to identify the current declaration across different compilation versions.
  remarks: >-
    <p>
        References are essential in Metalama because <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref> objects are bound to a specific
        <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>. As aspects execute, the compilation evolves through multiple immutable versions.
        References provide a stable way to track the same declaration across these versions.
        </p>
    <p>
      <b>Common use cases:</b>
    </p>

    <ul><li>Storing declaration references in aspect fields for use in later compilation versions.</li><li>Serializing references for cross-project scenarios (inheritable aspects, validators).</li><li>Passing references to child aspects via <xref href="Metalama.Framework.Aspects.IAspectState" data-throw-if-not-resolved="false"></xref>.</li></ul>

    <p>
        To resolve a reference back to the declaration, use <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: IRef<IField> ToRef()
    return:
      type: Metalama.Framework.Code.IRef{Metalama.Framework.Code.IField}
      description: A compile-time serializable reference to the current declaration.
    content.vb: Function ToRef() As IRef(Of IField)
  overload: Metalama.Framework.Code.IField.ToRef*
  seealso:
  - linkId: Metalama.Framework.Code.IRef`1
    commentId: T:Metalama.Framework.Code.IRef`1
  - linkId: Metalama.Framework.Code.RefExtensions
    commentId: T:Metalama.Framework.Code.RefExtensions
  - linkId: Metalama.Framework.Code.IDeclaration.ToSerializableId
    commentId: M:Metalama.Framework.Code.IDeclaration.ToSerializableId
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
