- uid: Metalama.Framework.Code.Types.IRecordFacet.CloneMethod
  commentId: P:Metalama.Framework.Code.Types.IRecordFacet.CloneMethod
  id: CloneMethod
  parent: Metalama.Framework.Code.Types.IRecordFacet
  langs:
  - csharp
  - vb
  name: CloneMethod
  nameWithType: IRecordFacet.CloneMethod
  fullName: Metalama.Framework.Code.Types.IRecordFacet.CloneMethod
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the clone method, whose metadata name is <code>&lt;Clone&gt;$</code>, or <code>null</code> when the type is a record

    struct, which has none. The <code>with</code> expression of a record class calls this method.
  remarks: >-
    <p>
        The name of this method is not a C# identifier, so the method is absent from
        <xref href="Metalama.Framework.Code.INamedType.Methods" data-throw-if-not-resolved="false"></xref>, which represents what can be written in C#. This property is the only way to
        reach it.
        </p>
  example: []
  syntax:
    content: IMethod? CloneMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property CloneMethod As IMethod
  overload: Metalama.Framework.Code.Types.IRecordFacet.CloneMethod*
