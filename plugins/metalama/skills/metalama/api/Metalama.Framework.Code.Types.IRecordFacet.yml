  fullName: Metalama.Framework.Code.Types.IRecordFacet
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: 'Represents the structure of a record: the members that the compiler synthesizes for it.'
  remarks: >-
    <p>
        The facet is reached through <xref href="Metalama.Framework.Code.Collections.ITypeFacetCollection.Record" data-throw-if-not-resolved="false"></xref>, as in
        <code>type.Facets.Record?.PrintMembersMethod</code>. It is <code>null</code> for a type that
        <xref href="Metalama.Framework.Code.INamedType.IsRecord" data-throw-if-not-resolved="false"></xref> reports as not being a record.
        </p>
    <p>
        One interface describes a record class and a record struct. A record struct has no equality contract, no clone
        method and no copy constructor, so these three properties are <code>null</code> for it.
        </p>
    <p>
        The members that the compiler adds to a record and that are not specific to a record are not part of the facet:
        <code>Equals</code>, <code>GetHashCode</code>, <code>ToString</code>, and the <code>==</code> and <code>!=</code> operators are reached through
        the member collections of <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> like any other member. The primary constructor is reached
        through <xref href="Metalama.Framework.Code.INamedType.PrimaryConstructor" data-throw-if-not-resolved="false"></xref>, because a primary constructor is not specific to a record
        since C# 12.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IRecordFacet : ITypeFacet
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IRecordFacet Inherits ITypeFacet
