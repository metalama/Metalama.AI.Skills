- uid: Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod
  commentId: P:Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod
  id: DeconstructMethod
  parent: Metalama.Framework.Code.Types.IRecordFacet
  langs:
  - csharp
  - vb
  name: DeconstructMethod
  nameWithType: IRecordFacet.DeconstructMethod
  fullName: Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the <code>Deconstruct</code> method, or <code>null</code> when the record is not positional, that is, when it

    declares no parameter list.
  remarks: >-
    <p>
        A record read from a compiled assembly is reported as not positional, because a compiled assembly does not
        record the parameter list of a record. The <code>Deconstruct</code> method of such a record is a member of the type
        and is reached through <xref href="Metalama.Framework.Code.INamedType.Methods" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: IMethod? DeconstructMethod { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IMethod
    content.vb: ReadOnly Property DeconstructMethod As IMethod
  overload: Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod*
- uid: Metalama.Framework.Code.Types.IRecordFacet.PositionalProperties
  commentId: P:Metalama.Framework.Code.Types.IRecordFacet.PositionalProperties
  id: PositionalProperties
  parent: Metalama.Framework.Code.Types.IRecordFacet
  langs:
  - csharp
  - vb
  name: PositionalProperties
  nameWithType: IRecordFacet.PositionalProperties
  fullName: Metalama.Framework.Code.Types.IRecordFacet.PositionalProperties
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Types
  summary: >-
    Gets the properties that the positional parameters of the record declare, in the order of the parameters, or

    an empty list when the record is not positional. A positional parameter that declares no property, because

    the record or one of its base records declares a member of that name itself, contributes no element.
  remarks: >-
    <p>
        A record read from a compiled assembly has an empty list, for the reason that
        <xref href="Metalama.Framework.Code.Types.IRecordFacet.DeconstructMethod" data-throw-if-not-resolved="false"></xref> gives.
        </p>
  example: []
  syntax:
    content: IReadOnlyList<IProperty> PositionalProperties { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IReadOnlyList{Metalama.Framework.Code.IProperty}
    content.vb: ReadOnly Property PositionalProperties As IReadOnlyList(Of IProperty)
  overload: Metalama.Framework.Code.Types.IRecordFacet.PositionalProperties*
