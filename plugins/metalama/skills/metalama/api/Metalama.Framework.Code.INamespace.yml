- uid: Metalama.Framework.Code.INamespace.IsPartial
  commentId: P:Metalama.Framework.Code.INamespace.IsPartial
  id: IsPartial
  parent: Metalama.Framework.Code.INamespace
  langs:
  - csharp
  - vb
  name: IsPartial
  nameWithType: INamespace.IsPartial
  fullName: Metalama.Framework.Code.INamespace.IsPartial
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the current namespace is partial, i.e. incomplete. Metalama uses partial compilations

    at design time, when only the closure of modified types are being incrementally recompiled. In this scenario, namespaces

    of the current compilation are partial. Namespaces of external assemblies are never partial.
  example: []
  syntax:
    content: bool IsPartial { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsPartial As Boolean
  overload: Metalama.Framework.Code.INamespace.IsPartial*
