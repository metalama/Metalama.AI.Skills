  summary: >-
    In Metalama, use <xref href="Metalama.Framework.Aspects.AspectOrderAttribute" data-throw-if-not-resolved="false"></xref> to specify order dependencies (typically one attribute per aspect library).

    The other kinds of dependencies are not supported in Metalama.
