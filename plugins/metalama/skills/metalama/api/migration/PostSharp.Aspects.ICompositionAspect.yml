    There is no composition aspect in Metalama, but you can build one by deriving the <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref> type, implementing

    the <xref href="Metalama.Framework.Aspects.TypeAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.INamedType%7d)" data-throw-if-not-resolved="false"></xref> method, and calling <code>builder</code>.<xref href="Metalama.Framework.Aspects.IAspectBuilder.Advice" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Advising.IAdviceFactory.ImplementInterface(Metalama.Framework.Code.INamedType%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.

    There is no concept of protected interface in Metalama.
