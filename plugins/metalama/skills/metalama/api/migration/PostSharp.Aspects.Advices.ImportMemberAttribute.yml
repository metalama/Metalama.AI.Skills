  summary: >-
    In Metalama, members of the target declaration do not need to be imported into the aspect. Instead, the

    aspect accesses the target code using dynamic code or invokers. To generate code that calls a method, use <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.Invokers.IMethodInvoker.Invoke(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>.

    To generate code that accesses a field or property, use <xref href="Metalama.Framework.Code.IFieldOrProperty" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Field)]

      [Obsolete("In Metalama, members of the target declaration do not need to be imported into the aspect. Instead, the aspect accesses the target code using dynamic code or invokers. To generate code that calls a method, use 'IMethod'.'IMethodInvoker.Invoke(params dynamic?[])'. To generate code that accesses a field or property, use 'IFieldOrProperty'.'IExpression.Value'.", false)]

      public sealed class ImportMemberAttribute : Advice
    content.vb: >-
      <AttributeUsage(AttributeTargets.Field)>

      <Obsolete("In Metalama, members of the target declaration do not need to be imported into the aspect. Instead, the aspect accesses the target code using dynamic code or invokers. To generate code that calls a method, use 'IMethod'.'IMethodInvoker.Invoke(params dynamic?[])'. To generate code that accesses a field or property, use 'IFieldOrProperty'.'IExpression.Value'.", False)>

      Public NotInheritable Class ImportMemberAttribute Inherits Advice
