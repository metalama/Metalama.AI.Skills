  namespace: PostSharp.Extensibility
  summary: >-
    In Metalama, a message is represented by a <xref href="Metalama.Framework.Diagnostics.IDiagnostic" data-throw-if-not-resolved="false"></xref>.

    To instantiate a diagnostic, you must first declare its <xref href="Metalama.Framework.Diagnostics.DiagnosticDefinition%601" data-throw-if-not-resolved="false"></xref> as a static field or property, then use

    <xref href="Metalama.Framework.Diagnostics.DiagnosticDefinition%601.WithArguments(%600)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: >-
      [Obsolete("In Metalama, a message is represented by a 'IDiagnostic'. To instantiate a diagnostic, you must first declare its 'DiagnosticDefinition<T>' as a static field or property, then use 'DiagnosticDefinition<T>.WithArguments(T)'.", false)]

      public sealed class Message
    content.vb: >-
      <Obsolete("In Metalama, a message is represented by a 'IDiagnostic'. To instantiate a diagnostic, you must first declare its 'DiagnosticDefinition<T>' as a static field or property, then use 'DiagnosticDefinition<T>.WithArguments(T)'.", False)>

      Public NotInheritable Class Message
