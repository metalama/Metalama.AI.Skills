- uid: PostSharp.Aspects.Aspect.AspectPriority
  commentId: P:PostSharp.Aspects.Aspect.AspectPriority
  id: AspectPriority
  parent: PostSharp.Aspects.Aspect
  langs:
  - csharp
  - vb
  name: AspectPriority
  nameWithType: Aspect.AspectPriority
  fullName: PostSharp.Aspects.Aspect.AspectPriority
  type: Property
  assemblies:
  - Metalama.Migration
  namespace: PostSharp.Aspects
  summary: >-
    It is not possible to set the aspect priority on a per-instance basis in Metalama. Instead, all aspects are

    statically ordered using the <xref href="Metalama.Framework.Aspects.AspectOrderAttribute" data-throw-if-not-resolved="false"></xref> custom attribute.
  example: []
  syntax:
    content: >-
      [Obsolete("It is not possible to set the aspect priority on a per-instance basis in Metalama. Instead, all aspects are statically ordered using the 'AspectOrderAttribute' custom attribute.", true)]

      public int AspectPriority { get; set; }
    parameters: []
    return:
      type: System.Int32
    content.vb: >-
      <Obsolete("It is not possible to set the aspect priority on a per-instance basis in Metalama. Instead, all aspects are statically ordered using the 'AspectOrderAttribute' custom attribute.", True)>

      Public Property AspectPriority As Integer
  overload: PostSharp.Aspects.Aspect.AspectPriority*
  seealso:
  - linkType: HRef
    linkId: '@ordering'
    altText: '@ordering'
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String,System.Boolean)
    arguments:
    - type: System.String
      value: It is not possible to set the aspect priority on a per-instance basis in Metalama. Instead, all aspects are statically ordered using the 'AspectOrderAttribute' custom attribute.
    - type: System.Boolean
      value: true
