  namespace: PostSharp.Aspects.Advices
  summary: >-
    In Metalama, there is no declarative way to bind advice parameters. Instead, Metalama uses a programmatic approach, where the advice can get the desired

    value using the code model. In Metalama, template parameters can be marked as compile-time using <xref href="Metalama.Framework.Aspects.CompileTimeAttribute" data-throw-if-not-resolved="false"></xref>, otherwise they are run-time.

    Run-time parameters must match the target parameter by name. Compile-time parameters must be supplied by the advice factory method (see <xref href="Metalama.Framework.Advising.IAdviceFactory" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter)]

      [Obsolete("In Metalama, there is no declarative way to bind advice parameters. Instead, Metalama uses a programmatic approach, where the advice can get the desired value using the code model. In Metalama, template parameters can be marked as compile-time using 'CompileTimeAttribute', otherwise they are run-time. Run-time parameters must match the target parameter by name. Compile-time parameters must be supplied by the advice factory method (see 'IAdviceFactory').", false)]

      public abstract class AdviceParameterAttribute : Attribute
