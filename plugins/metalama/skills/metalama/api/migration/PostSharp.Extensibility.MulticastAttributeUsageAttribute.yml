  summary: >-
    There is no full equivalent of this attribute in Metalama, and there will not be. To mark an aspect as inherited, use the <xref href="Metalama.Framework.Aspects.InheritableAttribute" data-throw-if-not-resolved="false"></xref>

    custom attribute. To specify the eligibility of an aspect, implement the <xref href="Metalama.Framework.Eligibility.IEligible%601.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class)]

      [Obsolete("There is no full equivalent of this attribute in Metalama, and there will not be. To mark an aspect as inherited, use the 'InheritableAttribute' custom attribute. To specify the eligibility of an aspect, implement the 'IEligible<T>.BuildEligibility(IEligibilityBuilder<T>)' method.", false)]

      public sealed class MulticastAttributeUsageAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Class)>

      <Obsolete("There is no full equivalent of this attribute in Metalama, and there will not be. To mark an aspect as inherited, use the 'InheritableAttribute' custom attribute. To specify the eligibility of an aspect, implement the 'IEligible<T>.BuildEligibility(IEligibilityBuilder<T>)' method.", False)>

