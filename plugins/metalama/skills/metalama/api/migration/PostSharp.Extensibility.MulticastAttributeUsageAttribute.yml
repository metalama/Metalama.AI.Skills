- uid: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  commentId: P:PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  id: AllowMultiple
  parent: PostSharp.Extensibility.MulticastAttributeUsageAttribute
  langs:
  - csharp
  - vb
  name: AllowMultiple
  nameWithType: MulticastAttributeUsageAttribute.AllowMultiple
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute.AllowMultiple
  type: Property
  assemblies:
  - Metalama.Migration
  namespace: PostSharp.Extensibility
  summary: >-
    Metalama always allows multiple attributes, but only one is actually processed. The other instances are exposed in <code>builder</code>.<xref href="Metalama.Framework.Aspects.IAspectBuilder.AspectInstance" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Aspects.IAspectInstance.SecondaryInstances" data-throw-if-not-resolved="false"></xref>.

    It is up to the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> implementation to handle the situation with many aspects.
  example: []
  syntax:
    content: >-
      [Obsolete("Metalama always allows multiple attributes, but only one is actually processed. The other instances are exposed in <c>builder</c>.'IAspectBuilder.AspectInstance'.'IAspectInstance.SecondaryInstances'. It is up to the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' implementation to handle the situation with many aspects.", false)]

      public bool AllowMultiple { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: >-
      <Obsolete("Metalama always allows multiple attributes, but only one is actually processed. The other instances are exposed in <c>builder</c>.'IAspectBuilder.AspectInstance'.'IAspectInstance.SecondaryInstances'. It is up to the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' implementation to handle the situation with many aspects.", False)>

