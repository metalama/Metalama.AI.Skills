      value: Metalama always allows multiple attributes, but only one is actually processed. The other instances are exposed in <c>builder</c>.'IAspectBuilder.AspectInstance'.'IAspectInstance.SecondaryInstances'. It is up to the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' implementation to handle the situation with many aspects.
    - type: System.Boolean
      value: false
- uid: PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance
  commentId: P:PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance
  id: Inheritance
  parent: PostSharp.Extensibility.MulticastAttributeUsageAttribute
  langs:
  - csharp
  - vb
  name: Inheritance
  nameWithType: MulticastAttributeUsageAttribute.Inheritance
  fullName: PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance
  type: Property
  assemblies:
  - Metalama.Migration
  namespace: PostSharp.Extensibility
  summary: >-
    To mark an aspect as inherited, use <xref href="Metalama.Framework.Aspects.InheritableAttribute" data-throw-if-not-resolved="false"></xref> or implement <xref href="Metalama.Framework.Aspects.IConditionallyInheritableAspect" data-throw-if-not-resolved="false"></xref>. Multicast inheritance is not supported in Metalama, but you can build a similar feature

    by making the aspect implement the <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref> for <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> and implement multicasting in the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref>

    method.
  example: []
  syntax:
    content: >-
      [Obsolete("To mark an aspect as inherited, use 'InheritableAttribute' or implement 'IConditionallyInheritableAspect'. Multicast inheritance is not supported in Metalama, but you can build a similar feature by making the aspect implement the 'IAspect<T>' for 'INamedType' and implement multicasting in the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' method.", false)]

      public MulticastInheritance Inheritance { get; set; }
    parameters: []
    return:
      type: PostSharp.Extensibility.MulticastInheritance
    content.vb: >-
      <Obsolete("To mark an aspect as inherited, use 'InheritableAttribute' or implement 'IConditionallyInheritableAspect'. Multicast inheritance is not supported in Metalama, but you can build a similar feature by making the aspect implement the 'IAspect<T>' for 'INamedType' and implement multicasting in the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' method.", False)>

      Public Property Inheritance As MulticastInheritance
  overload: PostSharp.Extensibility.MulticastAttributeUsageAttribute.Inheritance*
  attributes:
  - type: System.ObsoleteAttribute
    ctor: System.ObsoleteAttribute.#ctor(System.String,System.Boolean)
    arguments:
    - type: System.String
      value: To mark an aspect as inherited, use 'InheritableAttribute' or implement 'IConditionallyInheritableAspect'. Multicast inheritance is not supported in Metalama, but you can build a similar feature by making the aspect implement the 'IAspect<T>' for 'INamedType' and implement multicasting in the 'IAspect<T>.BuildAspect(IAspectBuilder<T>)' method.
    - type: System.Boolean
      value: false
