  summary: >-
    There is no composition aspect in Metalama, but you can build one by deriving the <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref> type, implementing

    the <xref href="Metalama.Framework.Aspects.TypeAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.INamedType%7d)" data-throw-if-not-resolved="false"></xref> method, and calling <code>builder</code>.<xref href="Metalama.Framework.Aspects.IAspectBuilder.Advice" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Advising.IAdviceFactory.ImplementInterface(Metalama.Framework.Code.INamedType%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.

    There is no concept of protected interface in Metalama.
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Assembly|AttributeTargets.Class|AttributeTargets.Struct, AllowMultiple = true, Inherited = false)]

      [MulticastAttributeUsage(MulticastTargets.Class|MulticastTargets.Struct, AllowMultiple = true)]

      [Obsolete("There is no composition aspect in Metalama, but you can build one by deriving the 'TypeAspect' type, implementing the 'TypeAspect.BuildAspect(IAspectBuilder<INamedType>)' method, and calling <c>builder</c>.'IAspectBuilder.Advice'.'IAdviceFactory.ImplementInterface(INamedType, INamedType, OverrideStrategy, object?)'. There is no concept of protected interface in Metalama.", false)]

      public abstract class CompositionAspect : TypeLevelAspect, ITypeLevelAspectBuildSemantics, IAspectBuildSemantics, IValidableAnnotation, ICompositionAspect, ITypeLevelAspect, IAspect
    content.vb: >-
      <AttributeUsage(AttributeTargets.AssemblyOrAttributeTargets.ClassOrAttributeTargets.Struct, AllowMultiple:=True, Inherited:=False)>

