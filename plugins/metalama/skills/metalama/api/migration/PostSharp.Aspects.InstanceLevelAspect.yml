  summary: >-
    In Metalama, use <xref href="Metalama.Framework.Aspects.TypeAspect" data-throw-if-not-resolved="false"></xref>. Note that aspects in Metalama have no run-time existence, so they cannot be instance-scoped.

    While porting a PostSharp <xref href="PostSharp.Aspects.InstanceLevelAspect" data-throw-if-not-resolved="false"></xref> into Metalama, you would typically introduce instance fields or properties into

    the target type, and use an initializer to initialize them.
