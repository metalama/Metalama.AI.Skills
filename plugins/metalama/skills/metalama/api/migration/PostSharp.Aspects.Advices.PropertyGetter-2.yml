  namespace: PostSharp.Aspects.Advices
  summary: >-
    In PostSharp, this delegate allowed the run-time code of the aspect to access an indexer in the target code. In Metalama,

    no run-time helper is required because the template directly generates run-time code.

    Use <xref href="Metalama.Framework.Code.IIndexer" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.Invokers.IIndexerInvoker.GetValue(System.Object%5b%5d)" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Framework.Code.IIndexer" data-throw-if-not-resolved="false"></xref>.<xref href="Metalama.Framework.Code.Invokers.IIndexerInvoker.SetValue(System.Object%2cSystem.Object%5b%5d)" data-throw-if-not-resolved="false"></xref>

    to generate run-time code for any indexer.
  example: []
  syntax:
