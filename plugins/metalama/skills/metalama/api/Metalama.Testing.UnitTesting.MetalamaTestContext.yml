- uid: Metalama.Testing.UnitTesting.MetalamaTestContext.CancellationToken
  commentId: P:Metalama.Testing.UnitTesting.MetalamaTestContext.CancellationToken
  id: CancellationToken
  parent: Metalama.Testing.UnitTesting.MetalamaTestContext
  langs:
  - csharp
  - vb
  name: CancellationToken
  nameWithType: MetalamaTestContext.CancellationToken
  fullName: Metalama.Testing.UnitTesting.MetalamaTestContext.CancellationToken
  type: Property
  assemblies:
  - Metalama.Testing.UnitTesting
  namespace: Metalama.Testing.UnitTesting
  summary: >-
    Gets the <xref href="System.Threading.CancellationToken" data-throw-if-not-resolved="false"></xref> that the test must pass to the code under test. It is

    signalled when the timeout defined by <xref href="Metalama.Testing.UnitTesting.MetalamaTestContextOptions.Timeout" data-throw-if-not-resolved="false"></xref> elapses, or when the test

    framework cancels the test, whichever comes first.
  remarks: >-
    <p>
        The cancellation of the test framework reaches this token through the token passed to the constructor.
        <xref href="Metalama.Testing.UnitTesting.UnitTestClass.CreateTestContext(System.String%2cSystem.String)" data-throw-if-not-resolved="false"></xref> passes <xref href="Xunit.TestContext.CancellationToken" data-throw-if-not-resolved="false"></xref>
        of <xref href="Xunit.TestContext.Current" data-throw-if-not-resolved="false"></xref>, and the aspect test framework passes the token of the test run.
        Only the timeout writes a message to the test output and signals that the application is exiting.
        </p>
    <p>
        When a debugger is attached, there is no timeout, because a test that runs under a debugger can legitimately
        run for a long time. The token is then the token passed to the constructor.
        </p>
  example: []
  syntax:
    content: public CancellationToken CancellationToken { get; }
    parameters: []
    return:
      type: System.Threading.CancellationToken
    content.vb: Public ReadOnly Property CancellationToken As CancellationToken
  overload: Metalama.Testing.UnitTesting.MetalamaTestContext.CancellationToken*
- uid: Metalama.Testing.UnitTesting.MetalamaTestContext.SyncProvider
  commentId: P:Metalama.Testing.UnitTesting.MetalamaTestContext.SyncProvider
  id: SyncProvider
