  assemblies:
  - Metalama.Testing.UnitTesting
  namespace: Metalama.Testing.UnitTesting
  summary: >-
    Gets the provider of the synchronization points that the code under test reaches, which lets the test drive

    concurrent code into a specific interleaving. All of its synchronization points are released when this context

    is disposed, so a failing test does not hang.
  remarks: >-
    The provider is registered by <xref href="Metalama.Testing.UnitTesting.UnitTestClass.CreateTestSynchronizationProvider" data-throw-if-not-resolved="false"></xref>, so this property is

    available only in a context created by <xref href="Metalama.Testing.UnitTesting.UnitTestClass" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public TestSynchronizationProvider SyncProvider { get; }
    parameters: []
    return:
      type: SharpCrafters.Common.Testing.Hooks.TestSynchronizationProvider
    content.vb: Public ReadOnly Property SyncProvider As TestSynchronizationProvider
  overload: Metalama.Testing.UnitTesting.MetalamaTestContext.SyncProvider*
