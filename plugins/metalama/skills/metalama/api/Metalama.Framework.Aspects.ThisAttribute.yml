  namespace: Metalama.Framework.Aspects
  summary: >-
    When applied to a template method parameter, indicates that the introduced parameter should have the <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/this">this</a> modifier,

    making the introduced method an extension method.
  remarks: >-
    <p>
        Use this attribute on the first parameter of a template method when you want the introduced method to be an extension method.
        The parameter type determines the extended type.
        </p>
    <p>
        The introduced method must be static.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Parameter)]

      public sealed class ThisAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.Parameter)>

      Public NotInheritable Class ThisAttribute Inherits Attribute
