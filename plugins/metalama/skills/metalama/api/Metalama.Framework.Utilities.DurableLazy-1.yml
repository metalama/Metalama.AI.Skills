  name: DurableLazy<T>
  nameWithType: DurableLazy<T>
  fullName: Metalama.Framework.Utilities.DurableLazy<T>
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Utilities
  summary: >-
    A durable alternative to <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref>, that is, one that is safe to be held across

    compilations. The factory delegate is released as soon as the value has been computed.
  remarks: >-
    <p>
      <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref> is not durable, because it holds its factory delegate and a delegate holds its
        closure. A lambda that mentions a compilation produces a closure object that holds it, and whatever holds the
        delegate holds the compilation. That capture is invisible in the source, which is what makes it the most
        expensive mistake of this kind.
        </p>
    <p>
        This type closes the gap in two ways. The constructor parameter is marked with
        <xref href="Metalama.Framework.Utilities.DurableAttribute" data-throw-if-not-resolved="false"></xref>, so the analyzer examines what the factory captures at every call site. And the
        factory is set to <code>null</code> once the value has been computed, so nothing it captured is retained beyond the
        first evaluation.
        </p>
    <p>
        The value is computed at most once. Like the default mode of <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref>, this type uses lock
        based synchronization, so a factory that acquires the same lock from another thread deadlocks.
        </p>
  example: []
  syntax:
    content: >-
      [Durable]

      public sealed class DurableLazy<T>
    typeParameters:
    - id: T
      description: The type of the lazily computed value, which must itself be durable.
    content.vb: >-
      <Durable>

