  summary: >-
    Custom attribute that, when added to a field, property or parameter, throws

    an <xref href="System.ArgumentOutOfRangeException" data-throw-if-not-resolved="false"></xref> if the target is assigned a value

    smaller than zero.
  remarks: "    <p>Null values are accepted and do not throw an exception.\r\n</p>"
