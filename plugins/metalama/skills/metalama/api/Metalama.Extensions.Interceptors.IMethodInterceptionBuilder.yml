  name: Types(Func<INamedType, bool>)
  nameWithType: IMethodInterceptionBuilder.Types(Func<INamedType, bool>)
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionBuilder.Types(System.Func<Metalama.Framework.Code.INamedType, bool>)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Selects the types that declare the intercepted methods with a predicate over type definitions.
  remarks: >-
    The methods must then be given by name with <xref href="Metalama.Extensions.Interceptors.ITypeFilterSelection.Methods(System.String%5b%5d)" data-throw-if-not-resolved="false"></xref>, because the engine finds the call sites by the

    name of the called method.
  example: []
  syntax:
    content: ITypeFilterSelection Types(Func<INamedType, bool> predicate)
    parameters:
    - id: predicate
      type: System.Func{Metalama.Framework.Code.INamedType,System.Boolean}
      description: >-
        The predicate. It is stored with the registration, so it must not capture a declaration or a compilation. It is
                    invoked once for each type definition that declares a method of a selected name.
      attributes:
      - type: Metalama.Framework.Utilities.DurableAttribute
        ctor: Metalama.Framework.Utilities.DurableAttribute.#ctor
        arguments: []
    return:
      type: Metalama.Extensions.Interceptors.ITypeFilterSelection
    content.vb: Function Types(predicate As Func(Of INamedType, Boolean)) As ITypeFilterSelection
  overload: Metalama.Extensions.Interceptors.IMethodInterceptionBuilder.Types*
  exceptions:
