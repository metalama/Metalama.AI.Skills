  name: IMethodInterceptionBuilder
  nameWithType: IMethodInterceptionBuilder
  fullName: Metalama.Extensions.Interceptors.IMethodInterceptionBuilder
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    The first stage of the description of a method interception, which the delegate given to <code>InterceptMethods</code> receives. It sets where

    the call sites are, and then selects the type that declares the intercepted methods.
  remarks: >-
    <p>

    A description is a chain of immutable values: each method returns a new value, and the value on which it is called is unchanged. The

    delegate returns the last value of the chain, and every value that the delegate creates must be part of the returned chain. A value that is

    created and then not used, for instance <code>interception.WithGranularity( … );</code> without an assignment, is an error, which is reported when

    the delegate returns. A chain can contain at most 64 values.

    </p>

    <p>

    The stages are, in order: where the call sites are (this interface), what is called (<xref href="Metalama.Extensions.Interceptors.ITypeSelection" data-throw-if-not-resolved="false"></xref> and

    <xref href="Metalama.Extensions.Interceptors.IMethodSelection" data-throw-if-not-resolved="false"></xref>), how the call is intercepted (<xref href="Metalama.Extensions.Interceptors.IMethodResultFactory" data-throw-if-not-resolved="false"></xref>), and how the interceptor method is

    generated (<xref href="Metalama.Extensions.Interceptors.ITemplateInterception" data-throw-if-not-resolved="false"></xref>).

    </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IMethodInterceptionBuilder
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IMethodInterceptionBuilder
