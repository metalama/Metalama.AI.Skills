- uid: Metalama.Extensions.Interceptors.IMethodInterceptionBuilder.Types(System.Func{Metalama.Framework.Code.INamedType,System.Boolean})
  commentId: M:Metalama.Extensions.Interceptors.IMethodInterceptionBuilder.Types(System.Func{Metalama.Framework.Code.INamedType,System.Boolean})
