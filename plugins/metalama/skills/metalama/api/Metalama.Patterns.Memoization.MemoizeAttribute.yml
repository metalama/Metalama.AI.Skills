  namespace: Metalama.Patterns.Memoization
  summary: >-
    An aspect that, when applied to a get-only property or parameterless non-void method, caches the result and returns

    the cached value on subsequent calls.
  remarks: >-
    <p>The memoized result is stored in a field introduced by the aspect directly into the target type. The aspect

    uses <xref href="System.Threading.Interlocked.CompareExchange%60%601(%60%600%40%2c%60%600%2c%60%600)" data-throw-if-not-resolved="false"></xref> to ensure thread-safe initialization without locking.</p>

    <p>The underlying implementation of the property or method is <i>not</i> guaranteed to be executed only once.

    However, all invocations are guaranteed to return the same value or object reference.</p>

    <p>For nullable reference types and value types, the cached value is wrapped in a <xref href="System.Runtime.CompilerServices.StrongBox%601" data-throw-if-not-resolved="false"></xref>,

    adding minor memory allocation overhead when the memoized member is evaluated. This design minimizes memory usage

    when few or no memoized properties or methods are evaluated.</p>

    <p>Memoization serves as a simpler and higher-performance alternative to <xref href="System.Lazy%601" data-throw-if-not-resolved="false"></xref> for properties and

    parameterless methods that need to be computed only once.</p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property)]

      public sealed class MemoizeAttribute : Attribute, IAspect<IMethod>, IEligible<IMethod>, IAspect<IProperty>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<IProperty>
