  langs:
  - csharp
  - vb
  name: AddAttributes(IEnumerable<IAttribute>)
  nameWithType: IDeclarationBuilder.AddAttributes(IEnumerable<IAttribute>)
  fullName: Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttributes(System.Collections.Generic.IEnumerable<Metalama.Framework.Code.IAttribute>)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: >-
    Adds custom attributes to the current declaration by copying them from existing <xref href="Metalama.Framework.Code.IAttribute" data-throw-if-not-resolved="false"></xref> instances.

    This is useful when replacing or introducing a declaration and copying the attributes from the original declaration.

    Callers can filter the sequence (e.g. using LINQ <code>Where</code>) before passing it.
  example: []
  syntax:
    content: void AddAttributes(IEnumerable<IAttribute> attributes)
    parameters:
    - id: attributes
      type: System.Collections.Generic.IEnumerable{Metalama.Framework.Code.IAttribute}
      description: >-
        The attributes to copy. Each attribute is converted to an <xref href="Metalama.Framework.Code.DeclarationBuilders.AttributeConstruction" data-throw-if-not-resolved="false"></xref>
                    via <xref href="Metalama.Framework.Code.AttributeExtensions.ToAttributeConstruction(Metalama.Framework.Code.IAttribute)" data-throw-if-not-resolved="false"></xref>.
    content.vb: Sub AddAttributes(attributes As IEnumerable(Of IAttribute))
  overload: Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttributes*
  nameWithType.vb: IDeclarationBuilder.AddAttributes(IEnumerable(Of IAttribute))
  fullName.vb: Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttributes(System.Collections.Generic.IEnumerable(Of Metalama.Framework.Code.IAttribute))
  name.vb: AddAttributes(IEnumerable(Of IAttribute))
