- uid: Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttributes(System.Collections.Generic.IEnumerable{Metalama.Framework.Code.IAttribute})
  commentId: M:Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttributes(System.Collections.Generic.IEnumerable{Metalama.Framework.Code.IAttribute})
  id: AddAttributes(System.Collections.Generic.IEnumerable{Metalama.Framework.Code.IAttribute})
