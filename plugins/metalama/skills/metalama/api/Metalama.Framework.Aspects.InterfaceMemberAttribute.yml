  namespace: Metalama.Framework.Aspects
  summary: Marks a member in an aspect class as a template for implementing an interface member.
  remarks: >-
    <p>
        Use this attribute on methods, properties, fields, or events in your aspect class that should implement
        members of an interface being added via <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        Unlike <xref href="Metalama.Framework.Aspects.IntroduceAttribute" data-throw-if-not-resolved="false"></xref>, members marked with <code>[InterfaceMember]</code> are only introduced when
        the corresponding <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref> advice succeeds.
        If the advice is ignored (because the interface was already implemented and <xref href="Metalama.Framework.Aspects.OverrideStrategy.Ignore" data-throw-if-not-resolved="false"></xref> was used),
        the member is not introduced.
        </p>
    <p>
        By default, an implicit (public) implementation is created. Set <xref href="Metalama.Framework.Aspects.InterfaceMemberAttribute.IsExplicit" data-throw-if-not-resolved="false"></xref> to <code>true</code> to create
        an explicit interface implementation instead.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field|AttributeTargets.Event)]

      public sealed class InterfaceMemberAttribute : TemplateAttribute, ITemplateAttribute, IAdviceAttribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.MethodOrAttributeTargets.PropertyOrAttributeTargets.FieldOrAttributeTargets.Event)>

      Public NotInheritable Class InterfaceMemberAttribute Inherits TemplateAttribute Implements ITemplateAttribute, IAdviceAttribute
