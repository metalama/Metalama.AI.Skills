  name: IsExplicit
  nameWithType: InterfaceMemberAttribute.IsExplicit
  fullName: Metalama.Framework.Aspects.InterfaceMemberAttribute.IsExplicit
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: Gets or sets a value indicating whether the interface member should be introduced as an explicit implementation.
  remarks: >-
    When <code>true</code>, the member is introduced as an explicit interface implementation (e.g., <code>void IDisposable.Dispose()</code>).

    When <code>false</code> (the default), an implicit public implementation is created.
  example: []
  syntax:
    content: public bool IsExplicit { get; set; }
    parameters: []
    return:
      type: System.Boolean
