  namespace: Metalama.Framework.Aspects
  summary: Gets or sets the strategy to use when an interface member conflicts with an existing class member.
  remarks: >-
    The default is <xref href="Metalama.Framework.Aspects.InterfaceMemberOverrideStrategy.Default" data-throw-if-not-resolved="false"></xref>, which inherits the behavior from the

    <xref href="Metalama.Framework.Aspects.OverrideStrategy" data-throw-if-not-resolved="false"></xref> parameter passed to

    <xref href="Metalama.Framework.Aspects.AdviserExtensions.ImplementInterface(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamedType%7d%2cMetalama.Framework.Code.INamedType%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Object)" data-throw-if-not-resolved="false"></xref>.
