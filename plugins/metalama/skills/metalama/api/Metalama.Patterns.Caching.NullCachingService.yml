  summary: >-
    Gets a value from the cache or executes an asynchronous method returning <xref href="System.Threading.Tasks.Task%601" data-throw-if-not-resolved="false"></xref> and caches the result.

    This method is called by the generated code of the <code>CacheAttribute</code> aspect.
  example: []
  syntax:
    content: public Task<TTaskResultType?> GetFromCacheOrExecuteTaskAsync<TTaskResultType>(CachedMethodMetadata? metadata, object? instance, object?[] args, Func<object?, object?[], CancellationToken, Task<object?>> func, CacheItemConfiguration? configuration = null, CancellationToken cancellationToken = default)
    parameters:
    - id: metadata
      type: Metalama.Patterns.Caching.CachedMethodMetadata
      description: >-
        Metadata about the cached method, or <code>null</code> if the cache registration
                    has not been initialized yet (e.g., when a cached method is called from a static field initializer).
                    When <code>null</code>, caching is bypassed and the original method is called directly.
    - id: instance
      type: System.Object
      description: The instance on which the method is called, or <code>null</code> for static methods.
    - id: args
      type: System.Object[]
      description: The method arguments.
    - id: func
      type: System.Func{System.Object,System.Object[],System.Threading.CancellationToken,System.Threading.Tasks.Task{System.Object}}
      description: A delegate that invokes the original method if the value is not in cache.
    - id: configuration
      type: Metalama.Patterns.Caching.CacheItemConfiguration
      description: Optional configuration overriding the default settings.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A cancellation token.
    typeParameters:
    - id: TTaskResultType
      description: The type of the task result.
    return:
      type: System.Threading.Tasks.Task{{TTaskResultType}}
      description: A task representing the cached or computed result.
