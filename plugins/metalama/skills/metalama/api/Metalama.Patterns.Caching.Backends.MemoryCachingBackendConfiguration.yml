- uid: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.SizeCalculator
  commentId: P:Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.SizeCalculator
  id: SizeCalculator
  parent: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration
  langs:
  - csharp
  - vb
  name: SizeCalculator
  nameWithType: MemoryCachingBackendConfiguration.SizeCalculator
  fullName: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.SizeCalculator
  type: Property
  assemblies:
  - Metalama.Patterns.Caching.Backend
  namespace: Metalama.Patterns.Caching.Backends
  summary: >-
    Gets or sets a delegate that receives the object being cached and returns its size, for use in the <xref href="Microsoft.Extensions.Caching.Memory.MemoryCacheEntryOptions.Size" data-throw-if-not-resolved="false"></xref>

    property of the <xref href="Microsoft.Extensions.Caching.Memory.MemoryCacheEntryOptions" data-throw-if-not-resolved="false"></xref> object. This allows to enforce a size limit on the <xref href="Microsoft.Extensions.Caching.Memory.MemoryCache" data-throw-if-not-resolved="false"></xref>

    (see  <xref href="Microsoft.Extensions.Caching.Memory.MemoryCacheOptions.SizeLimit" data-throw-if-not-resolved="false"></xref>). The default value is a delegate returning the constant 1. This property is ignored

    if <xref href="Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.Serializer" data-throw-if-not-resolved="false"></xref> has a non-null value, because in this case the size is the number of bytes in the serialized item.
  example: []
  syntax:
    content: public Func<object?, long> SizeCalculator { get; init; }
    parameters: []
    return:
      type: System.Func{System.Object,System.Int64}
    content.vb: Public Property SizeCalculator As Func(Of Object, Long)
  overload: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.SizeCalculator*
- uid: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.Serializer
  commentId: P:Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.Serializer
  id: Serializer
  parent: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration
  langs:
  - csharp
  - vb
  name: Serializer
  nameWithType: MemoryCachingBackendConfiguration.Serializer
  fullName: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.Serializer
  type: Property
  assemblies:
  - Metalama.Patterns.Caching.Backend
  namespace: Metalama.Patterns.Caching.Backends
  summary: >-
    Gets or sets an optional <xref href="Metalama.Patterns.Caching.Serializers.ICachingSerializer" data-throw-if-not-resolved="false"></xref>. By default, this property is <code>null</code>, and cached objects are referenced

    in the <i>as is</i>, without any serialization. Setting this property forces the cache to hold the serialized representation of the cached

    object.
  remarks: >-
    <p>Using a serializer for the in-memory cache can have two benefits.</p>

    <p>First, it allows to test the readiness of the code before switching to a distributed cache like Redis. Running a Redis server on a development

    machine is less convenient than running no server, so using an in-memory caching backend with serializer is a good comprise between test

    coverage and convenience.</p>

    <p>

    Second, it allows to cache mutable objects and make sure that every caller receives a fresh instance of the return value of the cached method.

    </p>
  example: []
  syntax:
    content: public ICachingSerializer? Serializer { get; init; }
    parameters: []
    return:
      type: Metalama.Patterns.Caching.Serializers.ICachingSerializer
    content.vb: Public Property Serializer As ICachingSerializer
  overload: Metalama.Patterns.Caching.Backends.MemoryCachingBackendConfiguration.Serializer*
