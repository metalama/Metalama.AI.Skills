  nameWithType: IteratorInfo
  fullName: Metalama.Framework.Code.IteratorInfo
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Provides information about the iterator characteristics of a method, returned by the <xref href="Metalama.Framework.Code.MethodExtensions.GetIteratorInfo(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref> extension method of <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Use this struct to inspect iterator method properties at compile time, for example in <code>BuildAspect</code>.</p>

    <p>Note that <xref href="Metalama.Framework.Code.IteratorInfo.IsIteratorMethod" data-throw-if-not-resolved="false"></xref> indicates whether the method uses <code>yield return</code> or <code>yield break</code>,
        while <xref href="Metalama.Framework.Code.IteratorInfo.EnumerableKind" data-throw-if-not-resolved="false"></xref> indicates the return type regardless of the implementation.</p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public readonly struct IteratorInfo
