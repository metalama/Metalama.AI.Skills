  fullName: Metalama.Framework.Code.IteratorInfo.ItemType
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets the type of items being enumerated.
  example: []
  syntax:
    content: public IType ItemType { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IType
      description: >-
        The item type. For example, for a method returning <code>IEnumerable&lt;int&gt;</code>, this property returns <code>int</code>.

        For non-generic enumerable types like <xref href="System.Collections.IEnumerable" data-throw-if-not-resolved="false"></xref>, this property returns <xref href="System.Object" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public ReadOnly Property ItemType As IType
  overload: Metalama.Framework.Code.IteratorInfo.ItemType*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: Thrown when <xref href="Metalama.Framework.Code.IteratorInfo.EnumerableKind" data-throw-if-not-resolved="false"></xref> is <xref href="Metalama.Framework.Code.EnumerableKind.None" data-throw-if-not-resolved="false"></xref>.
- uid: Metalama.Framework.Code.IteratorInfo.EnumerableKind
