  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets the kind of enumerable or enumerator returned by the method, regardless of whether the method is a yield-based iterator (see <xref href="Metalama.Framework.Code.IteratorInfo.IsIteratorMethod" data-throw-if-not-resolved="false"></xref>).
  example: []
  syntax:
    content: public EnumerableKind EnumerableKind { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.EnumerableKind
      description: >-
        One of the <xref href="Metalama.Framework.Code.EnumerableKind" data-throw-if-not-resolved="false"></xref> values: <xref href="Metalama.Framework.Code.EnumerableKind.None" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.EnumerableKind.IEnumerable" data-throw-if-not-resolved="false"></xref>,

        <xref href="Metalama.Framework.Code.EnumerableKind.IEnumerator" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.EnumerableKind.UntypedIEnumerable" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.EnumerableKind.UntypedIEnumerator" data-throw-if-not-resolved="false"></xref>,

        <xref href="Metalama.Framework.Code.EnumerableKind.IAsyncEnumerable" data-throw-if-not-resolved="false"></xref>, or <xref href="Metalama.Framework.Code.EnumerableKind.IAsyncEnumerator" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public ReadOnly Property EnumerableKind As EnumerableKind
  overload: Metalama.Framework.Code.IteratorInfo.EnumerableKind*
