- uid: Metalama.Framework.Code.IteratorInfo.IsIteratorMethod
  commentId: P:Metalama.Framework.Code.IteratorInfo.IsIteratorMethod
  id: IsIteratorMethod
  parent: Metalama.Framework.Code.IteratorInfo
  langs:
  - csharp
  - vb
  name: IsIteratorMethod
  nameWithType: IteratorInfo.IsIteratorMethod
  fullName: Metalama.Framework.Code.IteratorInfo.IsIteratorMethod
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a value indicating whether the method is an iterator, i.e., whether it has a <code>yield return</code> or <code>yield break</code> statement.
  remarks: >-
    This property only indicates whether the method uses yield-based iteration. To determine the kind of enumerable

    returned by the method regardless of implementation, use <xref href="Metalama.Framework.Code.IteratorInfo.EnumerableKind" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public bool? IsIteratorMethod { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
      description: >-
        <code>true</code> if the method uses <code>yield return</code> or <code>yield break</code>;
            <code>false</code> if the method returns an enumerable type but does not use <code>yield</code>;
            <code>null</code> if the method is not defined in the current project and the information is not available.
    content.vb: Public ReadOnly Property IsIteratorMethod As Boolean?
  overload: Metalama.Framework.Code.IteratorInfo.IsIteratorMethod*
- uid: Metalama.Framework.Code.IteratorInfo.ItemType
  commentId: P:Metalama.Framework.Code.IteratorInfo.ItemType
  id: ItemType
