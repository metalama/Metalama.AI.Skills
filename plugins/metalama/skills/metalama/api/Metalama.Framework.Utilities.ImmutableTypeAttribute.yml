  name: ImmutableTypeAttribute
  nameWithType: ImmutableTypeAttribute
  fullName: Metalama.Framework.Utilities.ImmutableTypeAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Utilities
  summary: >-
    Declares that a type must be written in an immutable style, and requires every type that derives from it or

    implements it to be written that way too. An analyzer verifies the declaration and reports a warning when it

    does not hold.
  remarks: >-
    <p>
        An aspect is instantiated once and reused for every target it applies to, and at design time across
        compilations. State kept on it therefore leaks from one target to the next, in an order the author does not
        control. That is why <xref href="Metalama.Framework.Aspects.IAspect" data-throw-if-not-resolved="false"></xref> and
        <xref href="Metalama.Framework.Fabrics.Fabric" data-throw-if-not-resolved="false"></xref> carry this attribute, and why every aspect, fabric and
        validator is checked.
        </p>
    <p>
        Concretely, in a type subject to this contract:
        </p>
    <ul><li>
        every instance <b>field</b> must be <code>readonly</code>, or private and assigned only in a constructor or an
        <code>init</code> accessor;
        </li><li>
        every automatically implemented <b>property</b> must have no setter, an <code>init</code> accessor, or a private
        setter assigned only in a constructor or an <code>init</code> accessor;
        </li><li>
        and the <b>type</b> of every such member must itself be immutable, all the way down.
        </li></ul>
    <p>
        A member whose write access is private is checked at its assignments rather than at its declaration, because
        private write access confines every assignment to the declaring type, so the analyzer can see all of them.
        Passing such a member as a <code>ref</code> or <code>out</code> argument counts as an assignment.
        </p>
    <p>
        Intrinsic types, delegates, enumerations and the immutable collections are immutable, and an immutable
        collection is immutable only when its type arguments are. A type that is not marked with this attribute and is
        not otherwise known to the analyzer is not immutable, so marking a type propagates the obligation to the types
        of all of its members.
        </p>
    <p>
      <b>This attribute is deliberately not <code>System.ComponentModel.ImmutableObjectAttribute</code>.</b> That one
        exists to tell a designer that an object has no editable sub-properties, it is applied in the wild for that
        reason, and it says nothing about this contract. Reusing it would mean checking code whose author never opted
        in. The name also avoids <code>Metalama.Patterns.Immutability.ImmutableAttribute</code>, which is a different feature
        and may be imported in the same file.
        </p>
    <p>
        There is deliberately no per-type waiver. Where the contract is genuinely not wanted on one declaration, the
        ordinary suppression mechanisms apply: <code>#pragma warning disable</code>, <code>[SuppressMessage]</code> with a
        justification, or a severity in an <code>.editorconfig</code>. A project that implements the framework itself,
        rather than using it, sets the <code>MetalamaEnforceImmutabilityContract</code> MSBuild property to <code>false</code> to
        turn the contract off entirely.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Interface, Inherited = false)]

      public sealed class ImmutableTypeAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.Interface, Inherited:=False)>

      Public NotInheritable Class ImmutableTypeAttribute Inherits Attribute
