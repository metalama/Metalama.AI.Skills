- uid: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
  commentId: M:Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo
  id: ToMemberInfo
  parent: Metalama.Framework.Code.IMemberOrNamedType
  langs:
  - csharp
  - vb
  name: ToMemberInfo()
  nameWithType: IMemberOrNamedType.ToMemberInfo()
  fullName: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> that represents the current member or type at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> object for the current
        declaration. The actual return type depends on the declaration: <xref href="System.Reflection.FieldInfo" data-throw-if-not-resolved="false"></xref>
        for fields, <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> for properties, <xref href="System.Reflection.MethodInfo" data-throw-if-not-resolved="false"></xref>
        for methods, and so on.
        </p>
    <p>
        While Metalama is designed to eliminate the need for reflection in most scenarios, this method is useful
        when you need to pass member metadata to APIs that require <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on member names and may break if your project
        is obfuscated. Consider using strongly-typed alternatives when possible.
        </p>
  example: []
  syntax:
    content: MemberInfo ToMemberInfo()
    return:
      type: System.Reflection.MemberInfo
      description: A <xref href="System.Reflection.MemberInfo" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToMemberInfo() As MemberInfo
  overload: Metalama.Framework.Code.IMemberOrNamedType.ToMemberInfo*
  seealso:
  - linkId: Metalama.Framework.Code.IType.ToType
    commentId: M:Metalama.Framework.Code.IType.ToType
  - linkId: Metalama.Framework.Code.IMethod.ToMethodInfo
    commentId: M:Metalama.Framework.Code.IMethod.ToMethodInfo
  - linkId: Metalama.Framework.Code.IField.ToFieldInfo
    commentId: M:Metalama.Framework.Code.IField.ToFieldInfo
  - linkId: Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo
    commentId: M:Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo
