- uid: Metalama.Framework.Introspection.IIntrospectionAspectInstance.IsSkipped
  commentId: P:Metalama.Framework.Introspection.IIntrospectionAspectInstance.IsSkipped
  id: IsSkipped
  parent: Metalama.Framework.Introspection.IIntrospectionAspectInstance
  langs:
  - csharp
  - vb
  name: IsSkipped
  nameWithType: IIntrospectionAspectInstance.IsSkipped
  fullName: Metalama.Framework.Introspection.IIntrospectionAspectInstance.IsSkipped
  type: Property
  assemblies:
  - Metalama.Framework.Introspection
  namespace: Metalama.Framework.Introspection
  summary: >-
    Gets a value indicating whether the current aspect instance has been skipped. This value is <code>true</code> if

    the aspect evaluation resulted in an error or if the <xref href="Metalama.Framework.Aspects.IAspect%601.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7b%600%7d)" data-throw-if-not-resolved="false"></xref> method invoked

    <xref href="Metalama.Framework.Aspects.IAspectBuilder.SkipAspect" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: bool IsSkipped { get; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: ReadOnly Property IsSkipped As Boolean
  overload: Metalama.Framework.Introspection.IIntrospectionAspectInstance.IsSkipped*
- uid: Metalama.Framework.Introspection.IIntrospectionAspectInstance.SecondaryInstances
  commentId: P:Metalama.Framework.Introspection.IIntrospectionAspectInstance.SecondaryInstances
  id: SecondaryInstances
  parent: Metalama.Framework.Introspection.IIntrospectionAspectInstance
  langs:
  - csharp
  - vb
  name: SecondaryInstances
  nameWithType: IIntrospectionAspectInstance.SecondaryInstances
  fullName: Metalama.Framework.Introspection.IIntrospectionAspectInstance.SecondaryInstances
  type: Property
  assemblies:
  - Metalama.Framework.Introspection
  namespace: Metalama.Framework.Introspection
  summary: >-
    Gets the other instances of the same <xref href="Metalama.Framework.Introspection.IIntrospectionAspectInstance.AspectClass" data-throw-if-not-resolved="false"></xref> on the same <xref href="Metalama.Framework.Aspects.IAspectPredecessor.TargetDeclaration" data-throw-if-not-resolved="false"></xref>.

    When several instances of the same <xref href="Metalama.Framework.Introspection.IIntrospectionAspectInstance.AspectClass" data-throw-if-not-resolved="false"></xref> are found on the same <xref href="Metalama.Framework.Aspects.IAspectPredecessor.TargetDeclaration" data-throw-if-not-resolved="false"></xref>,

    they are ordered by priority, and only the first one gets executed. The other instances are exposed on this property.
  example: []
  syntax:
    content: ImmutableArray<IIntrospectionAspectInstance> SecondaryInstances { get; }
    parameters: []
    return:
      type: System.Collections.Immutable.ImmutableArray{Metalama.Framework.Introspection.IIntrospectionAspectInstance}
    content.vb: ReadOnly Property SecondaryInstances As ImmutableArray(Of IIntrospectionAspectInstance)
  overload: Metalama.Framework.Introspection.IIntrospectionAspectInstance.SecondaryInstances*
