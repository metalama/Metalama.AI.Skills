  name: IIntrospectionAspectInstance
  nameWithType: IIntrospectionAspectInstance
  fullName: Metalama.Framework.Introspection.IIntrospectionAspectInstance
  type: Interface
  assemblies:
  - Metalama.Framework.Introspection
  namespace: Metalama.Framework.Introspection
  summary: Represents an instance of an aspect, as well as the results of the aspect instance.
  remarks: >-
    To obtain an <xref href="Metalama.Framework.Introspection.IIntrospectionAspectInstance" data-throw-if-not-resolved="false"></xref> from a <code>Metalama.Framework.Workspaces.Workspace</code>, use the

    <code>Workspace.AspectInstances</code> property, which returns all aspect instances aggregated

    across all projects in the workspace. For per-project access, use the <code>Project.AspectInstances</code> property.

    Alternatively, use the <code>IIntrospectionAspectClass.Instances</code> property to get all instances of a specific <code>IIntrospectionAspectClass</code>.
  example: []
  syntax:
    content: 'public interface IIntrospectionAspectInstance : IIntrospectionAspectPredecessor'
    content.vb: Public Interface IIntrospectionAspectInstance Inherits IIntrospectionAspectPredecessor
