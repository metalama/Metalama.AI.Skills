  type: Method
  assemblies:
  - Metalama.Framework.Workspaces
  namespace: Metalama.Framework.Workspaces
  summary: >-
    Gets inbound declaration references, i.e. the list of declarations that use the given declaration,

    in the projects loaded in the current <xref href="Metalama.Framework.Workspaces.Workspace" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static IEnumerable<IIntrospectionReference> GetInboundReferences(this IDeclaration declaration, IntrospectionChildKinds childKinds = IntrospectionChildKinds.ContainingDeclaration, CancellationToken cancellationToken = default)
    parameters:
    - id: declaration
      type: Metalama.Framework.Code.IDeclaration
      description: The declaration to get inbound references for.
    - id: childKinds
      type: Metalama.Framework.Introspection.IntrospectionChildKinds
      description: Specifies which kinds of child declarations to include.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A cancellation token.
    return:
      type: System.Collections.Generic.IEnumerable{Metalama.Framework.Introspection.IIntrospectionReference}
      description: An enumerable of inbound references.
    content.vb: Public Shared Function GetInboundReferences(declaration As IDeclaration, childKinds As IntrospectionChildKinds = IntrospectionChildKinds.ContainingDeclaration, cancellationToken As CancellationToken = Nothing) As IEnumerable(Of IIntrospectionReference)
