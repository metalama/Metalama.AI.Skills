  name: Literal(object?, bool)
  nameWithType: ExpressionFactory.Literal(object?, bool)
  fullName: Metalama.Framework.Code.SyntaxBuilders.ExpressionFactory.Literal(object?, bool)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.SyntaxBuilders
  summary: Returns an expression that represents a literal.
  example: []
  syntax:
    content: public static IExpression Literal(object? value, bool stronglyTyped = false)
    parameters:
    - id: value
      type: System.Object
      description: A literal value, or <code>null</code> to represent a null string.
    - id: stronglyTyped
      type: System.Boolean
      description: >-
        A value indicating if the literal should be qualified to remove any type ambiguity, for instance
                    if the <code class="paramref">value</code> parameter contains a <code>long</code> that can also represent an <xref href="System.Int32" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Metalama.Framework.Code.IExpression
    content.vb: Public Shared Function Literal(value As Object, stronglyTyped As Boolean = False) As IExpression
