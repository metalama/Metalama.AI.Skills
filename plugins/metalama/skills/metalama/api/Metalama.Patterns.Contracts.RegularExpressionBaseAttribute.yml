  summary: Base class for contract aspects that validate strings against regular expressions.
  remarks: >-
    <p>Derived classes must implement <xref href="Metalama.Patterns.Contracts.RegularExpressionBaseAttribute.GetRegex" data-throw-if-not-resolved="false"></xref> to provide the regular expression used for validation.

    If the target is a nullable type, null strings are accepted and do not throw an exception.</p>

    <p>To customize the behavior when validation fails, override the <xref href="Metalama.Patterns.Contracts.RegularExpressionBaseAttribute.OnContractViolated(System.Object%2cSystem.Object%2cMetalama.Patterns.Contracts.ContractContext)" data-throw-if-not-resolved="false"></xref> template method.</p>
