  name: IInitializable
  nameWithType: IInitializable
  fullName: Metalama.Framework.RunTime.Initialization.IInitializable
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Marks a type as having a post-initialization hook. The <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> method

    is called after all constructors and object/collection initializers have completed,

    ensuring that all properties (including <code>init</code>-only and <code>required</code> members)

    are set before validation or derived value computation runs.
  remarks: >-
    <p>
        The Metalama Linker automatically rewrites call sites (<code>new T()</code>, <code>new T { ... }</code>,
        <code>with { ... }</code>) to invoke <xref href="Metalama.Framework.RunTime.Initialization.InitializableExtensions.WithInitialize%60%601(%60%600%2cMetalama.Framework.RunTime.Initialization.InitializationMetadata)" data-throw-if-not-resolved="false"></xref> after construction.
        </p>
    <p>
        Implementing classes should declare <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> as <code>public virtual</code>
        (or <code>override</code>) on non-sealed classes to allow derived types to extend initialization behavior.
        </p>
  example: []
  syntax:
    content: public interface IInitializable
    content.vb: Public Interface IInitializable
