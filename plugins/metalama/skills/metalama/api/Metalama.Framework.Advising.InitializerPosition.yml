  fullName: Metalama.Framework.Advising.InitializerPosition.BeforeBase
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: The initializer runs before the call to the base initializer.
  example: []
  syntax:
    content: BeforeBase = 1
    return:
      type: Metalama.Framework.Advising.InitializerPosition
  seealso:
