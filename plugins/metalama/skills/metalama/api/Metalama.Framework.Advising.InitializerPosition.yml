    commentId: T:Metalama.Framework.Advising.InitializerKind
  - linkId: Metalama.Framework.Advising.IAddInitializerAdviceResult
    commentId: T:Metalama.Framework.Advising.IAddInitializerAdviceResult
  - linkType: HRef
    linkId: '@initializers'
    altText: '@initializers'
  attributes:
  - type: Metalama.Framework.Aspects.CompileTimeAttribute
    ctor: Metalama.Framework.Aspects.CompileTimeAttribute.#ctor
    arguments: []
- uid: Metalama.Framework.Advising.InitializerPosition.AfterBase
  commentId: F:Metalama.Framework.Advising.InitializerPosition.AfterBase
  id: AfterBase
  parent: Metalama.Framework.Advising.InitializerPosition
  langs:
  - csharp
  - vb
  name: AfterBase
  nameWithType: InitializerPosition.AfterBase
  fullName: Metalama.Framework.Advising.InitializerPosition.AfterBase
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    The initializer runs after the call to the base initializer (<code>base.Initialize(...)</code> or

    <code>base.OnConstructed(...)</code>). This is the default.
  example: []
  syntax:
    content: AfterBase = 0
    return:
      type: Metalama.Framework.Advising.InitializerPosition
  seealso:
  - linkType: HRef
    linkId: '@initializers'
    altText: '@initializers'
- uid: Metalama.Framework.Advising.InitializerPosition.BeforeBase
