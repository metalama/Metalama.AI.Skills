  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Returns a representation of an expression that is safe to be held across compilations.
  remarks: >-
    <p>
        The counterpart of <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref> for expressions. Call
        <xref href="Metalama.Framework.Code.IDurableExpression.ToExpression(Metalama.Framework.Code.ICompilation)" data-throw-if-not-resolved="false"></xref> to get the expression back.
        </p>
    <p>
        The expression is rendered when this method is called, so call it while the expression is still usable.
        </p>
  example: []
  syntax:
    content: public static IDurableExpression ToDurable(this IExpression expression)
    parameters:
    - id: expression
      type: Metalama.Framework.Code.IExpression
    return:
      type: Metalama.Framework.Code.IDurableExpression
    content.vb: Public Shared Function ToDurable(expression As IExpression) As IDurableExpression
