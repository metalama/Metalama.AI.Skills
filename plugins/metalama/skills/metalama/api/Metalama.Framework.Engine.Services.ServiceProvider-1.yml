  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Services
  summary: >-
    An immutable implementation of <xref href="System.IServiceProvider" data-throw-if-not-resolved="false"></xref> that will index services that implement the <code class="typeparamref">TBase</code> interface.

    When a service is added to a <xref href="Metalama.Framework.Engine.Services.ServiceProvider%601" data-throw-if-not-resolved="false"></xref>, a mapping is created between the type of this object and the object itself,

    but also between the type of any interface derived from <code class="typeparamref">TBase</code> and implemented by this object. Service provider instances

    are immutable (each <xref href="Metalama.Framework.Engine.Services.ServiceProvider%601.WithService(%600%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> method

    returns a copy of the service provider with the new service), except for the <i>shared</i> services, which are shared among all instances

    of the same family.
