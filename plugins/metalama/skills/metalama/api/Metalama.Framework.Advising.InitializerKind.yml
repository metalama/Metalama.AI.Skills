- uid: Metalama.Framework.Advising.InitializerKind.BeforeInstanceConstructor
  commentId: F:Metalama.Framework.Advising.InitializerKind.BeforeInstanceConstructor
  id: BeforeInstanceConstructor
  parent: Metalama.Framework.Advising.InitializerKind
  langs:
  - csharp
  - vb
  name: BeforeInstanceConstructor
  nameWithType: InitializerKind.BeforeInstanceConstructor
  fullName: Metalama.Framework.Advising.InitializerKind.BeforeInstanceConstructor
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Indicates that the advice should be executed before any user code in all instance constructors except those that are chained to a constructor of the current class (using the <code>this</code> chaining keyword). The initialization logic executes

    after the call to the base constructor.
  remarks: >-
    <p>
        Use this when you need to initialize instance state or register instances before any user constructor code runs.
        The initialization code runs after <code>: base(...)</code> calls but before any user code in the constructor body.
        </p>
    <p>
        A default constructor will be automatically created if the type does not contain any constructor.
        </p>
  example: []
  syntax:
    content: BeforeInstanceConstructor = 0
    return:
      type: Metalama.Framework.Advising.InitializerKind
  seealso:
  - linkType: HRef
    linkId: '@initializers'
    altText: '@initializers'
- uid: Metalama.Framework.Advising.InitializerKind.BeforeTypeConstructor
  commentId: F:Metalama.Framework.Advising.InitializerKind.BeforeTypeConstructor
  id: BeforeTypeConstructor
  parent: Metalama.Framework.Advising.InitializerKind
  langs:
  - csharp
  - vb
  name: BeforeTypeConstructor
  nameWithType: InitializerKind.BeforeTypeConstructor
  fullName: Metalama.Framework.Advising.InitializerKind.BeforeTypeConstructor
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: Indicates that the advice should be executed before the type constructor (aka static constructor) of the target type. If there is no type constructor, this advice adds one.
  remarks: >-
    <p>
        Use this when you need to initialize static/type-level state before any user static constructor code runs.
        The type constructor is called once when the type is first accessed.
        </p>
    <p>
        The initialization code runs at the beginning of the static constructor, after field initializers.
        </p>
  example: []
  syntax:
    content: BeforeTypeConstructor = 1
    return:
      type: Metalama.Framework.Advising.InitializerKind
  seealso:
  - linkType: HRef
    linkId: '@initializers'
    altText: '@initializers'
- uid: Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor
  commentId: F:Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor
  id: AfterLastInstanceConstructor
  parent: Metalama.Framework.Advising.InitializerKind
  langs:
  - csharp
  - vb
  name: AfterLastInstanceConstructor
  nameWithType: InitializerKind.AfterLastInstanceConstructor
  fullName: Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Indicates that the advice should run at the end of every instance constructor body, after all

    user constructor code. In an inheritance chain it runs only once, in the most-derived layer:

    base constructors skip the call so that derived state is fully assigned by the time the template

    executes. Constructors chained via <code>: this(...)</code> are skipped just like with

    <xref href="Metalama.Framework.Advising.InitializerKind.BeforeInstanceConstructor" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        This kind introduces a virtual <code>OnConstructed(InitializationContext)</code> method on the target
        type and injects the template body into it. A call to <code>OnConstructed</code> is appended to the end
        of every instance constructor, guarded so that only the most-derived constructor actually invokes
        the body — a framework-reserved <xref href="Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed" data-throw-if-not-resolved="false"></xref>
        slot carries the "already handled" signal up the chain.
        </p>
    <p>
        Choose this kind when your initialization logic depends on the constructor body having finished
        (e.g. registering the instance in a tracker, starting a background task) but does <em>not</em>
        need properties or fields to have been set via an object initializer yet.
        If you need those properties to be set first, use <xref href="Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer" data-throw-if-not-resolved="false"></xref> instead.
        </p>
    <p>
        The <code>InitializationContext</code> parameter is pulled into constructors via the constructor parameter
        introduction mechanism (<xref href="Metalama.Framework.Advising.IAdviceFactory.IntroduceParameter(Metalama.Framework.Code.IConstructor%2cSystem.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Code.TypedConstant%2cMetalama.Framework.Advising.IPullStrategy%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Framework.Code.DeclarationBuilders.AttributeConstruction%7d)?text=IAdviceFactory.IntroduceParameter" data-throw-if-not-resolved="false"></xref>).
        </p>
  example: []
  syntax:
    content: AfterLastInstanceConstructor = 2
    return:
      type: Metalama.Framework.Advising.InitializerKind
  seealso:
  - linkType: HRef
    linkId: '@initializers'
    altText: '@initializers'
  - linkId: Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer
    commentId: F:Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer
  - linkId: Metalama.Framework.RunTime.Initialization.InitializationContext
    commentId: T:Metalama.Framework.RunTime.Initialization.InitializationContext
- uid: Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer
  commentId: F:Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer
  id: AfterObjectInitializer
  parent: Metalama.Framework.Advising.InitializerKind
  langs:
  - csharp
  - vb
  name: AfterObjectInitializer
  nameWithType: InitializerKind.AfterObjectInitializer
  fullName: Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    Indicates that the advice should inject statements into the <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> method of

    <xref href="Metalama.Framework.RunTime.Initialization.IInitializable" data-throw-if-not-resolved="false"></xref> on the target type. If the type does not

    already implement <xref href="Metalama.Framework.RunTime.Initialization.IInitializable" data-throw-if-not-resolved="false"></xref>, the interface and a

    virtual <code>Initialize(InitializationContext)</code> method are introduced automatically. 

    Metalama rewrites every instrumented <code>new T(...)</code>, <code>new T { ... }</code>, and

    <code>with { ... }</code> call site to invoke <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> after construction, so the template

    runs only once properties and fields have been assigned by the object initializer.
  remarks: >-
    <p>
        Choose this kind for cross-cutting concerns that must observe the object in its fully initialized
        state — for example, validating property values, computing derived read-only
        properties, or wiring back-references between parent and child objects. Unlike
        <xref href="Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor" data-throw-if-not-resolved="false"></xref>, which runs at the end of the constructor body,
        <xref href="Metalama.Framework.Advising.InitializerKind.AfterObjectInitializer" data-throw-if-not-resolved="false"></xref> runs <em>after</em> object/collection initializers, so
        properties set inline at the call site are visible inside the template.
        </p>
    <p>
        Templates used with this kind may optionally declare an
        <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext" data-throw-if-not-resolved="false"></xref> parameter to inspect caller intent,
        metadata (e.g. <xref href="Metalama.Framework.RunTime.Initialization.InitializationMetadata.Modify" data-throw-if-not-resolved="false"></xref> for
        <code>with</code> expressions), or coordination slots passed to the <code>slotFields</code> parameter of
        <xref href="Metalama.Framework.Advising.IAdviceFactory.AddInitializer(Metalama.Framework.Code.INamedType%2cSystem.String%2cMetalama.Framework.Advising.InitializerKind%2cSystem.Object%2cSystem.Object%2cSystem.Collections.Generic.IEnumerable%7bMetalama.Framework.Code.IField%7d)?text=IAdviceFactory.AddInitializer" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: AfterObjectInitializer = 3
    return:
      type: Metalama.Framework.Advising.InitializerKind
  seealso:
  - linkId: Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor
    commentId: F:Metalama.Framework.Advising.InitializerKind.AfterLastInstanceConstructor
  - linkId: Metalama.Framework.RunTime.Initialization.IInitializable
    commentId: T:Metalama.Framework.RunTime.Initialization.IInitializable
  - linkId: Metalama.Framework.RunTime.Initialization.InitializationContext
    commentId: T:Metalama.Framework.RunTime.Initialization.InitializationContext
