  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a value indicating whether the method has an async implementation, i.e., whether it has the <code>async</code> modifier.
  example: []
  syntax:
    content: public bool? IsAsync { get; }
    parameters: []
    return:
      type: System.Nullable{System.Boolean}
      description: >-
        <code>true</code> if the method has the <code>async</code> modifier; <code>false</code> if it does not;
            <code>null</code> if the method is not defined in the current project and the information is not available.
    content.vb: Public ReadOnly Property IsAsync As Boolean?
