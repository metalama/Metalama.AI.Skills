  fullName: Metalama.Framework.Code.AsyncInfo
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Provides information about the async characteristics of a method, returned by the <xref href="Metalama.Framework.Code.MethodExtensions.GetAsyncInfo(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref> extension method of <xref href="Metalama.Framework.Code.IMethod" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>Use this struct to inspect async method properties at compile time, for example in <code>BuildAspect</code>.</p>

    <p>The <xref href="Metalama.Framework.Code.AsyncInfo.ResultType" data-throw-if-not-resolved="false"></xref> property is particularly useful when you need the actual result type instead of the task type.
        For example, for a method returning <code>Task&lt;string&gt;</code>, <xref href="Metalama.Framework.Code.AsyncInfo.ResultType" data-throw-if-not-resolved="false"></xref> is <code>string</code>.</p>
