  name: IsAwaitable
  nameWithType: AsyncInfo.IsAwaitable
  fullName: Metalama.Framework.Code.AsyncInfo.IsAwaitable
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a value indicating whether the return type of the method is awaitable, i.e., whether it can be used with the <code>await</code> keyword.
  remarks: This does not include <code>IAsyncEnumerable&lt;T&gt;</code>, which can be used with <code>await foreach</code> but not <code>await</code>.
  example: []
  syntax:
    content: public bool IsAwaitable { get; }
    parameters: []
    return:
      type: System.Boolean
      description: <code>true</code> if the return type can be used with <code>await</code>; otherwise, <code>false</code>.
    content.vb: Public ReadOnly Property IsAwaitable As Boolean
  overload: Metalama.Framework.Code.AsyncInfo.IsAwaitable*
