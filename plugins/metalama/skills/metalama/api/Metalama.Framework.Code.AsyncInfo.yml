  name: ResultType
  nameWithType: AsyncInfo.ResultType
  fullName: Metalama.Framework.Code.AsyncInfo.ResultType
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets the unwrapped result type of the async method, i.e., the type of the <code>await</code> expression.
  example: []
  syntax:
    content: public IType ResultType { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.IType
      description: >-
        The unwrapped result type. For example, for a method returning <code>Task&lt;string&gt;</code>, this property returns <code>string</code>.

        For a method returning <code>Task</code> or <code>void</code>, this property returns <code>void</code>.
    content.vb: Public ReadOnly Property ResultType As IType
