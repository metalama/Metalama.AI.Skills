  name: IPullStrategy
  nameWithType: IPullStrategy
  fullName: Metalama.Framework.Advising.IPullStrategy
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Advising
  summary: >-
    A strategy that defines how the value of an introduced constructor parameter is obtained in two contexts:

    (a) the framework-emitted <em>forwarding constructor</em> that preserves the pre-mutation signature when

    <xref href="Metalama.Framework.Advising.IAdviceFactory.IntroduceParameter(Metalama.Framework.Code.IConstructor%2cSystem.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Advising.IPullStrategy%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Framework.Code.DeclarationBuilders.AttributeConstruction%7d%2cMetalama.Framework.Advising.IConstructorOverloadingStrategy)" data-throw-if-not-resolved="false"></xref>

    introduces a required parameter; and (b) chained constructors (in the same class) and derived constructors

    (in the same project or in referencing projects) that must pass a value to the mutated base constructor.

    For standard implementations, see <xref href="Metalama.Framework.Advising.PullStrategy" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        When you introduce a parameter to a base constructor using <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceParameter(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IConstructor%7d%2cSystem.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Advising.IPullStrategy%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Framework.Code.DeclarationBuilders.AttributeConstruction%7d%2cMetalama.Framework.Advising.IConstructorOverloadingStrategy)" data-throw-if-not-resolved="false"></xref>
        or the corresponding extension methods in <xref href="Metalama.Framework.Aspects.AdviserExtensions" data-throw-if-not-resolved="false"></xref>, this strategy determines how chained and derived
        constructors (plus the forwarding constructor, when one is emitted) obtain the value for the newly introduced parameter.
        </p>
    <p>
      <strong>Cross-Project Operation:</strong> Pull strategies operate across project boundaries. Custom implementations
        must be serializable (implement <xref href="Metalama.Framework.Serialization.ICompileTimeSerializable" data-throw-if-not-resolved="false"></xref>) because the strategy needs to be persisted
        and applied in projects that reference the project where the parameter was introduced. For example, if you introduce
        a parameter to a base class in Project A using <xref href="Metalama.Framework.Advising.PullStrategy.IntroduceParameterAndPull(System.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Code.IExpression%2cMetalama.Framework.Code.IExpression%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>, and Project B
        references Project A and has derived classes, those derived classes will automatically have the parameter added to
        their constructors.
        </p>
  example: []
  syntax:
    content: 'public interface IPullStrategy : ICompileTimeSerializable'
    content.vb: Public Interface IPullStrategy Inherits ICompileTimeSerializable
