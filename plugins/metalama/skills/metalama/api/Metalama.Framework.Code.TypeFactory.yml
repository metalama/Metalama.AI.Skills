  summary: Attempts to get a type based on its full name, as used in reflection.
  remarks: >-
    <p>
        For nested types, this means using <code>+</code>, e.g. to get <xref href="System.Environment.SpecialFolder" data-throw-if-not-resolved="false"></xref>, use <code>System.Environment+SpecialFolder</code>.
        </p>
    <p>
        For generic type definitions, this requires using <code>`</code>, e.g. to get <code>List&lt;T&gt;</code>, use <code>System.Collections.Generic.List`1</code>.
        </p>
    <p>
        Constructed generic types (e.g. <code>List&lt;int&gt;</code>) are not supported, for those, use <xref href="Metalama.Framework.Code.GenericExtensions.WithTypeArguments(Metalama.Framework.Code.INamedType%2cMetalama.Framework.Code.IType%5b%5d)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: public static bool TryGetType(string typeName, out INamedType? namedType)
    parameters:
    - id: typeName
      type: System.String
      description: The full name of the type in reflection format.
    - id: namedType
      type: Metalama.Framework.Code.INamedType
      description: When this method returns, contains the <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref> if the type was found; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
      attributes:
      - type: System.Diagnostics.CodeAnalysis.NotNullWhenAttribute
        ctor: System.Diagnostics.CodeAnalysis.NotNullWhenAttribute.#ctor(System.Boolean)
        arguments:
        - type: System.Boolean
          value: true
    return:
      type: System.Boolean
      description: <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> if the type was found; otherwise, <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>.
    content.vb: Public Shared Function TryGetType(typeName As String, namedType As INamedType) As Boolean
