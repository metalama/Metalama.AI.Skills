- uid: Flashtrace.Activities.ILogActivity.Resume
  commentId: M:Flashtrace.Activities.ILogActivity.Resume
  id: Resume
  parent: Flashtrace.Activities.ILogActivity
  langs:
  - csharp
  - vb
  name: Resume()
  nameWithType: ILogActivity.Resume()
  fullName: Flashtrace.Activities.ILogActivity.Resume()
  type: Method
  assemblies:
  - Flashtrace
  namespace: Flashtrace.Activities
  summary: >-
    Resumes the current async activity after it has been suspended by a call to <xref href="Flashtrace.Activities.LogActivity%601.Suspend" data-throw-if-not-resolved="false"></xref>. There is typically no need

    to invoke this method in user code because all async methods that use the <xref href="Flashtrace.FlashtraceLevelSource" data-throw-if-not-resolved="false"></xref> class are automatically instrumented.
  example: []
  syntax:
    content: void Resume()
    content.vb: Sub [Resume]()
  overload: Flashtrace.Activities.ILogActivity.Resume*
- uid: Flashtrace.Activities.ILogActivity.Suspend
  commentId: M:Flashtrace.Activities.ILogActivity.Suspend
  id: Suspend
  parent: Flashtrace.Activities.ILogActivity
  langs:
  - csharp
  - vb
  name: Suspend()
  nameWithType: ILogActivity.Suspend()
  fullName: Flashtrace.Activities.ILogActivity.Suspend()
  type: Method
  assemblies:
  - Flashtrace
  namespace: Flashtrace.Activities
  summary: >-
    Suspends the current async activity.

    The activity must than be resumed by a call of the <xref href="Flashtrace.Activities.LogActivity%601.Resume" data-throw-if-not-resolved="false"></xref> method.

    There is typically no need to invoke this method in user code because all async methods that use the <xref href="Flashtrace.FlashtraceLevelSource" data-throw-if-not-resolved="false"></xref> class are automatically instrumented.
  example: []
  syntax:
    content: void Suspend()
    content.vb: Sub Suspend()
  overload: Flashtrace.Activities.ILogActivity.Suspend*
