- uid: Metalama.Framework.Code.INamespaceOrNamedType.Types
  commentId: P:Metalama.Framework.Code.INamespaceOrNamedType.Types
  id: Types
  parent: Metalama.Framework.Code.INamespaceOrNamedType
  langs:
  - csharp
  - vb
  name: Types
  nameWithType: INamespaceOrNamedType.Types
  fullName: Metalama.Framework.Code.INamespaceOrNamedType.Types
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets the list of types defined in the current namespace or type.
  remarks: >-
    If the current object is an <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>,

    this is the collection of nested types. If the current object is an <xref href="Metalama.Framework.Code.INamespace" data-throw-if-not-resolved="false"></xref>, the collection only

    includes types inside the <xref href="Metalama.Framework.Code.IDeclaration.DeclaringAssembly" data-throw-if-not-resolved="false"></xref>. In case of partial compilations (see <xref href="Metalama.Framework.Code.INamespace.IsPartial" data-throw-if-not-resolved="false"></xref>),

    this collection only contain the types in the current partial compilation.
  example: []
  syntax:
    content: INamedTypeCollection Types { get; }
    parameters: []
    return:
      type: Metalama.Framework.Code.Collections.INamedTypeCollection
    content.vb: ReadOnly Property Types As INamedTypeCollection
  overload: Metalama.Framework.Code.INamespaceOrNamedType.Types*
