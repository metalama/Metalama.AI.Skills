  summary: A base class for aspects that target type declarations (classes, structs, interfaces, delegates, and enums).
  remarks: >-
    <p>
        This class provides a convenient base for creating type-level aspects by implementing <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>
        with <code>T</code> set to <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>. Derived classes override <xref href="Metalama.Framework.Aspects.TypeAspect.BuildAspect(Metalama.Framework.Aspects.IAspectBuilder%7bMetalama.Framework.Code.INamedType%7d)" data-throw-if-not-resolved="false"></xref>
        to add advice (such as introducing members, implementing interfaces, or applying child aspects) to the target type.
        </p>
    <p>
        Aspects can only be applied to run-time code, never to compile-time types (types marked with <xref href="Metalama.Framework.Aspects.CompileTimeAttribute" data-throw-if-not-resolved="false"></xref>
        or <xref href="Metalama.Framework.Aspects.RunTimeOrCompileTimeAttribute" data-throw-if-not-resolved="false"></xref>). This eligibility restriction is enforced by the <xref href="Metalama.Framework.Aspects.TypeAspect.BuildEligibility(Metalama.Framework.Eligibility.IEligibilityBuilder%7bMetalama.Framework.Code.INamedType%7d)" data-throw-if-not-resolved="false"></xref>
        method.
        </p>
    <p>
        This is a convenience base class. The aspect framework primarily requires implementation of <xref href="Metalama.Framework.Aspects.IAspect%601" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Enum|AttributeTargets.Interface|AttributeTargets.Delegate)]

      public abstract class TypeAspect : Aspect, IAspect<INamedType>, IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible<INamedType>
    content.vb: >-
      <AttributeUsage(AttributeTargets.ClassOrAttributeTargets.StructOrAttributeTargets.EnumOrAttributeTargets.InterfaceOrAttributeTargets.Delegate)>

      Public MustInherit Class TypeAspect Inherits Aspect Implements IAspect(Of INamedType), IAspect, ICompileTimeSerializable, ITemplateProvider, IEligible(Of INamedType)
