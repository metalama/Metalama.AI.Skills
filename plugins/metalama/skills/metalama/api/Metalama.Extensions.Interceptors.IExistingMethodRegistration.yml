- uid: Metalama.Extensions.Interceptors.IExistingMethodRegistration.WithArgs(System.Object)
  commentId: M:Metalama.Extensions.Interceptors.IExistingMethodRegistration.WithArgs(System.Object)
  id: WithArgs(System.Object)
  parent: Metalama.Extensions.Interceptors.IExistingMethodRegistration
  langs:
  - csharp
  - vb
  name: WithArgs(object)
  nameWithType: IExistingMethodRegistration.WithArgs(object)
  fullName: Metalama.Extensions.Interceptors.IExistingMethodRegistration.WithArgs(object)
  type: Method
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: Sets the arguments that bind parameters and type parameters of the existing method by name.
  remarks: >-
    <p>

    <xref href="Metalama.Extensions.Interceptors.IMethodRegistrationFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref> describes how the arguments take precedence over the other values. A

    property that binds a parameter accepts these values:

    </p>

    <ul><li>a literal: <code>null</code>, a Boolean, a character, a number, a string or an enumeration value of a run-time-or-compile-time

    enumeration type;</li><li>a <xref href="System.Type" data-throw-if-not-resolved="false"></xref>, which is written as <code>typeof</code>;</li><li>an <xref href="Metalama.Framework.Code.IDurableExpression" data-throw-if-not-resolved="false"></xref>, which is emitted at the site. It is created by <xref href="Metalama.Framework.Code.ExpressionExtensions.ToDurable(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>

    from an <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref>, for instance from a <xref href="Metalama.Framework.Code.TypedConstant" data-throw-if-not-resolved="false"></xref>;</li><li>an <xref href="Metalama.Framework.Code.IDurableRef%601" data-throw-if-not-resolved="false"></xref> of a field or a property, which is emitted at the site as an access to that member. It is created by

    <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref>.</li></ul>

    <p>

    A property that binds a type parameter is a <xref href="System.Type" data-throw-if-not-resolved="false"></xref> or an <xref href="Metalama.Framework.Code.IDurableRef%601" data-throw-if-not-resolved="false"></xref> of an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>. A property

    that names no parameter and no type parameter is an error.

    </p>

    <p>

    The expressions of a call site, such as its arguments and its receiver, are available only in the delegate given to

    <xref href="Metalama.Extensions.Interceptors.IMethodSelection.ForEachSite(System.Func%7bMetalama.Extensions.Interceptors.IMethodInterceptionSite%2cMetalama.Extensions.Interceptors.IMethodInterception%7d)" data-throw-if-not-resolved="false"></xref>. Use <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception.WithArgs(System.Object)" data-throw-if-not-resolved="false"></xref> there to pass them.

    </p>
  example: []
  syntax:
    content: IExistingMethodRegistration WithArgs(object args)
    parameters:
    - id: args
      type: System.Object
      description: >-
        An anonymous object, an <xref href="System.Collections.Generic.IReadOnlyDictionary%602" data-throw-if-not-resolved="false"></xref> of names and values, or an
                    <xref href="Metalama.Framework.Aspects.IObjectReader" data-throw-if-not-resolved="false"></xref>. Its values must be durable.
