  name: IExistingMethodRegistration
  nameWithType: IExistingMethodRegistration
  fullName: Metalama.Extensions.Interceptors.IExistingMethodRegistration
  type: Interface
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    A registration whose calls are redirected to an existing method, created by <xref href="Metalama.Extensions.Interceptors.IMethodRegistrationFactory.RedirectToExistingMethod(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref>.

    It is a complete interception, which the delegate given to <code>InterceptMethods</code> can return. It is the counterpart of

    <xref href="Metalama.Extensions.Interceptors.IExistingMethodInterception" data-throw-if-not-resolved="false"></xref> for a result that applies to every call site.
  remarks: >-
    The registration is kept across compilations, so its arguments must be durable. The arguments are resolved in the compilation of each call

    site.
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface IExistingMethodRegistration : IMethodInterception
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface IExistingMethodRegistration Inherits IMethodInterception
