  nameWithType: TestLiveTemplateAttribute
  fullName: Metalama.Testing.AspectTesting.TestLiveTemplateAttribute
  type: Class
  assemblies:
  - Metalama.Testing.AspectTesting
  namespace: Metalama.Testing.AspectTesting
  summary: >-
    An attribute used in <xref href="Metalama.Testing.AspectTesting.TestScenario.LiveTemplate" data-throw-if-not-resolved="false"></xref> and <xref href="Metalama.Testing.AspectTesting.TestScenario.LiveTemplatePreview" data-throw-if-not-resolved="false"></xref> tests

    to mark the declaration to which an aspect should be applied as a live template.
  remarks: >-
    <p>
        In live template test scenarios, this attribute simulates the user selecting a declaration in the IDE's refactoring
        context menu and applying an aspect to it. The attribute specifies which aspect type should be applied.
        </p>
    <p>
        To use this attribute, set the <code>// @TestScenario(LiveTemplate)</code> or <code>// @TestScenario(LiveTemplatePreview)</code>
        comment in your test file, then apply this attribute to the target declaration.
        </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.All)]

      public class TestLiveTemplateAttribute : Attribute
    content.vb: >-
      <AttributeUsage(AttributeTargets.All)>

