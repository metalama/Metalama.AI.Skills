- uid: Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo
  commentId: M:Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo
  id: ToPropertyInfo
  parent: Metalama.Framework.Code.IPropertyOrIndexer
  langs:
  - csharp
  - vb
  name: ToPropertyInfo()
  nameWithType: IPropertyOrIndexer.ToPropertyInfo()
  fullName: Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> that represents the current property or indexer at run time.
  remarks: >-
    <p>
        This method generates run-time code that retrieves the <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> object for the current
        property or indexer. While Metalama is designed to eliminate the need for reflection in most scenarios,
        this method is useful when you need to pass property metadata to APIs that require <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> objects.
        </p>
    <p>
      <b>Warning:</b> The code generated by this method relies on property names and may break if your project
        is obfuscated. Consider using the <xref href="Metalama.Framework.Code.IExpression.Value" data-throw-if-not-resolved="false"></xref> property to access property values directly
        when possible, as this approach is obfuscation-safe.
        </p>
  example: []
  syntax:
    content: PropertyInfo ToPropertyInfo()
    return:
      type: System.Reflection.PropertyInfo
      description: A <xref href="System.Reflection.PropertyInfo" data-throw-if-not-resolved="false"></xref> that can be used only in run-time code.
    content.vb: Function ToPropertyInfo() As PropertyInfo
  overload: Metalama.Framework.Code.IPropertyOrIndexer.ToPropertyInfo*
