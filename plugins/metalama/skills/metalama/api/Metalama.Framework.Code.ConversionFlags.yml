- uid: Metalama.Framework.Code.ConversionFlags.TypeParameterEquivalence
  commentId: F:Metalama.Framework.Code.ConversionFlags.TypeParameterEquivalence
  id: TypeParameterEquivalence
  parent: Metalama.Framework.Code.ConversionFlags
  langs:
  - csharp
  - vb
  name: TypeParameterEquivalence
  nameWithType: ConversionFlags.TypeParameterEquivalence
  fullName: Metalama.Framework.Code.ConversionFlags.TypeParameterEquivalence
  type: Field
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    When set, method-level type parameters are considered equivalent if they occupy the same ordinal position,

    regardless of which declaring method they belong to. This is useful when comparing method signatures from

    different declaring types, where their type parameters are distinct objects but represent the same positional slot.
  example: []
  syntax:
    content: TypeParameterEquivalence = 1
    return:
      type: Metalama.Framework.Code.ConversionFlags
