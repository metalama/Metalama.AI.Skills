  nameWithType: IMetaExtension
  fullName: Metalama.Framework.Aspects.IMetaExtension
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Marks an object that a Metalama extension makes available to a template through <xref href="Metalama.Framework.Aspects.meta.GetExtension%60%601" data-throw-if-not-resolved="false"></xref> and

    <xref href="Metalama.Framework.Aspects.meta.TryGetExtension%60%601(%60%600%40)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        An extension, for instance the interceptors of Metalama Premium, adds information that the standard <code>meta</code> API does not provide. The
        information applies to the declaration that the template implements. A template that is called by another template sees the extensions of
        the calling template.
        </p>
    <p>
        An extension typically exposes its object through a C# 14 extension property of <xref href="Metalama.Framework.Aspects.meta" data-throw-if-not-resolved="false"></xref>, so that the template reads it as an
        ordinary member of <code>meta</code>.
        </p>
