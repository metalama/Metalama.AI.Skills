  fullName: Metalama.Framework.Code.Collections.IAttributeCollection
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Collections
  summary: A read-only collection of <xref href="Metalama.Framework.Code.IAttribute" data-throw-if-not-resolved="false"></xref> representing the custom attributes applied to a declaration.
  remarks: >-
    <p>
        This collection is exposed via the <xref href="Metalama.Framework.Code.IDeclaration.Attributes" data-throw-if-not-resolved="false"></xref> property and provides methods to query attributes
        by type using <xref href="Metalama.Framework.Code.Collections.IAttributeCollection.OfAttributeType(Metalama.Framework.Code.IType)" data-throw-if-not-resolved="false"></xref> or check for attribute presence using <xref href="Metalama.Framework.Code.Collections.IAttributeCollection.Any(Metalama.Framework.Code.IType)" data-throw-if-not-resolved="false"></xref>.
        </p>
    <p>
        The order of items in this collection is undetermined and may change between versions.
        </p>
    <p>
        To add attributes to existing declarations, use <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceAttribute(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IDeclaration%7d%2cMetalama.Framework.Code.IAttributeData%2cMetalama.Framework.Aspects.OverrideStrategy)" data-throw-if-not-resolved="false"></xref>.
        To add attributes to introduced declarations, use <xref href="Metalama.Framework.Code.DeclarationBuilders.IDeclarationBuilder.AddAttribute(Metalama.Framework.Code.DeclarationBuilders.AttributeConstruction)" data-throw-if-not-resolved="false"></xref>.
        To remove attributes, use <xref href="Metalama.Framework.Aspects.AdviserExtensions.RemoveAttributes(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.IDeclaration%7d%2cMetalama.Framework.Code.INamedType)?text=RemoveAttributes" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public interface IAttributeCollection : IReadOnlyCollection<IAttribute>, IEnumerable<IAttribute>, IEnumerable'
    content.vb: Public Interface IAttributeCollection Inherits IReadOnlyCollection(Of IAttribute), IEnumerable(Of IAttribute), IEnumerable
