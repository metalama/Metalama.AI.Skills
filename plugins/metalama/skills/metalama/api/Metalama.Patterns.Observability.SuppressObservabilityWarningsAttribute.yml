  type: Class
  assemblies:
  - Metalama.Patterns.Observability
  namespace: Metalama.Patterns.Observability
  summary: >-
    Suppresses warnings reported by the <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect when it encounters unsupported

    code constructs in the target member or type.
  remarks: >-
    <p>

    The <xref href="Metalama.Patterns.Observability.ObservableAttribute" data-throw-if-not-resolved="false"></xref> aspect reports <code>LAMA51**</code> warnings when it encounters code patterns

    that it cannot analyze, such as calls to non-constant methods. This attribute suppresses these warnings for

    the target declaration and its children.

    </p>

    <p>

    Alternatively, warnings can be suppressed using the standard <code>#pragma warning disable</code> directive.

    </p>

    <p>

    <b>Warning:</b> Suppressing warnings does not change the generated code. Dependencies that triggered the warnings

    will still not be tracked. Use this attribute only when you are certain that the untracked dependencies will not

    affect observable state.

    </p>
  example: []
  syntax:
    content: >-
      [AttributeUsage(AttributeTargets.Class|AttributeTargets.Struct|AttributeTargets.Method|AttributeTargets.Property|AttributeTargets.Field)]

      public sealed class SuppressObservabilityWarningsAttribute : Attribute, IHierarchicalOptionsProvider
