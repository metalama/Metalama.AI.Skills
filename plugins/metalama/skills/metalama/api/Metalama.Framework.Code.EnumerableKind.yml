  nameWithType: EnumerableKind
  fullName: Metalama.Framework.Code.EnumerableKind
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Specifies the kind of enumerable or enumerator type returned by a method.
  remarks: >-
    <p>To get the <xref href="Metalama.Framework.Code.EnumerableKind" data-throw-if-not-resolved="false"></xref> of a method, use the <xref href="Metalama.Framework.Code.MethodExtensions.GetIteratorInfo(Metalama.Framework.Code.IMethod)" data-throw-if-not-resolved="false"></xref> extension method,
        which returns an <xref href="Metalama.Framework.Code.IteratorInfo" data-throw-if-not-resolved="false"></xref> struct. The <xref href="Metalama.Framework.Code.IteratorInfo.EnumerableKind" data-throw-if-not-resolved="false"></xref> property contains the enumerable kind.</p>
    <p>This enum distinguishes between generic and non-generic (untyped) variants, as well as between synchronous and async variants.</p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      public enum EnumerableKind
    content.vb: >-
      <CompileTime>

      Public Enum EnumerableKind
