  summary: >-
    A mutable builder for creating <xref href="Metalama.Framework.Engine.Services.ServiceProvider%601" data-throw-if-not-resolved="false"></xref> instances. Allows registering service factories

    that will be applied when building the final immutable service provider.
  remarks: >-
    Use this builder to register services before building a <xref href="Metalama.Framework.Engine.Services.ServiceProvider%601" data-throw-if-not-resolved="false"></xref>.

    Services can be registered either eagerly (with an instance) or lazily (with a factory function).
