  fullName: Metalama.Framework.Code.IGenericContext.IsEmptyOrIdentity
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Gets a value indicating whether the current context contains any non-trivial mapping.

    This value is <code>true</code> if there is no type parameter in the context of the current declaration

    or if the context is unbound, i.e. in the context of a generic type definition.
