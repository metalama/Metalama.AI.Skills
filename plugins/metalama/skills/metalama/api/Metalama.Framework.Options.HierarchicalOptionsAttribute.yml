  name: HierarchicalOptionsAttribute
  nameWithType: HierarchicalOptionsAttribute
  fullName: Metalama.Framework.Options.HierarchicalOptionsAttribute
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Options
  summary: >-
    Custom attribute that, when applied to a class implementing the <xref href="Metalama.Framework.Options.IHierarchicalOptions" data-throw-if-not-resolved="false"></xref> interface,

    specifies how the options are inherited across different declaration levels.
  remarks: >-
    <p>
        By default, hierarchical options are inherited along all axes: from base types to derived types, from base members to overriding members,
        from enclosing types to nested types, and from declaring types to their members. This attribute allows aspect authors to disable
        inheritance along specific axes when the default behavior is not appropriate for their options.
        </p>
    <p>
        For example, an aspect might want options to be inherited from a type to its members, but not from a base type to derived types.
        This can be achieved by setting <xref href="Metalama.Framework.Options.HierarchicalOptionsAttribute.InheritedByDerivedTypes" data-throw-if-not-resolved="false"></xref> to <code>false</code> while leaving other properties as <code>true</code>.
        </p>
  example: []
  syntax:
    content: >-
      [RunTimeOrCompileTime]

      [AttributeUsage(AttributeTargets.Class)]

      public sealed class HierarchicalOptionsAttribute : Attribute
    content.vb: >-
      <RunTimeOrCompileTime>

      <AttributeUsage(AttributeTargets.Class)>

      Public NotInheritable Class HierarchicalOptionsAttribute Inherits Attribute
