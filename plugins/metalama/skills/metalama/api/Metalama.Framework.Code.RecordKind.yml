  fullName: Metalama.Framework.Code.RecordKind
  type: Enum
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Authoring forms of a record, given to

    <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceRecord(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamespaceOrNamedType%7d%2cSystem.String%2cMetalama.Framework.Code.RecordKind%2cMetalama.Framework.Aspects.OverrideStrategy%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IRecordBuilder%7d)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        This enumeration names what an author chooses when introducing a record. It is not reported by the code model:
        a record read from source is a class or a struct according to <xref href="Metalama.Framework.Code.IType.TypeKind" data-throw-if-not-resolved="false"></xref>, and
        <xref href="Metalama.Framework.Code.INamedType.IsRecord" data-throw-if-not-resolved="false"></xref> states that it is a record.
        </p>
