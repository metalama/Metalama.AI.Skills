  name: ITypeParameter
  nameWithType: ITypeParameter
  fullName: Metalama.Framework.Code.ITypeParameter
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Represents a generic type parameter of a method or type, such as <code>T</code> in <code>List&lt;T&gt;</code>.
  remarks: >-
    <p>
        Type parameters are placeholders for types that are specified when a generic type or method is instantiated.
        They can have constraints that restrict which types can be used as type arguments.
        </p>
    <p>
        In Metalama, type parameters are always bound. In a generic definition like <code>List&lt;T&gt;</code>,
        the type parameter <code>T</code> is bound to itself. In a constructed generic type like <code>List&lt;int&gt;</code>,
        the type parameter <code>T</code> is bound to <code>int</code>. Use the <xref href="Metalama.Framework.Code.ITypeParameter.ResolvedType" data-throw-if-not-resolved="false"></xref> property to
        get the type to which a type parameter is bound.
        </p>
    <p>
        Type parameters can have various constraints specified through properties like <xref href="Metalama.Framework.Code.ITypeParameter.TypeKindConstraint" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Code.ITypeParameter.TypeConstraints" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.ITypeParameter.HasDefaultConstructorConstraint" data-throw-if-not-resolved="false"></xref>, and <xref href="Metalama.Framework.Code.ITypeParameter.AllowsRefStruct" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: 'public interface ITypeParameter : INamedDeclaration, IDeclaration, IDiagnosticLocation, IMeasurable, IEquatable<IDeclaration>, IType, ICompilationElement, IDisplayable, IEquatable<IType>'
    content.vb: Public Interface ITypeParameter Inherits INamedDeclaration, IDeclaration, IDiagnosticLocation, IMeasurable, IEquatable(Of IDeclaration), IType, ICompilationElement, IDisplayable, IEquatable(Of IType)
