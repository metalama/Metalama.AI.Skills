- uid: Metalama.Framework.Code.ITypeParameter.ToRef
  commentId: M:Metalama.Framework.Code.ITypeParameter.ToRef
  id: ToRef
  parent: Metalama.Framework.Code.ITypeParameter
  langs:
  - csharp
  - vb
  name: ToRef()
  nameWithType: ITypeParameter.ToRef()
  fullName: Metalama.Framework.Code.ITypeParameter.ToRef()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Gets a reference that can be used to identify the current declaration across different compilation versions.
  remarks: >-
    <p>
        References are essential in Metalama because <xref href="Metalama.Framework.Code.IDeclaration" data-throw-if-not-resolved="false"></xref> objects are bound to a specific
        <xref href="Metalama.Framework.Code.ICompilation" data-throw-if-not-resolved="false"></xref>. As aspects execute, the compilation evolves through multiple immutable versions.
        References provide a stable way to track the same declaration across these versions.
        </p>
    <p>
      <b>Common use cases:</b>
    </p>

    <ul><li>Storing declaration references in aspect fields for use in later compilation versions.</li><li>Serializing references for cross-project scenarios (inheritable aspects, validators).</li><li>Passing references to child aspects via <xref href="Metalama.Framework.Aspects.IAspectState" data-throw-if-not-resolved="false"></xref>.</li></ul>

    <p>
        To resolve a reference back to the declaration, use <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d)" data-throw-if-not-resolved="false"></xref> or
        <xref href="Metalama.Framework.Code.RefExtensions.GetTarget%60%601(Metalama.Framework.Code.IRef%7b%60%600%7d%2cMetalama.Framework.Code.ICompilation%2cMetalama.Framework.Code.IGenericContext)" data-throw-if-not-resolved="false"></xref>.
        </p>
  example: []
  syntax:
    content: IRef<ITypeParameter> ToRef()
    return:
      type: Metalama.Framework.Code.IRef{Metalama.Framework.Code.ITypeParameter}
      description: A compile-time serializable reference to the current declaration.
    content.vb: Function ToRef() As IRef(Of ITypeParameter)
  overload: Metalama.Framework.Code.ITypeParameter.ToRef*
  seealso:
  - linkId: Metalama.Framework.Code.IRef`1
    commentId: T:Metalama.Framework.Code.IRef`1
  - linkId: Metalama.Framework.Code.RefExtensions
    commentId: T:Metalama.Framework.Code.RefExtensions
  - linkId: Metalama.Framework.Code.IDeclaration.ToSerializableId
    commentId: M:Metalama.Framework.Code.IDeclaration.ToSerializableId
  - linkType: HRef
    linkId: '@aspect-serialization'
    altText: '@aspect-serialization'
- uid: Metalama.Framework.Code.ITypeParameter.ToNonNullable
  commentId: M:Metalama.Framework.Code.ITypeParameter.ToNonNullable
  id: ToNonNullable
  parent: Metalama.Framework.Code.ITypeParameter
  langs:
  - csharp
  - vb
  name: ToNonNullable()
  nameWithType: ITypeParameter.ToNonNullable()
  fullName: Metalama.Framework.Code.ITypeParameter.ToNonNullable()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Returns the non-nullable type from the current <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref>. If the current type is a non-nullable reference type, returns the current type.

    If the current type is a <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref>, i.e. a nullable value type, returns the underlying type.
  remarks: >-
    <p>
        For type parameters without a <code>class</code> or <code>struct</code> constraint, this method always strips the nullable annotation
        because C# has no way to express non-nullability for such type parameters. To unconditionally strip nullability annotations for all types,
        use <xref href="Metalama.Framework.Code.IType.StripNullabilityAnnotation" data-throw-if-not-resolved="false"></xref> instead.
        </p>
    <p>
        For nullable value types, i.e. <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref>, this method returns the underlying type <code>T</code>.
        </p>
  example: []
  syntax:
    content: ITypeParameter ToNonNullable()
    return:
      type: Metalama.Framework.Code.ITypeParameter
    content.vb: Function ToNonNullable() As ITypeParameter
  overload: Metalama.Framework.Code.ITypeParameter.ToNonNullable*
  seealso:
  - linkId: Metalama.Framework.Code.IType.ToNullable
    commentId: M:Metalama.Framework.Code.IType.ToNullable
  - linkId: Metalama.Framework.Code.IType.StripNullabilityAnnotation
    commentId: M:Metalama.Framework.Code.IType.StripNullabilityAnnotation
- uid: Metalama.Framework.Code.ITypeParameter.StripNullabilityAnnotation
  commentId: M:Metalama.Framework.Code.ITypeParameter.StripNullabilityAnnotation
  id: StripNullabilityAnnotation
  parent: Metalama.Framework.Code.ITypeParameter
  langs:
  - csharp
  - vb
  name: StripNullabilityAnnotation()
  nameWithType: ITypeParameter.StripNullabilityAnnotation()
  fullName: Metalama.Framework.Code.ITypeParameter.StripNullabilityAnnotation()
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: Strips the nullability annotation from the current type, returning an unannotated version.
  remarks: >-
    <p>
        Unlike <xref href="Metalama.Framework.Code.IType.ToNonNullable" data-throw-if-not-resolved="false"></xref>, which marks reference types as non-nullable (returning a type with <xref href="Metalama.Framework.Code.IType.IsNullable" data-throw-if-not-resolved="false"></xref>
        set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>), this method returns an unannotated type (with <xref href="Metalama.Framework.Code.IType.IsNullable" data-throw-if-not-resolved="false"></xref> set to <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>).
        </p>
  example: []
  syntax:
    content: ITypeParameter StripNullabilityAnnotation()
    return:
      type: Metalama.Framework.Code.ITypeParameter
      description: >-
        A type whose <xref href="Metalama.Framework.Code.IType.IsNullable" data-throw-if-not-resolved="false"></xref> property is <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>, meaning the type has no nullability annotation.

        If the current type is a <xref href="System.Nullable%601" data-throw-if-not-resolved="false"></xref>, returns the underlying value type.
    content.vb: Function StripNullabilityAnnotation() As ITypeParameter
  overload: Metalama.Framework.Code.ITypeParameter.StripNullabilityAnnotation*
  seealso:
  - linkId: Metalama.Framework.Code.IType.ToNullable
    commentId: M:Metalama.Framework.Code.IType.ToNullable
  - linkId: Metalama.Framework.Code.IType.ToNonNullable
    commentId: M:Metalama.Framework.Code.IType.ToNonNullable
