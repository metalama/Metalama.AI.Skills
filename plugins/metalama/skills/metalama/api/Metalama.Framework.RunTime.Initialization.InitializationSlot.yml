- uid: Metalama.Framework.RunTime.Initialization.InitializationSlot
  commentId: T:Metalama.Framework.RunTime.Initialization.InitializationSlot
  id: InitializationSlot
  parent: Metalama.Framework.RunTime.Initialization
  children:
  - Metalama.Framework.RunTime.Initialization.InitializationSlot.Allocate
  - Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed
  - Metalama.Framework.RunTime.Initialization.InitializationSlot.op_BitwiseOr(Metalama.Framework.RunTime.Initialization.InitializationSlot,Metalama.Framework.RunTime.Initialization.InitializationSlot)
  langs:
  - csharp
  - vb
  name: InitializationSlot
  nameWithType: InitializationSlot
  fullName: Metalama.Framework.RunTime.Initialization.InitializationSlot
  type: Struct
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    A strongly-typed bitmask representing a single aspect behavior slot for cross-layer coordination.

    Each aspect type that needs coordination allocates one slot at class initialization time.
  remarks: >-
    <p>
        Slots are needed only by aspect types that address the telescoping constructor problem —
        i.e., aspects whose <xref href="Metalama.Framework.RunTime.Initialization.IInitializable.Initialize(Metalama.Framework.RunTime.Initialization.InitializationContext)" data-throw-if-not-resolved="false"></xref> behavior must be skipped when a derived type
        guarantees it will handle the same concern.
        </p>
    <p>
        A maximum of 32 slots can be allocated per <xref href="Metalama.Framework.RunTime.Initialization.InitializationSlotFactory" data-throw-if-not-resolved="false"></xref> (or per
        AppDomain when using the default factory via <xref href="Metalama.Framework.RunTime.Initialization.InitializationSlot.Allocate" data-throw-if-not-resolved="false"></xref>). In practice, very few
        aspect types need slots (likely fewer than half a dozen in a typical application).
        </p>
  example: []
  syntax:
    content: public readonly struct InitializationSlot
    content.vb: Public Structure InitializationSlot
  inheritedMembers:
