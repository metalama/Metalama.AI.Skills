- uid: Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed
  commentId: P:Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed
  id: OnConstructed
  parent: Metalama.Framework.RunTime.Initialization.InitializationSlot
  langs:
  - csharp
  - vb
  name: OnConstructed
  nameWithType: InitializationSlot.OnConstructed
  fullName: Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed
  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Slot used by the engine's <code>OnConstructed</code> mechanism to coordinate multi-level

    inheritance. Derived constructors descend their context with this slot before calling the

    base constructor; base constructors guard the <code>OnConstructed</code> call with

    <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)" data-throw-if-not-resolved="false"></xref> against this slot. Not intended for direct

    use by aspects.
  example: []
  syntax:
    content: public static InitializationSlot OnConstructed { get; }
    parameters: []
    return:
      type: Metalama.Framework.RunTime.Initialization.InitializationSlot
    content.vb: Public Shared ReadOnly Property OnConstructed As InitializationSlot
  overload: Metalama.Framework.RunTime.Initialization.InitializationSlot.OnConstructed*
