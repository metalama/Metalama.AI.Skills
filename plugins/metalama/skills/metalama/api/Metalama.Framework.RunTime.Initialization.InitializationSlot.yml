  type: Property
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.RunTime.Initialization
  summary: >-
    Slot used by the engine's <code>OnConstructed</code> mechanism to coordinate multi-level

    inheritance. Derived constructors descend their context with this slot before calling the

    base constructor; base constructors guard the <code>OnConstructed</code> call with

    <xref href="Metalama.Framework.RunTime.Initialization.InitializationContext.IsHandled(Metalama.Framework.RunTime.Initialization.InitializationSlot)" data-throw-if-not-resolved="false"></xref> against this slot. Not intended for direct

    use by aspects.
