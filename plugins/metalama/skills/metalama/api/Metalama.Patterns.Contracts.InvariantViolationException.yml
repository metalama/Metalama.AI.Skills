  summary: >-
    An exception that should be thrown by the target methods of the <xref href="Metalama.Patterns.Contracts.InvariantAttribute" data-throw-if-not-resolved="false"></xref> aspect

    when an invariant condition is violated.
  remarks: >-
    <p>Methods marked with <xref href="Metalama.Patterns.Contracts.InvariantAttribute" data-throw-if-not-resolved="false"></xref> are automatically called after public or internal methods

    complete. When an invariant method detects an inconsistent state, it should throw this exception to indicate

    the contract violation.</p>
  example: []
  syntax:
    content: 'public class InvariantViolationException : ApplicationException, ISerializable'
