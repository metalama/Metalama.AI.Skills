  summary: >-
    Provides diff tool functionality for the test framework.

    When no implementation is available (i.e., when the <code>Metalama.Extensions.DiffEngine</code> package is not referenced),

    diff tool features are silently disabled and tests continue to work normally.
  remarks: >-
    <p>
        To enable diff tool support, add a reference to the <code>Metalama.Extensions.DiffEngine</code> package.
        </p>
