  name: DurableTemplateInvocation
  nameWithType: DurableTemplateInvocation
  fullName: Metalama.Framework.Aspects.DurableTemplateInvocation
  type: Class
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Aspects
  summary: >-
    Represents an invocation of a template method that can be kept across compilations. It is the durable counterpart of

    <xref href="Metalama.Framework.Aspects.TemplateInvocation" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        Use this type where an API keeps a template invocation after the compilation in which it was created, for instance a
        registration that is evaluated again in each new compilation. Use <xref href="Metalama.Framework.Aspects.TemplateInvocation" data-throw-if-not-resolved="false"></xref> everywhere else.
        </p>
    <p>
        The values of <xref href="Metalama.Framework.Aspects.DurableTemplateInvocation.Arguments" data-throw-if-not-resolved="false"></xref> must be durable. A declaration or a type must be passed as a durable reference
        (see <xref href="Metalama.Framework.Code.RefExtensions.ToDurableRef%60%601(%60%600)" data-throw-if-not-resolved="false"></xref>), and an expression must be passed as a durable expression (see
        <xref href="Metalama.Framework.Code.ExpressionExtensions.ToDurable(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>). Literals, enumeration values and <xref href="System.Type" data-throw-if-not-resolved="false"></xref> values are
        durable. A durable reference or a durable expression is resolved in the compilation in which the template is expanded,
        so that the template receives the declaration, the type or the <xref href="Metalama.Framework.Code.IExpression" data-throw-if-not-resolved="false"></xref> of that compilation.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [Durable]

      public sealed class DurableTemplateInvocation
    content.vb: >-
      <CompileTime>

      <Durable>

      Public NotInheritable Class DurableTemplateInvocation
