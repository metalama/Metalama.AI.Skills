    parameters:
    - id: roots
      type: System.Collections.Generic.IEnumerable{{T}}
      description: The initial collection of root items.
    - id: getChildren
      type: System.Func{{T},System.Collections.Generic.IEnumerable{{T}}}
      description: A function that returns the set of all child nodes connected to a given node.
    - id: includeRoot
      type: System.Boolean
      description: A value indicating whether the root items themselves should be included in the result set.
    typeParameters:
    - id: T
      description: The type of items in the graph.
    return:
      type: System.Collections.Generic.List{{T}}
      description: A list containing the closure of the graph starting from <code class="paramref">roots</code>.
