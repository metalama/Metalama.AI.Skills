  nameWithType: ITypeFacetCollection
  fullName: Metalama.Framework.Code.Collections.ITypeFacetCollection
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.Collections
  summary: Read-only collection of the facets of a named type, reached through <xref href="Metalama.Framework.Code.INamedType.Facets" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>
        The collection contains exactly the typed properties of this interface that are not <code>null</code>, and
        <xref href="System.Collections.Generic.IReadOnlyCollection%601.Count" data-throw-if-not-resolved="false"></xref> is their number. Reading a facet through its typed property is
        therefore equivalent to searching the collection for that kind, and it is the intended way to reach a facet.
        </p>
    <p>
        The collection is empty for a type that has no facet, which is the case of most named types. That case allocates
        nothing, because every such type returns one shared instance.
        </p>
  example: []
  syntax:
    content: >-
      [CompileTime]

      [InternalImplement]

      public interface ITypeFacetCollection : IReadOnlyCollection<ITypeFacet>, IEnumerable<ITypeFacet>, IEnumerable
    content.vb: >-
      <CompileTime>

      <InternalImplement>

      Public Interface ITypeFacetCollection Inherits IReadOnlyCollection(Of ITypeFacet), IEnumerable(Of ITypeFacet), IEnumerable
