- uid: Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor
  commentId: T:Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor
  id: SafeSyntaxVisitor
  parent: Metalama.Framework.Engine.Utilities.Roslyn
  children:
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor.#ctor
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor.Visit(Microsoft.CodeAnalysis.SyntaxNode)
  - Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor.VisitCore(Microsoft.CodeAnalysis.SyntaxNode)
  langs:
  - csharp
  - vb
  name: SafeSyntaxVisitor
  nameWithType: SafeSyntaxVisitor
  fullName: Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor
  type: Class
  assemblies:
  - Metalama.Framework.Sdk
  namespace: Metalama.Framework.Engine.Utilities.Roslyn
  summary: >-
    A derivation of <xref href="Microsoft.CodeAnalysis.CSharp.CSharpSyntaxVisitor" data-throw-if-not-resolved="false"></xref> that provides enhanced exception handling

    when visiting syntax nodes without returning a result.
  remarks: >-
    <p>
        This class wraps exceptions thrown during node visitation with <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SyntaxProcessingException" data-throw-if-not-resolved="false"></xref>,
        which includes detailed information about the syntax node being processed when the exception occurred.
        This makes debugging weaver issues significantly easier.
        </p>
    <p>
        Use this class instead of directly inheriting from <xref href="Microsoft.CodeAnalysis.CSharp.CSharpSyntaxVisitor" data-throw-if-not-resolved="false"></xref> in your aspect weaver implementations.
        Override <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor.VisitCore(Microsoft.CodeAnalysis.SyntaxNode)" data-throw-if-not-resolved="false"></xref> instead of <xref href="Metalama.Framework.Engine.Utilities.Roslyn.SafeSyntaxVisitor.Visit(Microsoft.CodeAnalysis.SyntaxNode)" data-throw-if-not-resolved="false"></xref> to add custom visiting logic.
        </p>
  example: []
  syntax:
    content: 'public abstract class SafeSyntaxVisitor : CSharpSyntaxVisitor'
    content.vb: Public MustInherit Class SafeSyntaxVisitor Inherits CSharpSyntaxVisitor
