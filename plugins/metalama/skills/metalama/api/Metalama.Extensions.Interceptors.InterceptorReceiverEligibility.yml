  name: InterceptorReceiverEligibility
  nameWithType: InterceptorReceiverEligibility
  fullName: Metalama.Extensions.Interceptors.InterceptorReceiverEligibility
  type: Struct
  assemblies:
  - Metalama.Extensions.Interceptors
  namespace: Metalama.Extensions.Interceptors
  summary: >-
    Describes whether the receiver of a call can or must be mapped to the <code>this</code> of the generated interceptor method, that is, whether

    <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverMapping" data-throw-if-not-resolved="false"></xref> can or must be <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverMapping.This" data-throw-if-not-resolved="false"></xref>. The

    <xref href="Metalama.Extensions.Interceptors.IInterceptorMethodBuilder.ReceiverEligibility" data-throw-if-not-resolved="false"></xref> property gives it.
  remarks: >-
    <p>

    The properties are nested: <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisRequired" data-throw-if-not-resolved="false"></xref> implies <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligibleForAllSites" data-throw-if-not-resolved="false"></xref>, which implies

    <xref href="Metalama.Extensions.Interceptors.InterceptorReceiverEligibility.IsThisEligible" data-throw-if-not-resolved="false"></xref>. The default value of the structure has all the properties <code>false</code>: the receiver cannot be mapped to

    <code>this</code>.

    </p>

    <p>

    The sites of a group are the call sites that are intercepted with the same template, in the same placement type, for the same intercepted

    method. The constructions of a generic type and of a generic method are the same type and the same method. A call site that cannot be

    intercepted is not part of a group.

    </p>
