- uid: Flashtrace.Records.LoggingPropertyOptions.#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,Flashtrace.Formatters.IFormatter)
  commentId: M:Flashtrace.Records.LoggingPropertyOptions.#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,Flashtrace.Formatters.IFormatter)
  id: '#ctor(System.Boolean,System.Boolean,System.Boolean,System.Boolean,Flashtrace.Formatters.IFormatter)'
  parent: Flashtrace.Records.LoggingPropertyOptions
