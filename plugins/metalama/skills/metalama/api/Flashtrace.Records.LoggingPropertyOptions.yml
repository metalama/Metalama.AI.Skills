  name: LoggingPropertyOptions(bool, bool, bool, bool, IFormatter?)
  nameWithType: LoggingPropertyOptions.LoggingPropertyOptions(bool, bool, bool, bool, IFormatter?)
  fullName: Flashtrace.Records.LoggingPropertyOptions.LoggingPropertyOptions(bool, bool, bool, bool, Flashtrace.Formatters.IFormatter?)
  type: Constructor
  assemblies:
  - Flashtrace
  namespace: Flashtrace.Records
  summary: >-
    Initializes a new instance of the <xref href="Flashtrace.Records.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref> struct.

    Initializes a new <xref href="Flashtrace.Records.LoggingPropertyOptions" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public LoggingPropertyOptions(bool isRendered = false, bool isInherited = false, bool isBaggage = false, bool isIgnored = false, IFormatter? formatter = null)
    parameters:
    - id: isRendered
      type: System.Boolean
      description: >-
        Determines whether the property will be included in the log message. The default value is <code>false</code>, then
                    the property is only available as an additional property, if this is supported by the backend.
    - id: isInherited
      type: System.Boolean
      description: >-
        Determines whether the property is inherited from the parent activity to children activities and messages. The default value is <code>true</code>.
                    When this property is set to <code>false</code>, <xref href="Flashtrace.Records.LoggingPropertyOptions.IsBaggage" data-throw-if-not-resolved="false"></xref> is automatically set to <code>false</code>.
    - id: isBaggage
      type: System.Boolean
      description: " Determines whether the property is cross-process. The default value is <code>false</code>. When this property is set to <code>true</code>, <xref href=\"Flashtrace.Records.LoggingPropertyOptions.IsInherited\" data-throw-if-not-resolved=\"false\"></xref> is automatically\r\nset to <code>true</code>."
    - id: isIgnored
      type: System.Boolean
      description: >-
        Determines whether this property must be ignored by the <xref href="Flashtrace.Records.LogEventMetadata.VisitProperties%60%601(System.Object%2cFlashtrace.Records.ILoggingPropertyVisitor%7b%60%600%7d%2c%60%600%40%2cFlashtrace.Records.LoggingPropertyVisitorOptions%40)" data-throw-if-not-resolved="false"></xref>
                    method.
    - id: formatter
      type: Flashtrace.Formatters.IFormatter
      description: The formatter to be used to render the property value.
    content.vb: Public Sub New(isRendered As Boolean = False, isInherited As Boolean = False, isBaggage As Boolean = False, isIgnored As Boolean = False, formatter As IFormatter = Nothing)
