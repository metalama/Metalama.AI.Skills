- uid: Metalama.Framework.Code.ConstructorExtensions.IsSourceCompatibilityConstructor(Metalama.Framework.Code.IConstructor)
  commentId: M:Metalama.Framework.Code.ConstructorExtensions.IsSourceCompatibilityConstructor(Metalama.Framework.Code.IConstructor)
  id: IsSourceCompatibilityConstructor(Metalama.Framework.Code.IConstructor)
  isExtensionMethod: true
  parent: Metalama.Framework.Code.ConstructorExtensions
  langs:
  - csharp
  - vb
  name: IsSourceCompatibilityConstructor(IConstructor)
  nameWithType: ConstructorExtensions.IsSourceCompatibilityConstructor(IConstructor)
  fullName: Metalama.Framework.Code.ConstructorExtensions.IsSourceCompatibilityConstructor(Metalama.Framework.Code.IConstructor)
  type: Method
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code
  summary: >-
    Returns <code>true</code> if the given constructor is a forwarding constructor emitted by the framework,

    i.e. a compile-time stub that preserves the pre-mutation signature of a source constructor and chains, via

    <code>: this(...)</code>, to the mutated constructor. Such constructors are marked with

    <xref href="Metalama.Framework.RunTime.SourceCompatibilityConstructorAttribute" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Aspect authors implementing a custom <xref href="Metalama.Framework.Advising.IPullStrategy" data-throw-if-not-resolved="false"></xref> use this method from

    <xref href="Metalama.Framework.Advising.IPullStrategy.GetPullAction(Metalama.Framework.Code.IParameter%2cMetalama.Framework.Code.IHasParameters)" data-throw-if-not-resolved="false"></xref> to detect whether the target is a forwarding constructor

    (as opposed to a regular chained constructor), so they can return a <xref href="Metalama.Framework.Advising.PullAction.UseExpression(Metalama.Framework.Code.IExpression)" data-throw-if-not-resolved="false"></xref>,

    <xref href="Metalama.Framework.Advising.PullAction.UseConstant(Metalama.Framework.Code.TypedConstant)" data-throw-if-not-resolved="false"></xref>, or <xref href="Metalama.Framework.Advising.PullAction.UseExistingParameter(Metalama.Framework.Code.IParameter)" data-throw-if-not-resolved="false"></xref> instead of the normal

    <xref href="Metalama.Framework.Advising.PullAction.IntroduceParameterAndPull(System.String%2cMetalama.Framework.Code.IType%2cMetalama.Framework.Code.IExpression%2cSystem.Collections.Immutable.ImmutableArray%7bMetalama.Framework.Code.DeclarationBuilders.AttributeConstruction%7d%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> cascade.
  example: []
  syntax:
    content: public static bool IsSourceCompatibilityConstructor(this IConstructor constructor)
    parameters:
    - id: constructor
      type: Metalama.Framework.Code.IConstructor
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsSourceCompatibilityConstructor(constructor As IConstructor) As Boolean
  overload: Metalama.Framework.Code.ConstructorExtensions.IsSourceCompatibilityConstructor*
