  name: IDelegateBuilder
  nameWithType: IDelegateBuilder
  fullName: Metalama.Framework.Code.DeclarationBuilders.IDelegateBuilder
  type: Interface
  assemblies:
  - Metalama.Framework
  namespace: Metalama.Framework.Code.DeclarationBuilders
  summary: Allows to complete the construction of a delegate that has been created by the <xref href="Metalama.Framework.Aspects.AdviserExtensions.IntroduceDelegate(Metalama.Framework.Aspects.IAdviser%7bMetalama.Framework.Code.INamespaceOrNamedType%7d%2cSystem.String%2cSystem.Action%7bMetalama.Framework.Code.DeclarationBuilders.IDelegateBuilder%7d%2cMetalama.Framework.Aspects.OverrideStrategy)" data-throw-if-not-resolved="false"></xref> advice.
  remarks: >-
    <p>
        This interface derives from <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder" data-throw-if-not-resolved="false"></xref> and declares the members of a signature
        itself. A delegate declaration is a method signature preceded by the <code>delegate</code> keyword, so the
        return type, the return parameter and the parameters describe the <code>Invoke</code> method that the compiler
        synthesizes, while the name, the accessibility, the custom attributes and the type parameters describe the
        delegate type.
        </p>
    <p>
        The following inherited properties are not valid for a delegate, and their setter throws a
        <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref>: <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsStatic" data-throw-if-not-resolved="false"></xref>,
        <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsSealed" data-throw-if-not-resolved="false"></xref>, <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsAbstract" data-throw-if-not-resolved="false"></xref> and
        <xref href="Metalama.Framework.Code.DeclarationBuilders.IMemberOrNamedTypeBuilder.IsPartial" data-throw-if-not-resolved="false"></xref>. A delegate is implicitly sealed, and it is never static,
        abstract or partial.
        </p>
    <p>
        A delegate builder is not an <xref href="Metalama.Framework.Code.INamedType" data-throw-if-not-resolved="false"></xref>, so it may not be used where an <xref href="Metalama.Framework.Code.IType" data-throw-if-not-resolved="false"></xref> is
        expected. The introduced delegate is read from
        <xref href="Metalama.Framework.Advising.IIntroductionAdviceResult%601.Declaration" data-throw-if-not-resolved="false"></xref>, which is how an aspect gives
        it as the type of a field, of a property or of an event.
        </p>
    <p>
        The <code>BeginInvoke</code> and <code>EndInvoke</code> methods are neither exposed nor built. They exist only for a
        delegate compiled for .NET Framework, and they are the asynchronous pattern that preceded <code>async</code>.
        </p>
  example: []
  syntax:
    content: >-
      [InternalImplement]

      public interface IDelegateBuilder : IMemberOrNamedTypeBuilder, IMemberOrNamedType, INamedDeclaration, IDeclarationBuilder, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable<IDeclaration>
    content.vb: >-
      <InternalImplement>

      Public Interface IDelegateBuilder Inherits IMemberOrNamedTypeBuilder, IMemberOrNamedType, INamedDeclaration, IDeclarationBuilder, IDeclaration, IDisplayable, IDiagnosticLocation, ICompilationElement, IMeasurable, IEquatable(Of IDeclaration)
