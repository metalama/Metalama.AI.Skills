  summary: Appends a type parameter to the delegate.
  remarks: >-
    <p>
        A delegate is, with an interface, one of the two kinds of type whose type parameters may declare variance,
        so <xref href="Metalama.Framework.Code.DeclarationBuilders.ITypeParameterBuilder.Variance" data-throw-if-not-resolved="false"></xref> is meaningful on the value this method returns.
        </p>
