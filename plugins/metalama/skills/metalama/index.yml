- name: Getting started
  path: content/conceptual/getting-started/getting-started.md
  summary: Learn how to install Metalama, create your first aspect, apply it to code, add aspects in bulk with fabrics, and validate architecture.
  keywords: Metalama, getting started, tutorial, first aspect, logging
- name: Conceptual documentation
  items:
  - name: Conceptual documentation
    path: content/conceptual/conceptual.md
    summary: Conceptual documentation covering requirements, installation, usage, aspect creation, validation, configuration, migration, and removal.
    keywords: Metalama documentation, aspects, validation, configuration, migration, installation, patterns, SDK
    items:
    - name: Release notes
      path: content/conceptual/release-notes/release-notes.md
      summary: This document provides a high-level changelog for all Metalama releases, highlighting key features and enhancements, and the status of each version.
      keywords: Metalama release notes
      items:
      - name: Requirements
        path: content/conceptual/requirements.md
        summary: Requirements for using Metalama, including build environment, supported IDEs, target frameworks, and version synchronization guidelines.
        keywords: Metalama, .NET SDK, Roslyn-based IDEs, Visual Studio, version synchronization, build environment, compatibility issues, C# features, SDK-style projects, target frameworks
      - name: Metalama 2027.0
        path: content/conceptual/release-notes/release-notes-2027.0.md
        summary: Metalama 2027.0 adds C# 15 and .NET 11 support, call-site interceptors, the introduction of structs, records, enums, delegates and unions, type facets in the code model, and analyzers that verify immutable and durable aspect code.
        keywords: Metalama 2027.0, release notes, C# 15, .NET 11, unions, closed classes, extension indexers, interceptors, type introduction, type facets, immutable aspects
      - name: Metalama 2026.1
        path: content/conceptual/release-notes/release-notes-2026.1.md
        summary: Metalama 2026.1 completes C# 14 support, extends initialization advice, brings major Redis caching improvements, reduces third-party dependencies, and closes most of the bug backlog.
        keywords: Metalama 2026.1, release notes, C# 14, extension blocks, operator introduction, initialization, dependency injection, Redis caching, System.Text.Json
      - name: Metalama 2026.0
        path: content/conceptual/release-notes/release-notes-2026.0.md
        summary: Metalama 2026.0 provides full C# 14 and .NET 10 SDK support, introduces first-class tuple types, and enables event handler invocation overriding.
        keywords: Metalama 2026.0, release notes
      - name: Metalama 2025.1
        path: content/conceptual/release-notes/release-notes-2025.1.md
        summary: Metalama 2025.1 is the first open-source release with breaking changes in packages and namespaces for proprietary components.
        keywords: Metalama 2025.1, release notes
      - name: Metalama 2025.0
        path: content/conceptual/release-notes/release-notes-2025.0.md
        summary: Metalama 2025.0 introduces support for .NET 9 and C# 13, improved work with introduced types, T# enhancements, and async WPF commands.
        keywords: Metalama 2025.0, release notes
      - name: Metalama 2024.2
        path: content/conceptual/release-notes/release-notes-2024.2.md
        summary: Metalama 2024.2 introduces type introduction, finalizes Metalama.Patterns.Observability and Metalama.Patterns.Wpf packages, and includes dozens of improvements to the framework.
        keywords: Metalama 2024.2, release notes
      - name: Metalama 2024.1
        path: content/conceptual/release-notes/release-notes-2024.1.md
        summary: Metalama 2024.1 improves the user interface, especially through a Visual Studio extension that has been unified with PostSharp. The version also improves performance and the advising of constructors.
        keywords: Metalama 2024.1, release notes
      - name: Metalama 2024.0
        path: content/conceptual/release-notes/release-notes-2024.0.md
        summary: Metalama 2024.0 adds support for C# 12, offers multi C# version support, and introduces deterministic build for all Metalama assemblies. Other improvements include published symbol packages, warnings and errors deduplication, and updated licensing.
        keywords: Metalama 2024.0, release notes
      - name: Metalama 2023.4
        path: content/conceptual/release-notes/release-notes-2023.4.md
        summary: Metalama 2023.4 introduces a new configuration framework, the first stable release of Metalama Contracts, and the stabilization of Metalama Caching. It also includes updates for Visual Studio 17.8 readiness and various enhancements and bug fixes.
        keywords: Metalama 2023.4, release notes
      - name: Metalama 2023.3
        path: content/conceptual/release-notes/release-notes-2023.3.md
        summary: Metalama 2023.3 release introduces new features including ready-made aspect implementations for caching and contracts, auxiliary templates, and a revamped Metalama.Framework.Sdk. It also includes platform updates, enhancements, minor breaking changes, and bug fixes.
        keywords: Metalama 2023.3, release notes
      - name: Metalama 2023.2
        path: content/conceptual/release-notes/release-notes-2023.2.md
        summary: The Metalama 2023.2 update includes bug fixes, minor enhancements, platform updates for compatibility with xUnit 2.5.0, and new APIs to filter collections by unbound generic types.
        keywords: Metalama 2023.2, release notes
      - name: Metalama 2023.1
        path: content/conceptual/release-notes/release-notes-2023.1.md
        summary: The Metalama 2023.1 update focuses on bug fixes and minor enhancements, including improved support for Visual Studio 17.6, Roslyn 4.6, and .NET SDK 7.0.300, and better error reporting.
        keywords: Metalama 2023.1, release notes
      - name: Metalama 2023.0
        path: content/conceptual/release-notes/release-notes-2023.0.md
        summary: Metalama 2023.0 is the initial release.
        keywords: Metalama 2023.0, release notes
    - name: Installing Metalama
      path: content/conceptual/installing/installing.md
      summary: This document provides instructions on how to install Metalama, including the Visual Studio Tools for Metalama, the Metalama Command Line Tool, and the process of registering a license key.
      keywords: installation, Visual Studio extension, NuGet packages, command line tool, license registration
      items:
      - name: Installing the Visual Studio tooling
        path: content/conceptual/installing/install-vsx.md
        summary: This document provides step-by-step instructions on how to install the Metalama Tools extension for Visual Studio 2022, and introduces the Metalama Command-Line Tool.
        keywords: Visual Studio extension, CodeLens, Aspect Explorer, syntax highlighting, diffing, installation
      - name: Installing Metalama command line tool
        path: content/conceptual/installing/dotnet-tool.md
        summary: This document provides instructions on how to install the Metalama Command Line Tool, which offers several features for managing the Metalama software.
        keywords: command line tool, dotnet tool, configuration, license, processes, temporary files
      - name: Registering a license
        path: content/conceptual/installing/register-license.md
        summary: Metalama automatically activates a 45-day trial upon first use. Users can switch to Metalama Free or register a license key to continue usage beyond the trial period.
        keywords: license registration, evaluation mode, license key, Metalama Free, Metalama Community, command line tool
    - name: Using Metalama
      path: content/conceptual/using/using.md
      summary: The document is a guide on using Metalama, particularly for individuals who want to use aspects without creating new ones. It includes articles on obtaining, applying, and debugging aspects.
      keywords: Metalama, obtaining aspects, applying aspects, debugging aspects, Code Lens, Code Diff, live templates
      items:
      - name: Configuring your IDE
        path: content/conceptual/using/ide/ide.md
        summary: Learn how to configure Visual Studio, VS Code, and Rider for optimal use with Metalama.
        keywords: Metalama IDE, Visual Studio configuration, VS Code Metalama, Rider Metalama, IDE setup, Roslyn analyzers
        items:
        - name: Visual Studio
          path: content/conceptual/using/ide/visual-studio.md
          summary: Configure Visual Studio for optimal use with Metalama, including the Metalama Tools extension.
          keywords: Metalama Visual Studio, Visual Studio extension, Metalama Tools, CodeLens, diff preview, live templates
        - name: VS Code
          path: content/conceptual/using/ide/vs-code.md
          summary: Configure VS Code for use with Metalama, including enabling Roslyn analyzers and code fixes.
          keywords: Metalama VS Code, VS Code analyzers, Roslyn analyzers, code fixes VS Code, C# Dev Kit
        - name: Rider
          path: content/conceptual/using/ide/rider.md
          summary: Configure JetBrains Rider for use with Metalama, including aspect testing and diagnostics.
          keywords: Metalama Rider, Rider configuration, aspect testing Rider, xUnit Rider, test discovery Rider
        - name: AI agents
          path: content/conceptual/using/ide/ai-agents.md
          summary: Install the Metalama plugin for AI coding agents such as Claude Code and OpenAI Codex to get AI-assisted aspect development.
          keywords: Claude Code, OpenAI Codex, Metalama AI, AI coding agent, Claude plugin, Codex plugin, aspect development
      - name: Getting aspects
        path: content/conceptual/using/getting-aspects.md
        summary: The document provides information about using pre-built aspects in projects, including demo aspects and those from the Metalama community, without altering source code.
        keywords: pre-built aspects, source code, NuGet package, Metalama.Documentation.QuickStart, Metalama Marketplace, open-source aspects
      - name: Adding aspects to code
        path: content/conceptual/using/adding-aspects.md
        summary: This document provides a guide on how to add aspects to source code using custom attributes. It covers the process of adding aspects as custom attributes, adding multiple attributes, and using the refactoring menu.
        keywords: Metalama, getting started
      - name: Understanding your code with aspects
        path: content/conceptual/using/understanding-your-code-with-aspects.md
        summary: This document explains how to understand aspect-oriented code using Metalama's tools like CodeLens, Diff Preview, and Debug Transformed Code. It also discusses explicit and implicit aspect applications.
        keywords: aspect-oriented code, Metalama tools, CodeLens, Metalama Diff, Debug Transformed Code, understand code functionality, aspect explorer
      - name: Debugging aspect oriented code
        path: content/conceptual/using/debugging-aspect-oriented-code.md
        summary: The document provides a step-by-step guide on how to debug aspect-oriented code using the Visual Studio debugger, including setting up a debug configuration, using breakpoints and step-into, and forcefully breaking the program.
        keywords: debug aspect-oriented code, debugger, breakpoints, step-into, transformed code, debug configuration, LamaDebug, Debugger.Break, aspect-transformed code
      - name: Applying live templates
        path: content/conceptual/using/live-templates.md
        summary: Live templates modify source code within an editor and can be accessed from the refactoring menu. They are a one-time operation and can be added to a project or package reference.
        keywords: live templates, refactoring menu
      - name: Adding many aspects at once
        path: content/conceptual/using/adding-aspects-with-fabrics.md
        summary: The document provides a guide on how to use fabrics in the Metalama Framework to programmatically add aspects to targets, with examples and recommendations on when to use fabrics versus custom attributes.
        keywords: fabrics, Metalama Framework, add aspects, logging, profiling, ProjectFabric, AmendProject method, AddAspectIfEligible
      - name: More about fabrics
        path: content/conceptual/using/fabrics.md
        summary: The document discusses fabrics in Metalama, which are unique classes that execute at compile time. They can add aspects, configure libraries, and implement architecture rules.
        keywords: fabrics, Metalama, configure libraries, architecture rules, ProjectFabric, Namespace Fabric, Type Fabric, Transitive Project Fabrics
      - name: Configuring aspect libraries
        path: content/conceptual/using/configuring.md
        summary: The document provides a guide on how to configure aspects with fabrics in Metalama, detailing the process steps, example configurations, and information about inheritance of configuration options.
        keywords: configuration, Metalama, IHierarchicalOptions, SetOptions, compile-time configuration
      - name: Amending many projects at once
        path: content/conceptual/using/amending-many-projects.md
        summary: The document provides instructions on how to add aspects to multiple projects in a repository using transitive project fabrics and common project fabrics, including their execution order.
        keywords: transitive project fabrics, common project fabrics, execution order, repository, multiple projects, central location, aspect libraries, architectural rules, dependency graph, Directory.Build.props
    - name: Pattern Libraries
      items:
      - name: Pattern Libraries
        path: content/patterns/patterns.md
        summary: Metalama Patterns are libraries of design patterns for C#, developed by the Metalama team, and are available on GitHub under the MIT license.
        keywords: design patterns, C#, Metalama Patterns
        items:
        - name: Dependency injection
          path: content/patterns/dependency-injection/dependency-injection.md
          summary: Learn how to use the [Dependency] aspect to reduce boilerplate code in dependency injection scenarios with Microsoft.Extensions.DependencyInjection.
          keywords: dependency injection, .NET, Microsoft.Extensions.DependencyInjection, Metalama.Extensions.DependencyInjection, DependencyAttribute, dependency, inject, import
        - name: Contracts
          path: content/patterns/contracts/contracts.md
          summary: 'Metalama Contracts facilitate contract-based programming, enhancing software reliability and clarity. They enforce preconditions, postconditions, and type invariants, aiding in error detection and promoting modular design. They are more readable, inheritable, and customizable than hand-written precondition checks. '
          keywords: contract-based programming, preconditions, postconditions, type invariants, error detection,  Metalama Contracts
          items:
          - name: Validating field, property and parameter values
            path: content/patterns/contracts/adding-contracts.md
            summary: The document provides a detailed guide on how to validate input and output values of fields, properties, or parameters using Metalama.Patterns.Contracts package in coding. It covers contract inheritance, primary constructor parameters, return values, out parameters, ref parameters, and fields and properties.
            keywords: validate input values, Metalama.Patterns.Contracts, contract inheritance, validate return values, validate out parameters, validate ref parameters, validate output values, validate fields, validate properties, primary constructor parameters
            items:
            - name: Contract types
              path: content/patterns/contracts/contract-types.md
              summary: The document describes various contract attributes in the Metalama Patterns library, including nullability, string, enum, numeric, and collections contracts, each with specific verification rules.
              keywords: Metalama contracts, types, custom attributes
            - name: Checking all non-nullable references
              path: content/patterns/contracts/enforcing-non-nullability.md
              summary: The document instructs on using Metalama's VerifyNotNullableDeclarations method to automatically check and enforce non-nullability in C# 8.0, simplifying the process of ensuring clean code.
              keywords: non-nullability, C# 8.0, null-checks, Metalama, VerifyNotNullableDeclarations
          - name: Enforcing type invariants
            path: content/patterns/contracts/invariants.md
            summary: The document explains how to check type invariants in Metalama, including adding invariants, opting out from invariant checking, and suspending enforcement of invariants, with examples provided.
            keywords: invariant checking, Metalama, type invariants, InvariantViolationException, DoNotCheckInvariants, performance optimization, suspend invariant enforcement, ContractOptions, SuspendInvariants
          - name: Configuring contracts
            path: content/patterns/contracts/configuring-contracts.md
            summary: The document provides guidance on configuring contracts in Metalama, covering both compile-time and run-time settings. It explains how to change validation logic, enable/disable contracts, customize inheritance or contract direction, and customize exception types or messages.
            keywords: contracts configuration, contract options, enable/disable contracts, Metalama, ContractHelpers class, ContractOptions class, exception customization, .NET
        - name: Immutability
          path: content/patterns/immutability/immutability.md
          summary: Learn how to use Metalama.Patterns.Immutability to mark types as immutable and enforce immutability constraints in your C# code.
          keywords: immutability, immutable type, C#, Metalama.Patterns.Immutability, ImmutableAttribute, ConfigureImmutability, shallow immutability, deep immutability, Metalama
        - name: Observability (INotifyPropertyChanged)
          path: content/patterns/observability/observability.md
          summary: Implement the Observable pattern and INotifyPropertyChanged interface automatically using the Metalama.Patterns.Observability package.
          keywords: Observable pattern, INotifyPropertyChanged, MVVM, INotifyPropertyChanged interface, Metalama.Patterns.Observability, ObservableAttribute, ConfigureObservability, ConstantAttribute, ObservabilityExtensions
          items:
          - name: Supported scenarios
            path: content/patterns/observability/standard-cases.md
            summary: Learn the code generation patterns for automatic properties, explicitly-implemented properties, field-backed properties, derived types, and child objects.
            keywords: Metalama.Patterns.Observability, automatic properties, explicitly-implemented properties, field-backed properties, class inheritance, OnPropertyChanged method, ObservableAttribute, INotifyPropertyChanged, child objects, MVVM architectures
        - name: Caching
          path: content/patterns/caching/caching.md
          summary: 'Metalama Caching is an efficient way to enhance application performance, reducing boilerplate, bugs, and coupling. It supports various caching topologies and automates complex cache processes. '
          keywords: caching, cache key generation, cache invalidation, performance enhancement, Metalama Caching, .NET, reduced boilerplate, flexible caching topologies
          items:
          - name: Getting started
            path: content/patterns/caching/getting-started.md
            summary: The document provides a guide on how to use Metalama Caching to enhance application performance, with instructions for projects with and without dependency injection. It also discusses the importance of customizing the caching key.
            keywords: caching, Metalama Caching, application performance, CacheAttribute, ICachingService, CachingService, .NET Core, caching key, CachingService.Default
          - name: Customizing cache keys
            path: content/patterns/caching/caching-keys.md
            summary: The document provides comprehensive guidelines on customizing cache keys in Metalama Caching, including using the CacheKey aspect, overriding ToString method, implementing IFormattable<T> interface, creating a formatter for third-party types, changing the maximal length of a cache key, and overriding the cache key builder.
            keywords: customize cache keys, Metalama Caching, CacheKey aspect, overriding ToString, IFormattable<T> interface, cache key builder, caching methods, CacheKeyAttribute, formatter for third-party types
          - name: Excluding parameters
            path: content/patterns/caching/exclude-parameters.md
            summary: The document provides instructions on how to exclude certain parameters from the cache key in Metalama's caching patterns, such as the 'this' parameter, parameters using the [NotCacheKey] attribute, and parameters by rule using classifiers.
            keywords: exclude parameters, cache key, Metalama, IgnoreThisParameter, NotCacheKeyAttribute, CachingConfigurationAttribute, ICacheParameterClassifier, ConfigureCaching, AddParameterClassifier
          - name: Configuring the caching behavior
            path: content/patterns/caching/configuring.md
            summary: 'The document provides instructions on configuring the Metalama caching service, detailing three methods: using custom attributes, using a fabric, and at runtime with caching profiles.'
            keywords: caching configuration, Metalama caching, caching profiles, caching options, configure caching
          - name: Invalidating the cache
            path: content/patterns/caching/invalidation.md
            summary: The document explains how to use Metalama for cache invalidation in software engineering, detailing both declarative and imperative methods, and how to force cache to refresh. It also discusses compile-time validation.
            keywords: cache invalidation, Metalama, remove from cache, caching keys, InvalidateCache attribute, CachingServiceExtensions
          - name: Working with cache dependencies
            path: content/patterns/caching/dependencies.md
            summary: The document explains the concept of cache dependencies in Metalama Caching, detailing how to add string dependencies, implement object-oriented dependencies, and suspend the collection of cache dependencies. It also highlights the potential trade-offs in performance and resource usage.
            keywords: cache dependencies, Metalama Caching, string dependencies, ICacheDependency interface, cache invalidation, object-oriented cache dependencies, ICachingService, caching backend, AddDependency method, Invalidate method
          - name: Distributed caching with Redis
            path: content/patterns/caching/redis.md
            summary: The document provides a guide on how to use Redis as a distributed server for caching in a Metalama application, including configuration, resilience policies, key compression, and handling dependencies.
            keywords: Redis caching, distributed caching, in-memory L1 cache, Metalama, StackExchange.Redis, Azure Redis Cache, Redis Pub/Sub, caching backend configuration, retry policy, exception handling, key hashing, resilience
          - name: Synchronizing local in-memory caches for multiple nodes
            path: content/patterns/caching/pubsub.md
            summary: The document provides a guide on synchronizing local in-memory caches across multiple servers using Metalama's publish/subscribe (Pub/Sub) message bus. It details the process using Azure Service Bus and Redis Pub/Sub.
            keywords: distributed caching, cache invalidation, in-memory cache, Azure Service Bus, Redis Pub/Sub, Metalama, publish/subscribe, cache synchronization, cache consistency
          - name: Caching special types with value adapters
            path: content/patterns/caching/value-adapters.md
            summary: The document discusses the concept of value adapters in Metalama for caching mutable or stream-like types. It details how to implement a custom value adapter and provides examples.
            keywords: caching mutable types, stream-like types caching, Metalama value adapter, custom value adapter implementation, .NET caching, immutable types caching, caching problematic types, caching configuration
          - name: Preventing concurrent execution
            path: content/patterns/caching/locking.md
            summary: The document discusses how to prevent concurrent execution of cached methods in Metalama using a lock manager. It covers local and distributed lock strategies, handling lock timeouts, and implementing a distributed lock manager.
            keywords: concurrent execution, cached methods, lock manager, local lock strategy, distributed lock manager, Metalama, locking strategy, ILockingStrategy interface, CachingProfile, lock timeouts
          - name: Troubleshooting
            path: content/patterns/caching/troubleshooting.md
            summary: The document provides instructions on how to troubleshoot the caching feature in Metalama using verbose logging, both with and without dependency injection.
            keywords: troubleshoot caching, verbose logging, dependency injection, .NET logging service, AddLogging extension method, minimum caching level, FlashtraceLoggerFactory, TraceSourceLoggerFactory, CachingService object, detailed logging
        - name: Memoization
          path: content/patterns/memoization/memoization.md
          summary: Memoization is an optimization technique that caches results of deterministic methods to enhance performance. Metalama provides a straightforward and high-performance implementation through the [Memoize] aspect.
          keywords: memoization, optimization, caching, Metalama, Memoize aspect, high-performance caching, System.Lazy alternative, .NET
        - name: WPF
          path: content/patterns/wpf/wpf.md
          summary: WPF aspects for commands and dependency properties.
          keywords: WPF, command, dependency property, ICommand, DependencyProperty
          items:
          - name: Command
            path: content/patterns/wpf/command.md
            summary: Generate WPF command boilerplate automatically with the [Command] aspect.
            keywords: WPF command, ICommand interface, CanExecute method, boilerplate code, Metalama.Patterns.Wpf.CommandAttribute, ICommand.Execute method, INotifyPropertyChanged, CanExecuteChanged event, DelegateCommand class, Metalama
          - name: Dependency Property
            path: content/patterns/wpf/dependency-property.md
            summary: Convert automatic properties into WPF dependency properties with the [DependencyProperty] aspect.
            keywords: dependency property, WPF, Metalama, boilerplate code, automatic property, DependencyPropertyAttribute, validation, PropertyChanged callback, default values, .NET
    - name: Creating aspects
      path: content/conceptual/aspects/aspects.md
      summary: This document is a guide on creating aspects in Metalama, detailing the benefits of aspects like boilerplate elimination, code validation and fixes, and outlining various aspects-related topics.
      keywords: boilerplate elimination, code validation, code fixes, Metalama, creating aspects, clean code, fewer bugs, custom attributes, dynamic code templates, advanced code modifications
      items:
      - name: Creating simple aspects
        path: content/conceptual/aspects/simple-aspects/simple-aspects.md
        summary: The document provides guidance on creating simple aspects, including overriding method and property implementations and validating values of fields, properties, or parameters.
        keywords: overriding method, overriding property, validating values, .NET aspects, aspect implementation, method implementation, property implementation, field encapsulation, parameter validation, Metalama
        items:
        - name: Overriding methods
          path: content/conceptual/aspects/simple-aspects/overriding-methods.md
          summary: The document provides a guide on how to override methods using the Metalama.Framework, with examples including logging, retrying upon exception, authorizing users, including method names in logs, and profiling methods.
          keywords: overriding methods, Metalama.Framework, logging, retry upon exception, authorizing users, method names in logs, profiling methods, OverrideMethodAspect, meta.Proceed, meta.Target.Method
        - name: Overriding fields or properties
          path: content/conceptual/aspects/simple-aspects/overriding-properties.md
          summary: The document provides a guide on how to override fields and properties using the Metalama.Framework package in C#, including examples of trimming strings and normalizing values to uppercase.
          keywords: override fields, override properties, Metalama.Framework, OverrideFieldOrPropertyAspect, field transformation, property template, trim strings, normalize uppercase
        - name: Validating parameters, fields and properties
          path: content/conceptual/aspects/simple-aspects/contracts.md
          summary: The document provides a guide on how to use contracts in Metalama for aspect-oriented programming, including creating custom attributes for field, property, or parameter validation, and how to implement the ContractAspect class.
          keywords: aspect-oriented programming, custom attribute, field validation, property validation, parameter validation, Metalama, ContractAspect class, exception handling, value normalization, .NET
      - name: Understanding the framework design
        path: content/conceptual/aspects/aspect-design.md
        summary: The document provides an in-depth understanding of the Metalama aspect framework design, including its class diagram, abilities, and examples of aspects targeting methods, fields, and properties. It also explains how to customize aspect appearance in the IDE.
        keywords: Metalama aspect framework, aspect design, class diagram, IAspect interface, IAspectBuilder, code transformation, diagnostics reporting, advanced code validations, adding aspects, IDE customization
      - name: Working with the type system
        path: content/conceptual/aspects/type-system.md
        summary: Learn how to work with the Metalama type system, including IType, INamedType, generic types, tuple types, array types, pointer types, and nullability handling. Discover how to obtain type references, access type members, construct derived types, and control nullability.
        keywords: IType, INamedType, TypeFactory, generic types, tuple types, array types, pointer types, type system, Metalama types, compile-time types, nullability, ToNullable, ToNonNullable, nullable reference types
      - name: Writing T# templates
        path: content/conceptual/aspects/templates/templates.md
        summary: This document provides a guide on writing T# templates in Metalama, covering topics like template language introduction, compile-time code, dynamic code generation, and debugging.
        keywords: T# templates, Metalama, compile-time code, dynamic code generation, debugging, template language, run-time code, System.Reflection, parameters, auxiliary templates
        items:
        - name: Overview
          path: content/conceptual/aspects/templates/template-overview.md
          summary: 'This document provides an overview of T#, a template language used by Metalama, which is fully compatible with C#. It details how T# integrates compile-time and run-time expressions and statements, and outlines the different scopes of code: run-time, compile-time, and Run-time-or-compile-time. The document also compares T# to Razor and explains the compilation process.'
          keywords: T#, Metalama, template language, compile-time expressions, run-time expressions, compile-time code, run-time code, Run-time-or-compile-time code, compilation process
        - name: Dynamic typing in templates
          path: content/conceptual/aspects/templates/dynamic-typing.md
          summary: Learn how to use dynamic typing in Metalama templates to handle unknown types at compile time, including dynamic expressions, member access, and conversion to IExpression.
          keywords: dynamic typing, templates, meta.This, IExpression, run-time code generation
        - name: Writing compile-time code
          path: content/conceptual/aspects/templates/template-compile-time.md
          summary: This document provides detailed information on writing compile-time code using the Metalama Framework, including compile-time expressions, statements, the 'meta' pseudo-keyword, compile-time language constructs, aspect properties, compile-time types and methods, and calling other packages from compile-time code.
          keywords: compile-time code, Metalama Framework, compile-time expressions, meta pseudo-keyword, aspect properties, compile-time types, compile-time methods, compile-time variables, compile-time statements, compile-time constructs
        - name: Generating run-time expressions
          path: content/conceptual/aspects/templates/generating-expressions.md
          summary: This document provides detailed information on generating run-time code in templates, using dynamic expressions and variables, invoking members, parsing C# expressions and statements, converting run-time expressions to compile-time, and converting compile-time values to run-time values.
          keywords: dynamic expressions, generating run-time code, compile-time values, run-time values, dynamic variables, IExpression.Value, ExpressionBuilder, dynamic member, parsing C# expressions
        - name: Generating expressions based on the code model
          path: content/conceptual/aspects/templates/invokers.md
          summary: Learn how to generate run-time code that invokes methods, accesses properties and fields, raises events, works with indexers, and creates tuple instances using the invoker API from the code model.
          keywords: invokers, IMethodInvoker, IExpression, method invocation, property access, field access, event handling, indexers, tuple creation, code generation
        - name: Generating run-time statements
          path: content/conceptual/aspects/templates/generating-statements.md
          summary: Learn how to dynamically generate run-time statements in templates using StatementBuilder, parse string-based statements, define local variables programmatically, and build switch statements.
          keywords: statements, StatementBuilder, meta.InsertStatement, meta.DefineLocalVariable, SwitchStatementBuilder, dynamic code generation, parsing statements
        - name: Template parameters and type parameters
          path: content/conceptual/aspects/templates/template-parameters.md
          summary: This document describes how to use compile-time parameters and type parameters in the BuildAspect method in Metalama and provides examples and alternatives for using these parameters.
          keywords: compile-time parameters, type parameters, BuildAspect method, Metalama, template method, compile-time-only, tags
