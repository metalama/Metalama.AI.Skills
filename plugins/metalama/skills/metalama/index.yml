      keywords: bug reports, GitHub issues, Metalama, exception, error message, binary build log, crash report, profiling snapshot
    - name: How to contribute code
      path: content/contributing/contribute-code.md
      summary: This document outlines the steps for contributing code into Metalama repositories, including feature implementation, testing, formatting, and submitting a pull request.
      keywords: contributing code, Metalama, testing, formatting, pull request, build repository, unit tests, Contributor License Agreement
    - name: How to contribute documentation
      path: content/contributing/contribute-docs.md
      summary: This document guides on contributing to Metalama's documentation using DocFx, including cloning, building, authoring, updating, and preparing a PR.
      keywords: DocFx, Metalama, documentation, authoring sample code, Metalama.Testing.AspectTesting, authoring documentation article, update documentation, prepare PR
    - name: How to build from source
      path: content/contributing/build-from-source.md
      summary: This document provides instructions for building Metalama from source, including environment setup, cloning, building, testing, and using Docker.
      keywords: Metalama build, source code, clone repo, build script, local dependencies, Docker build, multi-repo build
    - name: Coding standard
      path: content/contributing/coding-standard.md
      summary: This document outlines the coding standards to follow when contributing to the Metalama project.
      keywords: coding standard, coding conventions
    - name: Branching strategy
      path: content/contributing/branching.md
      summary: The document outlines Metalama's Git flow strategy involving concurrent version branches, continuous integration, and specific branch naming conventions.
      keywords: Git flow strategy, version branches, continuous integration, branch naming conventions, version control, Metalama, .NET, TeamCity, versioning
