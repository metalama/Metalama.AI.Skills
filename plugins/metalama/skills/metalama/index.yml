  items:
  - name: Code Model API
    path: content/api/code-api.md
    summary: Compile-time representation of the code model, providing access to declarations, types, and code structure during aspect execution.
    keywords: Metalama Framework, code model, declarations, types, IDeclaration, IType, IMethod, type system, syntax builders, invokers
  - name: Aspect API
    path: content/api/aspect-api.md
    summary: Namespaces and functionalities for creating and managing aspects or fabrics.
    keywords: Metalama Framework, API documentation, creating aspects, managing aspects, diagnostics, eligibility, project model, runtime classes
  - name: Extensions API
    path: content/api/extensions-api.md
    summary: Additional features built on the Metalama.Framework public API, including architecture validation, code fixes, and dependency injection.
    keywords: Metalama extensions, architecture validation, code fixes, dependency injection, metrics, multicast
  - name: Patterns API
    path: content/api/patterns-api.md
    summary: Common design patterns for caching, contracts, observability, immutability, memoization, and WPF.
    keywords: Metalama patterns, caching, contracts, observability, INotifyPropertyChanged, immutability, memoization, WPF, dependency property, command
  - name: Flashtrace API
    path: content/api/flashtrace-api.md
    summary: Logging front-end for Metalama Caching, recommended only for specific scenarios like custom cache key formatters.
    keywords: logging front-end, Metalama Caching, custom cache key formatters, Flashtrace API, .NET
  - name: Introspection API
    path: content/api/introspection-api.md
    summary: Namespaces for querying projects and solutions using the Metalama code model, including compilation process output.
    keywords: Metalama code model, querying projects, querying solutions, compilation process output, aspect instances, reported diagnostics, C# project, LINQPad, introspection
  - name: Testing API
    path: content/api/testing-api.md
    summary: Metalama testing frameworks for unit testing compile-time logic and snapshot-based aspect testing.
    keywords: Metalama testing, unit testing, aspect testing, snapshot testing, xUnit, compile-time testing
  - name: Advanced Extensibility API (SDK)
    path: content/api/advanced-api.md
    summary: Namespaces and assemblies for extending Metalama with the Roslyn API, including aspect weavers, code model integration, and source transformers.
    keywords: Metalama SDK, Roslyn API, aspect weavers, source transformers, IPartialCompilation, IAspectWeaver, code model
  - name: PostSharp API migration
    path: content/api/migration-api.md
    summary: Mapping from the PostSharp API to its Metalama equivalent for migration purposes.
    keywords: migration, PostSharp API, Metalama, API mapping, .NET, PostSharp to Metalama
